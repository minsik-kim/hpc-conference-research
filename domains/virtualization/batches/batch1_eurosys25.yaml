- id: VIRT-EUROSYS25-02
  title: Towards VM Rescheduling Optimization Through Deep Reinforcement Learning
  title_correction: null
  authors:
  - Xianzhong Ding
  - Yunkai Zhang
  - Binbin Chen
  - Donghao Ying
  - Tieying Zhang
  - Jianjun Chen
  - Lei Zhang
  - Alberto Cerpa
  - Wan Du
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3717476
  official_url: https://download.vusec.net/asplos-eurosys-2025/talk/WXLKEZ/
  fullpaper_source: https://arxiv.org/abs/2505.17359
  classification: SUPPORT
  classification_note: The contribution is a two-stage deep-RL solver for choosing which VMs to live-migrate to defragment CPU capacity; live migration is the enabling virtualization mechanism it is constrained by, not the object of study.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T4
  - T1
  physical_resource: CPU core
  logical_abstraction: A VM-to-physical-machine mapping that a cluster operator can re-establish online within a 5 s decision budget
  problem: VMs initially placed by fast heuristics leave scattered CPU fragments on physical machines, and optimal rescheduling by MIP takes ~50 minutes, far beyond the window in which a solution is still valid.
  mechanism: VMR2L decomposes each migration decision into (i) pick a VM and (ii) pick a destination PM, collapsing an O((M*N)^MNL) action space into sequential selections; a sparse-attention feature extractor over the VM/PM bipartite state plus risk-seeking evaluation is trained offline in a deterministic simulator, and a migration-number limit (typically 2-3% of VMs) caps migration cost.
  isolation_mechanism: N/A (placement-level; per-VM resource requests and affinity/anti-affinity constraints are inputs, not enforced mechanisms)
  multiplexing_mechanism: Physical machine CPU/memory capacity is packed with VM requests; fragment rate (unusable CPU over total available) is the objective being minimised
  state_mechanism: 'VM state moves by pre-copy live migration: memory is copied while the VM runs, dirty pages tracked, then a brief pause for final sync; storage is not moved because the fleet is compute/storage-disaggregated'
  overhead_bottleneck: 'Decision latency: solutions computed beyond ~5 s are stale because VMs arrive/depart concurrently, so solver time, not migration bandwidth, is the binding constraint'
  primary_tradeoff: Learned policy instead of MIP -> gains a ~1 s decision that fits the operational window, but costs ~2.9% optimality in fragment rate and requires a simulator plus 92 GPU-hours of offline training
  quantitative_claims:
  - 'fragment rate: 0.2941 (VMR2L) vs 0.2859 (MIP near-optimal), a 2.86% gap (Medium dataset, 2089 VMs / 280 PMs, migration-number limit 50)'
  - 'inference time: 1.1 s per mapping vs 50.55 min for MIP/Gurobi (Medium dataset)'
  - 'inference time: 3.8 s on the Large dataset (4546 VMs / 1176 PMs)'
  - 'generalisation: 1.16% average fragment-rate gap when one agent trained at MNL=50 is applied to MNL in {10,20,30,40,50}'
  - 'robustness: >95% of potential fragment-rate improvement retained on clusters whose PM count varies by 10-20%'
  - 'training cost: 92 hours on a single GPU'
  why_useful_for_learning: It shows what live migration is actually used for in a production fleet (defragmentation) and how migration cost is budgeted, which is the operational reason CORE migration/memory papers matter.
  priority: P2
  related:
  - VIRT-OSDI25-02
  relations:
  - type: LAYER_ABOVE
    target: VIRT-OSDI25-02
    basis: Kamino allocates VMs at admission time with latency-driven cache-aware scheduling; VMR2L re-optimises an existing allocation by migration. Both attack CPU/host fragmentation from opposite ends of the VM lifecycle.
  - type: USES_MECHANISM_FROM
    target: VM pre-copy live migration (Clark et al., NSDI 2005)
    basis: Paper states only memory need be transferred and describes dirty-page tracking plus a brief final pause.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: Read the arXiv version (2505.17359); the arXiv PDF header carries the internal name VMR2L. Official EuroSys title confirmed from the ASPLOS/EuroSys 2025 Virtualization session program page, which also gave the author list.
- id: VIRT-EUROSYS25-03
  title: 'HyperAlloc: Efficient VM Memory De/Inflation via Hypervisor-Shared Page-Frame Allocators'
  title_correction: null
  authors:
  - Lars Wrenger
  - Kenny Albes
  - Marco Wurps
  - Christian Dietrich
  - Daniel Lohmann
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3717484
  official_url: https://dl.acm.org/doi/10.1145/3689031.3717484
  fullpaper_source: https://www.sra.uni-hannover.de/Publications/2025/hyperalloc-eurosys/wrenger_25_eurosys.pdf
  classification: CORE
  classification_note: 'The contribution is a new guest-hypervisor memory-virtualization interface: the hypervisor is given direct, lock-free access to the guest page-frame allocator, replacing ballooning/free-page-reporting as the de/inflation mechanism.'
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary:
  - T3
  - T1
  physical_resource: DRAM
  logical_abstraction: Guest-physical memory whose backing can be reclaimed and reinstalled at 2 MiB granularity while remaining DMA-safe under device passthrough
  problem: VM memory demand is volatile, and existing deflation paths are either too slow (virtio-balloon), not DMA-safe with passthrough devices, or lack automatic reclamation (virtio-mem).
  mechanism: The guest replaces the Linux buddy allocator with LLFree, whose compact pointer-free metadata is memory-mapped into the QEMU monitor, so guest and hypervisor share a per-frame state tuple (M,R,E,A) and cooperate through atomic operations rather than a device protocol. The hypervisor periodically scans allocator state for free huge pages, unmaps them from EPT and IOMMU (hard or soft reclamation), and the guest hypercalls on allocating an evicted frame so the hypervisor can reinstall host-physical backing.
  isolation_mechanism: The hypervisor keeps its own authoritative reclamation state R and never trusts the guest-written E hint; a malicious guest manipulating the A bit only loses cooperation (it pays extra faults/hypercalls), and invalid guest state is detected by comparing resident set size against reclamation metadata. Per-VM locking serialises concurrent host reclaim/return/install.
  multiplexing_mechanism: Host DRAM is shared by reclaiming free 2 MiB huge pages out of each guest allocator every 5 s and returning them to the host allocator; hard limits are enforced by marking frames allocated+evicted, soft limits let the guest re-take them on demand
  state_mechanism: The guest allocator bitfields/area/tree arrays live in guest-physical memory and are mapped into the QEMU monitor address space at boot; hypervisor-private reclamation metadata (R,M) stays in QEMU. Nothing migrates - only EPT/IOMMU mappings are added and removed.
  overhead_bottleneck: Reinstalling a reclaimed frame costs an extra mode switch into the user-space QEMU monitor, making install ~6% slower than a virtio-mem EPT fault; the authors note one switch would suffice if HyperAlloc lived inside KVM
  primary_tradeoff: Co-designing the guest allocator with the hypervisor -> gains two orders of magnitude faster, DMA-safe deflation and lower average footprint, but costs guest transparency (the buddy allocator must be replaced), so adoption depends on economic pressure such as per-second memory billing
  quantitative_claims:
  - 'reclaim throughput: 344.8 GiB/s (HyperAlloc) vs 34 GiB/s (virtio-mem) vs 0.95 GiB/s (virtio-balloon) on a 20 GiB VM with 19 GiB written pages, 2x Intel Xeon Gold 6252, 10 iterations'
  - 'shrink speedup: 362x faster than virtio-balloon and 10x faster than virtio-mem (same setup)'
  - 'DMA-safe reclaim with passthrough NIC via VFIO: 54.6 GiB/s (HyperAlloc+VFIO) vs 17.7 GiB/s (virtio-mem+VFIO), 20 GiB VM'
  - 'memory footprint: 17% lower average footprint than virtio-balloon free-page reporting (Clang 16.0 compilation, 16 GiB VM, 6 runs, sampled at 1 Hz)'
  - 'automatic reclamation CPU cost: 0.51 +/- 0.18% (HyperAlloc) vs 0.15 +/- 0.42% (default virtio-balloon) during Clang compilation on a 12-vCPU guest'
  - 'STREAM 1st percentile during shrink/grow: 70.1 GB/s (HyperAlloc) vs 31.9 GB/s (virtio-mem) vs 30.9 GB/s (virtio-balloon), 12 threads [VERIFY: this STREAM figure could not be located in the author PDF on spot-check; paper shows 18.4 GB/s for a virtio-mem+VFIO condition. Do not cite without rechecking.]'
  - 'install path: ~6% slower than a virtio-mem EPT fault because of the extra QEMU user-space context switch'
  why_useful_for_learning: It is the cleanest modern statement of the VM memory de/inflation design space - balloon vs hotplug vs shared-allocator - and of why device passthrough (IOMMU pinning) is what breaks classic ballooning.
  priority: P1
  related:
  - VIRT-OSDI25-08
  - VIRT-ATC25-14
  relations:
  - type: ALTERNATIVE
    target: virtio-balloon / virtio-mem
    basis: Directly implemented and measured as baselines; HyperAlloc replaces the balloon device protocol with shared allocator state.
  - type: TRADEOFF_PAIR
    target: VIRT-EUROSYS25-01
    basis: HyperAlloc keeps deflation working *under* passthrough/IOMMU pinning; FastIOV attacks the startup cost of that same passthrough path. Both are consequences of choosing passthrough over software mediation.
  - type: SAME_BRANCH
    target: VIRT-ATC25-14
    basis: Para-ksm also reduces VM memory footprint, but by same-page merging (deduplication) rather than by returning free frames; complementary points in the T2 reclamation design space.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: The author-hosted PDF is the camera-ready-content but anonymised (Submission Id 517); the author list and DOI were taken from the Leibniz Universitaet Hannover SRA publication entry and the EuroSys session program page.
- id: VIRT-EUROSYS25-04
  title: Optimizing Task Scheduling in Cloud VMs with Accurate vCPU Abstraction
  title_correction: null
  authors:
  - Edward Guo
  - Weiwei Jia
  - Xiaoning Ding
  - Jianchen Shan
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3696092
  official_url: https://dl.acm.org/doi/10.1145/3689031.3696092
  fullpaper_source: https://web.njit.edu/~dingxn/papers/vsched.pdf
  classification: CORE
  classification_note: The contribution is repairing the vCPU abstraction itself - capacity, topology and activity of virtual CPUs as seen by the guest - which is the guest-host interface at the heart of CPU virtualization.
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary:
  - T9
  physical_resource: CPU core
  logical_abstraction: vCPUs annotated with measured capacity, real cache/SMT topology and expected preemption latency, exposed to the guest scheduler as scheduling domains
  problem: The guest task scheduler assumes vCPUs are uniform, always-running CPUs with a static topology, while in reality vCPUs differ in capacity, are preempted for milliseconds, and sit on a topology the hypervisor may have changed.
  mechanism: 'Three user-space probers infer the truth without hypervisor changes: vcap measures per-vCPU capacity from paired light/heavy sampling plus steal time, vact estimates preemption latency from heartbeat timestamps and steal-time jumps, and vtop reconstructs the cache/SMT hierarchy from inter-vCPU cache-line transfer latency. A kernel module rebuilds scheduling domains from these results, and three policies use them: biased vCPU selection for latency-sensitive tasks, intra-VM harvesting that migrates CPU-bound tasks off soon-to-be-preempted vCPUs, and relaxed work conservation that hides bad vCPUs via cgroups.'
  isolation_mechanism: N/A for security; the paper acknowledges a co-located adversarial VM could perturb the probes but argues it is impractical. Performance interference from vCPU stacking is handled by declining to use stacked vCPUs (non-work-conserving).
  multiplexing_mechanism: KVM time-slices vCPUs onto physical cores and may stack several vCPUs on one core or hardware-thread pair; the guest sees the result only indirectly through steal time and missed ticks
  state_mechanism: All authoritative scheduling state stays in the hypervisor; the guest holds only derived, periodically refreshed estimates in scheduling-domain structures and per-vCPU metadata. No paravirtual channel is added.
  overhead_bottleneck: Periodic probing, dominated by vtop cache-line latency measurement on large VMs; ~0.7% average degradation when the workload cannot benefit, and responsiveness limited to seconds rather than sub-second
  primary_tradeoff: Inferring vCPU properties from inside the guest -> gains deployability on unmodified hypervisors and any cloud, but costs sub-second accuracy (paravirtual designs such as XPV/CPS get real-time data) and adds a probing attack surface
  quantitative_claims:
  - 'tail latency: 95th percentile grows ~20x (2 ms -> 16 ms) as vCPU inactivity/preemption latency grows (Tailbench, Figure 2)'
  - 'throughput: up to 43% higher by excluding a low-capacity straggler vCPU from placement (Parsec, 16-vCPU VM)'
  - 'priority inversion under vCPU stacking: 6.7x improvement with the non-work-conserving policy on synchronisation-intensive workloads'
  - 'capacity-aware scheduling: 32% higher throughput vs default CFS on an asymmetric-capacity 16-vCPU VM (Sysbench)'
  - 'SMT topology accuracy: 18% improvement for Matmul on a 32-vCPU VM with SMT pairs'
  - 'LLC/socket topology accuracy: 26% average throughput increase and 99% fewer inter-processor interrupts (Hackbench/Dedup/Nginx, cross-socket VM)'
  - 'biased vCPU selection: 42% average reduction in 95th-percentile latency on an overcommitted 16-vCPU VM (Tailbench)'
  - 'cost when no benefit is available: 0.7% average performance degradation'
  why_useful_for_learning: It is the best single explanation of why a vCPU is not a CPU - capacity, preemption and topology all leak - and of the paravirtual-versus-inference choice for closing that semantic gap.
  priority: P1
  related:
  - VIRT-EUROSYS25-02
  relations:
  - type: ALTERNATIVE
    target: XPV / CPS (paravirtualized vCPU exposure)
    basis: Paper contrasts its inference approach with hypervisor-modifying paravirtual designs and states the sub-second accuracy gap.
  - type: CONTRASTS_WITH
    target: VIRT-ATC25-02
    basis: HyperTurtle reduces the cost of the virtualization boundary itself (nested exits); vSched leaves the boundary alone and instead repairs the abstraction the guest reasons about.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Author-hosted PDF is titled vsched.pdf; system name is vSched. Guest-OS modification required, so it is not applicable to VMs running closed-source guests.
- id: VIRT-EUROSYS25-05
  title: 'Erebor: A Drop-In Sandbox Solution for Private Data Processing in Untrusted Confidential Virtual Machines'
  title_correction: null
  authors:
  - Chuqi Zhang
  - Rahul Priolkar
  - Yuancheng Jiang
  - Yuan Xiao
  - Mona Vij
  - Zhenkai Liang
  - Adil Ahmad
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3717464
  official_url: https://dl.acm.org/doi/10.1145/3689031.3717464
  fullpaper_source: https://faculty.sist.shanghaitech.edu.cn/xiaoyuan/publication/erebor.pdf
  classification: CORE
  classification_note: The contribution virtualizes kernel privilege inside a confidential VM - splitting ring-0 into a monitor mode and a deprivileged-kernel mode using PKS/CET - to create an in-guest sandbox, i.e. a new isolation boundary built on CVM hardware.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T5
  - T2
  physical_resource: CPU core
  logical_abstraction: A confined sandbox inside a confidential VM whose memory and exits are controlled by an attested in-guest monitor, so client data survives a malicious service-provider OS
  problem: Confidential VMs protect a tenant from the host hypervisor but not from the service provider software running inside the CVM, which can leak client data through syscalls, memory access and covert channels.
  mechanism: 'Erebor boots an attested Erebor-Monitor first and then deprivileges the Linux kernel: the kernel is instrumented so all MMU-configuration instructions, IDT/LSTAR/GHCI writes and page-table updates are delegated to the monitor, while Intel PKS marks monitor and kernel pages non-accessible in normal mode and Intel CET (IBT + shadow stacks) plus SMEP/SMAP constrain control flow. A Gramine-derived LibOS emulates heap, in-memory filesystem, threading and communication for the sandbox, and the monitor holds exclusive rights to tdcall, so it alone can run TDX attestation and terminate the sandbox on any syscall or VM exit after data arrives.'
  isolation_mechanism: Page-granularity PKS domains plus monitor-mediated page tables prevent double-mapping of confined memory; W^X on kernel code; SMAP blocks kernel access to sandbox user pages; all context-switch interfaces are interposed so an exit after data receipt destroys the sandbox; output is padded to a fixed length before encryption to hide size
  multiplexing_mechanism: Confined pages are pre-allocated, pinned and exclusive per sandbox, while read-only common memory (e.g. an ML model) is shared across sandbox instances; the monitor keeps a per-core secure stack and shadow stack
  state_mechanism: Monitor code, data, secure stacks, shadow stacks, IDT and page-table pages live in guest kernel memory protected by PKS keys, with the per-core IA32_PKRS switched at every monitor entry/exit gate; attestation state is bound to TDX measurement registers
  overhead_bottleneck: Every privileged operation now costs a monitor call (~1224 cycles, 1.78x a syscall); page-table updates are the extreme case at 58.5x native (23 -> 1345 cycles), which is why initialization is the worst-hit phase
  primary_tradeoff: Using only guest-controlled hardware features -> gains drop-in deployment with zero changes to the cloud provider hypervisor/paravisor, but costs the finer-grained enclave-style protection that VMPL-based partitioning (Veil, NestedSGX) achieves, and adds ~8% steady-state runtime overhead
  quantitative_claims:
  - 'empty monitor call (EMC): 1224 CPU cycles, 0.56x a syscall and 4.31x faster than a tdcall in a native CVM (Intel Xeon Platinum 8570, Emerald Rapids)'
  - 'privileged-instruction cost: CR writes 294 -> 1593 cycles (5.42x), MSR writes 364 -> 1613 cycles (4.43x), IDT 260 -> 1369 cycles (5.27x)'
  - 'page-table update: 23 -> 1345 cycles (58.5x native)'
  - 'application runtime overhead: 8.1% geometric mean across five applications, range 4.5-13.2% (llama.cpp worst at 13.15%)'
  - 'memory saving from read-only common memory: up to 89.1% (llama.cpp 36 GB -> 8 GB with 8 containers)'
  - 'one-time initialization overhead: 11.5-52.7% (llama.cpp 52.70%)'
  - 'background-service impact: OpenSSH 8.2% average (max 18% on 1 KB files), Nginx 5.1% average (max 17.6% on small files)'
  - 'page-fault cost: 3.8x native (LMBench)'
  why_useful_for_learning: It shows that a confidential VM is only half an isolation story, and demonstrates the software-only alternative to hardware VM-privilege-level partitioning for building a second boundary inside a guest.
  priority: P1
  related:
  - VIRT-EUROSYS25-17
  - VIRT-ATC25-01
  relations:
  - type: ALTERNATIVE
    target: Veil / NestedSGX (AMD VMPL-style CVM partitioning)
    basis: Table 1 of the paper compares protection and deployment requirements; those designs need provider-side hypervisor/paravisor changes.
  - type: SAME_BRANCH
    target: VIRT-EUROSYS25-17
    basis: CKI uses the same Intel PKS mechanism to deprivilege a guest kernel, but for secure-container performance rather than in-CVM data confidentiality - the two papers bracket what PKS-based intra-kernel privilege separation is for.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - official-web
  - code
  confidence: HIGH
  notes: No empirical comparison against SGX/gVisor baselines; comparison to Veil/NestedSGX is qualitative (Table 1). Prototype disables huge pages and LKM/eBPF loading.
- id: VIRT-EUROSYS25-07
  title: Improving GPU Sharing Performance through Adaptive Bubbleless Spatial-Temporal Sharing
  title_correction: null
  authors:
  - Shulai Zhang
  - Quan Chen
  - Weihao Cui
  - Han Zhao
  - Chunyu Xue
  - Zhen Zheng
  - Wei Lin
  - Minyi Guo
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3696070
  official_url: https://dl.acm.org/doi/abs/10.1145/3689031.3696070
  fullpaper_source: https://jamesthez.github.io/files/bless-eurosys25.pdf
  classification: SUPPORT
  classification_note: It is a kernel-squad scheduler layered on existing MPS SM-affinity contexts rather than a new virtual-GPU abstraction, but it is the sharpest available account of the spatial-vs-temporal GPU multiplexing trade-off that vGPU/MIG designs live inside.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T9
  physical_resource: GPU
  logical_abstraction: A per-tenant GPU quota (fraction of SMs) that is honoured on average while instantaneous SM partitioning is re-decided per kernel squad
  problem: Temporal GPU sharing wastes SMs while a slow tail kernel finishes, static spatial sharing wastes SMs a tenant cannot saturate, and unbounded concurrent sharing makes interference unpredictable - so no existing scheme gives both utilization and a quota guarantee.
  mechanism: Bless intercepts CUDA kernel launches and groups kernels from several applications into kernel squads; an execution-configuration determiner searches SM-partition splits using two profiled predictors (interference-free and workload-equivalence), and a concurrent kernel manager launches each squad into pre-created MPS contexts created with cuCtxCreate_v3 SM affinity, removing SM restrictions for the rear 20-50% of a request (Semi-SP) to absorb leftover capacity.
  isolation_mechanism: 'SM-count partitioning through MPS contexts bounds compute interference (measured: kernel slowdown <=2x even against a highly memory-intensive co-runner, 7% average in mutual pairs); fairness restored across squads by giving more slots to the application with the shortest relative progress'
  multiplexing_mechanism: 'Hybrid: spatial SM partitioning within a squad, temporal switching between squads, at kernel-squad granularity (max 6 kernels per squad in the prototype)'
  state_mechanism: Per-request progress, queues and configuration search live in host-side scheduler processes; per-context SM restrictions live in pre-established MPS contexts and device ring buffers; profiled kernel durations and SM ratios are stored at deployment time
  overhead_bottleneck: 'Squad switching and host scheduling: 20 us synchronisation + ~3 us launch idle per squad switch, ~50 us GPU context switch, 6.7 us host scheduling per kernel - so kernels shorter than ~7 us cannot be managed profitably; each MPS context also costs ~230 MB of GPU memory'
  primary_tradeoff: Scheduling at kernel-squad granularity -> gains bubble-free utilization with honoured quotas, but costs offline per-DAG profiling and restricts the approach to stationary workloads (dynamic graphs such as autoregressive LLM inference do not fit)
  quantitative_claims:
  - 'inference latency: 26.9% lower than Reef+ under high load, 34.2% lower than GSlice under medium load, 37.3% lower than temporal sharing under low load (13 models / model pairs, single NVIDIA A100)'
  - 'quota fidelity: 0.6 ms average latency deviation from the isolated baseline vs 2.1 ms (GSlice) and 14.3 ms (temporal), 9 model pairs x 7 quota configurations'
  - 'Microsoft Azure serverless trace: 49.3% lower latency than temporal, 41.2% than MIG, 32.1% than GSlice'
  - 'Twitter trace at 50% even quota: 18.4% lower than temporal, 20.5% than MIG, 7.3% than GSlice'
  - 'multi-tenancy: 41.2% (4 BERT instances) and 80.8% (8 instances) latency reduction vs temporal sharing'
  - 'SLO: 0.6% QoS violation vs 38.8% (unbounded MPS) and 50.1% (GSlice)'
  - 'training co-location: 26.5% lower latency than temporal, 7.5% than MIG, 9.9% than Zico'
  - 'interference bound: measured kernel slowdown <= 2x against a highly memory-intensive co-runner; 7% average slowdown in mutual pairs'
  - 'per-MPS-context GPU memory cost: ~230 MB'
  why_useful_for_learning: It quantifies, on one GPU, what each GPU-multiplexing mechanism actually buys - MIG hard partitioning vs MPS spatial vs time-slicing vs unbounded concurrency - which is the trade-off space every GPU virtualization design must place itself in.
  priority: P1
  related:
  - VIRT-ATC25-03
  - VIRT-ATC25-05
  - VIRT-EUROSYS25-12
  relations:
  - type: ALTERNATIVE
    target: NVIDIA MIG
    basis: MIG is evaluated as a baseline; Bless argues hardware partitioning is too static and measures 20.5-41.2% latency gaps on real traces.
  - type: USES_MECHANISM_FROM
    target: NVIDIA MPS (cuCtxCreate_v3 SM affinity)
    basis: Spatial partitioning is implemented entirely with MPS contexts carrying SM-affinity limits.
  - type: SAME_BRANCH
    target: VIRT-ATC25-03
    basis: Both bound GPU interference for co-located tenants; Bless partitions SMs from the host scheduler while the ATC kernel-space-interception work enforces sharing below the CUDA runtime.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  confidence: HIGH
  notes: System name in the paper is Bless. Single-GPU scope; requires per-application offline profiling (~1.9 s average).
- id: VIRT-EUROSYS25-11
  title: Serverless Cold Starts and Where to Find Them
  title_correction: null
  authors:
  - Artjom Joosen
  - Ahmed Hassan
  - Martin Asenov
  - Rajkarn Singh
  - Luke Darlow
  - Jianfeng Deng
  - Qiwen Deng
  - Adam Barker
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3696073
  official_url: https://dl.acm.org/doi/10.1145/3689031.3696073
  fullpaper_source: https://arxiv.org/html/2410.06145v1
  classification: CONTEXT
  classification_note: 'A 31-day provider-side characterization of cold starts on Huawei YuanRong: it measures how a production platform pays for isolation instances but introduces no isolation or virtualization mechanism of its own.'
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T9
  physical_resource: CPU core
  logical_abstraction: A function instance (pod) drawn from pre-warmed resource pools, characterised by how long it takes to create and how long it is then useful
  problem: Cold-start research has lacked production data, so nobody could say which part of a cold start actually dominates or how often it is paid.
  mechanism: The authors instrument five regions/20 clusters of a production FaaS platform for 31 days (85 billion requests, 11.9 million cold starts) and decompose each cold start into pod allocation, code deployment, dependency deployment and scheduling time, then correlate with runtime, trigger type and resource size.
  isolation_mechanism: N/A (Kubernetes pods with preinstalled language runtimes; the paper does not analyse the sandbox mechanism)
  multiplexing_mechanism: Pre-maintained pools of pods per resource shape are searched in stages when a request finds no warm instance
  state_mechanism: N/A - no snapshot/restore or VM state mechanism is studied; the paper explicitly does not measure microVM or image provisioning internals
  overhead_bottleneck: 'Which component dominates is region-dependent: one region is dominated by dependency deployment plus scheduling (up to 7 s), another by pod allocation (up to 3 s)'
  primary_tradeoff: Keeping pools warm -> gains low cold-start probability but costs idle capacity; the paper reframes this with a utility ratio (useful pod lifetime / cold-start time) and shows 20% of pods never repay their own creation cost

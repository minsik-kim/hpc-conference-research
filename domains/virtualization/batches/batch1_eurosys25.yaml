  classification: CONTEXT
  classification_note: A cross-job autoscaler that allocates replica counts under Kubernetes/Ray Serve on a fixed on-premises cluster; it consumes container multi-tenancy and contributes no isolation or virtualization mechanism.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T8
  physical_resource: CPU core
  logical_abstraction: A per-job pool of container replicas sized from a latency SLO turned into a utility function
  problem: On-premises inference clusters are fixed-size and shared by many models, so per-job autoscalers that assume unlimited cloud capacity cannot satisfy cluster-wide SLO objectives.
  mechanism: Faro turns latency SLOs into utility functions, predicts each jobs workload probabilistically, derives replica requirements with an M/D/c queueing model, then solves a cluster-wide utility maximisation (Faro-Sum / Faro-Fair) using deliberately relaxed ("sloppified") objectives with a COBYLA solver, followed by a shrinking pass to remove over-provisioning.
  isolation_mechanism: Relies on Kubernetes resource quotas/cgroup limits and one Ray Serve subcluster per job; no new mechanism
  multiplexing_mechanism: Fixed cluster CPU capacity is divided into container replicas whose counts are re-decided over time
  state_mechanism: N/A - replicas are stateless inference servers, scaled by creation/deletion rather than state movement
  overhead_bottleneck: Solver latency versus reaction time, which is why the utility and latency models are deliberately approximated
  primary_tradeoff: Optimising a cluster-wide utility across jobs -> gains far fewer SLO violations under oversubscription, but costs per-job independence and requires workload prediction plus an approximate model
  quantitative_claims:
  - 'right-sized cluster (36 replicas): 2.3x-12.3x lower SLO violation rate than baselines (lost utility 0.79 vs 2.02 for Mark)'
  - 'oversubscribed cluster (32 replicas): 2.8x-8.4x lower cluster SLO violation rate than four baselines'
  - 'mixed ResNet18/ResNet34 workloads: 4x-23x lower SLO violation rates'
  - 'large scale (20 jobs over 70 replicas): 0.02 SLO violation rate vs 0.08 for Mark'
  - 'simulator fidelity: cluster utility predicted within 9.6% average difference'
  - 'testbed: IBM Cloud VPC, two 32-vCPU machines, 10 jobs driven by Azure Functions and Twitter traces (1-1600 req/min)'
  why_useful_for_learning: 'It is a clean example of the application-level consequence of multi-tenancy: once capacity is fixed, SLO satisfaction becomes an allocation problem across tenants rather than a per-tenant scaling problem.'

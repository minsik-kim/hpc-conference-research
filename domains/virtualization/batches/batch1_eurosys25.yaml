  - Anthony Rowe
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3717470
  official_url: https://dl.acm.org/doi/abs/10.1145/3689031.3717470
  fullpaper_source: https://arxiv.org/html/2312.03858v3
  classification: CORE
  classification_note: 'It redefines where the Wasm sandbox boundary sits: instead of the WASI capability API, the boundary becomes linear memory plus a ~2000-LoC thin syscall passthrough (WALI), which is an isolation-architecture contribution.'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T10
  physical_resource: CPU core
  logical_abstraction: A Wasm module that imports ~137 Linux syscalls almost one-to-one, so unmodified POSIX software runs sandboxed and architecture-neutral
  problem: WASI must be reimplemented per platform, keeps churning, and still lacks mmap, signals and other features legacy software needs, so most existing programs cannot run on Wasm at all.
  mechanism: WALI exposes the host syscall ABI through the Wasm import section with address-space translation between linear memory and kernel addresses, in ~2000 LoC of C with under 100 lines platform-specific; signals are delivered at engine safepoints (loop headers/function entry) via a virtual signal table, threads are instance replications over shared memory with a 1:1 mapping to native processes, and higher-level APIs including WASI itself can then be implemented as Wasm modules on top. WAZI repeats the recipe on Zephyr.
  isolation_mechanism: Every syscall operates only on bounds-checked linear memory (rw- only, read-only tables), mmap/mremap are confined to linear memory and fail past declared limits, memory is non-executable, control-flow integrity comes from Wasm structured control flow, and dangerous endpoints such as /proc/self/mem are explicitly blocked
  multiplexing_mechanism: One Wasm process per native Linux process (its own PID), with threads as replicated instances sharing memory; the kernel does the actual CPU multiplexing
  state_mechanism: Virtual signal table, pending-signal queue and allocation bookkeeping live inside the engine (<1 KB), which makes binaries portable across x86-64/aarch64/riscv64 but means checkpoint or migration would require serialising engine-internal state
  overhead_bottleneck: Wasm execution itself (median ~2.32x native) dominates; WALI syscall mediation is a few hundred nanoseconds (read 167 ns, write 151 ns, mmap 512 ns) and usually under 1% of runtime, with clone at ~554 us being a WAMR instance-creation cost
  primary_tradeoff: Faithfully passing through a real kernel ABI -> gains legacy-software compatibility, a stable interface and a 2000-LoC TCB, but costs the narrow capability surface WASI aimed at, pushing security policy up to a layer above the engine
  quantitative_claims:
  - 'syscall coverage: ~137 Linux syscalls implemented as Wasm imports'
  - 'implementation size: ~2000 LoC for WALI vs over 6000 lines of engine code for a WASI preview1 implementation (libuvwasi); ~4200 LoC for the Zephyr variant WAZI'
  - 'per-syscall overhead: read 167 ns, write 151 ns, mmap 512 ns; clone ~554 us (WAMR instance duplication; ~5 us in Wasmtime)'
  - 'signal delivery: under 10% slowdown when polling at loop headers; at least 10x slower if polled at every instruction'
  - 'startup: milliseconds vs nearly half a second for Docker; Docker also carries ~30 MB base memory'
  - unmodified WASI implementation (libuvwasi) runs on top of WALI as a Wasm module
  why_useful_for_learning: It is the clearest case study of how much of an isolation boundary is policy versus mechanism, and of the sandbox-surface-versus-expressiveness trade that every lightweight-isolation design makes.

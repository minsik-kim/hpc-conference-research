    target: Kata Containers with hardware-assisted virtualization (HVM); PVM (SOSP 2023 software para-virtualization)
    basis: Both are implemented as baselines across bare-metal and nested-cloud scenarios.
  - type: SAME_BRANCH
    target: VIRT-EUROSYS25-05
    basis: Erebor uses the same Intel PKS primitive for intra-kernel privilege separation, but to defend client data inside a CVM rather than to speed up secure containers.
  - type: TRADEOFF_PAIR
    target: VIRT-ATC25-02
    basis: HyperTurtle makes nested virtualization cheaper; CKI avoids the nested VMX path altogether. The two are the opposing answers to the same nested-cloud cost.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:

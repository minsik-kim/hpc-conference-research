- id: VIRT-EUROSYS25-18
  title: 'RAKIS: Secure Fast I/O Primitives Across Trust Boundaries on Intel SGX'
  title_correction: null
  authors:
  - Mansour Alharthi
  - Fan Sang
  - Dmitrii Kuvaiskii
  - Mona Vij
  - Taesoo Kim
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3696090
  official_url: https://dl.acm.org/doi/10.1145/3689031.3696090
  fullpaper_source: https://gts3.org/assets/papers/2025/alharthi:rakis.pdf
  classification: CORE
  classification_note: 'The contribution is trusted I/O across an isolation boundary: kernel-bypass ring structures in untrusted shared memory are made safe for an SGX enclave by certifying producer/consumer indices and frame ownership inside the TCB.'
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T3
  - T5
  physical_resource: NIC
  logical_abstraction: POSIX send/recv/read/write inside an enclave, served by XDP sockets and io_uring rings that live in untrusted memory but are validated at every use
  problem: I/O-heavy enclave programs are crippled by enclave exits on every syscall, and the obvious fix - adopting kernel-bypass userspace libraries - would balloon the trusted computing base and assumes a trusted OS.
  mechanism: RAKIS puts a ~2 KLoC FastPath Module inside the enclave that drives XDP/XSK rings (UDP) and io_uring (TCP and files) directly over shared untrusted memory, with a refined ~5 KLoC LWIP UDP/IP stack also inside; an untrusted Monitor Module thread outside the enclave issues the few remaining syscalls (recvfrom, sendto, io_uring_enter) so the data path needs no enclave exit.
  isolation_mechanism: '"RAKIS-certified rings": trusted copies of producer/consumer indices are kept in enclave memory and every untrusted index is bounds-checked (0 <= producer_untrusted - consumer_trusted <= ring_size), and a frame-ownership map rejects any UMem frame the enclave did not issue; verified with KLEE symbolic execution and AFL++ fuzzing (84% line / 76% branch coverage of the UDP/IP stack)'
  multiplexing_mechanism: One FastPath Module and one enclave thread per XSK (each bound to a NIC queue by an eBPF program), and per-thread io_uring instances for multithreaded applications
  state_mechanism: Trusted ring control variables, socket state and the frame-ownership map live in enclave memory; packet/data buffers and the io_uring submission/completion rings live in untrusted shared memory (16 MB UMem per XSK by default)
  overhead_bottleneck: Enclave exits on the I/O path, which RAKIS removes for the data plane; the residual cost is the cross-thread handoff for synchronous file I/O (~30% over native) and copies into encrypted enclave memory
  primary_tradeoff: Driving kernel-bypass rings from inside the enclave with hand-written modules -> gains multi-x I/O throughput while keeping the TCB small (2 KLoC instead of liburing ~35 KLoC or libxdp+libbpf ~130 KLoC), but costs data confidentiality/integrity guarantees (left to TLS or tunnels) and syscall coverage (no epoll; TCP stack stays in the host kernel)
  quantitative_claims:
  - 'UDP throughput: 4.6x higher than Gramine-SGX (iperf3; Intel Xeon Gold 6312U, 25 Gbps NIC in loopback)'
  - 'iperf3 at 1460-byte packets: ~10.5 Gbps (RAKIS-SGX) vs ~2.3 Gbps (Gramine-SGX)'
  - 'memcached: 4.6x average throughput improvement over Gramine-SGX across thread counts'
  - 'redis: 2.6x higher throughput than Gramine-SGX (modified to use select instead of epoll)'
  - 'file write (fstime, 16 KB blocks): 2.8x advantage over Gramine-SGX'
  - 'curl/QUIC download: matches native, while Gramine-SGX takes 2.5x longer than native'
  - 'enclave exits for iperf3: ~200K (Gramine-SGX) vs ~10K (RAKIS-SGX)'
  - 'TCB cost: FastPath Module ~2 KLoC plus Service Module ~6 KLoC, versus ~35 KLoC (liburing) or ~130 KLoC (libxdp with libbpf) if the stock libraries were imported'
  - 'synchronous file I/O via io_uring: ~30% overhead versus native'
  why_useful_for_learning: 'It is the sharpest small example of the trusted-I/O problem: whenever a device queue is shared across an isolation boundary, the boundary owner must re-validate the queue metadata, and that validation is the real cost of confidential I/O.'
  priority: P2
  related:
  - VIRT-EUROSYS25-05
  - VIRT-EUROSYS25-17
  relations:
  - type: SAME_BRANCH
    target: VIRT-EUROSYS25-05
    basis: Both harden a confidential-computing boundary from the inside; Erebor for an untrusted in-CVM OS, RAKIS for an untrusted host OS driving I/O rings.
  - type: ALTERNATIVE
    target: Rkt-IO (DPDK-in-enclave)
    basis: Cited as the DPDK-based alternative; not evaluated because the hardware was unavailable.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - code
  confidence: HIGH
  notes: Found by program scan, NOT in the seed list - also recorded in possible_omissions. Official proceedings title capitalises the system name as "Rakis" in the ACM listing; the paper PDF uses RAKIS.

  problem: SR-IOV gives traditional containers fast startup and high data-plane performance, but for secure containers it must be used as passthrough I/O, whose startup cost makes it unusable for time-sensitive workloads such as serverless functions.
  mechanism: 'FastIOV is a CNI plugin plus stack changes attacking three measured bottlenecks: it decomposes locks in virtual-function device management, removes unnecessary DMA mapping operations, decouples memory zeroing from the critical path, and initializes the guest driver asynchronously. The artifact modifies the VFIO driver, QEMU, the Kata runtime/shim, the Kata guest kernel and agent, and adds a fastiov-cni plugin.'

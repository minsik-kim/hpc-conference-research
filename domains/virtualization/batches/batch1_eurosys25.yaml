- id: VIRT-EUROSYS25-17
  title: A Hardware-Software Co-Design for Efficient Secure Containers
  title_correction: null
  authors:
  - Jiacheng Shi
  - Yang Yu
  - Jinyu Gu
  - Yubin Xia
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3717473
  official_url: https://dl.acm.org/doi/10.1145/3689031.3717473
  fullpaper_source: https://ipads.se.sjtu.edu.cn/_media/pub/members/paper.pdf
  classification: CORE
  classification_note: It builds a secure-container isolation architecture that replaces hardware VM virtualization with PKS-based intra-kernel privilege separation, eliminating two-dimensional paging and nested VM exits entirely.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T1
  - T2
  - T7
  physical_resource: CPU core
  logical_abstraction: 'A secure container: its own guest kernel and address space with a per-container Kernel Security Monitor, but no EPT/nested page tables and no VMX mode switches'
  problem: Secure containers inherit virtualization hardware tuned for general-purpose VMs, so they lag OS-level containers - and the gap explodes in nested clouds, where memory-intensive apps degrade 28-226% and I/O-intensive apps 1.8-4.3x.
  mechanism: 'CKI proposes small x86 extensions to Protection Keys Supervisor: destructive privileged instructions (MSR/CR writes, CLI/STI) fault when PKRS is non-zero, a new wrpkrs instruction replaces unsafe wrmsr, and the IDT zeroes PKRS on interrupt entry. On top of that it creates three privilege levels in one address space - host kernel, per-container Kernel Security Monitor, and a deprivileged guest kernel - so the guest kernel runs in kernel mode with its own page tables over a contiguous host-physical range, with the KSM validating every page-table update.'
  isolation_mechanism: Two PKS domains per container (guest kernel vs KSM) enforced by the per-core PKRS, plus a separate address space per container; page-table pages are read-only to the guest and all updates are validated by the KSM; IDT and interrupt gates live in KSM-only memory with per-vCPU areas mapped at a constant guest virtual address to avoid trusting kernel_gs
  multiplexing_mechanism: The host kernel hands each container a contiguous host-physical segment that its guest kernel manages directly (no second-level translation), and schedules container vCPUs itself, keeping per-vCPU copies of the guest top-level page-table pages
  state_mechanism: Isolation state is the PKRS register (per core), the KSM-private per-vCPU area (secure stack, vCPU context, interrupt info) at a constant gVA, KSM-only IDT/gates, and KSM page descriptors tracking reference counts and PTP levels
  overhead_bottleneck: KSM calls on page-fault handling and the iret path (1067 ns total in nested clouds) replace the far more expensive shadow-paging emulation (~1828 ns in PVM) and nested EPT faults (~30881 ns in nested HVM)
  primary_tradeoff: Dropping hardware virtualization in favour of PKS plus address-space separation -> gains near-native syscalls and one-dimensional paging (the big win under nesting), but costs contiguous per-container physical memory (fragmentation) and is limited by PKS offering only 16 domains per address space
  quantitative_claims:
  - 'motivation: secure containers in nested clouds degrade memory-intensive apps by 28-226% and I/O-intensive apps by 1.8-4.3x'
  - 'page fault (nested): 1067 ns (CKI) vs 32565 ns (HVM-NST) vs 4407 ns (PVM), AMD EPYC-9654'
  - 'syscall: ~90 ns (CKI, matching RunC/HVM) vs 336 ns (PVM)'
  - 'empty hypercall (nested cloud): 390 ns (CKI) vs 6746 ns (HVM-NST)'
  - 'memory-intensive latency (PARSEC/vmitosis, nested): up to 72% lower than HVM and 47% lower than PVM'
  - 'memcached with 64 clients (nested): 6.8x throughput vs HVM-NST and 1.2x vs PVM-NST'
  - 'redis with 64 clients (nested): 2.0x throughput vs HVM-NST and 1.3x vs PVM-NST'
  - 'GUPS (TLB-miss intensive, bare metal): 19% lower latency than HVM by eliminating the two-dimensional page-table walk'
  - 'SQLite write-heavy: CKI matches RunC/HVM while PVM is 19-24% lower throughput'
  why_useful_for_learning: It isolates exactly which costs of a secure container come from hardware virtualization (two-dimensional paging, VM exits, nesting) and shows what remains if you keep the guest kernel but delete the hypervisor boundary.
  priority: P1
  related:
  - VIRT-EUROSYS25-05
  - VIRT-ATC25-01
  - VIRT-ATC25-02
  - VIRT-OSDI25-03
  relations:

  multiplexing_mechanism: The physical NIC is divided by SR-IOV into virtual functions, one assigned per secure container
  state_mechanism: Device-assignment state lives in VFIO/IOMMU page tables and QEMU device models set up at container start; passthrough assignment is what makes this state expensive to create (and, as HyperAlloc notes, expensive to change later)
  overhead_bottleneck: End-to-end startup latency of enabling SR-IOV passthrough, split across VF device management locking, DMA memory mapping/zeroing, and in-guest driver initialization
  primary_tradeoff: Passthrough instead of software-mediated virtio -> gains near-native data-plane performance for secure containers but costs a heavy device-attach path at every start; FastIOV pays down that cost rather than giving up passthrough
  quantitative_claims:
  - overhead of enabling SR-IOV reduced by 96.1% (as stated in the official abstract)
  - end-to-end startup time reduced by 65.7% on average and 75.4% at the 99th percentile (official abstract)
  why_useful_for_learning: It is the concrete inventory of what actually happens when a device is passed through to a guest, and therefore of why passthrough trades data-plane speed for control-plane rigidity.

  classification: CONTEXT
  classification_note: 'A cost-driven provisioning and task-packing scheduler over EC2 instances: it consumes cloud VMs as priced units of capacity and contributes no virtualization mechanism, though it does quantify what instance acquisition and task checkpoint/restart actually cost.'
  drop_reason: null
  taxonomy_primary: T9

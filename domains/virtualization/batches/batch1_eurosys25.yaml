- id: VIRT-EUROSYS25-09
  title: 'Hey Hey, My My, Skewness Is Here to Stay: Challenges and Opportunities in Cloud Block Store Traffic'
  title_correction: null
  authors:
  - Haonan Wu
  - Erci Xu
  - Ligang Wang
  - Yuandong Hong
  - Changsheng Niu
  - Bo Shi
  - et al.
  venue: EuroSys
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3689031.3696068
  official_url: https://dl.acm.org/doi/10.1145/3689031.3696068
  fullpaper_source: https://oasis-sjtu.github.io/static/papers/HeyHeyMyMy.pdf
  classification: SUPPORT
  classification_note: A production characterization of Alibaba Cloud EBS that lays out the virtual-disk I/O path (VM -> queue pairs -> hypervisor polling worker threads -> BlockServer segments -> ChunkServer) and shows where virtualized block I/O actually becomes imbalanced or throttled.
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T9
  - T2
  physical_resource: NVMe
  logical_abstraction: A virtual disk mounted by a VM, exposed through 1-8 IO queue pairs and backed by 32 GiB logical segments spread over BlockServers
  problem: Cloud block storage deploys many load balancers, yet nobody had measured whether traffic is actually balanced across the layers of the virtual-disk path at fleet scale.
  mechanism: Using the DiTing distributed tracing framework, the authors collect 310 million sampled IO traces (1/3200) plus second-granularity full-scale metrics over a 12-hour window across ~60,000 VMs and ~140,000 virtual disks in three datacenters, then quantify spatial and temporal skewness at VM, queue-pair, worker-thread, segment, storage-node and LBA granularity and test candidate fixes in trace-driven simulation.
  isolation_mechanism: Per-virtual-disk IO queue pairs give parallelism and isolation between disks; a throttle enforces the per-VD purchased IOPS/throughput limit - the paper shows the throttle fires while 61.6% (throughput) / 74.7% (IOPS) of the resource is available
  multiplexing_mechanism: Hypervisor polling worker threads bound to host cores serve queue pairs round-robin; each virtual disk is striped over 32 GiB segments across BlockServers, and ChunkServers persist to SSDs over RDMA
  state_mechanism: Virtual-disk metadata is the segment-to-BlockServer map; rebalancing moves segments between BlockServers, and the paper shows up to 59.2% of those migrations in the worst cluster are unnecessary
  overhead_bottleneck: 'Skew, not aggregate capacity: the hottest hypervisor worker thread carries 2.6x the coldest on average, and 1% of VMs contribute 75.4% of read traffic in one datacenter'
  primary_tradeoff: 'Round-robin queue-to-thread binding and per-VD throttling -> gain simplicity and predictable billing, but cost utilization: rebinding helps only 29.9% of nodes, while lending unused quota between a tenants virtual disks would cut throttle duration by a median 43.7% at the risk of 5.2% negative cases'
  quantitative_claims:
  - 'scale: ~60,000 VMs and ~140,000 virtual disks, 12-hour window, 310 million IO traces at 1/3200 sampling, three datacenters (Alibaba Cloud EBS)'
  - 'spatial skew: 1% of VMs contribute 75.4% of read and 42.6% of write traffic (DC-3); 1% of segments contribute 55.9% of read and 38.6% of write'
  - 'storage nodes are comparatively balanced: top 1% contribute 2.8% of read and 1.9% of write traffic (DC-3)'
  - 'temporal skew: VM read traffic median peak-to-average 15813.1, 24.1x the write figure'
  - 'worker threads: median coefficient of variation 0.7 (read) and 0.5 (write) at 1-minute scale; hottest thread handles 2.6x the coldest on average'
  - 'read-vs-write asymmetry: 96.8% of storage clusters have read CoV >= write CoV'
  - 'queue concentration: 42.6% of compute nodes have a single hottest queue carrying >80% of read traffic'
  - 'LBA hotspots: the hottest 64 MiB block is 3.0% of the address space but takes 18.2% of accesses, and 93.9% of hottest blocks are write-dominant'
  - 'throttling: when throttled, median available-resource rate is 61.6% (throughput) and 74.7% (IOPS); limited lending at p=0.8 gives positive gain in 85.9% of multi-VD cases, median 43.7% shorter throttle duration'
  - 'rebalancing: up to 59.2% of migrations unnecessary in the worst cluster; an ideal importer choice extends migration intervals 2.0x (median 0.48 vs 0.24)'
  - 'caching: BS-side cache shows 21.0x lower standard deviation in cache utilization than compute-node cache'
  why_useful_for_learning: It is the concrete anatomy of a virtual disk in production - queues, hypervisor polling threads, segments, throttles - and shows that the hard problems of storage virtualization at scale are skew and quota semantics, not raw path efficiency.
  priority: P2

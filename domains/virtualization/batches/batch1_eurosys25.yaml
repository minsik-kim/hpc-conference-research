  physical_resource: CPU core
  logical_abstraction: A cloud instance as a priced capacity container that several batch tasks can be packed into
  problem: Hosting long-running batch jobs in the cloud is expensive because per-task instance provisioning underutilises instances, co-location interference is ignored, and there is no principled way to decide when reconfiguration is worth its overhead.
  mechanism: Eva orders instance types by hourly cost and packs tasks by throughput-normalised reservation price (a tasks standalone hourly cost scaled by its measured co-location throughput). Each scheduling period it computes both a full reconfiguration and a partial one and picks between them by comparing expected long-run provisioning savings against migration cost under a Poisson arrival model; tasks run as Docker containers with checkpoints in S3.

  - T8
  physical_resource: CPU core
  logical_abstraction: 'A workflow domain (WFD): one address space holding several functions as threads, with a LibOS providing filesystem/network/threading and reference-passed intermediate data'
  problem: Serverless workflows pay a cold start per function and then copy intermediate data through inter-process or inter-VM channels, so both instance creation and data hand-off dominate end-to-end latency.
  mechanism: AlloyStack is a three-layer LibOS - as-visor (global runtime), as-libos (kernel modules loaded on demand) and as-std (syscall-routing standard library). Functions of one workflow run as threads in one WFD address space and exchange data by reference through an AsBuffer slot namespace; Intel MPK splits the address space into a system partition (as-visor/as-libos) and a user partition, with trampoline pages switching PKRU and a blacklist on wrpkru/syscall/sysenter/int enforced by pre-execution image scanning.
  isolation_mechanism: MPK protection keys separate LibOS from user functions within a WFD, and different workflows get different processes/LibOS instances so their files and memory are unreachable across WFDs; optionally each function instance can get its own MPK partition for stricter intra-workflow isolation
  multiplexing_mechanism: Functions are threads scheduled by Linux CFS via clone(); each function gets exclusive heap/code/data segments and an independent stack, and unused LibOS modules are never loaded
  state_mechanism: Intermediate data lives in shared heap memory inside the WFD and is addressed by slot identifiers held by as-libos, so hand-off is a reference rather than a copy; per-function heaps are reclaimed on crash, and a fatfs file path is the fallback when reference passing is unavailable
  overhead_bottleneck: 'Once cold start is removed, the user-space filesystem becomes the limit: rust-fatfs is 4.4x slower than ext4 on reads, and with a 50 MB input cold start is 45% and data transfer 48% of end-to-end latency in the baseline'
  primary_tradeoff: Sharing one address space per workflow -> gains 1.3 ms starts and copy-free data passing, but costs intra-workflow isolation strength (MPK plus instruction blacklisting rather than separate address spaces) and forces functions to be compiled against as-std or to WASM
  quantitative_claims:
  - 'cold start: reduced by 98.5% to 1.3 ms; disabling on-demand module loading raises it to 89.4 ms'
  - 'intermediate data transfer of 16 MB: 2.6x faster in Rust, 13.2x in C, 1.8x in Python vs Faastlane-refer'
  - 'end-to-end Rust workflows: 7.3x-38.7x speedup (FunctionChain 4.08-10.15x over OpenFaaS, 6.69-20.68x over OpenFaaS-gVisor)'
  - 'end-to-end Python/C workflows: 4.8x-78.3x speedup'
  - 'WordCount with 100 MB input and 3 instances: 6.5-29.3x faster than OpenFaaS variants'
  - 'P99 latency: up to 7.4x lower than Faastlane-refer-kata at high QPS'
  - 'resource use: 2.4x less CPU and 3.2x less memory than Faastlane-refer-kata'
  - 'user-space filesystem penalty: rust-fatfs 4.4x slower than ext4 on reads; Wasmtime path 30.0% slower than Faasm/WAVM on CPU-bound C/Python'
  why_useful_for_learning: 'It is a clean demonstration that the unit of isolation is a design choice: widening it from the function to the workflow converts both sandbox creation and inter-function data movement from costs into non-events.'

# ============================= ASPLOS 2024 =============================

- id: VIRT-ASPLOS24-01
  title: Direct Memory Translation for Virtualized Clouds
  title_correction: null
  authors: [Jiyuan Zhang, Weiwei Jia, Siyuan Chai, Tianyin Xu, et al.]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620665.3640358
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#8B
  fullpaper_source: https://tianyin.github.io/pub/dmt.pdf
  classification: CORE
  classification_note: The paper's entire contribution is a hardware/OS mechanism (DMT, and its paravirtualized variant pvDMT) that replaces multi-level nested guest-physical-to-host-physical address translation with a direct VMA-to-physical-region mapping, which is squarely T2 machine-memory-virtualization.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T1]
  physical_resource: DRAM
  logical_abstraction: A per-core hardware register file mapping virtual-memory-area ranges directly to contiguous physical Translation-Entry-Areas, bypassing multi-level (nested, for guests) page-table walks
  problem: Nested address translation on x86 requires up to 24 (35 with 5-level tables) sequential memory accesses on a TLB miss, consuming over half of execution time for memory-intensive VM workloads, and nested virtualization has no hardware 2-level acceleration so falls back to slow shadow paging.
  mechanism: DMT adds 16 per-core registers holding VMA-base/size/page-size and a pointer to a contiguous Translation-Entry-Area (TEA) holding that VMA's last-level PTEs; a miss becomes a single indexed memory reference instead of a walk. pvDMT extends this to guests via a hypercall (KVM_HC_ALLOC_TEA) and a read-only gTEA table (EPTP-switching-like) so a guest can only map into its own TEAs, and nested translation collapses similarly.
  isolation_mechanism: Guests can only allocate/reference their own TEAs through the hypercall-mediated gTEA table, which the host validates, preventing a guest from mapping arbitrary host physical memory and closing associated timing side channels.
  multiplexing_mechanism: OS dynamically merges/splits/prioritizes VMA-to-TEA register assignments (largest VMAs first, since they cause most walks) when the 16-register budget is exceeded, falling back to standard page walks for excess VMAs.
  state_mechanism: Register state (VMA base/size/page-size, TEA physical frame number, gTEA pointer) is saved/restored per process on context switch; for VMs the host keeps a separate guest/host register set.
  overhead_bottleneck: Requirement for contiguous physical memory for each TEA, and infrequent VMA-management (merge/split) overhead; both are minor compared to the translation savings.
  primary_tradeoff: Eager, register-resident VMA-to-physical mapping -> collapses nested/guest translation to one memory reference, but assumes workloads have a handful of large, mostly-static VMAs; highly fragmented or frequently-remapped memory falls back to ordinary (slow) page walks.
  quantitative_claims:
  - "page-walk speedup: 1.28x native (4KB pages) vs vanilla Linux; 1.58x under single virtualization (pvDMT, 4KB) vs Linux/KVM (Intel Xeon Gold 6138, 20 cores)"
  - "application speedup: 1.20x single-virtualization (pvDMT, 4KB, avg of 7 memory-intensive benchmarks: Redis, Memcached, GUPS, BTree, Canneal, XSBench, Graph500, 62-155GB working sets)"
  - "nested virtualization: eliminates 39% of shadow-paging overhead; 1.48x application speedup (4KB, pvDMT) vs nested KVM with shadow paging"
  - "pvDMT hypercall overhead: 1.88 microseconds per TEA allocation"
  - "extra memory for eager TEA allocation: <2.5%"
  why_useful_for_learning: Concretely shows the cost structure of guest-physical-to-host-physical translation (why nested paging is slow) and a hardware-software co-design that attacks it directly, complementing shadow-paging/EPT/NPT background.
  priority: P1
  related: [VIRT-ASPLOS24-03]
  relations:
  - {type: TRADEOFF_PAIR, target: "EPT/NPT nested paging (Intel/AMD hardware 2D page walk)", basis: "Paper positions DMT/pvDMT as replacing the sequential 2D EPT/NPT walk with a single direct-mapped reference."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author preprint (tianyin.github.io/pub/dmt.pdf); official ACM DOI/volume confirmed via search (Vol.2 of 29th ASPLOS), session placement confirmed from the ASPLOS 2024 main-program page (Session 8B).

- id: VIRT-ASPLOS24-02
  title: Verifying Rust Implementation of Page Tables in a Software Enclave Hypervisor
  title_correction: null
  authors: [Zhaofeng Li, Zhouyang Dai, Ronghui Gu, et al.]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620665.3640398
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#4D
  fullpaper_source: https://www.cs.columbia.edu/~rgu/publications/asplos24-dai.pdf
  classification: CORE
  classification_note: The object of study is the extended-page-table (EPT) memory-virtualization code of HyperEnclave, a production software TEE hypervisor; the paper formally verifies the hypervisor's spatial-isolation mechanism between enclaves and the untrusted primary OS, which is T7 hypervisor-correctness/confidential-VM CORE by definition.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T1, T2]
  physical_resource: DRAM
  logical_abstraction: Formally-verified per-enclave Extended Page Tables carving isolated address spaces (ELRANGE) plus a shared Enclave Page Cache out of host physical memory, mediated by a Rust hypervisor monitor
  problem: Rust's memory-safety guarantees do not prevent semantic/logic errors in memory-subsystem configuration (e.g. page-table aliasing, covert mappings) that can silently break spatial isolation between mutually-distrusting VMs/enclaves in a software TEE.
  mechanism: The authors build MIRVerif, a formal semantics and object-view memory model for Rust's MIR, and a 15-layer CCAL-style refinement proof (frame allocation up to address-space isolation) covering HyperEnclave's ~2,130 LoC memory module; three pointer types (normal, trusted, RData) preserve Rust ownership discipline through the proof layers without rewriting idiomatic code.
  isolation_mechanism: Extended Page Tables give each enclave/primary-OS its own guest-physical-to-host-physical mapping; the proof establishes a noninterference theorem (no principal can observe state it lacks permission for) plus invariants for ELRANGE isolation, marshalling-buffer constraints and EPCM metadata consistency.
  multiplexing_mechanism: A shared Enclave Page Cache (EPC), managed by the RustMonitor, is partitioned across concurrently-running enclaves and the primary OS via the verified EPT configuration code.
  state_mechanism: Enclave/primary-OS memory-virtualization state lives in the verified EPT structures and EPC metadata inside the hypervisor; the paper does not address migration of this state.
  overhead_bottleneck: Not a performance paper; the "cost" reported is verification effort, not runtime overhead.
  primary_tradeoff: Formal verification of the memory-virtualization layer -> high assurance that isolation invariants hold (catches a real bug), but at a proof-engineering cost of ~3 person-years for 49 of 77 functions in one module, with the remaining 105 unsafe blocks trusted via manual review only.
  quantitative_claims:
  - "proof effort: ~3 person-years total (20% framework, 30% invariant/noninterference proofs, 40% code proofs)"
  - "code verified: 49 of 77 functions in the Memory module (~2,130 LoC of Rust)"
  - "proof density: 1.25 lines of proof script per line of generated MIR code (3,358 MIR LoC / 4,191 proof LoC), vs 2.16 for SeKVM's C-based verification"
  - "found one real security bug: shallow-copied page tables retaining pointers into guest-controlled memory, caught during verification"
  why_useful_for_learning: Shows concretely what has to be proven (and what commonly goes wrong) in a hypervisor's EPT/nested-paging isolation code, directly explaining why CORE confidential-VM/EPT papers treat this layer as security-critical.
  priority: P1
  related: [VIRT-ASPLOS24-01]
  relations:
  - {type: USES_MECHANISM_FROM, target: "Extended Page Tables / SGX-style enclave isolation", basis: "HyperEnclave is a software TEE that virtualizes enclave memory via EPTs analogous to SGX/EPT hardware isolation."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author-hosted PDF (cs.columbia.edu/~rgu). HyperEnclave is Ant Group's open-source production software TEE; session placement confirmed from ASPLOS 2024 main-program page (Session 4D).

- id: VIRT-ASPLOS24-03
  title: "GMLake: Efficient and Transparent GPU Memory Defragmentation for Large-scale DNN Training with Virtual Memory Stitching"
  title_correction: null
  authors: [Cong Guo, Rui Zhang, Jiale Xu, Jingwen Leng, et al.]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620666.3651353
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#8B
  fullpaper_source: https://arxiv.org/abs/2401.08156
  classification: CORE
  classification_note: The paper's core mechanism, virtual memory stitching, is a GPU-side virtual-to-physical address remapping layer that fuses scattered physical GPU memory blocks into a logically contiguous virtual allocation, i.e. it builds a genuine GPU virtual-memory abstraction (T6/T2) rather than merely scheduling around fragmentation.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T2]
  physical_resource: GPU
  logical_abstraction: A logically-contiguous virtual GPU memory allocation stitched transparently from non-contiguous physical GPU memory blocks via GPU virtual-address mapping
  problem: Caching allocators (PyTorch/TensorFlow) combined with memory-reduction techniques (recomputation, offloading, distributed training, LoRA) issue frequent, irregular alloc/free requests that fragment GPU memory severely, wasting capacity and sometimes causing out-of-memory failures despite free memory existing.
  mechanism: Virtual Memory Stitching (VMS) uses GPU low-level virtual-memory management APIs to map a single logically-contiguous virtual address range onto multiple non-contiguous physical GPU memory blocks, so a large tensor allocation succeeds without requiring physically-contiguous space; this is fully transparent to the DNN framework and memory-reduction technique in use.
  isolation_mechanism: N/A (single-tenant process memory management, not multi-tenant isolation)
  multiplexing_mechanism: Physical GPU memory blocks freed by different lifecycle stages (recomputation, offloading, distributed shards) are reused and stitched together on demand rather than requiring contiguous free runs.
  state_mechanism: Virtual-to-physical mapping state lives in the GPU driver's page tables for the process; no cross-process/migration handling is discussed.
  overhead_bottleneck: Overhead of maintaining/updating the virtual-to-physical mapping tables during frequent stitching operations (not separately quantified as a distinct cost line in the summary obtained).
  primary_tradeoff: Virtual-address stitching over physical fragmentation -> recovers usable capacity and avoids OOM without any framework/model code changes, at the cost of relying on lower-level GPU virtual-memory management primitives instead of the framework's own simpler bump allocator.
  quantitative_claims:
  - "average GPU memory savings: 9.2 GB (up to 25 GB) across eight LLM models on NVIDIA A100 80GB"
  - "fragmentation reduction: 15% average (up to 33%)"
  why_useful_for_learning: A clean example of applying classic OS virtual-memory decoupling (logical vs physical contiguity) inside a GPU to solve a fragmentation problem, bridging CPU-side VM concepts to accelerator virtualization.
  priority: P1
  related: [VIRT-ASPLOS24-01]
  relations:
  - {type: SAME_BRANCH, target: VIRT-ASPLOS24-01, basis: "Both papers apply virtual-memory decoupling/remapping (VMA-to-physical for CPU/VMs, GPU virtual-to-physical for DNN training) to eliminate a translation/fragmentation bottleneck."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Summarized from the arXiv abstract/preprint (2401.08156); did not verify the full evaluation section beyond the headline numbers reported by the fetch.

- id: VIRT-ASPLOS24-04
  title: "Lightweight Fault Isolation: Practical, Efficient, and Secure Software Sandboxing"
  title_correction: null
  authors: [Zachary Yedidia]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620665.3640408
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#3B
  fullpaper_source: https://zyedidia.github.io/papers/lfi_asplos24.pdf
  classification: CORE
  classification_note: LFI's entire contribution is a new software-fault-isolation sandboxing boundary (an alternative to hardware virtualization/containers and to WebAssembly) for untrusted-code execution, directly matching the brief's T5 "syscall interposition / isolation boundary is CORE" example.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: Tens of thousands of independent 4GiB software-isolated sandbox regions coexisting within one process address space on ARM64
  problem: Cloud/serverless platforms need to run untrusted code with minimal startup latency and cheap isolation; hardware virtualization/containers cost thousands of cycles per context switch, and existing multi-sandbox SFI systems either impose 20%+ overhead or scale to only a few thousand sandboxes.
  mechanism: LFI enforces address-space and control-flow confinement on ARM64 using a single guard instruction (`add x18, x21, w1, uxtw`) that forces the top 32 bits of every computed address into a reserved register, confining all memory accesses to a 4GiB region; five general-purpose registers are reserved for sandbox bookkeeping, and a 300-line Rust static verifier checks compiled binaries preserve these invariants without requiring compiler cooperation.
  isolation_mechanism: Software-enforced address masking plus static verification of guard-instruction placement in the binary; violating code cannot pass verification and is rejected before execution.
  multiplexing_mechanism: Each sandbox is allotted its own 4GiB virtual region within a shared process address space, allowing ~65,000 concurrent sandboxes per address space (vs a few thousand for prior SFI, and one 4GiB space per instance for WebAssembly engines).
  state_mechanism: N/A (no migration; sandbox lifecycle is process-local)
  overhead_bottleneck: The guard instruction and reserved-register bookkeeping inserted at every memory access/control transfer; worst-case 17% overhead observed on one SPEC benchmark (leela_r).
  primary_tradeoff: Binary-level SFI verification instead of hardware isolation or a managed runtime (Wasm) -> near-native (~6-7%) overhead and 50-cycle inter-sandbox calls with tens of thousands of sandboxes per address space, at the cost of requiring a specific calling convention/guard discipline in compiled code and ARM64-specific mechanics.
  quantitative_claims:
  - "runtime overhead: 6.4% (Apple M1) / 7.3% (Google Cloud T2A) geometric mean over 14 SPEC CPU2017 benchmarks vs native LTO-compiled code"
  - "vs WebAssembly: LFI 6-7% overhead vs 15-22% for optimized Wasm engines (WAMR, wasm2c)"
  - "sandbox density: ~65,000 sandboxes per address space vs <3,000 for NaCl on x86-64"
  - "inter-sandbox call latency: 50 cycles"
  - "syscall context-switch: 22 ns for LFI vs 129 ns for a Linux syscall; 1,504 ns for a Linux pipe-based IPC context switch"
  - "code-size overhead: 12.9% text-segment increase, 8.3% overall binary-size increase"
  why_useful_for_learning: A concrete, quantified alternative point on the isolation-cost spectrum (hardware VM > container > WebAssembly > SFI), useful for explaining why serverless/edge platforms trade isolation strength for startup-latency and density.
  priority: P1
  related: []
  relations:
  - {type: ALTERNATIVE, target: "WebAssembly sandboxing (Wasm2c/WAMR)", basis: "Paper directly benchmarks LFI against WAMR/wasm2c as competing lightweight-isolation mechanisms for untrusted code."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author-hosted camera-ready PDF (zyedidia.github.io); artifact is on Zenodo (11078552).

- id: VIRT-ASPLOS24-05
  title: "RainbowCake: Mitigating Cold-starts in Serverless with Layer-wise Container Caching and Sharing"
  title_correction: null
  authors: [Hanfei Yu, Rohan Basu Roy, Christian Fontenot, Devesh Tiwari, Jian Li, Hong Zhang, Seung-Jong Park, Hao Wang]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3617232.3624871
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#4B
  fullpaper_source: https://github.com/IntelliSys-Lab/RainbowCake-ASPLOS24
  classification: SUPPORT
  classification_note: The contribution is a container-runtime caching/sharing mechanism (layer-wise pre-warming and keep-alive) for serverless cold-start mitigation; per the brief's threshold guidance this is container-runtime/image mechanism (SUPPORT), not a new isolation-architecture boundary.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8]
  physical_resource: CPU core
  logical_abstraction: A layered, partially-shared container image/runtime cache (base/runtime/app layers cached and kept warm independently) atop Apache OpenWhisk
  problem: Serverless cold-starts (container creation latency) hurt tail latency; full-container caching wastes memory holding every layer warm, while whole-container sharing wastes memory across dissimilar functions.
  mechanism: RainbowCake decomposes container startup into three stages/layers and applies a sharing-aware, event-driven caching algorithm that decides in real time which individual layers to keep warm and share across functions, rather than caching or sharing whole containers.
  isolation_mechanism: Standard OpenWhisk/container-level isolation; the paper's contribution is cache/keep-alive policy, not a new isolation boundary.
  multiplexing_mechanism: Memory is multiplexed at layer granularity across concurrently-idle functions that share common base/runtime layers, instead of at whole-container granularity.
  state_mechanism: N/A beyond keep-alive container state in memory; no cross-host migration discussed.
  overhead_bottleneck: Memory pressure from keeping enough layers warm to cover the workload's layer-sharing structure while avoiding whole-container duplication.
  primary_tradeoff: Layer-wise caching/sharing -> large joint reduction in cold-start latency and memory waste, at the cost of a more complex, sharing-aware runtime cache-management policy than simple whole-container caching.
  quantitative_claims:
  - "68% reduction in function startup latency vs state-of-the-art solutions"
  - "77% reduction in memory waste vs state-of-the-art solutions"
  why_useful_for_learning: "Concrete example of the CORE/SUPPORT boundary the brief draws for serverless: the isolation substrate (container) is unchanged, but the caching mechanism that makes that isolation cheap to reuse is the contribution."
  priority: P2
  related: [VIRT-ASPLOS24-06]
  relations:
  - {type: SAME_BRANCH, target: VIRT-ASPLOS24-06, basis: "Both target serverless cold-start/idle-container memory cost in the same 'Serverless Computing 1' ASPLOS 2024 session, from complementary angles (container-cache layering vs container memory offloading)."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds: [code, official-web]
  confidence: MEDIUM
  notes: Summarized from the paper's GitHub artifact README rather than the full PDF (ACM DL 403'd); numbers match the abstract as quoted in the README.

- id: VIRT-ASPLOS24-06
  title: "FaaSMem: Improving Memory Efficiency of Serverless Computing with Memory Pool Architecture"
  title_correction: null
  authors: [Zhaobo Zhang, Zijun Li, Quan Chen, et al.]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620666.3651355
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#4B
  fullpaper_source: https://mivenhan.github.io/publication/2024faasmem/
  classification: SUPPORT
  classification_note: FaaSMem's contribution is memory reclamation/offloading for idle serverless sandboxes (a memory-pool architecture), matching the brief's "memory reclamation = SUPPORT" guidance for serverless mechanisms that make isolation cheaper, rather than a new isolation boundary itself.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T9]
  physical_resource: DRAM
  logical_abstraction: A remote/local memory-pool architecture that offloads cold pages of idle-but-kept-alive serverless containers instead of keeping their full memory footprint local
  problem: Serverless platforms keep idle containers' full memory resident to avoid cold-start recreation cost, but this wastes scarce datacenter memory since idle containers use only a fraction of their allocated pages.
  mechanism: FaaSMem introduces Page Bucket (Pucket), which segregates a container's memory pages by lifecycle phase (init/execution/idle) since access patterns differ sharply across phases, and a semi-warm keep-alive period during which cold pages are offloaded to a remote memory pool, balancing offload cost against remote-access penalty on next invocation.
  isolation_mechanism: N/A (memory-efficiency mechanism for already-isolated containers, not a new isolation boundary)
  multiplexing_mechanism: Idle containers' cold pages are pooled remotely and reclaimed for other tenants' local memory, increasing achievable container density per host.
  state_mechanism: Offloaded pages move from local host memory to a remote memory pool during the semi-warm idle period and are fetched back on the next invocation.
  overhead_bottleneck: Remote-memory access latency when a semi-warm container is invoked and must fetch offloaded pages back.
  primary_tradeoff: Segment-wise (phase-aware) cold-page offloading -> large local-memory savings and higher container density, at the cost of a small increase in 95th-percentile invocation latency.
  quantitative_claims:
  - "local memory footprint reduced 9.9%-79.8% (workload-dependent)"
  - "container deployment density increased to 108%-218% of baseline"
  - "negligible increase in 95th-percentile latency"
  why_useful_for_learning: Shows the memory-reclamation half of the serverless isolation-cost equation (complementing RainbowCake's caching half), explaining why "keep containers warm cheaply" is an active systems problem.
  priority: P2
  related: [VIRT-ASPLOS24-05]
  relations:
  - {type: SAME_BRANCH, target: VIRT-ASPLOS24-05, basis: "Both address the cost of keeping serverless containers warm; FaaSMem attacks memory footprint, RainbowCake attacks cache-layer duplication."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: Summarized from the author's publication page (ACM DL 403'd); a GitHub artifact (BarrinXu/FaaSMem) also exists but was not separately fetched.

- id: VIRT-ASPLOS24-07
  title: "RAP: Resource-aware Automated GPU Sharing for Multi-GPU Recommendation Model Training and Input Preprocessing"
  title_correction: null
  authors: [Zheng Wang, Yuke Wang, Jiaqi Deng, et al.]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620665.3640406
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#3C
  fullpaper_source: https://storage.googleapis.com/yuke_profile/ASPLOS24_RAP.pdf
  classification: SUPPORT
  classification_note: RAP co-schedules DLRM training and input-preprocessing kernels on the same GPUs using a cost model and kernel fusion, not a virtual-GPU partitioning abstraction; per the brief this is a scheduler over existing GPU resources (SUPPORT), not CORE GPU virtualization.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T6]
  physical_resource: GPU
  logical_abstraction: A predicted "overlapping capacity" time-window on each training GPU into which preprocessing kernels are packed via horizontal fusion
  problem: Industrial deep-learning recommendation models require continuous online retraining, and dedicating hundreds of CPU nodes purely to input preprocessing consumes more power than the GPU trainers themselves.
  mechanism: RAP profiles each GPU's spare capacity during training phases (Overlapping Capacity Estimator), predicts preprocessing-kernel run time with an XGBoost latency predictor, and uses an MILP solver plus heuristic search to fuse/shard preprocessing kernels and schedule them into training's idle GPU windows without violating a co-running cost budget; inter-GPU graph mapping balances preprocessing load and locality across GPUs.
  isolation_mechanism: Predictive avoidance (cost-model-bounded co-running budget) rather than hardware partitioning; no spatial/temporal hardware isolation primitive (MIG/MPS) is used.
  multiplexing_mechanism: Preprocessing and training kernels time-share the same GPU SMs via horizontal kernel fusion and adaptive kernel sharding when the fused kernel would exceed available resources.
  state_mechanism: N/A
  overhead_bottleneck: Accuracy of the latency predictor and the overlapping-capacity estimate, which bound how aggressively preprocessing can be packed without degrading training.
  primary_tradeoff: Software co-scheduling on shared GPUs instead of dedicated CPU preprocessing fleets -> large throughput/cost gains, at the cost of prediction-model accuracy risk (91-99% observed) and reliance on a cost model rather than hardware-guaranteed isolation.
  quantitative_claims:
  - "18.4x average speedup vs CPU-based TorchArrow preprocessing (DGX-A100, 8xA100)"
  - "2.01x vs plain CUDA streams; 1.39x vs NVIDIA MPS"
  - "end-to-end throughput only 1.71% below an ideal (interference-free) upper bound"
  - "GPU/SM utilization: 92.8%/80.3% (RAP) vs 77.6%/59.0% (baseline)"
  - "latency-predictor accuracy: 92.9%-98.5% across operators"
  why_useful_for_learning: "A worked example of the brief's GPU-sharing threshold trap: a sophisticated scheduler over existing GPUs is SUPPORT, contrasted with CORE vGPU-abstraction papers."
  priority: P2
  related: []
  relations:
  - {type: CONTRASTS_WITH, target: "MIG/MPS-based vGPU partitioning (CORE-tier)", basis: "RAP explicitly benchmarks against and avoids relying on MIG/MPS hardware partitioning, instead using a software cost model."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author-hosted preprint PDF (storage.googleapis.com/yuke_profile).

- id: VIRT-ASPLOS24-08
  title: "Pentimento: Data Remanence in Cloud FPGAs"
  title_correction: null
  authors: [Colin Drewes, Olivia Weng, Andres Meza, Alric Althoff, Ryan Kastner, Dustin Richmond]
  venue: ASPLOS
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3620665.3640355
  official_url: https://www.asplos-conference.org/asplos2024/main-program/index.html#2B
  fullpaper_source: https://www.colindrewes.com/papers/drewes2024asplos.pdf
  classification: SUPPORT
  classification_note: The paper attacks (rather than builds) FPGA multi-tenancy isolation, showing cloud providers' logical-wipe-based temporal isolation between successive FPGA tenants is incomplete; this directly informs the isolation-mechanism trade-offs of CORE FPGA/accelerator-virtualization designs, matching the brief's SUPPORT bar.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T6]
  physical_resource: FPGA
  logical_abstraction: A sequentially-time-shared FPGA fabric that cloud providers isolate between successive tenants purely by logical bitstream wipe/reconfiguration
  problem: Cloud FPGA providers claim no design code is exposed and that FPGA state is scrubbed on termination, but analog transistor-level effects can retain information about a prior tenant's design after logical wipe.
  mechanism: "The attack exploits Bias Temperature Instability (BTI): sustained logical 0/1 values on a transistor cause different, measurable propagation-delay drift; an attacker who leases the FPGA after a victim measures these delays with an on-chip Time-to-Digital Converter to recover prior-tenant information, including full AES keys in the best case."
  isolation_mechanism: "Exposes a gap in providers' temporal isolation: logical/bitstream wipe between successive tenants does not remove the physical BTI \"imprint,\" so isolation depends on device age/environmental conditions the provider does not control for."
  multiplexing_mechanism: Cloud providers time-multiplex one physical FPGA across sequential tenants (no spatial co-location), which is exactly the boundary this attack targets.
  state_mechanism: Residual analog state (accumulated charge-trap degradation) persists physically in the fabric across the provider's logical reset, and decays/is recoverable over a 24-200+ hour window depending on polarity.
  overhead_bottleneck: Attack success depends on burn-in/recovery duration and uncontrolled device/environmental variables (temperature, device age), which the cloud setting cannot control the way the lab setting can.
  primary_tradeoff: Sequential (temporal) FPGA multi-tenancy without added scrubbing hardware -> lower provider cost, but leaves a residual side channel that logical wiping alone cannot close.
  quantitative_claims:
  - "local controlled test: +-10 ps delta between 0/1-burned 10k-ps routes after 200 hours; PBTI recovery in 30-50 hours, NBTI in 200+ hours"
  - "AWS F1 cloud test: full 128-bit AES key recovered on 5 of 8 instances under burn-in+recovery threat model; recovery-only threat model reaches 90%+ per-bit accuracy but needs ~2^62 encryptions to fully recover a key"
  - "80%+ classification accuracy for 5000 ps test routes within hours of the recovery phase, across multiple AWS boards"
  why_useful_for_learning: A concrete counter-example to the assumption that "logical reset = isolation" for shared accelerators, directly relevant to designing CORE FPGA/accelerator virtualization with real scrubbing guarantees.
  priority: P2

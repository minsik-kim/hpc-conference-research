- id: VIRT-HPDC24-03
  title: "FaaSKeeper: Learning from Building Serverless Services with ZooKeeper as an Example"
  title_correction: null
  authors: [Marcin Copik, Alexandru Calotoiu, Pengyu Zhou, Konstantin Taranov, Torsten Hoefler]
  venue: HPDC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3625549.3658661
  official_url: https://doi.org/10.1145/3625549.3658661
  fullpaper_source: https://mcopik.github.io/assets/pdf/2024_faaskeeper_preprint.pdf
  classification: CONTEXT
  classification_note: FaaSKeeper is an experience/measurement paper rebuilding a stateful coordination service (ZooKeeper) atop existing commercial FaaS/storage primitives (Lambda, DynamoDB, S3, etc.); it does not build a new sandbox/isolation mechanism, but its findings on missing FaaS platform capabilities (fast invocation, stateful functions, decoupled I/O) directly explain why the abstraction FaaS providers offer is insufficient for this workload class, matching the brief's CONTEXT definition.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T9]
  physical_resource: CPU core
  logical_abstraction: A ZooKeeper-equivalent coordination service reconstructed from disaggregated serverless compute (follower/leader functions) and storage (DynamoDB/S3 or Datastore/Cloud Storage) instead of a persistent VM cluster
  problem: ZooKeeper requires a persistent VM cluster that is often underutilized for variable, infrequent coordination workloads, motivating a fully serverless (pay-per-use) reimplementation, but doing so exposes gaps in what commercial FaaS platforms actually provide.
  mechanism: Follower functions validate operations and enqueue changes via FIFO queues; a leader function applies updates to user-visible storage and delivers watch notifications; system metadata lives in DynamoDB/Datastore and user data in S3/Cloud Storage; synchronization uses timed locks and atomic key-value operations rather than a persistent quorum process.
  isolation_mechanism: Relies entirely on the underlying commercial FaaS platform's sandbox isolation (Lambda/Cloud Functions); not modified or evaluated as a contribution.
  multiplexing_mechanism: Each client request activates independent function invocations multiplexed by the cloud provider's existing FaaS scheduler.
  state_mechanism: Service state is decoupled from compute and held entirely in managed storage services (DynamoDB/S3 or Datastore/Cloud Storage) between invocations, since FaaS functions themselves are stateless/ephemeral.
  overhead_bottleneck: FaaS invocation and remote-storage I/O latency (functions spend most wall-clock time waiting on external services, so added CPU allocation gives minimal benefit).
  primary_tradeoff: Fully disaggregated, pay-per-use serverless coordination service -> up to 110-719x lower cost for infrequent workloads, at the cost of much higher per-write latency (30-400ms vs ZooKeeper's 2-3ms) and throughput capped at ~100 ops/sec.
  quantitative_claims:
  - "cost: 110-719x lower than the smallest ZooKeeper VM deployment for infrequent workloads; break-even around ~1M requests/day"
  - "write latency: ZooKeeper ~2-3ms vs FaaSKeeper ~30-400ms depending on node/storage choice"
  - "queue throughput saturates at ~100 ops/sec; storage costs dominate 40-80% of write cost"
  - "ported across AWS and GCP with ~950 lines of changes"
  why_useful_for_learning: Documents concretely which FaaS-runtime capabilities (fast invocation, stateful functions, decoupled I/O, real FIFO semantics) are missing today, which is exactly the "why the abstraction is needed / what problems multi-tenancy and statelessness create" context the brief asks CONTEXT records to carry for CORE serverless-isolation papers.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: "An earlier preprint (arXiv 2203.14859, 2022) covers an earlier version of the system; the HPDC 2024 paper is the peer-reviewed venue publication."
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author-hosted 2024 preprint PDF matching the HPDC venue publication.

- id: VIRT-HPDC24-04
  title: "FaaSRail: Employing Real Workloads to Generate Representative Load for Serverless Research"
  title_correction: null
  authors: [Christos Katsakioris, Chloe Alverti, Konstantinos Nikas, Dimitrios Siakavaras, Stratos Psomadakis, Nectarios Koziris]
  venue: HPDC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3625549.3658684
  official_url: https://doi.org/10.1145/3625549.3658684
  fullpaper_source: https://www.cslab.ece.ntua.gr/~knikas/files/papers/2024-hpdc-faasrail.pdf
  classification: CONTEXT
  classification_note: FaaSRail is a benchmarking/load-generation methodology for serverless research (derived from Azure/Huawei production FaaS traces); it characterizes real FaaS workload properties (invocation skew, duration distribution, diurnal patterns) that are essential context for evaluating CORE serverless cold-start/isolation mechanisms, but is not itself an isolation or virtualization mechanism.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: A downscaled synthetic FaaS workload (augmented open-source functions plus a scaled invocation-time generator) statistically representative of production Azure/Huawei traces
  problem: "Serverless researchers cannot reproduce realistic load: production traces reveal skewed function popularity, bursty arrivals and short execution times, but the underlying function binaries are undisclosed and naive scaling-down (synthetic distributions or random sampling) loses statistical fidelity to the real trace."
  mechanism: An offline "Shrink Ray" stage augments ~10 open-source FunctionBench functions into ~2,300 variants (varying inputs) to match target execution-time distributions, then maps production trace functions onto these variants preserving popularity distributions; an online load generator downscales load/time using either "Spec mode" (thumbnail-style 24h-to-configurable-duration compression preserving diurnal shape) or "Smirnov Transform mode" (sampling from empirical runtime CDFs), with sub-minute arrivals modeled as Poisson processes.
  isolation_mechanism: N/A (a workload/benchmark generator, not an isolation mechanism)
  multiplexing_mechanism: N/A
  state_mechanism: N/A
  overhead_bottleneck: N/A
  primary_tradeoff: Statistically-faithful trace-derived synthetic workloads -> reproducible, representative serverless benchmarking without needing the real (undisclosed) function binaries, at the cost of some benchmarks remaining under- or over-represented where the augmented-workload distribution cannot fully match the target trace (e.g. lr_training at only 3% representation).
  quantitative_claims:
  - "production traces: Azure (80K functions, 908M invocations/day) and Huawei (104 functions)"
  - "trace properties reproduced: 50% of functions execute <1s, 80% of invocations run <1s, 99% of invocations concentrate in 8% of functions"
  - "example generated load: 908M daily invocations downscaled to a 2-hour, 20 RPS-max trace of 118K invocations"
  why_useful_for_learning: Gives the empirical FaaS workload shape (extreme popularity skew, sub-second majority durations) that motivates why CORE serverless cold-start/snapshot mechanisms target sub-second, bursty invocation patterns.
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read the author-hosted camera-ready PDF (NTUA cslab).


  problem: "Far-memory systems trade off transparency and performance: kernel-based approaches (paging over RDMA) are transparent but slow; library-based approaches (manual remote-object APIs) are fast but require programmer rewrites."
  mechanism: TrackFM uses LLVM middle-end analysis to identify heap allocations eligible for remote placement, instruments every load/store with a lightweight guard that checks/enforces locality using a spare bit in non-canonical x86-64 addresses to mark remotable pointers, and applies loop-chunking to eliminate redundant guards inside loops over contiguous remote data; it drives an existing AIFM far-memory backend rather than replacing it.

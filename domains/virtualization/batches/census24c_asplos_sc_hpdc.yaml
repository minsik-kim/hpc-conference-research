  state_mechanism: Object residency (local vs remote) is tracked and swapped via the AIFM backend under compiler guard control; no cross-host migration of full application state is discussed.
  overhead_bottleneck: Guard-check code inserted at every load/store; mitigated for loops via chunking, but this is the dominant instrumentation cost.
  primary_tradeoff: Compiler-level access guards over an existing far-memory library -> full programmer transparency at library-level performance, at the cost of noticeable code-size/compile-time growth.
  quantitative_claims:
  - "up to 2.7x faster than Fastswap (kernel-based) on STREAM Sum/Copy"
  - "within 10% of AIFM (library-based) performance while remaining fully transparent"
  - "12x speedup over Fastswap on hashmap workloads via reduced I/O amplification"
  - "code-size overhead: 2.4x average; compile-time overhead: <6x of baseline LLVM"

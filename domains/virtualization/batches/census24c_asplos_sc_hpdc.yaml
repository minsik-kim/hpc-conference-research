- id: VIRT-HPDC24-02
  title: "DataStates-LLM: Lazy Asynchronous Checkpointing for Large Language Models"
  title_correction: null
  authors: [Avinash Maurya, Robert Underwood, M. Mustafa Rafique, Franck Cappello, Bogdan Nicolae]
  venue: HPDC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3625549.3658685
  official_url: https://doi.org/10.1145/3625549.3658685
  fullpaper_source: https://arxiv.org/pdf/2406.10707
  classification: SUPPORT
  classification_note: DataStates-LLM is application/framework-level model-state checkpointing (GPU-to-host-to-storage) for LLM training fault tolerance, not machine/container-level virtualization state; it is kept SUPPORT (T4) because it directly informs the state-mechanism and overhead-bottleneck trade-offs (async vs sync capture, what dominates checkpoint cost) that the brief's CORE VM/container checkpoint papers must also address, even though the state being captured is training state rather than a hypervisor/container image.
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: []
  physical_resource: GPU
  logical_abstraction: An asynchronously-materialized, lazily-flushed snapshot of model parameters and optimizer state, captured without pausing GPU compute
  problem: LLM training on HPC systems needs frequent checkpoints for fault tolerance, but synchronous checkpointing blocks training and existing asynchronous approaches only achieve 1-4 GB/s throughput versus 25+ GB/s PCIe and 50+ GB/s network capacity available.
  mechanism: Exploiting that model parameters/optimizer state are immutable during forward/backward passes, DataStates-LLM issues lazy device-to-host copies of shards overlapped with compute, streams partial checkpoint data to persistent (Lustre) storage concurrently via separate physical links (streamlined multi-level flushing), and reuses pre-allocated, pinned host buffers across checkpoints (coalesced sharding) to avoid repeated allocation overhead.
  isolation_mechanism: N/A (single-job fault-tolerance mechanism, not multi-tenant isolation)
  multiplexing_mechanism: N/A
  state_mechanism: Model/optimizer shards move GPU -> pinned host buffer -> parallel filesystem asynchronously, with a two-phase consolidation consensus across GPUs to finalize a consistent checkpoint.
  overhead_bottleneck: Blocking synchronous D2H/H2D transfer during the training-update phase in prior approaches, which lazy overlap with compute eliminates.
  primary_tradeoff: Lazy, overlapped, buffer-reused checkpointing -> 3-4.2x higher checkpoint throughput and 1.3-2.2x faster end-to-end training, at the cost of added system complexity (pinned-buffer management, multi-level flush coordination) versus a simple synchronous checkpoint call.
  quantitative_claims:
  - "3-4.2x higher checkpointing throughput vs state-of-the-art (DeepSpeed sync, PyTorch Lightning async, TorchSnapshot)"
  - "up to 48x faster checkpointing for a 30B-parameter model at high data-parallelism degree"
  - "1.3-2.2x faster end-to-end training across configurations"
  - "evaluated on ALCF Polaris, up to 128 nodes / 512 A100 GPUs, BLOOM/LLaMA 3B-70B with 3D parallelism"
  why_useful_for_learning: "A useful cross-layer comparison point for CORE VM/container checkpoint-restore papers: shows how async, hardware-overlap-aware state capture is designed at the ML-framework layer, a directly analogous problem to hypervisor/container live-checkpoint design."
  priority: P2
  related: []
  relations:

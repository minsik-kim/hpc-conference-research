  batch_observations: >
    No seed list exists for the 2024 vintage of this venue set, so this batch is a fresh
    discovery census as instructed. Enumeration completeness differs sharply by venue and
    should be weighted accordingly in any downstream audit: HPDC 2024 is FULLY enumerated
    (dblp gave a clean 26-title list, and every title was individually screened against the
    taxonomy keyword list before deciding which got full records). ASPLOS 2024 is enumerated
    at the session-and-track level directly from the conference's own main-program page
    (133 papers scheduled across 8 numbered sessions / up to 4 parallel tracks each over 3
    days), which is believed complete for the *physically-presented* San Diego 2024 program;
    however, ASPLOS's continuous-review model splits the "29th ASPLOS" badge across four ACM
    DL proceedings volumes, a third-party aggregator reports 193 total accepted papers for
    that combined badge, and three papers found in the physical 2024 session list (FreePart,
    Flame, lambdaFS) turned out on DOI inspection to actually be 28th-ASPLOS-2023 papers
    re-presented in 2024 -- meaning an unknown number of *other* papers in my 133-count could
    carry a similar mismatched vintage that I did not individually verify (checking all 133
    DOIs against ACM DL was infeasible given the persistent 403s described in access_failures).
    Treat the ASPLOS 2024 population figure as "best-available, session-enumerated, with an
    unquantified vintage-mismatch risk," not as an ACM-DL-verified count. SC 2024 is the
    weakest link: the official site's robots.txt blocks essentially every /program/ and
    /proceedings/ path (even robots.txt itself failed to fetch, which reads as a network/WAF
    issue rather than a genuine robots policy), ACM DL 403s, and dblp's SC page would not load even
    though the near-identical HPDC dblp page did load cleanly earlier in the same session --
    so SC 2024 discovery here is keyword-search-based (GPU sharing, CXL/disaggregation,
    serverless, confidential computing, migration/checkpoint, SR-IOV/DPU terms each searched
    against "SC24"/"SC 2024") rather than full-population screening, and the resulting 5
    records should be read as "confirmed-real virtualization-adjacent SC24 papers found by
    targeted search," not as a complete census of SC24's virtualization content -- a
    meaningfully higher true count should be assumed likely.
    Threshold calls actually made: (1) GPU-sharing papers that explicitly compose/schedule
    over existing MIG/MPS primitives (RAP, ParvaGPU, ESG) were all held to SUPPORT, not CORE,
    per the brief's explicit trap; none of the ASPLOS/SC/HPDC 2024 candidates found this pass
    qualified as a CORE new-vGPU-abstraction paper except GMLake, whose virtual-memory-
    stitching mechanism is itself the contribution. (2) Disaggregation/CXL papers were split
    three ways per the brief's rule: SMART and COAXIAL explicitly disclaim building any
    virtual/pooled abstraction and were DROPped as keyword false positives; TrackFM similarly
    disclaims a new abstraction but was kept SUPPORT since it still directly informs
    far-memory design trade-offs; TECO (SC24 CXL tensor-offload) does build a coherent-memory
    abstraction over the CXL domain and was kept SUPPORT (not CORE) because the abstraction is
    single-job/single-host rather than a tenant-facing elastic pool. (3) "Checkpoint" in a
    title was NOT treated as automatically T4-relevant: MemSnap's checkpoint is data/database
    persistence (DROPped) while DataStates-LLM's is ML-training-state checkpointing, which was
    kept SUPPORT for its direct analogy to VM/container live-state-capture trade-offs, even
    though neither is a machine/container-level checkpoint. (4) Six papers (SpotServe, WASP,
    GMT, NetRen, CodeCrunch, Faast, ElasticRoom) hit the record-schema's hard rule 2 after
    genuine 3-plus-route access failures (ACM DL 403 nearly everywhere, ResearchGate 429,
    dblp/robots blocks) and were recorded at TITLE_ONLY/CONTEXT with LOW confidence rather
    than guessed into CORE/SUPPORT/DROP; WASP in particular is suspected pure_virtual_memory
    (the brief's explicit ASPLOS screening-rule case) but was not downgraded to DROP without
    having actually read it. (5) The pure-virtual-memory screening rule was applied crisply
    where evidence permitted: IDT (HPDC) explicitly states it is OS-level, non-hypervisor,
    non-disaggregated tiered-memory management and was DROPped confidently; WASP could not be
    confirmed either way and was left at CONTEXT rather than DROP. (6) CC-NIC was DROPped
    despite "NIC" and a passing IOMMU/BAR-space mention, because the paper's own text
    explicitly disclaims being a virtualization layer and does not develop or evaluate any
    isolation/multiplexing mechanism as a contribution.

  classification_note: Per the brief, disaggregation/far memory is SUPPORT unless the paper itself builds a virtual resource abstraction over the pool; TrackFM explicitly does not add a new logical/virtual abstraction layer, instead compiling access-tracking guards onto an existing far-memory runtime (AIFM), so it stays SUPPORT (informs disaggregated/tiered-memory trade-offs relevant to CORE memory-virtualization work).

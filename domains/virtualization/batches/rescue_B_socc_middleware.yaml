- id: VIRT-SOCC24-05
  title: 'uIO: Lightweight and Extensible Unikernels'
  title_correction: null
  authors:
  - Masanori Misono
  - Peter Okelmann
  - Charalampos Mainas
  - Pramod Bhatotia
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698518
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698518
  fullpaper_source: https://dse.in.tum.de/wp-content/uploads/2024/10/socc24-uIO.pdf
  classification: CORE
  classification_note: 'The contribution IS an in-process isolation/extensibility mechanism for unikernels:
    a hardware(MPK)- and language(eBPF)-isolated ''uIO context'' that shares the unikernel''s single address
    space, letting Unikraft load and run auxiliary code at runtime without breaking the unikernel''s single-address-space/no-process
    model.'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T7
  physical_resource: CPU core
  logical_abstraction: A schedulable, address-space-sharing execution context inside a unikernel that
    can safely load and run external position-independent code (debugging/monitoring/management tools)
    at runtime
  problem: Unikernels trade compile-time specialization (small image, fast boot, single address space)
    for runtime extensibility, so production auxiliary tasks (debugging, monitoring, reconfiguration)
    that assume a process/OS boundary cannot run inside them.
  mechanism: uIO adds a host-side process (managing a virtual filesystem uIO-fs and console uIO-console
    over VirtIO) and an in-unikernel 'uIO context' thread sharing the guest's single address space. External
    ELF objects are dynamically loaded, relocated and executed inside this context via a load-and-call
    model (no fork/exec); Memory Protection Keys give the uIO context read-only access to application
    memory by default (explicit permission changes needed to write), and an eBPF-based sandboxed interpreter
    (bounds checks, loop detection, 1M-instruction cap) is offered as a software-only isolation alternative
    when MPK is unavailable.
  isolation_mechanism: 'Two alternative in-process isolation domains for the loaded auxiliary code: (1)
    hardware MPK-based read-only-by-default memory domain requiring explicit permission grants to write
    into the unikernel''s memory, and (2) a language-based eBPF sandbox with static/dynamic safety checks;
    an instruction sanitizer additionally enforces W^X to block time-of-check-to-time-of-use attacks on
    loaded code.'
  multiplexing_mechanism: N/A at the physical-resource level (single guest); the uIO context is multiplexed
    onto the unikernel's own cooperative/thread scheduler as one more schedulable entity sharing the single
    address space.
  state_mechanism: Host-side uIO-fs/uIO-console state lives in the QEMU-side VirtIO backend; guest-side,
    the loaded auxiliary program's code/data live in the shared unikernel address space, access-controlled
    via MPK domain tags; nothing migrates, this is a runtime-extensibility mechanism, not a checkpoint/migration
    one.
  overhead_bottleneck: Program loading and relocation cost (dominated by ELF parsing/symbol resolution
    when uncached) and VirtIO-9p filesystem I/O overhead relative to VirtIO-blk.
  primary_tradeoff: Sharing a single address space with hardware/language-based intra-process isolation
    domains -> keeps the unikernel's small image size and fast boot, but costs a weaker isolation boundary
    than a separate process (isolation is by MPK domain / eBPF sandbox, not by page-table-separated address
    space) and a modest steady-state performance and memory-footprint overhead.
  quantitative_claims:
  - 'baseline integration overhead: 2.1-6.2% for Nginx and Redis, negligible for SQLite (Unikraft-ported
    apps, Intel Xeon Gold 5317, 1 vCPU/1 GiB VM, QEMU 7.2.0+KVM)'
  - 'overhead with auxiliary operations running: 4.2-8.2% for ls/perf-style commands; up to 31% when tracing
    busy functions in Redis'
  - MPK isolation adds <1.9% overhead over the unisolated uIO* baseline
  - 'console round-trip latency: 18.6 microseconds average, +1.1 microseconds under heavy Nginx load'
  - 'program load time: 79.1 microseconds uncached vs 31.1 microseconds cached (61% reduction)'
  - 'memory footprint increase: 0.12-0.33 MB in-unikernel, 0.23-1.55 MB total including host components
    (~0.1% of a 1 GiB VM)'
  - 'image size increase: 60-190 KB over baseline Unikraft'
  - 'VirtIO-9p filesystem overhead vs VirtIO-blk: 17% on reads, 74% on writes'
  why_useful_for_learning: A clean, concrete case study of in-process isolation applied inside a unikernel
    (MPK-vs-eBPF trade-off), directly comparable to Intel-MPK-based intra-process sandboxes and to LightZone's
    ARM64 in-process isolation mechanism.
  priority: P1
  related:
  - VIRT-MIDDLEWARE24-15
  relations:
  - type: ALTERNATIVE
    target: VIRT-MIDDLEWARE24-15
    basis: Both build in-process isolation domains for untrusted/auxiliary code sharing an address space
      with a trusted body of code -- uIO uses x86 MPK (or eBPF) inside a unikernel guest, LightZone uses
      ARM64 TTBR/PAN switching for regular multi-threaded processes; alternative hardware primitives for
      the same isolation-domain-count/switch-cost trade-off.
  - type: SAME_BRANCH
    target: SURE (SoCC 2024)
    basis: Both are unikernel-architecture papers in the same SoCC 2024 session; SURE applies Unikraft
      to serverless sandbox isolation while uIO makes Unikraft runtime-extensible without breaking its
      isolation model.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: 'Rescue pass: retrieved the author-hosted full PDF at dse.in.tum.de (TUM Systems Research Group,
    Bhatotia''s group), which mirrors the SoCC 2024 camera-ready. Read abstract, problem, design/architecture,
    isolation mechanism and full evaluation (figures 4-9). Superseded prior TITLE_ONLY/CONTEXT/LOW stub
    in census24b.yaml.'
- id: VIRT-SOCC24-06
  title: Securing a Multiprocessor KVM Hypervisor with Rust
  title_correction: internal/system name in the paper is 'KrustVM'
  authors:
  - Yu-Hsun Chiang
  - Wei-Lin Chang
  - Shih-Wei Li
  - Jan-Ting Du
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698562
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698562
  fullpaper_source: https://liswei.sh/files/socc24chiang.pdf
  classification: CORE
  classification_note: The contribution is a retrofitted KVM hypervisor (KrustVM) whose trusted computing
    base is a small Rust component (Rcore) running at Arm EL2 that deprivileges the host Linux kernel
    to EL1 and mediates VM exits/memory access via stage-2 page tables -- a hypervisor-correctness/confidentiality
    mechanism, squarely CORE T7.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T1
  physical_resource: CPU core
  logical_abstraction: A VM whose confidentiality and integrity hold even if the (deprivileged, C-language)
    host Linux kernel is fully compromised, on a commodity multiprocessor Arm KVM host
  problem: KVM's trusted computing base is large, complex, unsafe C code; memory-safety bugs there break
    every hosted VM's confidentiality/integrity, and Rust's ecosystem lacks concurrency/locking primitives
    suited to low-level, multiprocessor hypervisor code, so a naive Rust port would still need large amounts
    of unchecked unsafe code.
  mechanism: Rather than rewriting all of KVM, the authors carve out a small Rust 'Rcore' (3.8K safe +
    0.2K unsafe Rust LOC) that runs at Arm EL2, interposes every VM exit, and manages Arm stage-2 page
    tables and SMMU page tables for memory/DMA access control, while the (untrusted) host Linux kernel
    is deprivileged to EL1. To make this safe on a multiprocessor, they build KMutex, a custom lock type
    using Reference Getter Functions that leverages Rust's type/lifetime system to enforce lock ordering
    and rule out deadlocks at compile time even under concurrent multi-vCPU/multi-core access.
  isolation_mechanism: Rcore executes in EL2 (hypervisor mode); VM execution state is kept in Rcore-private
    memory the deprivileged host kernel (EL1) cannot reach; stage-2 page tables enforce guest-physical
    isolation and SMMU/IOMMU page tables block DMA attacks from the host; Rust's ownership/type system
    plus KMutex give compile-time data-race and deadlock freedom for the concurrent hypervisor code itself.
  multiplexing_mechanism: Standard KVM multiprocessor vCPU scheduling is retained; Rcore's contribution
    is not multiplexing capacity but mediating every VM-exit/memory-management event underneath that scheduling
    with a safe, deprivileging boundary.
  state_mechanism: Per-VM confidential state (page tables, execution context) is held in Rcore's EL2-private
    memory, invisible to the deprivileged EL1 host kernel; nothing is migrated -- this is a within-host
    confidentiality boundary, not a live-migration mechanism.
  overhead_bottleneck: Grant/revoke hypercall overhead on networking-heavy paths (e.g. TCP_RR, Memcached)
    and stage-2 page faults, which grow with the number of concurrently running VMs.
  primary_tradeoff: A minimal, formally-motivated Rust TCB with compile-time race/deadlock freedom ->
    gains strong confidentiality/integrity guarantees against a compromised host kernel with mostly-modest
    (mostly <10%) overhead vs mainline KVM, but costs a slightly larger TCB than an equivalent hand-written
    C design (HypSec) due to Rust language-feature overhead, plus the engineering cost of building custom
    safe concurrency primitives (KMutex) since Rust's stock ecosystem does not fit low-level hypervisor
    code.
  quantitative_claims:
  - 'overall overhead vs mainline KVM: within ~10% for most benchmarks (Kernbench, Hackbench, Apache,
    YCSB-Redis; Raspberry Pi 4, quad-core Cortex-A72, 4GB RAM, 2 vCPU/1GB guest)'
  - higher overhead on networking benchmarks (TCP_RR, Memcached) attributed to grant/revoke hypercall
    cost
  - 'TCB size: Rcore = 3.8K safe Rust + 0.2K unsafe Rust + 10K C (crypto library) vs HypSec-5.15 baseline
    = 3.4K C'
  - Miri (Rust interpreter/model checker) found no undefined behavior in Rcore
  - 'multi-VM scaling: performance degrades as concurrent VM count increases, attributed to stage-2 page
    faults'
  why_useful_for_learning: A concrete, measured case study of using a safe systems language to shrink
    and verify a hypervisor's confidentiality-critical TCB, directly comparable to the C-based HypSec/SeKVM
    lineage and to later hypervisor-correctness work such as an Android hypervisor test-oracle paper.
  priority: P1
  related: []
  relations:
  - type: EXTENSION
    target: HypSec / SeKVM (Arm KVM confidential hypervisor line)
    basis: The paper directly implements and benchmarks against 'HypSec-5.15', a C-based implementation
      of the same EL2-Rcore/deprivileged-host design; KrustVM is a Rust re-implementation of that same
      architecture, aimed at eliminating memory-safety bugs in the C TCB.
  - type: SAME_BRANCH
    target: Android hypervisor test-oracle paper (SOSP 2025)
    basis: Both address correctness/trust of a commodity hypervisor's TCB (one via a safe-language rewrite
      with compile-time guarantees, the other via testing); complementary approaches to the same hypervisor-correctness
      problem in taxonomy T7.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: 'Rescue pass: retrieved the author-hosted full PDF from Shih-Wei Li''s own publications page
    (liswei.sh/files/socc24chiang.pdf), reached via his faculty homepage (liswei.sh, redirected from a
    stale shihweili.github.io alias) -> /pubs/ page. Read abstract, problem, KMutex/Rcore design, isolation
    mechanism, full evaluation and code-metric comparison against HypSec-5.15. Superseded prior TITLE_ONLY/CONTEXT/LOW
    stub in census24b.yaml.'
- id: VIRT-SOCC24-07
  title: Towards Swap-Free, Continuous Ballooning for Fast, Cloud-Based Virtual Machine Migrations
  title_correction: null
  authors:
  - Kevin Alarcón Negy
  - Tycho Nightingale
  - Hakim Weatherspoon
  - Zhiming Shen
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698543
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698543
  fullpaper_source: UNKNOWN (abstract obtained via Princeton institutional repository record)
  classification: CORE
  classification_note: The contribution is a production Linux balloon-driver modification plus a user-space
    'continuous ballooning' program that makes ballooning safe to use during the two scenarios where it
    was previously too risky (giant memory spikes and in-flight live migration) -- a direct VM memory-virtualization/live-migration
    mechanism, CORE T2/T4.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary:
  - T4
  physical_resource: DRAM
  logical_abstraction: A guest-physical memory reservation that can be safely deflated/inflated by a continuously-running
    balloon even while the VM is being live-migrated or experiencing multi-hundred-GB memory spikes, without
    swapping or OOM-killing the guest
  problem: Ballooning speeds up VM migration and improves consolidation by shrinking a VM's memory footprint
    before/during transfer, but it risks the guest swapping or hitting an out-of-memory error; this makes
    it infeasible to run ballooning during exactly the two high-risk moments where it is most wanted --
    large memory spikes and live migration -- forcing operators to forgo it there even though one production
    customer migrates nested cloud VMs tens of thousands of times a month.
  mechanism: The authors make minimal changes to the Linux kernel's balloon driver and add a user-space
    'continuous ballooning' program that runs alongside it in a non-overcommitted deployment context,
    coordinating balloon inflation/deflation so that neither a sudden multi-hundred-GB memory spike nor
    an in-progress live migration can push the guest into swapping or an OOM condition; the mechanism
    is designed to survive an unbounded sequence of successive migrations.
  isolation_mechanism: N/A (single-tenant guest memory-safety mechanism, not a multi-tenant isolation
    boundary)
  multiplexing_mechanism: Guest-physical memory is deflated (returned toward the host) and reinflated
    on demand via the modified balloon driver, timed by the continuous ballooning program to stay ahead
    of both organic memory-spike growth and the extra memory pressure that live migration itself creates.
  state_mechanism: Balloon target/size state lives in the guest kernel's balloon driver and is coordinated
    in real time by the user-space continuous-ballooning program during migration; the paper does not
    report moving this state across hosts itself (only ordinary VM memory content moves, via the surrounding
    live-migration mechanism it is designed to be safely compatible with).
  overhead_bottleneck: The steady-state cost of running continuous ballooning (extra driver/monitoring
    work) traded against migration-time savings; the paper reports this cost stays low (at most 8%) even
    while handling the two previously off-limits high-risk scenarios.
  primary_tradeoff: Making ballooning safe to run continuously, including during live migration, in a
    non-overcommitted setting -> gains substantial migration speedups and OOM/swap-free operation for
    memory-intensive giant VMs, at the cost of at most 8% overhead and applicability being scoped to non-overcommitted
    deployments rather than the classic overcommitted-consolidation use case for ballooning.
  quantitative_claims:
  - 'overhead: at most 8% added by continuous ballooning across the evaluated scenarios'
  - 'migration speedup: at least 52% faster migration for giant VMs running memory-intensive applications'
  - 'scale tested: VM memory reaching almost 600 GB'
  - 'robustness: survives an indefinite/unlimited number of sequential migrations and memory spikes of
    hundreds of gigabytes without swapping or OOM errors (per abstract)'
  why_useful_for_learning: A rare production-deployment data point (a real cloud customer migrating VMs
    tens of thousands of times a month) on why classic ballooning is normally avoided at exactly the moments
    it would help most, complementing the CORE HyperAlloc/Squeezy line of academic VM-memory-elasticity
    mechanisms with an operational, already-shipped fix to the same class of risk (OOM/swap during de/inflation).
  priority: P1
  related:
  - VIRT-EUROSYS25-03
  - VIRT-EUROSYS26-05
  relations:
  - type: ALTERNATIVE
    target: VIRT-EUROSYS25-03
    basis: HyperAlloc replaces virtio-balloon/virtio-mem with a shared page-frame allocator interface
      to make de/inflation fast and DMA-safe; this paper instead keeps the classic balloon-driver protocol
      but makes it safe to run continuously (including during migration) by adding real-time coordination
      logic -- two different fixes to the same 'ballooning is risky/slow' problem.
  - type: SAME_BRANCH
    target: VIRT-EUROSYS26-05
    basis: Squeezy attacks slow VM memory reclamation for serverless FaaS VMs by making the guest kernel
      aware of hotplugged-vs-ordinary memory; this paper attacks the safety (OOM/swap) of ballooning-based
      deflation for live-migrated cloud VMs -- both are 2024-2026 responses to the same underlying VM-memory-elasticity
      design space the brief highlights as a lineage (HyperAlloc/Squeezy).
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds:
  - official-web
  confidence: MEDIUM
  notes: 'Rescue pass: ACM DL still returns 403. Found the FULL official abstract (verbatim, including
    the concrete numbers above) via Princeton University''s institutional research-output repository (collaborate.princeton.edu),
    which lists co-author Kevin Alarcon Negy''s incoming Princeton lectureship; this is an official abstract
    record (evidence priority 3), not the PDF body, so evidence_depth is capped at ABSTRACT. Also checked
    Hakim Weatherspoon''s Cornell homepage (only a stale 2021 publication list) and the Cornell CS7490
    course/systems-lunch page (confirmed a Jan 2025 talk by Kevin Negy but no paper details beyond title/authors).
    Design/mechanism/evaluation-section-level detail (exact experimental setup, migration protocol internals)
    was not read and should not be assumed beyond what the abstract states.'
- id: VIRT-SOCC24-08
  title: 'PCLive: Pipelined Restoration of Application Containers for Reduced Service Downtime'
  title_correction: null
  authors:
  - Shiv Bhushan Tripathi
  - Debadatta Mishra
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698545
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698545
  fullpaper_source: https://www.cse.iitk.ac.in/users/shivbt/publications/socc_24/PCLive_SoCC24.pdf
  classification: CORE
  classification_note: The contribution is a new container checkpoint/restore mechanism (pipelined, dependency-aware
    restoration built on modified CRIU+runC) that directly attacks live-migration downtime, not an application
    that merely uses containers -- CORE T4/T5.
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary:
  - T5
  physical_resource: DRAM
  logical_abstraction: A migrating application container whose destination-side restore begins and makes
    progress before all of its checkpointed memory state has arrived, instead of waiting for a complete
    one-shot state transfer
  problem: 'Standard container live migration checkpoints/restores with CRIU using ''one-shot restore'':
    the destination rebuilds the entire container state only after the full memory image has arrived,
    and the paper shows memory-state processing dominates restoration time (99.5% across settings), inflating
    downtime far beyond VM-migration levels because containers'' OS-level state (namespaces, process tree,
    cgroups, per-process memory/FDs) is complex and interdependent, making naive iterative rebuilding
    non-trivial.'
  mechanism: 'PCLive modifies CRIU and runC to restore state in dependency order as it streams in during
    pre-copy: global state (namespaces, process tree, cgroups, files) is rebuilt first, then per-process
    state (memory, file descriptors) is rebuilt iteratively per pre-copy round instead of waiting for
    the final round. Two variants trade freeze time for completeness: PCLive does a full iterative rebuild
    across all state dependencies, while PCLiveG begins restoring as soon as only the global state has
    arrived, minimizing freeze time; a ''delayed restoration'' option further caps memory overhead (~5%)
    by deferring less-critical state.'
  isolation_mechanism: N/A (a checkpoint/restore migration mechanism, not a tenant-isolation boundary)
  multiplexing_mechanism: N/A (single-container migration mechanism; does not multiplex a shared physical
    resource across tenants)
  state_mechanism: Container state is checkpointed and pre-copied iteratively from source to destination
    (standard CRIU pre-copy with deduplication across iterations); PCLive's contribution is restoring
    that arriving state at the destination in dependency order (global state, then per-process memory/FDs)
    as it streams in, rather than only after the last iteration completes.
  overhead_bottleneck: Memory-state processing dominates restoration time (99.5% of it), so pipelining
    exactly that stage is where the gains come from; the resource cost of doing so shows up as extra CPU/memory
    kept live during the pipelined restore window.
  primary_tradeoff: Restoring container state in dependency order as it arrives, instead of after a complete
    transfer -> gains large restoration-time and downtime reductions, at the cost of additional CPU/memory
    overhead during the migration window (more for the minimal-freeze-time PCLiveG variant) and the engineering
    complexity of correctly ordering interdependent OS-level state.
  quantitative_claims:
  - 'memory-state processing share of restoration time: 99.5% across all evaluated settings'
  - 'restoration time reduction: up to 38x/38.8x for read-intensive workloads vs baseline CRIU one-shot
    restore, 5.4x for write-intensive workloads'
  - 'service downtime reduction: 2.7x for read-intensive workloads (e.g. Redis+YCSB, 1 Gbps), 18% for
    write-intensive workloads'
  - 'resource overhead, write-intensive case: +4% CPU, +23% memory vs baseline'
  - 'PCLiveG overhead: ~100 MB extra memory, 13.5-21.8% CPU increase'
  - 'downtime improvement at 10 Gbps network: 5.4x vs baseline'
  - 'workloads: Redis+YCSB (2M records), MySQL via BenchBase, Graph500'
  why_useful_for_learning: A concrete, measured example of why container checkpoint/restore migration
    is structurally slower than VM live migration (complex interdependent OS-level state vs a flat guest-physical
    address space) and of pipelining as the fix, directly comparable to CRIU-based FaaS snapshot-restore
    mechanisms.
  priority: P1
  related: []
  relations:
  - type: USES_MECHANISM_FROM
    target: CRIU (Checkpoint/Restore In Userspace)
    basis: PCLive is implemented as a modification to CRIU and runC, restructuring CRIU's restore path
      from a single-shot operation into a pipelined, dependency-ordered one.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - artifact
  - code
  - official-web
  confidence: HIGH
  notes: 'Rescue pass: ACM DL 403. Located the first author''s personal site (via his IIT Kanpur advisor
    Debadatta Mishra''s student list -> shivbt Wix site) which links the official SoCC''24 conference
    slide deck (PCLive_SoCC24.pdf, read in full for mechanism/eval detail) and the open-source artifact
    (github.com/shivbt/PCLive, README read for corroborating numbers). Slides + code README give design
    and evaluation-level detail equivalent to reading the paper''s own figures/results section, but the
    ACM proceedings PDF itself was not read, so evidence_kinds is [artifact, code, official-web] rather
    than [paper].'

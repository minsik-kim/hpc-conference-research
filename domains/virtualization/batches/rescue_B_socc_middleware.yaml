- id: VIRT-MIDDLEWARE24-15
  title: 'LightZone: Lightweight Hardware-Assisted In-Process Isolation for ARM64'
  title_correction: null
  authors:
  - Ziqi Yuan
  - Siyu Hong
  - Ruorong Guo
  - Rui Chang
  - Mingyu Gao
  - Wenbo Shen
  - Yajin Zhou
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700786
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://yajin.org/papers/middleware2024_lightzone.pdf
  classification: CORE
  classification_note: The contribution is a genuine in-process isolation mechanism built directly on
    ARM64 hardware privilege/paging features (TTBR-switched stage-1 page tables and PAN-gated privileged
    mappings), giving processes many cheap isolation domains without new hardware -- this is the taxonomy's
    canonical CORE in-process-isolation example (comparable to Intel MPK/VMFUNC), not a mere scheduling
    or application-level mechanism.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T7
  physical_resource: CPU core
  logical_abstraction: A user process on ARM64 that can create many (>16) cheap intra-process memory-isolation
    domains -- e.g. to protect cryptographic keys in Nginx, isolate threads in MySQL, or isolate data
    structures in an in-memory store -- without OS-mediated context switches or new hardware
  problem: ARM64 lacks a native in-process isolation primitive comparable to x86's VMFUNC/MPK or even
    ARMv7's Memory Domain feature; existing software approaches cannot simultaneously offer enough isolation
    domains (>16), strong security, and low switching cost without hardware changes.
  mechanism: 'LightZone gives each process a set of separate stage-1 page tables (one per isolation domain)
    and offers two complementary switching primitives: (1) a scalable TTBR-based mode that remaps the
    domain by updating TTBR0 to point at a different stage-1 page table (~490 cycles on a Carmel core,
    ~82 cycles on a Cortex-A55, dominated by TLB effects, but supports up to 128+ domains), and (2) an
    efficient PAN-based mode for the common two-domain case that marks protected memory as kernel-only
    and toggles the ARM Privileged Access Never (PAN) bit to flip a normal user thread''s access to it
    (~11-22 cycles). A TTBR1-mapped secure call gate constrains entry into the privileged path to prevent
    control-flow hijacking, and an instruction sanitizer enforces W^X on executable pages to block time-of-check-to-time-of-use
    attacks; both mechanisms can be mixed for different memory ranges within the same process, and per-page-table
    address-space identifiers avoid unnecessary TLB invalidation on TTBR switches.'
  isolation_mechanism: 'Two ARM64-hardware-enforced boundaries: TTBR-switched separate stage-1 page tables
    (scalable, many domains) and PAN-gated kernel-marked pages (fast, few domains); a hypervisor-configuration-register
    (HCR_EL2) check plus stage-2 paging additionally separates the isolated process from the rest of the
    system, and a dedicated secure call gate plus W^X instruction sanitizer close off control-flow-hijack
    and TOCTOU attack surfaces on the switching path itself.'
  multiplexing_mechanism: A single physical core's page-table/TLB hardware is time-multiplexed across
    a process's isolation domains via cheap TTBR/PAN switches instead of full OS context switches; both
    mechanisms can be combined per memory range within one process to balance domain count against switch
    cost.
  state_mechanism: Per-domain isolation state is the set of separate stage-1 page tables (TTBR mode) or
    the kernel/user marking of specific pages (PAN mode), both held in ordinary process/kernel page-table
    structures; nothing migrates across hosts -- this is an in-process, single-host isolation mechanism.
  overhead_bottleneck: TLB misses caused by switching between more stage-1 page tables as the number of
    TTBR-mode domains grows -- average switch cost rises with page-table/TLB pressure, which is the structural
    cost of choosing scalability (many domains) over PAN's minimal-overhead two-domain switch.
  primary_tradeoff: TTBR-based multi-page-table switching gains domain scalability (>16, tested to 128)
    at higher average per-switch cost (TLB-miss-bound, ~490 cycles on Carmel), while PAN-based switching
    gains near-negligible per-switch cost (~11-22 cycles) but is structurally limited to two domains --
    the paper lets applications mix both primitives per memory region to pick the right point on this
    trade-off.
  quantitative_claims:
  - 'domain switch cost (TTBR, 128 domains): ~490 cycles on Carmel (Jetson AGX Xavier, ARMv8.2, 2.2GHz)
    vs ~82 cycles on Cortex-A55 (Banana Pi BPI-M5, 2GHz)'
  - 'domain switch cost (PAN): ~11 cycles (Cortex-A55) to ~22 cycles (Carmel)'
  - 'Nginx throughput loss with PAN-protected crypto keys: 0.91% (Cortex-A55 host), 1.35% (Carmel host),
    10k HTTPS requests'
  - 'MySQL throughput loss with TTBR-based scalable thread isolation: 2.84% (Cortex-A55 host), 3.79% (Carmel
    host), OLTP workload'
  - 'NVM (in-memory data structure) benchmark overhead at 128 TTBR domains: 16.7% average (Carmel), 3.8%
    average (Cortex-A55), 5M substring searches'
  - 'page-table memory overhead: up to 22.2% for the Nginx/TTBR configuration'
  - compared against Watchpoint (limited to 16 domains), lwC (x86-based simulation), and PANIC (limited
    to 2 domains) as baselines
  why_useful_for_learning: The taxonomy's clearest ARM64 case study of in-process isolation built purely
    from hardware privilege/paging primitives (no new silicon), letting a learner directly compare TTBR-multi-page-table
    vs PAN-single-toggle designs, and compare across ISAs against Intel MPK/VMFUNC-based mechanisms such
    as uIO's in-unikernel isolation (this same rescue batch).
  priority: P1
  related:
  - VIRT-SOCC24-05
  relations:
  - type: ALTERNATIVE
    target: VIRT-SOCC24-05
    basis: uIO uses x86 Memory Protection Keys (plus an eBPF software fallback) to isolate an in-unikernel
      auxiliary-code context sharing the guest's address space; LightZone uses ARM64 TTBR/PAN switching
      to isolate domains within an ordinary multi-threaded process -- alternative hardware primitives
      for the same in-process-isolation-domain problem, on different ISAs and host environments.
  - type: CONTRASTS_WITH
    target: Intel MPK / VMFUNC-based in-process isolation (e.g. sMVX)
    basis: The paper explicitly frames ARM64 as lacking a native equivalent to Intel VMFUNC/MPK and designs
      TTBR+PAN switching to fill that gap; a direct cross-ISA contrast for the same isolation-domain-count/switch-cost
      design point.
  existing_corpus_overlap: null

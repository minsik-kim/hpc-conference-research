- id: VIRT-SC25-05
  title: 'EDDE: Container Deployment Framework Beyond the Cloud'
  title_correction: null
  authors:
  - Hao Fan
  - Shadi Ibrahim
  - et al.
  venue: SC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3712285.3759854
  official_url: https://sc25.supercomputing.org/program/papers/
  fullpaper_source: https://github.com/EDDEimage/EDDE (artifact repository; ACM proceedings PDF not read)
  classification: SUPPORT
  classification_note: EDDE is a container image-distribution/on-demand-pulling mechanism (compared explicitly
    against Nydus-style on-demand image pulling, with an eBPF-accelerated data path) for deploying containers
    to edge/beyond-cloud sites; per the brief this is a container runtime/image mechanism, SUPPORT T5,
    not a change to the isolation boundary itself.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T9
  physical_resource: NIC
  logical_abstraction: A container image that can start running at a remote/edge site before it has been
    fully downloaded, by pulling only the files actually needed on demand from the nearest edge server
    (ES) instead of the origin registry
  problem: Deploying containers 'beyond the cloud' (to edge sites) over long-RTT links makes conventional
    whole-image pulls slow (e.g. 24.07s to fully download an Nginx image even at 10ms RTT to the registry)
    and existing on-demand-pulling systems like Nydus, while reducing the amount of data fetched, still
    pay large penalties as RTT grows (network redirection plus FUSE-based IO redirection) and this gets
    worse the farther an edge site is from the origin registry.
  mechanism: EDDE restructures container deployment around nearest-edge-server (ES) data locality plus
    eBPF-accelerated on-demand file fetching (its own 'Gear' on-demand-pulling engine, benchmarked head-to-head
    against Nydus), and evaluates a randomized-graph model of edge-server placement/connectivity to understand
    how deployment performance scales with topology.
  isolation_mechanism: N/A (an image-distribution/deployment mechanism; does not change container namespace/cgroup
    isolation)
  multiplexing_mechanism: Network/storage bandwidth to a given container image is shared across deploying
    nodes by serving files from the nearest edge server rather than the origin registry, and by only transferring
    the subset of files an application actually touches (on-demand pulling) rather than the whole image.
  state_mechanism: Image-layer/file data is replicated to and served from nearby edge servers; the deployment-time
    state is which files have been fetched so far to a given node, tracked so that on-demand IO redirection
    (via FUSE-like mechanisms, as in Nydus) can fetch the rest lazily.
  overhead_bottleneck: 'Data-download time under high RTT to the source of the image data: conventional
    full-image pulls dominate at 10ms RTT (e.g. 24.07s for Nginx), while on-demand pulling shifts the
    bottleneck to per-file network+FUSE IO-redirection latency, which grows sharply as RTT increases (e.g.
    from ~12.78s at 10ms RTT to ~25.84s at 300ms RTT for Nginx).'
  primary_tradeoff: Serving on-demand file pulls from the nearest edge server with eBPF acceleration,
    instead of a full pull from a (possibly distant) origin registry -> gains large deployment-speed improvements
    at low RTT to the edge server, but this benefit shrinks as edge-to-registry/edge-to-node RTT grows,
    and on-demand images still pay a running-time penalty from network+IO redirection relative to a fully-local
    image.
  quantitative_claims:
  - 'per-image deployment speedup vs baseline: 1.6x (ubuntu) to 3.8x (redis)'

- id: VIRT-SC25-04
  title: 'coMtainer: Compilation-assisted HPC Container Images with Enhanced Adaptability'
  title_correction: null
  authors:
  - Yuhao Gu
  - Haoquan Chen
  - Xianjie Chen
  - Jiangsu Du
  - Zhiguang Chen
  - Nong Xiao
  - Xianwei Zhang
  - Yutong Lu
  venue: SC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3712285.3759790
  official_url: https://sc25.supercomputing.org/program/papers/
  fullpaper_source: https://xianweiz.github.io/doc/papers/25sc_comtainer.pdf
  classification: SUPPORT
  classification_note: coMtainer is a container-image build/compilation mechanism (system-side rebuild
    with native toolchains/libraries via build-time metadata injected into OCI images); per the brief's
    explicit threshold rule, container image/build mechanisms are SUPPORT, not CORE -- it does not touch
    namespace/cgroup isolation or the container runtime's isolation boundary.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: An OCI container image built once with generic toolchains that can be automatically,
    losslessly rebuilt on a specific HPC target system using that system's native compilers/optimized
    libraries/vendor MPI, without modifying source code
  problem: HPC container workflows separate build (user side, generic toolchains) from execution (system
    side, specialized compilers/optimized libraries/vendor-specific MPI); the resulting generic images
    badly underperform natively-built binaries -- the paper measures 50-72% performance degradation for
    LULESH on x86-64 and AArch64 HPC clusters when running the generic image instead of a native build.
  mechanism: 'coMtainer embeds build-time metadata into the container image via three models: a Compilation
    Model capturing individual GCC invocations, a Build Graph Model (a DAG of data transformations across
    the build), and an Image Model classifying files by origin (base image / package manager / build process
    / platform-independent). On the user side this metadata is captured from a two-stage Dockerfile build
    and injected as a cache layer; on the system side, the target HPC system retrieves that metadata and
    rebuilds the image using its own native toolchain and optimized libraries (optionally adding LTO/PGO),
    without the user needing to modify source code -- built on Charliecloud for execution and Buildah
    for OCI-compliant image construction.'
  isolation_mechanism: N/A (does not change container isolation; Charliecloud's namespace-based isolation
    is used unmodified for execution)
  multiplexing_mechanism: N/A (a build-time/image-construction mechanism, not a runtime resource-sharing
    mechanism)
  state_mechanism: Build-provenance state (compilation commands, build DAG, file-origin classification)
    is stored as an extra cache layer inside the OCI image itself and consumed at deployment time on the
    target system to drive the system-side rebuild; no runtime VM/container state migrates.
  overhead_bottleneck: The build-time-metadata cache layer's storage cost (7.1-11.3% of the original image
    size) and the cost of the system-side rebuild itself; the paper reports no added runtime overhead
    since everything happens at image-build/deployment time.
  primary_tradeoff: Embedding portable build provenance in the image so the target system can automatically
    rebuild it natively -> gains near-native performance across heterogeneous HPC systems (including cross-ISA,
    e.g. x86-64 to AArch64) with minimal manual porting effort, at the cost of a larger image (extra cache
    layer) and a rebuild step at deployment time instead of a pure pull-and-run.
  quantitative_claims:
  - 'baseline degradation: generic ("original") containerized LULESH is 50-72% slower than a native build
    on x86-64 (16-node Xeon Platinum 8358P cluster) and AArch64 (16-node Phytium FT-2000+/64 cluster)'
  - 'recovery from adaptation: average 96.3% of the original-to-native performance gap recovered on x86-64,
    66.5% on AArch64'
  - 'adapted-vs-native parity example: 22.0s (adapted) vs 21.35s (native) mean runtime on x86-64; 69.7s
    vs 67.0s on AArch64'
  - 'production-application gains: 253% (LAMMPS) and 99.7% (OpenMX) improvement over the generic image'
  - 'LTO/PGO on top of adaptation: additional 5.6-8% average improvement, up to 30.4% for individual workloads'
  - 'image size overhead of the build-metadata cache layer: 7.1% (x86-64) to 11.3% (AArch64) of the original
    image size'
  - 'manual cross-ISA porting effort: ~5 lines of manual changes vs 47 lines for traditional cross-compilation'
  - evaluated on 9 HPC benchmarks (HPL, HPCG, LULESH, Mantevo suite) plus 2 production applications (LAMMPS,
    OpenMX)
  why_useful_for_learning: 'A clear worked example of the brief''s container-image-vs-isolation-architecture
    threshold: shows exactly how much performance a generic HPC container image loses to environment mismatch,

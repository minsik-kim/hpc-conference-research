  state_mechanism: Relies on periodic training checkpointing to survive spot-instance reclamation; does not itself redesign the checkpointing mechanism.
  overhead_bottleneck: Spot-instance reclamation risk, mitigated by DeepVM's cost-effective checkpointing-aware instance mix rather than eliminated.
  primary_tradeoff: Blending cheap, reclaimable spot VMs with reliable on-demand VMs cuts training cost and makespan versus an on-demand-only cluster -> at the cost of checkpointing overhead and residual reclamation risk that an all-on-demand cluster would not have.

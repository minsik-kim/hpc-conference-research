- id: VIRT-CCGRID24-05
  title: Workload-Aware Live Migratable Cloud Instance Detector
  title_correction: null
  authors: [Junho Lim, Kyunghwan Kim, Kyungyong Lee]
  venue: CCGrid
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid59990.2024.00031
  official_url: https://2024.ccgrid-conference.org/program/
  fullpaper_source: https://leeky.me/publications/workload-aware-migrate-detector.pdf
  classification: CORE
  classification_note: The contribution directly targets live migration's CPU-feature-compatibility check -- a core enabling condition for VM live migration -- and shows that using actual workload CPU-feature usage (rather than full instance CPU-feature sets) safely widens the set of viable migration targets, a T4/T1 mechanism paper.
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T1, T9]
  physical_resource: CPU core
  logical_abstraction: A set of candidate destination cloud instance types that are guaranteed CPU-feature-compatible for live-migrating a specific running workload, wider than the set produced by comparing full instance CPU-feature specs
  problem: Standard live-migration compatibility checking (as in CRIU) compares the full CPU-feature sets of source and target instance types; since most workloads only ever use a subset of the CPU features their instance type supports, this over-conservative check produces false negatives that needlessly rule out feasible, often cheaper, migration targets (e.g. spot instances).
  mechanism: The system has three components -- a CPU Feature Collector that gathers per-instance-type CPU features via CPUID across 450 AWS EC2 instance types; a Workload Instruction Analyzer that determines which CPU features a specific workload actually exercises, via two heuristics (full text-segment disassembly, and execution-path tracking that follows actual function calls), mapping instructions to CPU features with Intel XED; and a Compatibility Checker that matches the workload's actually-used features (not the full instance spec) against candidate target instances.
  isolation_mechanism: N/A
  multiplexing_mechanism: N/A
  state_mechanism: The migration-feasibility decision is based on the workload's runtime CPU-feature footprint rather than VM memory state per se; the actual migration mechanism (e.g. CRIU-based) is assumed, not redesigned.
  overhead_bottleneck: Workload-analysis time (up to 15 seconds) needed to determine actually-used CPU features before a migration decision can be made.
  primary_tradeoff: Basing compatibility on actual workload CPU-feature usage widens the feasible migration-target set and captures cheaper spot pricing -> at the cost of an upfront (up to 15s) workload-analysis pass and reliance on execution-path coverage (which can miss rarely-taken code paths) for precision.
  quantitative_claims:
  - 'precision: 100% across all methods tested, zero migration failures (7 benchmarks x 450 AWS EC2 instance types grouped into 27 CPU-feature classes, 702 directional migrations per workload)'
  - 'recall: execution-path tracking achieves 5x higher recall than the CRIU baseline (same evaluation)'
  - 'analysis overhead: up to 15 seconds maximum for workload analysis'
  - 'cost: 16% improvement in median spot-instance pricing achieved by the widened migration-target set'
  - 'reliability: 15% reduction in spot-interruption ratio for quartile cases'
  why_useful_for_learning: A clear illustration of how CPU virtualization/migration compatibility is normally checked far too conservatively, and how workload-aware analysis reclaims migration options (and cost savings) without weakening correctness.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read via the author's (Kyungyong Lee) hosted camera-ready PDF.


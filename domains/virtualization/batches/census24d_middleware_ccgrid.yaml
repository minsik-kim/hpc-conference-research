# ============================== MIDDLEWARE 2024 ==============================

- id: VIRT-MIDDLEWARE24-01
  title: 'UTwinVM: Reliable hints on the effects of hypervisor updates on VMs in the Cloud'
  title_correction: null
  authors: [Djob Mvondo, Tong Xing, Antonio Barbalace]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700752
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: UNKNOWN
  classification: CORE
  classification_note: The paper's whole contribution is predicting, without VM introspection, how a hypervisor-level patch/update will affect the VMs running above it, which is squarely a guest-host interface / hypervisor-management problem.
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T9]
  physical_resource: CPU core
  logical_abstraction: A per-VM prediction of how an upcoming hypervisor security/feature update will change that VM's observed performance, without opening the VM (no introspection)
  problem: Cloud operators must patch hypervisors frequently (security fixes, CVEs), but a patch can silently change guest-visible performance or behaviour, and providers cannot inspect tenant VM internals to check impact before rolling the update out fleet-wide.
  mechanism: UTwinVM runs deliberately designed synthetic "twin" test applications that mimic real VM behaviour patterns, measures their sensitivity to the candidate hypervisor patch, and fits a non-negative least-squares model that maps twin-application deltas to a predicted per-tenant-VM impact, keeping the tenant's actual VM opaque.
  isolation_mechanism: The security boundary between provider and tenant is preserved by design -- the method explicitly avoids introspecting the guest, substituting synthetic proxy workloads instead.
  multiplexing_mechanism: N/A (the paper is about update-impact prediction, not about dividing a physical resource among tenants)
  state_mechanism: N/A (no migration/checkpoint of VM state is involved)
  overhead_bottleneck: Risk of undetected performance regressions after hypervisor patching, which the prediction step is meant to catch before fleet-wide rollout
  primary_tradeoff: Avoiding introspection preserves the tenant/provider security boundary -> but costs prediction accuracy versus a hypothetical ground-truth measurement inside the real VM
  quantitative_claims: []
  why_useful_for_learning: Illustrates an operational concern that only exists because of the hypervisor layer -- that patching the VMM itself is a first-class production risk distinct from patching the guest OS.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: 'ACM DL (403) and the HAL preprint (hal-04894609, bot-blocked by Anubis challenge) could not be retrieved after 3 distinct routes; classification rests on the WIDE lab announcement page and the Middleware full-program listing, both of which describe the mechanism (non-negative least-squares model over twin test applications) consistently.'

- id: VIRT-MIDDLEWARE24-02
  title: 'vPIM: Processing-in-Memory Virtualization'
  title_correction: null
  authors: [Dufy Teguia, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700782
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://www.upmem.com/wp-content/uploads/2024/09/ABUMPIMP-2024-Invited-talk-Processing-in-Memory-Virtualization.pdf
  classification: CORE
  classification_note: The paper's explicit, named contribution is a virtualization layer for a new accelerator class (UPMEM Processing-in-Memory), giving multiple guest VMs isolated, multiplexed access to physical PIM ranks through a frontend/backend virtio-style split -- a direct instance of the T6 "accelerator virtualization" definition.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T2, T3]
  physical_resource: PIM rank (UPMEM DPU memory bank)
  logical_abstraction: A per-VM virtual PIM device that a guest Linux kernel module can enqueue PIM SDK requests to, backed transparently by a physical PIM rank managed by the VMM
  problem: Commercial Processing-in-Memory hardware solves the CPU-memory data-movement bottleneck, but has no virtualization support, so it cannot be safely shared across multiple guest VMs in a cloud/virtualized deployment the way CPU, memory and NICs already are.
  mechanism: A frontend kernel module in the guest OS accepts PIM SDK requests and forwards them via KVM using virtio transport to a backend module in the VMM (Firecracker); requests travel through a queue living in guest memory (registered with KVM, visible to the VMM) with the VMM translating guest pages to physical addresses instead of copying data, and a Rank Manager hands out physical PIM ranks to VMs.
  isolation_mechanism: Physical PIM ranks are allocated whole to one VM at a time by the Rank Manager, giving hard rank-level isolation between tenants (no DPU-level sub-rank sharing yet).
  multiplexing_mechanism: Round-robin allocation of discrete physical PIM ranks across requesting VMs by the Rank Manager backend.
  state_mechanism: Per-VM PIM request/response state lives in a queue inside guest memory that KVM exposes to the VMM backend; no PIM-state migration mechanism is described.
  overhead_bottleneck: Virtio-mediated request/response round-trips between guest frontend and VMM backend, most visible for applications issuing many small PIM data transfers.
  primary_tradeoff: Virtualizing PIM through a virtio-style split enables multi-VM sharing of scarce PIM hardware -> but costs 1.01x-2.89x runtime overhead versus native (bare-metal) PIM access, worst for transfer-heavy kernels.
  quantitative_claims:
  - 'overhead: 1.01x-2.07x (avg 1.24x) for single-rank PrIM benchmarks vs. native PIM access'
  - 'overhead: 1.02x-2.89x (avg 1.54x) for multi-rank PrIM benchmarks vs. native PIM access'
  - 'overhead: 1.2x slowdown for a rewritten Needleman-Wunsch kernel optimized to reduce small transfers'
  why_useful_for_learning: A concrete, recent example of the "accelerator virtualization" pattern (T6) applied to an accelerator class (PIM) that has no vendor-provided virtualization support yet, showing the same frontend/backend virtio split used for virtual NICs and virtual GPUs.
  priority: P2
  related: []
  relations:
  - type: SAME_BRANCH
    target: SR-IOV / virtio device virtualization
    basis: Uses the same guest-frontend / VMM-backend virtio queue pattern as paravirtualized NIC/block device virtualization.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: 'ACM DL PDF and both HAL mirrors (hal-04737700) were blocked (403 / Anubis bot-challenge); read instead from the UPMEM-hosted invited-talk slide PDF that summarizes the same paper''s architecture, isolation mechanism and PrIM-benchmark results in detail.'

- id: VIRT-MIDDLEWARE24-03
  title: 'PvCC: A vCPU Scheduling Policy for DPDK-applied Systems at Multi-Tenant Edge Data Centers'
  title_correction: null
  authors: [Yuki Tsujimoto, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700779
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://github.com/sslab-keio/PvCC
  classification: CORE
  classification_note: The contribution is a new vCPU scheduling policy inside the Xen hypervisor itself, directly changing how physical cores are timesliced among vCPUs -- textbook T1 CPU/machine virtualization.
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T9, T3]
  physical_resource: CPU core
  logical_abstraction: A vCPU that receives microsecond-scale, dynamically-sized timeslices instead of a fixed share, so DPDK poll-mode workloads can be consolidated with best-effort tenants on the same physical cores
  problem: DPDK's poll-mode packet processing wants dedicated physical cores for low, predictable latency, which is wasteful in resource-limited multi-tenant edge data centers; naively co-scheduling DPDK vCPUs with other tenants under a default hypervisor scheduler produces latency spikes.
  mechanism: PvCC modifies the Xen (v4.12.1) credit-based vCPU scheduler to hand out microsecond-granularity timeslices and exposes a vCPU-scaling API server that dynamically changes how many physical cores are dedicated to latency-sensitive I/O vCPUs versus best-effort vCPUs, letting the overcommitment ratio move with load.
  isolation_mechanism: Timeslice-based CPU-time isolation between latency-sensitive DPDK vCPUs and best-effort vCPUs, enforced inside the hypervisor scheduler rather than left to the guest OS.
  multiplexing_mechanism: Physical CPU cores are time-multiplexed across vCPUs at microsecond granularity, with the vCPU-scaling API changing the number of physical CPUs dedicated to I/O at runtime.
  state_mechanism: N/A (scheduling only; no VM state migration involved)
  overhead_bottleneck: Timeslice length trades off tail latency against throughput -- shorter slices (100us) cut latency but saturate throughput sooner than longer ones (1000us).
  primary_tradeoff: Finer-grained, adaptive vCPU timeslicing lets best-effort tenants reclaim idle DPDK-reserved cores -> but risks the sub-millisecond tail-latency guarantees DPDK deployments exist for if timeslices are set too coarse.
  quantitative_claims:
  - '99th-percentile latency: sub-millisecond under PvCC vs. several milliseconds under Xen''s default credit scheduler (Seastar memcached workload, Intel Xeon Gold 5318Y, 128GB DRAM, Intel X540-AT2 10G NIC)'
  - 'timeslice sensitivity: 100us timeslices reduce latency but saturate throughput earlier than 1000us timeslices (same testbed)'
  why_useful_for_learning: A concrete case of the CPU-virtualization trade-off between hypervisor-level scheduling fairness and the near-bare-metal determinism that kernel-bypass I/O (DPDK) workloads need.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [artifact, code, official-web]
  confidence: HIGH
  notes: Read via the paper's public artifact repository (github.com/sslab-keio/PvCC), which reproduces the design, testbed and headline latency numbers.

- id: VIRT-MIDDLEWARE24-04
  title: 'Guardian: Safe GPU Sharing in Multi-Tenant Environments'
  title_correction: null
  authors: [Manos Pavlidakis, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700768
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://arxiv.org/abs/2401.09290
  classification: SUPPORT
  classification_note: Guardian adds memory-safety enforcement (PTX-level bounds checking, address-space partitioning, call interception) on top of GPU spatial sharing that already exists -- it is a sharing-safety mechanism, not a new virtual-GPU abstraction (no MIG-like partition or GPU-state virtualization), which the brief places in SUPPORT.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T9]
  physical_resource: GPU
  logical_abstraction: A dynamically-sized, memory-safe address-space partition of one physical GPU that unmodified frameworks (PyTorch, Caffe) can be given without knowing they are sharing the device
  problem: Sharing one GPU's single address space across multiple co-located tenants (to fix well-known GPU underutilization) is unsafe by default -- one tenant's kernel can read/write another's memory region because CUDA provides no cross-kernel memory isolation.
  mechanism: Guardian (1) partitions the GPU virtual address space per application, (2) intercepts GPU driver/runtime calls at the lowest level to catch violations before they execute, and (3) instruments kernels at the PTX (GPU assembly) level to insert bounds checks on every memory access, enabling dynamic spatial sharing without CUDA/framework modification.
  isolation_mechanism: PTX-level bounds checking on every memory instruction plus per-application address-space partitioning, enforcing memory isolation between co-resident tenant kernels sharing one physical GPU.
  multiplexing_mechanism: Dynamic spatial sharing -- multiple tenants' kernels co-reside on the same physical GPU's address space simultaneously, partitioned rather than time-sliced.
  state_mechanism: N/A (no GPU context checkpoint/migration described)
  overhead_bottleneck: Per-memory-access PTX-level bounds-check instructions added to every intercepted kernel.
  primary_tradeoff: Instrumenting every memory access for safety enables previously-unsafe GPU spatial sharing across mutually-untrusted tenants -> but costs 4-12% (avg 9%) throughput versus native, unchecked execution.
  quantitative_claims:
  - 'overhead: 4%-12% (average 9%) versus native GPU execution, measured across production ML frameworks (Caffe, PyTorch) generating billions of GPU kernels'
  why_useful_for_learning: Shows the concrete mechanism (PTX-level bounds checking) that a SUPPORT-layer paper needs to make spatial GPU sharing safe, which any CORE vGPU/MIG-style paper's isolation claims can be measured against.
  priority: P1
  related: []
  relations:
  - type: TRADEOFF_PAIR
    target: NVIDIA MIG / MPS (hardware or driver-enforced GPU partitioning)
    basis: Both address unsafe GPU sharing, but Guardian achieves it in software (PTX instrumentation) with measured 4-12% overhead instead of hardware-partitioned isolation.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: 'Read via the arXiv preprint (2401.09290, posted under the working title "G-Safe"), which matches the ACM abstract text retrieved for the camera-ready "Guardian" title.'

- id: VIRT-MIDDLEWARE24-05
  title: 'sMVX: Multi-Variant Execution on Selected Code Paths'
  title_correction: null
  authors: [SengMing Yeoh, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3654794
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://ssrg.ece.vt.edu/papers/middleware24-smvx.pdf
  classification: SUPPORT
  classification_note: sMVX is an in-process isolation/replication mechanism (Intel MPK-based monitor isolation, non-overlapping variant address spaces) whose security guarantee and performance trade-off directly inform how CORE in-process/hardware-isolation papers (e.g. MPK- or MTE-based sandboxes) are designed, without itself proposing a new virtual-machine or hypervisor abstraction.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T5]
  physical_resource: CPU core
  logical_abstraction: A program in which only security-sensitive code paths run as two divergence-checked variants in non-overlapping address spaces, while the rest of the program runs once
  problem: Traditional multi-variant execution (MVX) replicates an entire program to catch memory-corruption exploits via behavioural divergence, wasting CPU and memory on code paths (initialization, non-sensitive logic) that carry no security benefit from replication.
  mechanism: Developers annotate sensitive code paths; sMVX replicates only those paths into two variants with non-overlapping heap address spaces (so a corrupting write lands at different addresses in each variant and is caught by divergence), houses its in-process monitor behind Intel MPK page-granularity protection with stack-pivoting defenses and execute-only memory, and synchronizes variants only at libc call boundaries, emulating I/O for the follower variant.
  isolation_mechanism: Intel MPK (Memory Protection Keys) provides page-granularity, hardware-enforced isolation of the in-process monitor from the (potentially compromised) variant code, and non-overlapping heap layouts give the two variants divergent memory-corruption behaviour.
  multiplexing_mechanism: N/A (both variants of the sensitive path run concurrently on separate cores/threads; this is redundant execution, not resource sharing)
  state_mechanism: Variant execution state (registers, memory) is synchronized only at libc call boundaries, with the follower variant's I/O emulated rather than re-executed, to keep both variants consistent without full instruction-level lockstep.
  overhead_bottleneck: Heap-pointer relocation/scanning at variant-creation time dominates cost (13,162.4 microseconds measured on Lighttpd), and pointer-intensive applications suffer from expensive runtime pointer scanning.
  primary_tradeoff: Replicating only sensitive paths instead of the whole program cuts resource waste versus full-program MVX -> but requires source-level annotation, cannot protect statically-linked or setuid binaries, and still pays a heavy variant-creation cost for pointer-heavy code.
  quantitative_claims:
  - 'CPU/memory savings: 20% fewer CPU cycles and 49% less memory than full-program MVX (server application benchmarks)'
  - 'Nbench overhead: 7% average versus vanilla execution'
  - 'Nginx overhead: 266% throughput overhead vs. vanilla (ApacheBench)'
  - 'Lighttpd overhead: 223% throughput overhead vs. vanilla (ApacheBench)'
  - 'variant-creation cost: 13,162.4 microseconds dominated by heap-pointer scanning (Lighttpd)'
  why_useful_for_learning: A worked example of using hardware protection keys (Intel MPK) to build an in-process isolation boundary cheaply -- the same mechanism family (page-granularity intra-process isolation) that CORE sandbox/unikernel papers rely on.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read via the author lab's (Virginia Tech SSRG) hosted camera-ready PDF.

- id: VIRT-MIDDLEWARE24-06
  title: 'Menos: Split Fine-Tuning Large Language Models with Efficient GPU Memory Sharing'
  title_correction: null
  authors: [Chenghao Hu, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700758
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://iqua.ece.toronto.edu/papers/chenghao-middleware24.pdf
  classification: SUPPORT
  classification_note: Menos's contribution is a GPU-memory spatial- and temporal-sharing scheme for a multi-client split-learning server, matching the brief's SUPPORT example "GPU interference, GPU preemption, spatial/temporal sharing" rather than proposing a new virtual-GPU abstraction.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T2]
  physical_resource: GPU
  logical_abstraction: A server-side GPU memory pool that many split-learning clients draw from, seeing only their own adapters and on-demand activation memory rather than a dedicated device
  problem: Split fine-tuning lets clients fine-tune a shared, privacy-preserving LLM without exposing their data or the provider's full model weights, but server GPU memory is overwhelmed as the number of concurrently-served clients grows, since each client's base-model copy and activations compete for the same physical memory.
  mechanism: Menos combines spatial sharing (adapter-based fine-tuning freezes the base model, so Menos keeps one shared copy of base parameters in GPU memory referenced by all client model instances instead of N copies) with temporal sharing (intermediate activation memory is released during the network round-trip gap between a split-learning forward and backward pass and recomputed on demand), coordinated by a sub-millisecond event-driven FCFS-with-backfilling scheduler.
  isolation_mechanism: N/A explicit tenant isolation is not the focus; clients are logically separated by per-client adapter/optimizer/activation state layered over one shared, read-only base-model copy.
  multiplexing_mechanism: Spatial sharing of the frozen base-model weights across clients plus temporal sharing (allocate-on-demand, free-on-idle) of activation memory during split-learning's communication gaps.
  state_mechanism: Per-client trainable state (LoRA adapter, optimizer state, activations) is transient and recomputed/reallocated on demand; no cross-node migration of this state is described.
  overhead_bottleneck: Scheduling decision latency for forward/backward memory allocation, kept to sub-millisecond by the event-driven scheduler; per-iteration latency instead grows with client count due to the FCFS-with-backfilling ordering.
  primary_tradeoff: Sharing base-model weights and recomputing activations on demand cuts server GPU memory use sharply -> but adds an activation-recomputation cost that grows per-iteration latency as more clients are served concurrently.
  quantitative_claims:
  - 'GPU memory reduction: 64.1% for OPT-1.3B with 4 clients versus per-client-copy baseline (server: NVIDIA V100 32GB; clients: RTX A4500 20GB)'
  - 'GPU memory reduction: 72.2% for Llama-2-7B (same testbed)'
  - 'per-iteration time: 4.7s (1 client) to 6.0s (4 clients) for Llama-2 under Menos vs. 154.4s for the vanilla (non-shared) baseline'
  - 'scheduling overhead: sub-millisecond decision time across configurations'
  why_useful_for_learning: A concrete, recent example of GPU spatial+temporal sharing techniques (the SUPPORT-layer primitives) applied to a specific workload (multi-tenant split LLM fine-tuning), useful background for any CORE vGPU/MIG paper's motivation.
  priority: P2
  related:
  - VIRT-MIDDLEWARE24-04
  relations:
  - type: SAME_BRANCH
    target: VIRT-MIDDLEWARE24-04
    basis: Both are GPU spatial/temporal sharing mechanisms presented at the same Middleware 2024 GPU session, addressing memory-safety (Guardian) and memory-capacity (Menos) sides of GPU multi-tenancy respectively.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read via the author's (University of Toronto iQua lab) hosted camera-ready PDF.

- id: VIRT-MIDDLEWARE24-07
  title: 'HORSE: Ultra-low Latency Workloads on FaaS Platforms'
  title_correction: null
  authors: [Djob Mvondo, Francois Taiani, Yerom-David Bromberg]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: UNKNOWN
  classification: SUPPORT
  classification_note: The paper's contribution (PPSM, an algorithm that speeds up resuming a dormant microVM/snapshot) is exactly the brief's "mechanism that makes serverless isolation cheap" case, which the brief assigns to SUPPORT rather than CORE because it optimizes an existing snapshot/resume mechanism rather than defining a new virtualization abstraction.
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T8]
  physical_resource: CPU core
  logical_abstraction: A dormant (snapshotted) microVM/function sandbox that can be resumed to serving state far faster than a naive snapshot-restore, to meet microsecond-scale FaaS latency budgets
  problem: FaaS platforms need to run microsecond-duration workloads with tight latency budgets, but resuming a dormant sandboxed function instance from a cold or snapshotted state is normally too slow to meet those budgets.
  mechanism: HORSE introduces PPSM, an algorithm that accelerates the resumption of dormant virtual-machine-backed function sandboxes, reported to speed up resume time by up to 142.84x versus the baseline resume path.
  isolation_mechanism: Relies on the underlying VM/microVM sandbox boundary for tenant isolation (mechanism not itself the paper's contribution).
  multiplexing_mechanism: N/A at the level of resource sharing; the contribution is about a single instance's resume latency.
  state_mechanism: Dormant VM/sandbox state is stored (snapshotted) and PPSM changes how quickly that stored state is restored to a runnable instance.
  overhead_bottleneck: Naive snapshot-restore latency, which PPSM specifically targets and reduces.
  primary_tradeoff: Faster resume of dormant instances lets FaaS platforms serve microsecond-scale workloads within their latency budget -> implies added algorithmic/engineering complexity in the resume path versus a naive restore.
  quantitative_claims:
  - 'resume-time speedup: up to 142.84x faster than baseline resume of a dormant VM/sandbox (per WIDE lab paper announcement)'
  why_useful_for_learning: Illustrates that the economics of serverless isolation are dominated by how cheaply a snapshot can be resumed, which is precisely the SUPPORT-layer mechanism (snapshot/restore) that CORE lightweight-VM papers (e.g. Firecracker-style microVMs) are built around.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: 'ACM DL page blocked (403); classified from the WIDE lab''s own two-line description of the paper''s contribution (PPSM algorithm, 142.84x figure), which is consistent with but shorter than a full abstract.'

- id: VIRT-MIDDLEWARE24-08
  title: Near-Storage Processing in FaaS Environments with Funclets
  title_correction: null
  authors: [Alan Nair, Raven Szewczyk, Donald Jennings, Antonio Barbalace]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700755
  official_url: https://middleware-conf.github.io/2024/program/full-program/
  fullpaper_source: https://github.com/auto-ndp/faasm
  classification: SUPPORT
  classification_note: Funclets is built on Faasm's WebAssembly-based multi-tenant sandboxing plus a new function-migration mechanism that moves I/O-heavy code to the storage node -- a serverless-runtime-isolation-plus-migration mechanism (brief's SUPPORT example) rather than a new isolation architecture in its own right.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8, T4]
  physical_resource: NVMe
  logical_abstraction: A serverless function whose I/O-intensive portion (a "funclet") can transparently execute on or near the storage node instead of the compute node, while still sharing one Wasm-sandboxed runtime process with other tenant functions
  problem: In a disaggregated compute/storage serverless deployment, I/O-intensive parts of a function pay network round-trip cost to reach remote storage; moving computation to storage (near-data processing) helps, but must not break the FaaS platform's existing multi-tenant isolation or require rewriting functions.
  mechanism: Funclets extends the Faasm WebAssembly-based FaaS runtime with a migration mechanism that moves the I/O-intensive part of a function to the relevant storage node with minimal code changes, continuing to rely on Faasm's approach of running functions as isolated Wasm-sandboxed threads within a shared runtime process (software-fault-isolation via Wasm plus standard Linux process/thread tooling) for security and resource isolation.
  isolation_mechanism: WebAssembly software-fault isolation combined with Linux process/thread-level resource isolation, letting multiple tenant functions share one runtime process safely.
  multiplexing_mechanism: Multiple tenant functions run as threads inside a single shared Wasm runtime process, multiplexing one process's resources across tenants at low per-function overhead.
  state_mechanism: A function's I/O-intensive code path is migrated (moved) to execute on the storage node, rather than migrating a VM/container's full memory state.
  overhead_bottleneck: Network round-trip cost between compute and disaggregated storage nodes for I/O-intensive function code, which the migration-to-storage mechanism specifically targets.
  primary_tradeoff: Migrating I/O-heavy code to storage nodes removes network round-trips for near-data processing -> but requires the sandboxing layer to keep multi-tenant safety guarantees across a now-distributed execution locus.
  quantitative_claims: []
  why_useful_for_learning: Shows Wasm-based software-fault isolation used as the SUPPORT-layer mechanism underpinning a specific serverless architecture pattern (near-storage/near-data processing), distinct from and lighter-weight than microVM-based FaaS isolation.
  priority: P2
  related: []
  relations:
  - type: USES_MECHANISM_FROM
    target: Faasm (Shillaker & Pietzuch, USENIX ATC 2020)
    basis: Funclets is built directly on the Faasm WebAssembly multi-tenant FaaS runtime and its existing sandboxing/threading model.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds: [code, official-web]
  confidence: MEDIUM
  notes: 'ACM DL PDF returned 403 and the author-hosted PDF link 404''d; read from the linked open-source repository (github.com/auto-ndp/faasm) README, which describes the same migration mechanism and isolation approach as the paper.'

- id: VIRT-MIDDLEWARE24-09
  title: 'B-Side: Binary-Level Static System Call Identification'
  title_correction: null
  authors: [Gaspard Thévenon, et al.]
  venue: Middleware
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3652892.3700761
  official_url: https://middleware-conf.github.io/2024/program/full-program/

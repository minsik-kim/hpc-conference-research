- id: VIRT-CCGRID24-08
  title: Access-Based Carving of Data for Efficient Reproducibility of Containers
  title_correction: null
  authors: [Rohan Tikmany, Aniket Modi, Raffay Atiq, Moaz Reyad, Ashish Gehani, Tanu Malik]
  venue: CCGrid
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid59990.2024.00058
  official_url: https://2024.ccgrid-conference.org/program/
  fullpaper_source: http://www.csl.sri.com/users/gehani/papers/CCIC-2024.ABCD.pdf
  classification: CONTEXT
  classification_note: ABCD's actual contribution is I/O-access-based data subsetting (via LD_PRELOAD and HDF5-library interposition) to shrink the data a container ships with; the container itself is only the deployment/reproducibility vehicle motivating the problem, not the subject of any isolation/runtime mechanism change, so per the "merely runs inside a container" threshold trap this lands in CONTEXT rather than SUPPORT.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T10]
  physical_resource: NVMe
  logical_abstraction: A "carved" version of a scientific application's input/output dataset, containing only the bytes the program actually accessed, shipped inside the reproducibility container instead of the full dataset
  problem: Containerizing a scientific application for reproducibility typically bundles the full dataset it was run against, even though the program usually touches only a subset of it; this inflates container size (often to or beyond a gigabyte for even simple applications), raising storage, transfer and security costs.
  mechanism: ABCD (Access-Based Carving of Data) intercepts I/O at two levels -- system-call level via LD_PRELOAD function interposition, recording byte-level read/write offsets in an interval binary search tree, and library level via HDF5 call interposition (H5Fopen/H5Dread/H5Oopen), producing a "skeleton" copy with only accessed datasets populated -- across three phases (audit, carve, re-execute), with a fallback path for data access not seen during the audit.
  isolation_mechanism: N/A (data-subsetting mechanism; the container's own isolation boundary is unchanged)
  multiplexing_mechanism: N/A
  state_mechanism: N/A
  overhead_bottleneck: Audit-phase I/O interception cost (from milliseconds for synthetic benchmarks to seconds for real applications), and system-call-level interposition specifically incurring more overhead than library-level interposition due to higher event volume.
  primary_tradeoff: Carving out only accessed data shrinks container/data footprint dramatically -> at the cost of audit-time interception overhead and a fallback path needed for data access patterns not observed during the audit run.
  quantitative_claims:
  - 'storage reduction: up to 97% reduction in accessed data size via system-call-level interposition (3 real HDF5 precipitation-domain applications + 4 h5bench synthetic I/O-pattern micro-benchmarks, Ubuntu 22.04, 8-core Intel i7-4790 @ 3.60GHz, 15GB RAM)'
  - 'storage reduction: 15%-35% via library-level (HDF5) interposition, smaller than system-call-level but with different performance trade-offs'
  why_useful_for_learning: A useful CONTEXT example of a data-management technique that specifically targets container-based scientific reproducibility, illustrating the "runs inside a container but isn't about virtualization" boundary case the brief warns about.
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: Read via the author-hosted (SRI, Ashish Gehani) camera-ready PDF.


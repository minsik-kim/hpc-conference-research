batch_observations: >
  This is a from-scratch census (no seed list) for two mid-size, non-US-database-blocked venues.
  Enumeration completeness differs sharply by venue and by track. For Middleware 2024, the
  research track (39 papers) and industry track (7 papers) were FULLY enumerated by title,
  directly from the official full-program page, and cross-validated against an independent
  source (the PC chairs' own opening-remarks slide deck), which is the strongest population
  evidence obtained in this batch. Demos/posters (21 titles), the Doctoral Symposium (3
  proposals + 7 poster/demo lightning talks) and the 4 co-located workshops (~18 titles) were
  also fully title-enumerated from the same program page (used to spot two virtualization-
  adjacent titles, vPIM and LightZone-style work, appearing as posters as well as full papers --
  treated as the main-track paper version being the one to classify) but were not individually
  screened paper-by-paper beyond their titles, since publication-criterion exclusion already
  removes them from the main corpus; representative titles are logged in excluded_by_pubtype
  rather than every single one.

  For CCGrid 2024, the 8 named main tracks (67 papers total) were enumerated from BOTH dblp's
  page-range listing and the official program's per-track session listing, which agreed to
  within one paper (a Computer Science Education track paper inferred by page-range continuity
  but not independently re-confirmed against a session slot); this is flagged transparently in
  count_basis rather than silently reconciled. All 67 main-track titles were screened for
  virtualization relevance by keyword/topic; roughly 25 titles received at least a WebSearch-
  level abstract check, and 8 of those were read in enough depth to produce full records. A
  further ~15-20 CCGrid main-track titles that plausibly touched cloud/edge/GPU resource
  management (e.g. COTuner, Elasticity via GPU work-stealing, Opportunistic Energy-Aware
  Container Scheduling, Apodotiko, XFBench, Jingle, HeROcache, CNN Training Latency Prediction,
  Efficient Budget-Balanced Decentralized Federated Cloud/Edge, "Is the powersave governor
  really saving power?") were screened by title and a search snippet only, judged CONTEXT-at-
  best or non-candidate by the brief's own guidance (generic serverless/FL/edge/GPU-cluster
  scheduling normally lands in CONTEXT or is filtered as generic application), and were NOT
  given individual records, to keep this batch's depth-per-record honest given a large candidate
  pool; this is a keyword-search-depth gap, not a claim that these titles are irrelevant. The
  CCGrid poster session (2 titles), SCALE Challenge (2 titles) and Doctoral Symposium (4 titles,
  +1 companion to a main-track CORE paper, recorded as VIRT-CCGRID24-03) were fully title-
  enumerated; the 5 co-located CCGrid workshops (~35 titles, mostly security/ML/edge, publishing
  in the separate conf/ccgridw proceedings) and the co-located ICFEC conference (~20 titles) were
  enumerated by session/title only and excluded as out of scope (workshop proceedings / separate
  conference respectively), not individually screened for virtualization relevance -- logged
  under possible_expansion for ICFEC given thematic overlap.

  Threshold calls: (1) VIRT-MIDDLEWARE24-06 (Menos) and VIRT-MIDDLEWARE24-04 (Guardian) were
  both called SUPPORT rather than CORE because both are GPU spatial/temporal-sharing SCHEMES
  layered on unmodified CUDA/frameworks, not new virtual-GPU abstractions (no MIG-like partition,
  no GPU-state virtualization) -- a direct application of the brief's GPU-sharing trap.
  (2) VIRT-MIDDLEWARE24-10 (Privagic) and VIRT-MIDDLEWARE24-09 (B-Side) were both called SUPPORT
  rather than CORE because each builds tooling around an existing isolation boundary (SGX
  enclaves; seccomp-style syscall filtering) rather than creating a new one, per the brief's
  container/isolation-architecture trap. (3) VIRT-CCGRID24-08 (Access-Based Carving) was pulled
  back from an initial SUPPORT screen to CONTEXT on closer reading, since its actual mechanism
  (I/O-access-based data subsetting) does not touch the container runtime/isolation/image
  mechanism itself -- a clean instance of the brief's "merely runs inside a container is not a
  virtualization paper" trap. (4) Three titles (LightZone, HAPPIES, "Enhancing Effective
  Bidirectional Isolation...", "Towards SLO-Compliant Serverless GPU...") looked like probable
  CORE/SUPPORT papers by title alone but resisted 3-5 independent access routes each; per the
  schema's hard rule these were recorded as CONTEXT/TITLE_ONLY/LOW rather than classified from
  the title, and flagged prominently in access_failures so a future pass with different network
  access can revisit them specifically -- LightZone in particular is judged the single most
  likely mis-classification risk in this batch. (5) Several titles containing surface-level
  virtualization-adjacent keywords resolved to DROP/non-candidate on inspection and were not
  given records at all: "Brug" (a general-purpose, host-level memory allocator unrelated to
  VMs/containers), "A Cross-Architecture Evaluation of WebAssembly..." (explicitly a portability/
  performance benchmark, not an isolation-mechanism study, confirmed by its own text), "A2L"
  (native io_uring I/O layer, explicitly not virtualized I/O per its own text), "Towards
  Affordable Reproducibility Using Scalable Capture..." (HPC scientific-run-comparison "capture",
  a false positive on the word "checkpoint"), and "PireSPM" (persistent-memory security
  architecture with no virtualization/hypervisor link found). These are omitted from the
  papers list entirely rather than padded in as thin DROP records, consistent with keeping
  every emitted record at the evidence depth the brief requires.

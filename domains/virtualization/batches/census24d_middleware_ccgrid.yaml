- id: VIRT-CCGRID24-02
  title: Tackling Memory Footprint Expansion During Live Migration of Virtual Machines
  title_correction: null
  authors: [Roja Eswaran, Mingjie Yan, Kartik Gopalan]
  venue: CCGrid
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid59990.2024.00025
  official_url: https://2024.ccgrid-conference.org/program/
  fullpaper_source: https://kartikgopalan.github.io/publications/ccgrid24.pdf
  classification: CORE
  classification_note: The paper's whole contribution is a mechanism (SLM) that fixes a specific live-migration side effect -- loss of copy-on-write page sharing -- making it a direct T4 live-migration/state-mechanism paper.
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T2]
  physical_resource: DRAM
  logical_abstraction: A migrated VM's memory image that preserves the same copy-on-write sharing relationships with co-located VMs at the destination host that it had at the source host
  problem: When co-located VMs share memory pages via deduplication (KSM-style copy-on-write sharing) and are migrated to a common destination, standard live migration transfers and re-materializes each shared page separately per VM, "expanding" memory footprint at the destination, causing migration failures, extra network traffic and longer migration times.
  mechanism: SLM (Sharing-aware Live Migration) classifies each source page as Unique, Duplicate (already transferred as part of another VM's migration), or Dirty; only Unique and Dirty pages are sent with full content, Duplicate pages are sent as identifiers only, and the destination uses mmap with MAP_PRIVATE to remap the identified pages onto the same physical page, reconstructing the original copy-on-write sharing relationship -- implemented for both pre-copy and post-copy live migration on KVM/QEMU.
  isolation_mechanism: N/A (memory-sharing/migration mechanism; isolation between VMs is unaffected)
  multiplexing_mechanism: Copy-on-write physical-page sharing across co-located VMs is the resource-multiplexing mechanism being preserved through migration rather than accidentally destroyed by it.
  state_mechanism: VM memory state moves via classified page transfer (Unique/Duplicate-identifier/Dirty) plus destination-side COW remapping via mmap(MAP_PRIVATE), for both pre-copy and post-copy live migration.
  overhead_bottleneck: Destination-side memory footprint expansion and the network traffic caused by re-transferring/re-materializing already-shared pages as if they were distinct.
  primary_tradeoff: Preserving page sharing through migration cuts total migration time, downtime and network traffic substantially -> at the cost of extra source/destination-side page classification and remapping bookkeeping versus naive migration.
  quantitative_claims:
  - 'total migration time reduction: up to 59% (pre-copy) and up to 57% (post-copy) vs. generic (sharing-unaware) live migration (Intel Xeon E5-2620 v2, 128GB DRAM, 3-machine KVM/QEMU testbed)'
  - 'network traffic reduction: up to 62% vs. generic live migration (same testbed)'
  - 'average downtime: ~96ms (SLM) vs. 93ms (generic) for pre-copy; ~300ms (SLM) vs. 290ms (generic) for post-copy'
  - 'workloads: idle VMs sized 1GB-32GB, iPerf, and a 5-million-key-value-pair Redis cluster'
  why_useful_for_learning: A concrete case of the brief's "state" dimension -- exactly what virtualization state (here, page-sharing relationships) must be tracked and reconstructed across a live migration, and what breaks if it is not.
  priority: P1
  related:
  - VIRT-CCGRID24-03
  relations:
  - type: SAME_BRANCH
    target: VIRT-CCGRID24-03
    basis: Both papers, by the same Binghamton group, address sharing-awareness in live migration; VIRT-CCGRID24-03 is the Doctoral Symposium presentation of directly-related work on multi-VM live migration memory sharing.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]

- id: VIRT-CCGRID24-07
  title: 'DeepVM: Integrating Spot and On-Demand VMs for Cost-Efficient Deep Learning Clusters in the Cloud'
  title_correction: null
  authors: [Yoochan Kim, Kihyun Kim, Yonghyeon Cho, Jinwoo Kim, Awais Khan, Ki-Dong Kang, Baik-Song An, Myung-Hoon Cha, Hong-Yeon Kim, Youngjae Kim]
  venue: CCGrid
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid59990.2024.00030
  official_url: https://2024.ccgrid-conference.org/program/
  fullpaper_source: https://arxiv.org/abs/2403.05861
  classification: CONTEXT
  classification_note: DeepVM selects and mixes cloud VM instance types (spot vs. on-demand) for a distributed-training cluster; it is a fleet-level VM-economics/scheduling paper that uses VMs as its unit of allocation rather than proposing a virtualization mechanism, matching the brief's CONTEXT bucket for cloud cost optimization.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T1, T8]
  physical_resource: GPU
  logical_abstraction: A cluster composed of a cost-optimized mix of spot and on-demand VM instance types, sized and blended per training job's checkpointing tolerance and budget
  problem: Distributed deep-learning training needs GPU-based VM clusters, which are expensive; spot VM instances are far cheaper but can be reclaimed at any time, threatening in-progress training unless checkpointing and instance selection are handled carefully.
  mechanism: DeepVM uses a four-stage approach -- performance assessment via a FLOPS-per-dollar (FLOPP) metric, architecture-level optimization via linear programming, and an on-demand/spot instance-mix selection tuned to the job's requirements and checkpointing strategy -- validated via simulation and real AWS deployment.
  isolation_mechanism: N/A

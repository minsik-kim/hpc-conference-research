  - 'x86->RISC-V: up to 12.7% (vips), geomean 7.3% faster than QEMU 8.0'
  - 'weak-to-strong (ARM/RISC-V->x86): geomean 1.9% (to ARMv8) and 2.8% (to RISC-V) improvement via guest-to-IR
    redundant-fence removal'
  - 'fence cost without CrossMapping: up to 84.4% (avg 52.1%) of runtime for x86-to-ARM; up to 81.8% (avg
    59.4%) for x86-to-RISC-V'
  - 'platforms: Intel Xeon Silver 4210R (x86), Huawei Kunpeng 920 (ARMv8), LicheePi 4A TH1520 (RISC-V);
    PARSEC 3.0 benchmarks'
  why_useful_for_learning: A rare, rigorous treatment of the memory-consistency translation layer inside
    a software CPU/machine-virtualization system, complementary to hardware-assisted virtualization (VT-x/AMD-V)
    approaches that avoid this problem via native execution.

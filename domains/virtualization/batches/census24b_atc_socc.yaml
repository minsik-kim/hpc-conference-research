  classification: CORE
  classification_note: HugeScope directly targets a hypervisor EPT-management problem (hot-bloat misclassification
    of huge pages) and exploits EPT-modification stability under virtualization to fix it; this is guest-physical/EPT
    memory-virtualization work, explicitly CORE under T2.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary:
  - T1
  physical_resource: DRAM
  logical_abstraction: A 2MB guest-physical huge page whose hot/cold status is tracked at 4KB sub-page
    granularity so the hypervisor's tiered-memory and page-sharing decisions are not misled
  problem: Huge pages reduce address-translation overhead under virtualization, but hypervisors track
    hotness at huge-page granularity; when access is skewed to a few base pages, the whole 2MB huge page
    is (mis)classified as hot, degrading tiered-memory placement and page-sharing decisions by up to 50%.
  mechanism: A coarse phase reads existing EPT A/D bits (no splitting) to find hot huge pages; a fine
    phase splits only those candidates to compute a Page Skewness Ratio (PSR = 1 - Nb/Nt) and, guided
    by a hot-page-pressure metric, decides whether to keep a page huge or split it. HugeScope exploits
    the fact that a built EPTE is rarely modified post-construction, so it hooks only 11 stable KVM functions
    and refills the EPT directly instead of using Linux's general split/coalesce path, cutting VM exits
    from millions to under 1,200 for a 16GB workload.
  isolation_mechanism: N/A (memory-management mechanism within one VM's EPT, not a tenant isolation boundary)
  multiplexing_mechanism: Host DRAM/PMem tiers and page-sharing candidates are selected at accurate sub-huge-page
    granularity across VMs, avoiding the false-hot misclassification that wastes fast-tier capacity or
    blocks sharing
  state_mechanism: All tracking state lives in EPT (last-level page table) entries the hypervisor already
    owns; no data moves except split/coalesced EPT mappings themselves
  overhead_bottleneck: Millions of VM exits caused by Linux's general-purpose huge-page split/coalesce
    path when applied naively under virtualization
  primary_tradeoff: Two-phase coarse/fine EPT-native tracking instead of standard Linux splitting -> gains
    up to 61% tiered-memory improvement and 42.3% memory savings in page sharing at ~3% overhead, but
    costs correctness edge cases when the hypervisor's own swapping/ballooning concurrently modifies the
    same EPTs
  quantitative_claims:
  - 'tracking overhead: 3.04% average vs 20.7% (PEBS-50) vs 1.78% (sampling); fine-path overhead <1.5%
    vs 25.39% for Linux split/coalesce on a 16GB workset'
  - 'VM exits (16GB sequential access): 915 (HugeScope) vs 4.3M+ (Linux interfaces), 4,000x+ reduction'
  - 'tiered memory (HS-TMM): up to 61% improvement over vTMM baseline, near-optimal vs all-DRAM across
    20-80% fast-memory ratios'
  - 'page sharing (HS-Share): 42.3% memory saved vs Ingens''s 1.28%; 0.964 normalized performance (3.6%
    loss) vs KSM''s 0.902 (10% loss) at 46.8% savings'
  - 'working-set tracking accuracy: matches Redis''s actual 5.2GB working set vs ~14GB (2.7x overshoot)
    for huge-page-only tracking'
  - 'hardware: dual-socket Cascade Lake-SP (24 cores/socket), 8GB DRAM fast tier + 120GB Optane DC PMem
    slow tier, KVM/QEMU 3.1.0 on Linux 5.4.142'
  why_useful_for_learning: Directly demonstrates the extra address-indirection cost (guest-physical->host-physical
    via EPT) that virtualization introduces and how a hypervisor can exploit EPT-modification stability
    to fix a real production problem in tiered memory and page sharing.

  classification: CORE
  classification_note: CPC is a new confidential-VM maintenance mechanism (guest-resident, host-invoked
    procedure calls for ballooning/snapshot/migration/logging on AMD SEV-SNP and ARM CCA) -- confidential
    VM architecture is explicitly CORE (T7) in the taxonomy.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T2
  - T4
  physical_resource: CPU core
  logical_abstraction: A guest-trusted 'maintenance vCPU' (hvCPU) that the untrusted host can schedule
    to run privileged CVM-maintenance code without ever seeing the guest's plaintext memory
  problem: Confidential VMs need routine maintenance (ballooning/reclamation, snapshotting, logging, live
    migration), but today this either requires a firmware-trusted component (AMD Secure Processor) that
    scales poorly with VM count, or is simply unsupported (ARM CCA has no migration solution, Intel TDX
    has no snapshot implementation).
  mechanism: CPC splits each CVM's vCPUs into guest vCPUs (gvCPUs, normally scheduled) and host-invocable
    vCPUs (hvCPUs) that stay dormant until the host activates them to run Confidential Procedure Calls
    -- guest-authored, guest-trusted maintenance modules compiled into the guest image and validated via
    a 4-step state machine (token validation, core task execution over encrypted guest data, yield/hypercall
    suspension, state reset on reactivation). On AMD SEV-SNP, CPC uses VMPL to run SeCPCs (e.g. CPC-Ballooning,
    CPC-Snapshot via SVSM VMPL0 memory-encryption-extraction, CPC-SecureLog, CPC-LiveMigration) isolated
    from the guest kernel; on ARM CCA (lacking VMPL) a Confidential Page-Table Isolation scheme adds separate
    stage-2/stage-1 page tables and interrupt-vector tables to achieve the same isolation, implemented
    via a 242-line RMM extension and RSI protection-memory registration.
  isolation_mechanism: 'Control-plane/data-plane separation: the host only schedules hvCPU threads (control
    plane), while CPC code and guest data stay encrypted and trusted-execution-isolated from the host
    via VMPL (AMD) or CPTI''s multi-layer stage-1/stage-2/interrupt-vector isolation (ARM/others); a token-validated
    state machine prevents unauthorized re-entry'
  multiplexing_mechanism: One physical CPU's vCPU slots are shared between guest-visible gvCPUs and normally-dormant
    hvCPUs that the host wakes only for maintenance, so maintenance throughput scales with concurrent-CVM
    count without a per-VM firmware bottleneck
  state_mechanism: CVM memory state for reclamation/snapshot/migration is extracted and reinserted directly
    by guest-trusted CPC code (Memory Encryption/Structure Extraction and Insertion operators) rather
    than by an external firmware component reading encrypted pages one at a time
  overhead_bottleneck: AMD Secure Processor per-page extraction/insertion overhead, which the paper shows
    grows from 1.92M cycles/VM at 1 VM to 39.80M cycles/VM at 8 VMs, versus CPC's flat ~3.29M cycles
  primary_tradeoff: Guest-resident, host-scheduled maintenance code (CPC) instead of a firmware-trusted
    maintenance path -> gains large, VM-count-independent speedups (up to 340x for memory extraction,
    up to 138x for live migration) and portability across AMD/ARM, but costs extra vCPU/thread resources
    that compete with host resources under scarcity, and a residual cryptographic (GCM, not AES) bottleneck
    that keeps even the fastest CPC variant 16x slower than unencrypted VM migration
  quantitative_claims:

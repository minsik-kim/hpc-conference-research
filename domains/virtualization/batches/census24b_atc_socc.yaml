    user logic and the platform Shell so logic is device-agnostic and portable across PCIe/host-DRAM/HBM/network
    backends; a preemptive I/O scheduler pairs read/write scheduler instances per device with a request
    switch, completion FIFO and multiplex FIFO, applying round-robin among equal-priority virtual FPGAs
    and FIFO-with-preemption when priorities differ, reordering DMA requests at the transaction level
    before data transfer.
  isolation_mechanism: Per-virtual-FPGA priority-based preemptive scheduling at the DMA-transaction level
    bounds how much one tenant's I/O can delay another's, implemented in the shared virtual I/O + scheduler
    logic rather than in user logic
  multiplexing_mechanism: Each physical I/O interface (PCIe DMA, host-DRAM MMU/DMA, FPGA HBM local DMA,
    RDMA network stack) is multiplexed across concurrently active virtual FPGA I/O ports via the scheduler's
    request switch
  state_mechanism: N/A (I/O virtualization/scheduling layer; no migration/checkpoint mechanism)
  overhead_bottleneck: I/O throughput degradation from concurrent, unscheduled multi-tenant I/O requests

    SoCC''24 conference schedule page (12 sessions across 3 days: Wed 4+5+6+6=21, Thu 4+5+5+6=20, Fri
    4+6+6+5=21, total 62). The official call-for-papers page states SoCC accepts four submission tracks
    -- Full Research Papers (12pp), Short Research Papers (6pp), Industry Papers (12pp) and Vision Papers

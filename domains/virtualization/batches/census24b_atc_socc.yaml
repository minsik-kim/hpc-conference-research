  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: null
- id: VIRT-ATC24-08
  title: Limitations and Opportunities of Modern Hardware Isolation Mechanisms
  title_correction: null
  authors:
  - Xiangdong Chen
  - Zhaofeng Li
  - Tirth Jain
  - Vikram Narayanan
  - Anton Burtsev
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/chen-xiangdong
  fullpaper_source: https://www.usenix.org/system/files/atc24-chen-xiangdong.pdf
  classification: SUPPORT
  classification_note: 'This is a systematic evaluation of intra-address-space hardware isolation primitives
    (Intel MPK, ARM PAC/MTE, ARM Morello/CHERI) used to build sandbox/compartment boundaries; per the
    brief, sandbox/syscall-interposition isolation architecture is CORE only when the paper builds the
    isolation system itself as its headline abstraction, whereas here the contribution is a cross-mechanism
    measurement/critique, so it is SUPPORT: essential background for understanding any CORE paper that
    chooses one of these primitives as its isolation boundary.'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T10
  - T7
  physical_resource: CPU core
  logical_abstraction: An intra-process compartment (private heap + shared zero-copy exchange heap) whose
    boundary is enforced by a chosen hardware primitive instead of a full process/VM boundary
  problem: Building low-overhead in-process isolation boundaries (for microkernel-style subsystem separation,
    NFV pipelines, media pipelines) requires choosing among MPK, PAC, MTE and Morello/CHERI, but their
    practical suitability for tight latency budgets and revocable, cross-core-coherent access control
    is not well characterized.
  mechanism: The authors implement a common 'migrating threads' isolation model with private per-subsystem
    heaps and single-ownership shared exchange heaps on top of each hardware primitive, then measure enforcement
    overhead, cross-subsystem invocation cost and zero-copy data-passing cost on real hardware (Intel
    MPK/CET, ARM MTE/PAC on Pixel 8, ARM Morello dev platform).
  isolation_mechanism: 'Four candidate boundary mechanisms compared directly: MPK''s per-core protection-key
    register, PAC''s cryptographic pointer signing, MTE''s memory tag checking, and Morello/CHERI capability
    bounds-checking, each evaluated against software-transparency, cross-core rights synchronization,
    subsystem-count scaling and first-class revocation criteria'
  multiplexing_mechanism: N/A (the paper is about isolation boundaries within one address space, not resource
    multiplexing)

- id: VIRT-ATC24-01
  title: 'Harmonizing Efficiency and Practicability: Optimizing Resource Utilization in Serverless Computing
    with Jiagu'
  title_correction: null
  authors:
  - Qingyuan Liu
  - Yanning Yang
  - Dong Du
  - Yubin Xia
  - Ping Zhang
  - Jia Feng
  - James R. Larus
  - Haibo Chen
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/liu-qingyuan
  fullpaper_source: https://www.usenix.org/system/files/atc24-liu-qingyuan.pdf
  classification: CONTEXT
  classification_note: Jiagu is a scheduler/predictor that improves resource-utilization and cold-start
    behaviour for a serverless platform; it consumes containers/sandboxes as its execution substrate but
    does not change or study the isolation/virtualization mechanism itself, matching the brief's 'generic
    serverless scheduling' CONTEXT bucket.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T9
  physical_resource: CPU core
  logical_abstraction: A pool of serverless function instances whose count and placement are jointly decided
    by prediction-decoupled scheduling
  problem: Serverless platforms must keep enough warm instances to avoid cold starts without over-provisioning,
    and existing predict-then-schedule pipelines couple both steps so tightly that scheduling overhead
    or prediction error degrades utilization.
  mechanism: Jiagu separates load prediction ('pre-decision scheduling') from the scheduling decision
    itself and adds 'dual-staged scaling' that allows frequent fine-grained instance-count adjustments
    while amortizing the cost of cold starts.
  isolation_mechanism: N/A (relies on whatever container/sandbox isolation the underlying FaaS platform
    provides; not itself studied)
  multiplexing_mechanism: Physical cluster CPU/memory is shared by dynamically scaling the number of warm
    function instances per function
  state_mechanism: N/A - no snapshot/migration mechanism is introduced
  overhead_bottleneck: Coupling of prediction error and scheduling latency in prior pipelines, which Jiagu
    decouples
  primary_tradeoff: Decoupling prediction from scheduling -> gains higher deployment density and lower
    cold-start latency, but costs extra system complexity in keeping the two stages consistent
  quantitative_claims:
  - 'deployment density: 54.8% improvement over commercial clouds running Kubernetes (real-world applications
    + public cloud traces)'
  - 'scheduling cost: 81.0%-93.7% lower than existing QoS-aware schedulers'
  - 'cold start latency: 57.4%-69.3% reduction vs existing QoS-aware schedulers'
  why_useful_for_learning: Shows the operational scheduling layer that sits above serverless sandboxes
    and why cold-start/warm-pool trade-offs (the thing CORE sandbox/snapshot papers optimize) matter at
    fleet scale.
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: null
- id: VIRT-ATC24-02
  title: 'ALPS: An Adaptive Learning, Priority OS Scheduler for Serverless Functions'
  title_correction: null
  authors:
  - Yuqi Fu
  - Ruizhe Shi
  - Haoliang Wang
  - Songqing Chen
  - Yue Cheng
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/fu
  fullpaper_source: https://www.usenix.org/system/files/atc24-fu.pdf
  classification: CONTEXT
  classification_note: ALPS is a host-kernel CPU scheduler (an eBPF-backed approximate-SRPT policy layered
    on CFS) for FaaS workloads; it changes scheduling policy, not the container/VM isolation boundary,
    so it is generic serverless resource management rather than a virtualization mechanism.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T9
  physical_resource: CPU core
  logical_abstraction: A per-core run queue in which short-lived function invocations are prioritized
    without starving longer ones
  problem: Linux CFS is workload-oblivious and proportionally fair, which is a poor fit for FaaS workloads
    whose invocations are short, bursty and highly variable in duration; naive SRPT-style scheduling would
    instead starve long functions.
  mechanism: A user-space frontend approximates SRPT priority by learning from an SRPT simulation replayed
    over the recent workload history, and an eBPF backend enforces the learned priorities within CFS without
    replacing the kernel scheduler.
  isolation_mechanism: N/A - scheduling only, no isolation boundary introduced
  multiplexing_mechanism: CPU core time is shared among concurrently-runnable function invocations via
    a learned priority added on top of CFS proportional sharing
  state_mechanism: N/A
  overhead_bottleneck: Mis-scheduling short functions behind long ones under plain CFS proportional sharing
  primary_tradeoff: Approximating SRPT via eBPF+learning -> gains large average latency reduction, but
    costs the complexity of continuously re-learning from a simulated SRPT baseline instead of using a
    simple static policy
  quantitative_claims:
  - 'average function execution duration: 57.2% reduction vs plain CFS (production workload traces from
    Huawei and Azure)'
  why_useful_for_learning: Illustrates the host-OS scheduling problem that sits below serverless sandboxes,
    useful background for understanding why CORE snapshot/sandbox papers still need a scheduler to actually
    deliver low tail latency.
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds:
  - paper

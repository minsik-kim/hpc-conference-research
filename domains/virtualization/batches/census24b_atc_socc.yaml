  classification_note: Dynamic binary translation is a classic software-only machine-virtualization technique
    (QEMU-style guest-ISA-on-host-ISA emulation), and the paper's own framing uses guest/host terminology
    throughout; CrossMapping's contribution is the correctness/performance mechanism for the memory-model
    translation layer inside that virtual machine, which is CORE T1 (the paper builds the translation

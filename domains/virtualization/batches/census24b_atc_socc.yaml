  fullpaper_source: https://www.usenix.org/system/files/atc24-song.pdf
  classification: CORE
  classification_note: REWIND's headline contribution is a kernel-level container-state rewind mechanism
    (a new buddy page-table structure plus CoW-based memory/filesystem/task reset) that makes warm-container
    reuse security-isolated; per the brief this is exactly the 'mechanism that makes serverless isolation
    cheap (snapshot/restore, runtime isolation)' case that counts as CORE.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T4
  physical_resource: DRAM
  logical_abstraction: A warm container that behaves, after every request, as if it had been freshly instantiated,
    without paying a full checkpoint/restore or fork cost
  problem: Reusing warm containers for serverless functions is fast but insecure (state persists across
    invocations, enabling data leakage or rootkit persistence); prior secure resets (Groundhog checkpoint/restore,
    fork) are too slow or memory-heavy.
  mechanism: A 'buddy page table' extends every 4KB leaf to 8KB, with the lower half holding normal PTEs
    (used by the hardware MMU) and the upper half holding software-managed buddy PTEs that record pre-snapshot
    state; snapshot() applies copy-on-write to committed VMAs at container start, rewind() unmaps new/modified
    mappings and restores anonymous pages from their buddy PTE (exploiting temporal locality to avoid
    repeated faults), OverlayFS upper-layer snapshotting resets the filesystem, and non-snapshot tasks
    are killed to remove persistence.
  isolation_mechanism: Per-request reset to a copy-on-write-protected pristine memory/filesystem/task
    state, eliminating cross-invocation data leakage and rootkit persistence within one warm container
  multiplexing_mechanism: One warm container's memory/filesystem/task state is reused across many function
    invocations rather than re-instantiating a fresh container or full checkpoint/restore image each time
  state_mechanism: Snapshot state lives in buddy PTEs colocated with the normal page table (8KB leaves)
    and in a snapshotted OverlayFS upper layer; nothing migrates off-host, restoration is entirely local
    and fast
  overhead_bottleneck: Full-VMA checkpoint/restore cost (Groundhog) or dirty-page-duplication cost (fork)
    for enforcing per-invocation isolation
  primary_tradeoff: Buddy-page-table incremental reset instead of full snapshot/restore -> gains near-baseline
    latency and only 11% peak-RSS overhead, but costs a doubled page-table footprint and file-backed-page
    reuse is disabled for privacy/side-channel safety
  quantitative_claims:
  - 'peak RSS overhead: 11% vs baseline warm container (lowest among isolation schemes tested)'
  - 'snapshot creation time: max 0.3ms for memory workloads vs 16-59ms for Groundhog'
  - 'rewind time: 10.7% of Groundhog''s restoration overhead'
  - 'latency: 19% improvement over baseline on Linpack, 11% on MatMul via VMA-reuse optimization'
  - 'throughput under memory pressure (4GB system memory): ~16 req/s (REWIND) vs ~8 req/s (Groundhog and
    Fork)'
  - 'platform: OpenWhisk on Linux 5.4.0, 977 LoC kernel + 363 LoC OpenWhisk modifications; FunctionBench
    workloads'
  why_useful_for_learning: A concrete alternative to full VM/container checkpoint-restore for serverless
    isolation, illustrating the CoW-based state-reset design point between full snapshot/restore and fork-based
    isolation.

  main_track_paper_count: 77
  count_basis: 'Full linear enumeration of the official USENIX ATC''24 proceedings table-of-contents PDF
    (atc24-contents.pdf), which lists 77 numbered papers from page 1 (''Harmonizing Efficiency and Practicability...
    Jiagu'') to page 1273 (''Every Mapping Counts in Large Amounts: Folio Accounting''), confirmed as
    the final entry by an explicit follow-up query asking for any entries beyond page 1273 (none found).
    This required two independent WebFetch passes over the PDF because a first summarization pass mis-stated
    the count as 86/79 (renumbering artifacts of the underlying summarizer, not the source document);
    the page-numbered, per-title, per-author listing was used as ground truth over the bare count. All
    77 titles were also cross-checked session-by-session against the technical-sessions program page.
    Note the task brief''s expectation of ''~100 accepted papers'' for ATC24 does not match this verified
    count of 77 -- USENIX ATC has historically run 60-90 accepted papers, and 77 is consistent with recent
    years; the discrepancy is flagged rather than silently reconciled.'

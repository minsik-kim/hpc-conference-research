- id: VIRT-ATC24-03
  title: 'StreamBox: A Lightweight GPU SandBox for Serverless Inference Workflow'
  title_correction: null
  authors:
  - Hao Wu
  - Yue Yu
  - Junxiao Deng
  - Shadi Ibrahim
  - Song Wu
  - Hao Fan
  - Ziyue Cheng
  - Hai Jin
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/wu-hao
  fullpaper_source: https://www.usenix.org/system/files/atc24-wu-hao.pdf
  classification: SUPPORT
  classification_note: StreamBox replaces per-function GPU-runtime isolation with GPU-stream-based sandboxing
    plus fine-grained, auto-scaling memory management for sharing one GPU across serverless functions;
    per the brief this is GPU-sharing/serverless-runtime-isolation mechanism work, i.e. SUPPORT rather
    than a new virtual-GPU abstraction (no MIG/vGPU-style partition is introduced).
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T8
  - T5
  physical_resource: GPU
  logical_abstraction: A GPU stream per function, sharing one physical GPU's memory and PCIe bandwidth
    instead of a full CUDA context/runtime per function
  problem: Serverless GPU inference isolates each function in a separate GPU runtime/context, which duplicates
    memory and wastes PCIe bandwidth and startup time when many short-lived inference functions must share
    one accelerator.
  mechanism: StreamBox gives each function a lightweight GPU stream instead of a full context, with layer-level
    lazy allocation and eager recycling of DNN activation memory driven by offline per-model profiling,
    a unified same-GPU/peer-to-peer/RPC communication API, and a shared pinned-buffer IO daemon that round-robins
    2MB PCIe transfer blocks across concurrent streams.
  isolation_mechanism: Stream-level separation of concurrent functions on one GPU rather than context-level
    isolation; the paper notes this assumes a trusted workflow domain where functions share the same runtime,
    not hard multi-tenant security isolation
  multiplexing_mechanism: One physical GPU's memory and PCIe bandwidth are time/space-multiplexed across
    concurrently executing inference-function streams
  state_mechanism: Intermediate tensors live in an elastic GPU-memory communication store and migrate
    GPU-to-GPU (not to host) under memory pressure
  overhead_bottleneck: Per-function GPU context/runtime duplication and PCIe transfer contention under
    bursty multi-function inference
  primary_tradeoff: Stream-based sandboxing instead of full-context isolation -> gains large memory/startup/throughput
    wins for trusted co-located functions, but costs true multi-tenant isolation, so beyond ~3 concurrent
    untrusted tenants per GPU the system falls back to cold starts and SLO violations
  quantitative_claims:
  - 'GPU memory footprint: up to 82% lower than INFless/Astraea; 71% lower than an unoptimized stream-only
    baseline'
  - 'startup latency: 5.8s -> 5ms (98% reduction) vs context-based baselines'
  - 'throughput: 6.7x over INFless; 1.46x over stream-only baseline'
  - 'inter-function communication overhead: 94% reduction vs function-IPC approaches'
  - 'model loading latency: 91% reduction vs stream-only baseline'
  - 'hardware: 4x Nvidia V100 (16GB) + dual Xeon Gold 5117, Azure Function production traces'
  why_useful_for_learning: Concrete case study of the trade-off between context-level GPU isolation (safe,
    heavyweight) and stream-level sharing (cheap, weak isolation), directly relevant to understanding
    vGPU/MIG/MPS design trade-offs.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: null
- id: VIRT-ATC24-04
  title: 'PeRF: Preemption-enabled RDMA Framework'
  title_correction: null
  authors:
  - Sugi Lee
  - Mingyu Choi
  - Ikjun Yeom
  - Younghoon Kim
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/lee
  fullpaper_source: https://www.usenix.org/system/files/atc24-lee.pdf
  classification: CORE
  classification_note: PeRF's whole contribution is a software mechanism that turns a single-tenant-designed
    RNIC into a performance-isolated, work-conserving multi-tenant device -- i.e. it virtualizes RDMA
    access for multi-tenancy the way SR-IOV/QoS mechanisms virtualize a NIC, which the taxonomy places
    under T3 device virtualization rather than a mere scheduler over an already-virtual resource.
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T9
  physical_resource: NIC
  logical_abstraction: A per-tenant RDMA queue pair that behaves as if it had a private, performance-isolated
    slice of the RNIC while the RNIC stays fully work-conserving
  problem: RDMA was designed for single-tenant HPC use; in multi-tenant clouds, bandwidth- and message-intensive
    tenants on shared RNICs starve small-message and delay-sensitive tenants, and existing software isolation
    (e.g. Justitia) sacrifices RNIC utilization or hardware-based QoS (SP/ETS) needs switch support.
  mechanism: PeRF exploits RDMA's managed-QP verbs to buffer work requests in host memory and inserts
    ENABLE/WAIT control WRs so the RNIC only fetches queued requests when scheduled; a Large-Message Scheduling
    Engine splits big transfers into 16KB fragments with interposed WAITs, a Multi-QP Scheduling Engine
    PAUSE/RESUMEs queue pairs per tenant, and an Early-Completion Engine keeps send queues from saturating,
    giving software-only preemption without reservation-based bandwidth estimation.
  isolation_mechanism: Preemption of in-flight transmissions at the granularity of 16KB sub-messages and
    per-tenant QP pause/resume, enforced entirely in the host driver without RNIC firmware changes
  multiplexing_mechanism: One physical RNIC's transmit path is time-multiplexed across tenants' queue
    pairs by dynamically inserting/removing preemption points rather than by static bandwidth reservation
  state_mechanism: N/A (no persistent virtualization state; control state is per-QP preemption bookkeeping
    in host memory)
  overhead_bottleneck: RNIC transmit-path contention when a bandwidth- or message-intensive tenant monopolizes
    the queue ahead of small/delay-sensitive tenants
  primary_tradeoff: Software preemption instead of hardware QoS (SP/ETS) or reservation-based isolation
    (Justitia) -> gains near-bare-metal throughput with work-conserving isolation on commodity RNICs,
    but costs reliance on experimental verbs unsupported for Unreliable Datagram QPs and sensitivity to
    tuning parameters (sub-message size, wait unit)
  quantitative_claims:
  - 'message-rate isolation: ~2.04x M_App message-rate improvement over Justitia (16B messages)'
  - 'QP-level isolation: B_App_single throughput stays ~50 Gbps regardless of a competitor''s QP count,
    unlike Justitia which degrades'
  - 'M_App_single message rate: up to 35% higher than native uncontrolled RDMA'
  - 'D_App_single 99th-percentile latency: up to 22% lower than uncontrolled scheduling'
  - 'real app: Apache Crail throughput 55% higher than Justitia with <1us added latency'
  - 'scalability: sustains 9.7 Mmps for M_App while serving 1,000 B_Apps with 8 QPs each'
  - 'overhead: <5% extra CPU per tenant; ~9MB RAM per single-QP app, ~500KB per extra QP'
  - 'hardware: 5-node cluster, 16-core i7-11700K/32GB, Mellanox ConnectX-5/6 (RoCEv2 and InfiniBand),
    100Gbps'
  why_useful_for_learning: A clean example of software-defined performance isolation for a physical I/O
    device without SR-IOV-style hardware partitioning, useful contrast with hardware device-virtualization
    approaches (SR-IOV/IOMMU) in T3.
  priority: P2
  related:
  - VIRT-ATC24-06
  relations:
  - type: SAME_BRANCH
    target: VIRT-ATC24-06
    basis: Both virtualize a physical I/O device (RNIC vs SmartNIC) for multi-tenant performance isolation
      via software resource-multiplexing mechanisms rather than hardware SR-IOV partitioning.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: null

- id: VIRT-ATC24-06
  title: 'OSMOSIS: Enabling Multi-Tenancy in Datacenter SmartNICs'
  title_correction: null
  authors:
  - Mikhail Khalilov
  - Marcin Chrapek
  - Siyuan Shen
  - Alessandro Vezzu
  - Thomas Benz
  - Salvatore Di Girolamo
  - Timo Schneider
  - Daniele De Sensi
  - Luca Benini
  - Torsten Hoefler
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/khalilov
  fullpaper_source: https://www.usenix.org/system/files/atc24-khalilov.pdf
  classification: CORE
  classification_note: 'OSMOSIS is exactly a device-virtualization contribution: it builds the multiplexing/QoS
    layer that turns a single on-path SmartNIC''s compute, DMA and egress bandwidth into isolated per-tenant
    SR-IOV-exposed slices, which the brief lists explicitly under CORE (SmartNIC/DPU device virtualization).'
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T9
  physical_resource: NIC
  logical_abstraction: A per-tenant SR-IOV virtual function backed by a fair, SLO-aware share of the SmartNIC's
    processing units, DMA bandwidth and egress bandwidth
  problem: Existing on-path SmartNICs multiplex packet-processing kernels with unpredictable execution
    times across tenants using only static allocation or round robin, providing no performance isolation
    or QoS despite exposing SR-IOV VFs to tenants.
  mechanism: A software control plane on the host creates per-flow execution contexts and policies, while
    a hardware data plane on the SmartNIC SoC implements Flow Management Queues that track per-flow state
    and arbitrate via Weight-Limited Borrowed Virtual Time (WLBVT) for compute cycles and Weighted Round-Robin
    for DMA/egress bandwidth; it is integrated into the open-source RISC-V-based PsPIN 400Gbit/s SmartNIC.
  isolation_mechanism: Per-tenant Flow Management Queues plus Physical Memory Protection on the RISC-V
    cores bound both compute-time and memory access between tenants; watchdog timers terminate kernels
    exceeding their per-flow cycle budget
  multiplexing_mechanism: SmartNIC processing units, DMA bandwidth and egress bandwidth are each fairly
    arbitrated (WLBVT for PUs, WRR for DMA/egress) across tenant flow queues instead of static allocation
    or plain round robin
  state_mechanism: Per-flow execution/state metadata lives in hardware Flow Management Queues on the SmartNIC
    SoC; no migration mechanism is introduced
  overhead_bottleneck: DMA fragmentation overhead (2-23%) introduced by fairness-preserving scheduling
    on IO-bound workloads, and the ~7x hardware gate cost of the WLBVT scheduler vs plain round robin
  primary_tradeoff: Adding hardware+software multi-tenancy scheduling to an on-path SmartNIC -> gains
    up to 83% fairness improvement and up to 63% flow-completion-time reduction under contention, but
    costs 2-23% single-tenant IO overhead and non-trivial extra silicon area
  quantitative_claims:
  - 'single-tenant overhead: within +/-3% for compute-bound kernels; 2-23% for IO-bound kernels (decreasing
    with larger packets)'
  - 'peak throughput: 310 Mpps aggregation, 332 Mpps IO writes'
  - 'compute-set multi-tenancy: 47% fairness (Jain''s index) improvement and 39% faster flow completion
    time vs round robin'
  - 'IO-set multi-tenancy: up to 83% fairness improvement, up to 63% FCT reduction, 5x reduction in head-of-line-blocking
    latency for victim tenants'
  - 'hardware cost: WLBVT scheduler ~7x more gates than round robin; 128 FMQs cost only ~1% of PsPIN cluster+L2
    area'
  - 'evaluation: cycle-accurate Verilator simulation of 4 PsPIN clusters (32 cores), 1GHz, 400Gbit/s link,
    plus a 6Gbit/s FPGA prototype'
  why_useful_for_learning: A concrete, hardware-validated design for multiplexing a programmable NIC among
    SR-IOV tenants with QoS, directly comparable to how hypervisors multiplex vCPUs/DRAM, and a good bridge
    to SmartNIC/DPU virtualization more broadly.
  priority: P1
  related:
  - VIRT-ATC24-04
  relations:
  - type: SAME_BRANCH
    target: VIRT-ATC24-04
    basis: Both are software/hardware mechanisms that add multi-tenant performance isolation to a physical
      I/O device (RNIC vs SmartNIC) that natively lacks it.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: null
- id: VIRT-ATC24-07
  title: High-density Mobile Cloud Gaming on Edge SoC Clusters
  title_correction: null
  authors:
  - Li Zhang
  - Shangguang Wang
  - Mengwei Xu
  venue: ATC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc24/presentation/zhang-li-gaming
  fullpaper_source: https://www.usenix.org/system/files/atc24-zhang-li-gaming.pdf
  classification: SUPPORT
  classification_note: SFG spatially partitions a single mobile SoC's GPU/NPU across multiple concurrent
    game sessions (co-location plus a novel screen-space partitioning and NPU super-resolution fallback);
    this is GPU/accelerator spatial-sharing for multi-tenancy, which the brief places in SUPPORT rather
    than CORE since no new virtual-GPU abstraction is introduced.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T9
  physical_resource: GPU
  logical_abstraction: A rectangular sub-region of a shared mobile SoC's screen-space rendering budget,
    allocated per co-located game session
  problem: Mobile cloud gaming on SoC clusters wastes hardware because full-session co-location oversubscribes
    the shared GPU, and simple distance-based workload partitioning still renders occluded objects, wasting
    GPU cycles.
  mechanism: SFG partitions a game's rendering by modifying the camera projection matrix to render only
    a normalized Rectangle(x,y,w,h) region per session (sort-first style, avoiding occluded-object waste),
    then a two-stage coordinator first rebalances partition boundaries across SoCs and, if GPU still falls
    short, drops resolution and uses idle NPUs for lightweight super-resolution.
  isolation_mechanism: Spatial partitioning of the rendering viewport bounds each session's GPU workload;
    NPU offload is used only as capacity overflow, not a security boundary
  multiplexing_mechanism: One SoC's GPU is spatially multiplexed across co-located game sessions via screen-region
    partitioning, with NPU time-multiplexed for super-resolution when GPU capacity is exceeded
  state_mechanism: N/A (no VM/session migration; partitioning is recomputed live via WebRTC-streamed state)
  overhead_bottleneck: GPU rendering of occluded content under naive distance-based partitioning, and
    residual GPU shortage even after partitioning
  primary_tradeoff: Screen-space partitioning plus NPU super-resolution fallback -> gains up to 4.5x higher
    session density with <3.3% FPS loss, but costs added WebRTC network overhead and diminishing returns
    beyond two-way partitioning
  quantitative_claims:
  - 'game density: up to 4.5x higher than existing co-location/partitioning methods across 60 Snapdragon
    SM8250 SoCs, 5 Unity games'
  - 'resource-intensive games: 30 concurrent sessions across 60 SoCs (vs dedicated 1:1 baseline)'
  - 'performance loss: max 3.3% FPS reduction vs dedicated deployment; 99th-percentile FPS maintained'
  - 'image quality: PSNR > 30 across sessions'
  - 'GPU utilization: 97.3% average'
  why_useful_for_learning: A real edge-cluster example of spatial GPU/NPU sharing across tenants without
    a formal vGPU abstraction, useful contrast case for MIG/MPS-style temporal or partition-based accelerator
    sharing.
  priority: P2

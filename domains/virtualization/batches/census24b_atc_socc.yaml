- id: VIRT-SOCC24-01
  title: On-demand and Parallel Checkpoint/Restore for GPU Applications
  title_correction: null
  authors:
  - Yanning Yang
  - Dong Du
  - Haitao Song
  - Yubin Xia
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698510
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698510
  fullpaper_source: https://ipads.sjtu.edu.cn/_media/publications/yang-socc24.pdf
  classification: CORE
  classification_note: gCROP's headline contribution is a GPU checkpoint/restore mechanism (parallel,
    on-demand restoration of CPU+GPU state via a delegated Restore Server and gmmap page-fault-driven
    loading) -- GPU checkpoint/restore of virtualized state is an explicit CORE example under T6/T4 in
    the taxonomy.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T4
  - T5
  physical_resource: GPU
  logical_abstraction: A GPU application instance that can be checkpointed once and restored in tens of
    milliseconds, with CPU and GPU state loaded independently and on demand rather than as one serialized
    blob
  problem: Reusing CRIU-style whole-process checkpoint/restore for GPU-accelerated serverless-style applications
    is slow because GPU driver/data recovery is serialized behind CPU memory/page-table restoration by
    a 'restorer barrier' (Stage-2 GPU recovery needs libdrm/DMA resources that Stage-3 CPU restoration
    unmaps), and cold starts for large models still take hundreds of milliseconds to seconds.
  mechanism: gCROP checkpoints at two points (post-framework-init and post-app-load) to maximize content
    reuse across apps sharing a framework, deduplicating at page granularity (CPU) and buffer-object granularity
    (GPU); on restore, a dedicated Restore Server process imports dma-buf file descriptors and asynchronously
    restores GPU data in a separate address space while the main process restores CPU state via mmap-based
    on-demand paging (gmmap extends this to GPU buffer objects via a custom GPU-page-fault handler), and
    profile-guided recovery orders GPU buffer-object restoration by predicted access sequence to hide
    the remaining blocking delay.
  isolation_mechanism: Address-space isolation between the main process and the Restore Server substitutes
    for the sequential 'restorer barrier', letting CPU and GPU restoration proceed concurrently in separate
    address spaces; the authors note multi-checkpoint reuse breaks ASLR across instances sharing a template,
    so it is recommended only within a single tenant
  multiplexing_mechanism: A shared per-framework checkpoint template is reused (deduplicated) across many
    application instances, and the same GPU device services multiple sequential/concurrent restores of
    independent app instances
  state_mechanism: CPU state (host memory) and GPU state (VRAM-resident buffer objects) are checkpointed
    separately and restored independently -- CPU via ordinary mmap-backed demand paging, GPU via dma-buf
    handoff to the Restore Server plus a custom GPU page-fault handler (gmmap) that defers page-table
    mapping until first access
  overhead_bottleneck: Sequential GPU-then-CPU (or CPU-then-GPU) restoration imposed by the shared-library
    'restorer barrier' in naive CRIU-based restore, and GPU page-fault-driven blocking when access order
    is unpredictable
  primary_tradeoff: Parallel, on-demand, multi-checkpoint restore instead of single-shot CRIU checkpoint
    -> gains 5.5x-23.5x faster restore than CRIU and startup latency of 44-97ms, but costs breaking ASLR
    across instances sharing a template (a security trade-off mitigated by restricting reuse to one tenant)
    and requiring ~20 lines of app-side integration plus offline profiling
  quantitative_claims:
  - 'startup latency: 44-73ms (MobileNet, 20.6x faster than boot-from-scratch, 5.50x faster than CRIU);
    97ms (GPT-2-Large, 17.6x vs scratch, 23.5x vs CRIU)'
  - 'end-to-end latency: GPT-2-Large 460ms, 2.3x faster than warm partial caching, 5.5x faster than CRIU'
  - 'multi-checkpoint storage savings: CPU data 8-54%; GPU data 5.3-87.3% (up to 99% for a trivial ''Hello''
    app)'
  - 'profile-guided recovery: 1.72x less page-fault-induced execution-time increase and 1.60x end-to-end
    improvement (GPT-2-Large) vs default restore order'
  - 'concurrent scaling: 8 simultaneous instance restorations 5.5x-9.2x faster than CRIU, averaging <40-45ms
    per instance'
  - 'hardware: AMD Radeon Instinct MI50 (16GB VRAM), Intel i7-10700, ROCm 5.6.0, PyTorch 1.12, CRIU 3.19;
    7 pretrained models (2.5M-774M params)'
  why_useful_for_learning: A concrete, hardware-validated GPU-state checkpoint/restore design that parallels
    VM/container checkpoint-restore techniques but must solve GPU-specific problems (driver library barriers,
    VRAM buffer objects, GPU page faults) not present in CPU-only checkpointing.
  priority: P1
  related:

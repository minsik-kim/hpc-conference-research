seed_corrections: []
batch_observations: 'Coverage discipline: For ATC24, all 77 official proceedings titles were read (title+authors
  from the contents PDF) and screened against the seed-concept list; every title with a plausible keyword/concept
  hit (~28 titles) was fetched at the presentation-page level for at least an abstract, and every one
  of those became an individual YAML record (9 CORE, 5 SUPPORT, 4 CONTEXT, 8 DROP = 26 records). The remaining
  ~49 ATC24 titles (SSD/flash reliability, video streaming, blockchain, federated-learning algorithms,
  DB fuzzing, HPC application papers, pure ML-serving/training-systems papers, etc.) had no plausible
  virtualization signal on title screening against the seed-concept list and were not given individual
  records or fetched; they are enumerated in the working notes but omitted here to avoid diluting the
  corpus with pure noise, consistent with ''full-paper contribution determines inclusion'' -- the omission
  is a screening decision, not a DROP classification, and is disclosed here rather than silently applied.
  For SoCC24, all 62 official schedule titles were read and screened the same way; ~24 had a plausible
  hit and were carried into individual records, of which only 4 (gCROP, KACE, PraaS, SURE) could actually
  be read past the title/author/session level because ACM DL is systematically inaccessible (403 on every
  route tried) and Semantic Scholar/OpenAlex/dblp/search-engine fallbacks were blocked or 429''d; the
  other 20 are recorded as CONTEXT/TITLE_ONLY/LOW-confidence per the record schema''s hard rule 2, each
  with an explicit access-failure note and a ''plausible_note'' flagging where the title suggests the
  true classification is very likely CORE or SUPPORT (e.g. ''ConMonitor: Lightweight Container Protection
  with Virtualization and VM Functions'', ''Faascale: Scaling MicroVM Vertically for Serverless Computing
  with Memory Elasticity'', ''Towards Swap-Free, Continuous Ballooning...'', ''Securing a Multiprocessor
  KVM Hypervisor with Rust'', ''Snapipeline: Accelerating Snapshot Startup for FaaS Containers''). This
  means the SoCC24 portion of this batch under-counts CORE/SUPPORT relative to ATC24 not because SoCC24
  had less virtualization content, but because of an access asymmetry (USENIX is fully open-access with
  direct PDF links; ACM SoCC sits behind a DL wall this session could not get through for any paper, including
  ones with obvious lab/company affiliations). A later pass with ACM DL institutional access, or a person
  supplying the PDFs directly, should be able to promote most of the 20 TITLE_ONLY SoCC24 records to CORE/SUPPORT
  with real design/evaluation content; they are deliberately NOT guessed into those layers here per the
  record schema''s explicit prohibition on title-only classification. Threshold calls made and worth auditing:
  (1) PeRF (ATC24) and OSMOSIS (ATC24) were classified CORE rather than SUPPORT because their entire contribution
  is turning a single physical I/O device (RNIC, SmartNIC) into a multi-tenant, performance-isolated resource
  via a new software/hardware multiplexing mechanism -- treated as device virtualization (T3) rather than
  ''just a scheduler over an existing device'', matching the CORE bar used for SR-IOV/IOMMU-style work
  in the 2025 batches. (2) CrossMapping (ATC24, dynamic binary translation memory-consistency) was classified
  CORE (T1) on the reasoning that DBT is a classical software-only machine-virtualization technique and

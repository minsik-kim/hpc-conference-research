- id: VIRT-SOCC24-03
  title: 'Process-as-a-Service: Unifying Elastic and Stateful Clouds with Serverless Processes'
  title_correction: null
  authors:
  - Marcin Copik
  - Alexandru Calotoiu
  - Gyorgy Rethy
  - Roman Böhringer
  - Rodrigo Bruno
  - Torsten Hoefler
  venue: SoCC
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3698038.3698567
  official_url: https://dl.acm.org/doi/10.1145/3698038.3698567
  fullpaper_source: https://spcl.inf.ethz.ch/Publications/.pdf/2024_praas_preprint.pdf
  classification: CONTEXT
  classification_note: PraaS is a new cloud execution abstraction (a stateful 'process' between FaaS and
    IaaS) with a swap-in/swap-out elasticity lifecycle, but it runs atop existing container/VM platforms
    (Fargate, Kubernetes) for its actual isolation boundary and its contribution is execution/state semantics
    rather than a virtualization or isolation mechanism itself; per the brief's rule that ambiguous cases
    land in CONTEXT, and given it most resembles the 'application/abstraction that consumes serverless
    infrastructure' pattern, it is classified CONTEXT rather than CORE/SUPPORT.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T4
  physical_resource: CPU core
  logical_abstraction: A persistent 'cloud process' with an OS-process-like memory/thread model, elastic
    ACTIVE/IDLE/SWAPPED/KILLED lifecycle, and direct data-plane messaging between processes
  problem: FaaS functions cannot share memory or maintain state across invocations (forcing round trips
    to remote storage), while IaaS/CaaS give up serverless elasticity; existing abstractions sit at one
    extreme or the other.
  mechanism: PraaS processes run functions as threads sharing memory and persistent state (ephemeral local
    + durable replicated-storage); when idle, a process is swapped out (memory/filesystem/mailbox serialized
    to S3/Redis) and lazily reloaded on reactivation, all decided by the cloud provider to preserve serverless
    transparency; a co-located mailbox and a direct data-plane channel let functions communicate without
    round-tripping through remote storage.
  isolation_mechanism: Single-tenancy per process (functions within one process share state and trust
    each other; different tenants require separate processes), with the actual security boundary provided
    by the underlying container/VM platform (Fargate, Kubernetes) the process runs on
  multiplexing_mechanism: Cloud resources are multiplexed across many stateful processes via the provider-controlled
    swap lifecycle rather than pure request-level scheduling
  state_mechanism: Process memory/filesystem/mailbox state is serialized to replicated cloud storage (S3/Redis)
    on swap-out and lazily reloaded (background pulls plus on-demand loading) on reactivation -- a checkpoint/restore-like
    mechanism at the application-state level rather than the VM/container level
  overhead_bottleneck: Round-trip latency to remote storage (S3/Redis) for state and inter-function communication
    in conventional FaaS, which PraaS's local mailbox/IPC avoids
  primary_tradeoff: Stateful, swappable processes instead of stateless functions -> gains large latency/cost
    reductions for stateful workloads (63-70.5% lower memory cost than provisioned FaaS), but costs single-machine/single-tenant
    scope (no distributed shared memory) and multi-hundred-millisecond swap-in latency for large working
    sets
  quantitative_claims:
  - 'invocation latency: 68-94% faster than Lambda remotely; 17-187x faster locally'
  - 'inter-function communication vs S3: 77-99% latency reduction; vs Redis: 39-93% reduction'
  - 'state access vs S3: 11-50x faster with local state'
  - 'LaTeX microservice file serving: 3.3-34.3x faster than Lambda'
  - 'K-Means weak scaling (8 workers): 1.5-6x speedup vs S3-backed state'
  - 'cost: 63-70.5% memory-cost reduction vs provisioned FaaS instances'
  - 'state swap latency: 98.4ms (1MiB) to 3,480ms (200MiB) to S3'
  - evaluated on AWS Fargate (~13.5K LoC C++ prototype) and a custom Kubernetes/Knative extension
  why_useful_for_learning: 'A clear illustration of the CORE/CONTEXT boundary the brief draws for serverless
    work: PraaS''s swap-based state-elasticity mechanism is checkpoint/restore-flavored but operates at
    the application layer atop existing container/VM isolation rather than replacing or extending that
    isolation mechanism.'
  priority: P2
  related:
  - VIRT-ATC24-14
  - VIRT-ATC24-19
  relations:
  - type: CONTRASTS_WITH
    target: VIRT-ATC24-19
    basis: Both use a swap/serialize-to-storage lifecycle to cut cost while preserving state, but PASS/SnapStart
      snapshots a whole MicroVM's guest-physical memory at the hypervisor level while PraaS serializes
      one application process's state at the platform-API level.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: MEDIUM
  notes: ACM DL page returned 403; read via the SPCL (ETH Zurich) lab's own preprint mirror instead. Author-name
    spellings on the SPCL page differ slightly from the official SoCC program (e.g. 'Anja Calotoiu' vs
    'Alexandru Calotoiu'); the official program's author list is used here as authoritative.

  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary:
  - T10
  physical_resource: CPU core
  logical_abstraction: A guest-ISA virtual machine (memory-consistency semantics included) emulated correctly
    and efficiently on a host with a different, possibly weaker or stronger, memory model
  problem: Dynamic binary translators (e.g. QEMU) must preserve a guest ISA's memory-ordering semantics
    when translating to a host ISA with a different memory model; naive fence insertion is either unsafe
    or (more commonly) excessively conservative, and no unified way exists to compare two ISAs' memory
    models formally.
  mechanism: 'CrossMapping represents each ISA''s memory model as a specification table (ordered/dependency-ordered/unordered
    per instruction-pair, split by same-address vs different-address) and derives mappings in two offline-computed,
    online-applied phases: a guest-to-IR phase using a finite-state machine over concurrent primitives
    (load/store/fence/RMW) that inserts only the fences the guest requires but the host doesn''t guarantee,
    and an IR-to-host phase that translates each IR fence to the weakest sufficient host fence without
    inserting new ones; RMW instructions are decomposed into load-exclusive/store-exclusive pairs with
    context-dependent fences to preserve strong (e.g. x86 LOCK) semantics on weaker targets.'
  isolation_mechanism: N/A (concerns emulated-CPU correctness, not multi-tenant isolation)
  multiplexing_mechanism: N/A
  state_mechanism: N/A (no persistent VM state; the mechanism operates on the instruction stream during
    translation)
  overhead_bottleneck: Excess fences inserted by prior conservative approaches, which the paper measures
    as accounting for up to 84.4% (avg 52.1%) of run time in a no-fences-vs-fenced comparison on x86-to-ARM
  primary_tradeoff: Specification-table-driven, minimal fence insertion instead of conservative per-instruction
    fencing -> gains meaningful speedups translating both strong-to-weak and weak-to-strong ISA pairs,
    but costs having to formally re-derive specification tables for each new guest/host ISA pair and ignoring
    address/dependency tracking (treated conservatively as always-different-address) due to QEMU overhead
  quantitative_claims:

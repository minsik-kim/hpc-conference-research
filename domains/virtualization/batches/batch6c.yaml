    exposure (co-location probability, DoS drop rate), not runtime cost.
  primary_tradeoff: Scheduler policies that improve resistance to co-location attacks
    are shown to be largely independent of the policies governing DoS/contention behavior
    (which instead depend on service time, queuing policy, and cluster capacity) —
    isolation-security and contention-robustness are separate axes, not one trade-off.
  quantitative_claims:
  - scheduler choice produces orders-of-magnitude differences in co-location-attack
    likelihood under identical workloads (two case studies)
  why_useful_for_learning: Explains why container-reuse and scheduler placement policy

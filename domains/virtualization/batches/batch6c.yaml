- id: VIRT-CCGRID26-01
  title: 'TelePod: Live Migration for Stateful Containers'
  title_correction:
  authors:
  - Mingjie Yan
  - Atharva Ranade
  - Xin Zhang
  - Kartik Gopalan
  venue: CCGrid
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid68966.2026.00038
  official_url: https://ieeexplore.ieee.org/document/11619030
  fullpaper_source: UNKNOWN
  classification: CORE
  classification_note: The paper's entire contribution is a new stateful-container
    live-migration mechanism (pre-copy iterative memory transfer plus overlapped transmission-restoration
    on a modified CRIU); migration mechanism itself, not an application that merely
    uses migration, is the object of study.
  drop_reason:
  taxonomy_primary: T4
  taxonomy_secondary:
  - T5
  - T1
  physical_resource: DRAM
  logical_abstraction: A live, network-transparent stateful-container execution point
    that can move across hosts while preserving in-memory data and active network
    connections, decoupling total migration time from downtime.
  problem: Stateful containers (active databases, multiplayer game servers) cannot
    simply be destroyed and restarted like stateless containers, because doing so
    loses volatile in-memory data and live network connections; prior container migration
    approaches suffer high memory/state transfer overhead and service interruption.
  mechanism: TelePod extends Checkpoint/Restore In Userspace (CRIU) with (1) pre-copy
    iterative memory transfer, where the source container keeps running while dirty
    pages are iteratively re-sent, and (2) an overlapped transmission-restoration
    process, where the destination begins restoring container state while the source
    is still transmitting remaining dirty pages.
  isolation_mechanism: N/A for new contribution; relies on existing Linux namespace/cgroup
    container isolation boundaries as captured and restored by CRIU.
  multiplexing_mechanism: N/A (point-to-point single-container migration, not a resource-sharing
    mechanism).
  state_mechanism: Volatile process memory (heap/stack), open file descriptors, and
    network-connection state live in the CRIU checkpoint image; moved via iterative
    pre-copy of dirty memory pages while the destination concurrently restores already-transferred
    process/namespace state, rather than a single stop-and-copy transfer.
  overhead_bottleneck: Memory dirty-rate and total transferred state volume, as in
    classical VM live migration; the overlapped restore hides destination-side restoration
    latency behind the remaining page transfer instead of serializing it after transfer
    completes.
  primary_tradeoff: Overlapping destination-side restoration with source-side dirty-page
    transmission -> gains downtime reduction comparable to hypervisor-based VM live
    migration, but costs implementation complexity from coordinating concurrent CRIU
    dump/restore state across source and destination versus a simpler stop-and-copy
    migration.
  quantitative_claims: []
  why_useful_for_learning: Shows how container live migration reproduces the same
    pre-copy/dirty-page mechanics as hypervisor VM migration on a different (namespace/cgroup)
    isolation substrate, and explicitly claims parity with hypervisor VM migration
    performance for both traditional and confidential VMs, making it a bridge paper
    between the T4 (migration) and T5 (container isolation) branches.
  priority: P1
  related:
  - Post-Copy/Pre-copy VM live migration (Clark et al., NSDI 2005)
  - CRIU (Checkpoint/Restore In Userspace)
  relations:
  - type: USES_MECHANISM_FROM
    target: VM pre-copy live migration (Clark et al., NSDI 2005)
    basis: Abstract explicitly frames TelePod's technique as combining pre-copy iterative
      memory transfer (the classical hypervisor live-migration technique) with a new
      overlapped transmission-restoration step, and benchmarks against hypervisor-based
      VM migration performance.
  - type: USES_MECHANISM_FROM
    target: CRIU (Checkpoint/Restore In Userspace)
    basis: Prototype is explicitly 'based on modified Checkpoint/Restore In Userspace
      (CRIU)'.

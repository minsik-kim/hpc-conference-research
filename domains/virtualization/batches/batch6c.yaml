  relations:
  - type: CONTRASTS_WITH
    target: VIRT-CCGRID26-03
    basis: Both papers are SUPPORT-level improvements to existing GPU sharing/virtualization
      mechanisms (SVM paging policy vs. MPS scheduling policy) rather than new virtual-GPU

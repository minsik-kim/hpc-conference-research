  physical_resource: CPU core
  logical_abstraction: A discrete-event simulation of a serverless platform's scheduler,
    container-reuse policy, and resource contention, with attackers/victims modeled
    as first-class entities.
  problem: Production serverless platforms are vulnerable to co-location and resource-contention
    attacks exploiting shared execution environments, but studying these risks on
    real platforms is impractical (limited observability, high cost, no experimental
    control), and existing simulators model performance/cost rather than security.
  mechanism: Kumo models invocation arrivals, scheduler placement, container reuse,

  problem: NVIDIA MPS lets multiple jobs share a GPU concurrently but has no notion
    of job priority, so co-locating a latency/throughput-critical job (e.g., an HPC
    application) with a best-effort job (e.g., LLM training) can degrade the important
    job's turnaround time.
  mechanism: A priority-aware GPU co-scheduling policy layered on top of MPS that
    governs which co-located jobs get preferential access to GPU execution resources;

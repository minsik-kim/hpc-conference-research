    cold-start latency, both of which must fit inside the cloud provider's preemption
    grace period.
  primary_tradeoff: Using spot instances -> large cost savings at the cost of preemption
    risk; Cremes' predictive scaling recovers most of the savings while bounding SLO-violation
    risk, but depends on accurate latency/availability prediction.

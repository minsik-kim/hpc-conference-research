    dynamic threats.
  mechanism: Evaluates five learning-based detection methods over multiple system-call
    feature representations, using a purpose-built dataset of 1.6 million syscalls
    from 30 serverless functions deployed on an OpenFaaS-Kubernetes testbed, to identify
    compromised AI functions at runtime.
  isolation_mechanism: Relies on standard container/namespace isolation of FaaS functions
    as the boundary being monitored for supply-chain compromise via syscall behavior;
    does not modify the isolation boundary.
  multiplexing_mechanism: N/A.
  state_mechanism: N/A.
  overhead_bottleneck: Runtime syscall-tracing/analysis overhead needed to catch dynamic
    threats that static analysis misses (not separately quantified in the abstract).
  primary_tradeoff: Runtime system-call behavioral analysis -> catches dynamic supply-chain
    compromises that static analysis misses, at the cost of needing continuous syscall-monitoring
    infrastructure.
  quantitative_claims:
  - up to 100% detection rate with 99.90% F1 score across five learning-based methods
    (1.6M-syscall OpenFaaS-Kubernetes dataset, 30 functions)
  why_useful_for_learning: A real operational security concern (AI supply-chain compromise)
    that motivates strong container isolation, illustrated without the paper itself
    building or changing the isolation mechanism.

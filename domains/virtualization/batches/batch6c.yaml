  isolation_mechanism: Simulates (does not implement) the isolation weaknesses created
    by container-reuse and shared-execution-environment placement policies in serverless
    platforms.
  multiplexing_mechanism: Models how a serverless scheduler multiplexes worker/container
    capacity across tenant invocations, and how that multiplexing policy determines
    attacker-victim co-location probability.

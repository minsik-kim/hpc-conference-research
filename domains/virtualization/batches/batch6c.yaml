    across concurrent processes, now ordered by an explicit priority policy.
  state_mechanism: N/A (GPU execution-context state itself is managed by MPS, unchanged
    by this paper).
  overhead_bottleneck: Without priority differentiation, high-priority jobs suffer
    contention-induced turnaround-time inflation when MPS co-locates them with lower-priority
    jobs.
  primary_tradeoff: Adding priority-aware co-scheduling on top of MPS -> gains large
    turnaround-time improvements for high-priority jobs, at the cost of a more complex
    scheduling policy than MPS's default best-effort sharing (the abstract does not
    quantify the turnaround-time cost imposed on deprioritized jobs).
  quantitative_claims:

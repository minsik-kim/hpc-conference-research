- id: VIRT-CCGRID26-04
  title: Enhanced SVM for Improving Application Performance Under GPU Memory Oversubscription
  title_correction:
  authors:
  - Bennett Cooper
  - Thomas R. W. Scogland
  - Rong Ge
  venue: CCGrid
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/CCGrid68966.2026.00020
  official_url: https://doi.org/10.1109/CCGrid68966.2026.00020
  fullpaper_source: UNKNOWN
  classification: SUPPORT
  classification_note: Improves the migration-granularity and eviction policy inside
    AMD's existing Shared Virtual Memory (SVM) driver under GPU memory oversubscription;
    it enhances an existing GPU virtual-memory mechanism rather than introducing a
    new virtual-GPU/partition abstraction, so it is SUPPORT.
  drop_reason:
  taxonomy_primary: T6
  taxonomy_secondary:
  - T2
  physical_resource: GPU
  logical_abstraction: AMD Shared Virtual Memory (SVM) — a unified virtual address
    space spanning host and GPU memory that the driver pages in and out of physical
    GPU memory on demand.
  problem: When the working set of GPU kernels exceeds physical GPU memory, SVM's
    default fixed migration granularity and FIFO eviction policy cause thrashing (pages
    evicted and then immediately re-migrated back), severely degrading performance
    under oversubscription.
  mechanism: 'Two enhancements implemented directly in the SVM driver: (1) runtime-configurable
    page migration granularity in place of one fixed size, and (2) a priority-based
    eviction policy replacing FIFO so pages likely to be reused soon are less likely
    to be evicted first.'
  isolation_mechanism: N/A (single-context memory-oversubscription handling, not a
    multi-tenant isolation boundary).
  multiplexing_mechanism: GPU physical memory capacity is time-multiplexed among the
    virtual address space's pages via on-demand host<->GPU migration.
  state_mechanism: Page residency/location state is tracked and changed by the SVM
    driver itself; this paper changes the granularity and eviction bookkeeping of
    that state, not where it is kept.
  overhead_bottleneck: 'Thrashing: eviction immediately followed by re-migration of
    the same data, driven by a mismatch between fixed migration granularity and a
    recency-blind FIFO eviction order.'
  primary_tradeoff: Coarse fixed-granularity FIFO SVM -> simple driver logic but severe
    thrashing under oversubscription; configurable granularity plus priority eviction
    -> reduced thrashing and better performance, at the cost of added driver complexity
    and a larger tuning surface.
  quantitative_claims: []
  why_useful_for_learning: Shows that GPU unified/shared virtual memory is paged much
    like guest-physical VM memory (ballooning/reclamation), and that the same oversubscription/thrashing
    trade-offs recur at the GPU virtual-memory layer — useful background for any CORE
    paper on GPU virtualization or MIG/MPS-style GPU memory partitioning.
  priority: P2
  related:

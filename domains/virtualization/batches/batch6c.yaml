- id: VIRT-HPDC26-01
  title: Enabling Floating Point Virtualization With Tiny Numbers
  title_correction:
  authors:
  - Kevin Hayes
  - Peter Dinda
  venue: HPDC
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3806645.3807578
  official_url: https://doi.org/10.1145/3806645.3807578
  fullpaper_source: UNKNOWN
  classification: CORE
  classification_note: The contribution is a new instruction-level virtualization
    mechanism (trap-based interception plus a boxed value representation) that lets
    unmodified binaries run with an alternative, smaller-than-native floating-point
    arithmetic system; virtualizing the arithmetic ISA itself is the paper's entire
    subject.
  drop_reason:
  taxonomy_primary: T1
  taxonomy_secondary:
  - T10
  physical_resource: CPU core
  logical_abstraction: A virtual floating-point arithmetic system that lets unmodified
    binaries execute IEEE-754-shaped operations at a programmer-chosen precision as
    small as 3 bits, transparently substituted for native FP instructions.
  problem: Hardware and compilers only provide fixed IEEE-754 widths (e.g., 32/64-bit),
    while low-precision AI accelerators increasingly want arithmetic narrower than
    any native binary format, and no existing mechanism lets an unmodified binary
    transparently run with such 'tiny' numbers.
  mechanism: 'A hardware/software co-design on x64: ''lazy FPU abduction'' traps floating-point
    instructions by exploiting otherwise-idle x64 FPU-state-ownership machinery, and
    ''tiny value boxing'' compactly encodes reduced-precision values in the FP register/memory
    representation the trap handler manages; precision (down to 3 bits) can be chosen
    per-value or per-instruction at runtime.'
  isolation_mechanism: N/A (single-process arithmetic substitution, not a multi-tenant
    boundary).
  multiplexing_mechanism: N/A.
  state_mechanism: Reduced-precision values are boxed/encoded directly in the FP register
    and memory locations the trap handler manages, analogous to how the companion
    2025 system NaN-boxed pointers to larger-than-native alternative-arithmetic results
    — here the boxing runs in the opposite direction, for smaller-than-native values.
  overhead_bottleneck: Trap frequency/cost of intercepting FP instructions in software
    — the same fundamental bottleneck the companion 2025 paper attacked for large
    numbers, now faced again for tiny numbers.
  primary_tradeoff: Trapping at the instruction level to emulate arbitrary sub-native
    precision -> gains binary compatibility and per-value/per-instruction precision
    control without recompilation, but costs per-instruction trap/emulation overhead
    relative to native hardware execution.
  quantitative_claims:
  - supports IEEE-754-shaped precision down to 3 bits, adjustable per-value or per-instruction
    at runtime, validated with NAS and other benchmarks across a range of lower-precision
    settings
  why_useful_for_learning: 'Shows the opposite end of the floating-point-virtualization
    design space from the HPDC 2025 FPVM paper: instead of accelerating trap-and-emulate
    for wider/alternative arithmetic, it extends the same trap-based virtualization
    idea to narrower-than-native precision relevant to low-precision AI hardware,
    illustrating that ''virtualizing an ISA-level numeric format'' is a general technique
    independent of which direction the size changes.'
  priority: P1
  related:
  - Virtualization So Light, It Floats! Accelerating Floating Point Virtualization
    (Wanninger, Dhiantravan, Dinda; HPDC 2025)
  relations:
  - type: EXTENSION
    target: Virtualization So Light, It Floats! Accelerating Floating Point Virtualization
      (Wanninger, Dhiantravan, Dinda; HPDC 2025, DOI 10.1145/3731545.3731584)
    basis: Same senior/last author (Peter Dinda) and the same overall floating-point-virtualization
      research program (per the author's own publication list, listed consecutively
      as HPDC 2025 and HPDC 2026 entries); the 2025 system (FPVM) uses trap-and-emulate
      plus 'NaN-boxing' to virtualize toward LARGER alternative arithmetic (MPFR,
      posits, interval arithmetic), while the 2026 abstract explicitly targets the
      complementary, previously-unaddressed direction of SMALLER (tiny, down to 3-bit)
      numbers using an analogous but distinct mechanism ('tiny value boxing' + 'lazy
      FPU abduction'), extending floating-point virtualization to a numeric regime
      the 2025 design's optimizations (trap short-circuiting, instruction-sequence
      emulation, kernel-bypass) were not built for.
  existing_corpus_overlap:
  previous_analysis_depth:
  evidence_depth: ABSTRACT
  evidence_kinds:
  - official-web
  confidence: MEDIUM
  notes: 'Full-text access failed after 4 distinct routes: (1) ACM DL doi.org/10.1145/3806645.3807578

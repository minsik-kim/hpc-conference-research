  state_mechanism: N/A.
  overhead_bottleneck: Coordination/visibility overhead of tracking global, millisecond-level
    resource state across the whole platform to allocate/release resources per request.
  primary_tradeoff: Finer (request-level) resource granularity -> higher utilization
    and lower tail latency than instance-level allocation, at the cost of needing
    low-overhead global visibility/coordination infrastructure that instance-level
    systems avoid.
  quantitative_claims:

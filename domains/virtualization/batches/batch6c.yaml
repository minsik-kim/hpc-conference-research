    and release within a FaaS platform, unified with request routing.
  problem: Static, coarse-grained instance-level resource allocation in FaaS platforms
    cannot match millisecond-level bursty request patterns, forcing a trade-off between
    resource utilization and QoS.
  mechanism: RRP shifts the unit of scheduling/resource management from the VM/container
    instance to the individual request ('request-level provisioning'), unifying instance
    placement and request routing with millisecond-level global visibility so each
    request gets and releases exactly the resources it needs.
  isolation_mechanism: Per-request resource isolation from contention, implemented
    at the platform-scheduling level rather than via a new sandboxing/VM primitive.

  mechanism: Cremes models both instance-waiting-time and microservice-startup latency,
    uses cloud-exposed availability metrics plus lightweight ML latency prediction,
    and feeds a multi-dimensional optimization engine that decides scaling actions
    to keep recovery within the spot grace period at minimum cost.

- id: VIRT-OSDI24-03
  title: "Microkernel Goes General: Performance and Compatibility in the HongMeng Production Microkernel"
  title_correction: null
  authors: [Haibo Chen, Xie Miao, Ning Jia, Nan Wang, Yu Li, Nian Liu, "et al."]
  venue: OSDI

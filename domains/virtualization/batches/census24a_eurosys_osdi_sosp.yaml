- id: VIRT-SOSP24-05
  title: "Dirigent: Lightweight Serverless Orchestration"
  title_correction: null
  authors: [Lazar Cvetkovic, François Costa, Mihajlo Djokic, Michal Friedman, Ana Klimovic]
  venue: SOSP
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://sigops.org/s/conferences/sosp/2024/accepted.html
  fullpaper_source: https://anakli.inf.ethz.ch/papers/dirigent_sosp24.pdf
  classification: CONTEXT
  classification_note: "Dirigent explicitly does not alter container/sandbox provisioning or isolation; it redesigns only the Kubernetes-style cluster-manager scheduling/control-plane architecture around an existing, unmodified sandbox runtime -- a pure consumer of virtualization/sandboxing, the brief's textbook CONTEXT case for serverless orchestration."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T8]
  physical_resource: CPU core
  logical_abstraction: "A cluster-manager control plane with four abstractions (Function, Sandbox, DataPlane, WorkerNode) instead of Kubernetes' layered objects, that can schedule/create sandboxes fast enough to keep up with FaaS-scale churn"
  problem: "FaaS cluster managers built on Kubernetes add ~2s of scheduling latency for 100 concurrent sandbox creations despite the underlying containers themselves initializing in 10-100ms, because Kubernetes' hierarchical abstractions, mandatory persistent-state writes, and microservice control-plane RPCs are designed for long-lived applications, not high sandbox churn (production bursts up to 8000 sandbox creations/sec)."
  mechanism: "Dirigent compresses per-sandbox state from Kubernetes' ~17KB to 16 bytes across four simplified abstractions, removes persistent database writes from the invocation critical path (keeping only in-memory, re-creatable/re-inferable state), and consolidates scheduling logic into a single monolithic control-plane process using in-memory channels instead of inter-microservice RPCs; it explicitly does not change how sandboxes themselves (Firecracker or containerd) are created."
  isolation_mechanism: N/A (unchanged from the underlying Firecracker/containerd sandbox runtime; Dirigent only schedules it faster)
  multiplexing_mechanism: N/A
  state_mechanism: "Only recoverable state stays in memory during execution (sandboxes can be re-created elsewhere, metrics re-inferred); control-plane state recovers from a leader failure in 10ms vs. Knative's several seconds."
  overhead_bottleneck: "Kubernetes-inherited persistent-state writes and layered-object overhead on the invocation critical path is the bottleneck Dirigent's redesign targets."
  primary_tradeoff: "Simplified, persistence-free, monolithic control plane -> gains 2500 sandbox creations/sec (1250x Knative) and 2.79x lower p99 scheduling latency than AWS Lambda, at the cost of losing Kubernetes-style function versioning/traffic steering, request-level fault tolerance for synchronous calls, and general-purpose cluster-management features."
  quantitative_claims:
  - "peak sandbox-creation throughput: 2500/sec (Firecracker) / 1750/sec (containerd), vs. Knative/OpenWhisk saturating below 2/sec -- 1250x improvement"
  - "p99 scheduling latency (Azure 500-function trace): 2.79x lower than AWS Lambda, 403x lower than Knative"
  - "control-plane failover recovery: 10ms vs. Knative's ~seconds; data-plane recovery: 2s vs. Knative's 15s"
  - "warm-start throughput: 4000 invocations/sec at p99 2.5ms, vs. Knative's 1200/sec at p99 ~7ms"
  why_useful_for_learning: "A clean illustration of the brief's serverless CONTEXT/SUPPORT distinction: it is explicit textual evidence that a serverless orchestration paper can leave the sandbox/isolation mechanism untouched and still deliver large end-to-end gains purely from control-plane redesign."
  priority: P3
  related: [VIRT-EUROSYS24-05, VIRT-OSDI24-01]
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]

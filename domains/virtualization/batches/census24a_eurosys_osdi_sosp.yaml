  problem: "Confidential-VM architectures (AMD SEV-SNP, Intel TDX, Arm CCA) remove the hypervisor from the guest's trust boundary but require an in-guest privileged security module to replace hypervisor-provided services; Rust implementations still contain unsafe blocks, and formally verifying such a module is hard because an untrusted hypervisor can interrupt execution and tamper with hardware state at any point, breaking standard sequential verification techniques."
  mechanism: "VeriSMo splits verification into a machine-model layer (an abstract hardware model of registers/memory/page tables/RMP whose state transitions are proven to preserve VM confidentiality, VMPL isolation, and correct address translation even under adversarial hypervisor interference) and an implementation layer (Rust ownership + Verus permission tracking to handle VeriSMo's own multi-CPU concurrency), verified with the Verus tool atop Rust and a 90-LOC-trusted verified HACL crypto library."
  isolation_mechanism: "Runs at the highest VM privilege level (VMPL0) versus the guest OS at VMPL3, using the hardware Reverse Map Table (RMP) to enforce per-VMPL memory access permissions across three memory classes (VMPL0-private, VMPL3-private, hypervisor-shared), and a restricted-interrupt mode that limits the untrusted hypervisor to controlled #HV notifications rather than arbitrary interrupt injection."
  multiplexing_mechanism: N/A
  state_mechanism: "Confidential-VM security state (page ownership/validation, measurement, secrets) is tracked and enforced entirely within the verified module; the untrusted hypervisor is modeled as able to modify hardware state at any time, and the proofs must hold regardless."
  overhead_bottleneck: "None significant in the reported measurements; the paper reports near-zero UnixBench overhead versus baseline Linux."
  primary_tradeoff: "Full formal verification of the confidential-VM security module -> gains proven confidentiality/integrity/information-flow properties and only 32 unsafe Rust blocks (vs. 150-235 in AMD/COCONUT SVSM), at the cost of ~2x proof/spec code relative to executable code and 6 minutes of Verus/Z3 verification time on a 32-core machine, plus a narrower modeled scope (no #VC exceptions, no side-channel or physical-attack modeling)."

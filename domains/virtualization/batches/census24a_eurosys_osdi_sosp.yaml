- id: VIRT-SOSP24-02
  title: "VPRI: Efficient I/O Page Fault Handling via Software-Hardware Co-Design for IaaS Clouds"
  title_correction: 'sigops.org accepted-papers list gave: "VPRI: Optimized I/O Page Fault in Public IaaS"; official/dblp title used here is more complete.'
  authors: [Kaijie Guo, Dingji Li, Ben Luo, Yibin Shen, Kaihuan Peng, Ning Luo, "et al.", Xiantao Zhang, Zeyu Mi]
  venue: SOSP
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://sigops.org/s/conferences/sosp/2024/accepted.html
  fullpaper_source: https://ipads.sjtu.edu.cn/_media/publications/li-sosp24.pdf
  classification: CORE
  classification_note: "VPRI is a new I/O-page-fault (IOPF) mechanism enabling on-demand paging for passthrough devices in production IaaS, directly attacking static-pinning memory waste from device passthrough -- a core I/O/memory-virtualization mechanism, CORE T3/T2."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T2]
  physical_resource: DRAM
  logical_abstraction: "VM memory backing a passthrough NIC/block device that can be safely paged out and faulted back in on demand, instead of being permanently pinned for the VM's lifetime"
  problem: "Device passthrough requires statically pinning all VM memory to avoid I/O page faults, wasting up to 50% of DRAM in production (45% of pages cold within 2 minutes, 30% of servers >50% cold daily); the standard hardware fix (IOMMU ATS+PRI) needs features unsupported by >90% of production CPUs and imposes IOPF delivery latencies up to 3 orders of magnitude longer than CPU page faults, with a single 5ms IOPF triggering ~300ms of NIC network interruption."
  mechanism: "VPRI decouples pre-DMA page-presence checking from full address translation using a PA-BITMAP (2 bits/4KB page: present + R/W) that the I/O engine checks via a single ~50-100ns local DRAM access before DMA, avoiding any IOMMU ATS dependency; a dedicated DPU PCI function exposes a shared page-fault queue (PFQ) as a sideband IOPF-reporting path instead of relying on IOMMU PRI; an Adaptive DMA Protector (ADP) uses a device-type-aware dual-LRU policy (separate active/inactive blocks, tuned per NIC vs. block-device access patterns) to cut IOPF frequency by selectively pinning far fewer pages than naive per-device LRU; vCPU-affined IOPF scheduling runs each VM's fault handling only on that VM's own physical cores for both scalability and tenant isolation."
  isolation_mechanism: "vCPU-affined IOPF scheduling confines a tenant's fault-handling work to its own allocated physical cores, preventing one VM's fault storm from starving another's IOPF service (measured: serialized scheduling gives 10.4x higher latency at 16 VMs vs. VPRI's stable ~5000us); per-device protection domains keep separate LRU sets per device so a high-footprint block device cannot evict a low-footprint NIC's pinned pages."
  multiplexing_mechanism: "Physical DRAM is time-multiplexed across a VM's passthrough devices via per-device demand paging instead of static full pinning, with the ADP dual-LRU policy deciding how much of each device's footprint stays pinned versus pageable."
  state_mechanism: "PA-BITMAP entries mirror IOPT mapping state and are invalidated by the hypervisor before any IOPT unmap so a device can never DMA into reclaimed memory; a virtio-ring-based IO Page Access Logging (IO-PAL) channel provides lossy, hardware-assisted DMA access tracking to guide (not enforce) reclamation decisions."
  overhead_bottleneck: "IOPF delivery/handling latency (tens to hundreds of microseconds, vs. CPU page faults) and, for block devices specifically, weak temporal locality (>83% of pages accessed <10 times in 30 minutes) limiting how much IOPF reduction pinning-based heuristics can achieve."
  primary_tradeoff: "Sideband, ATS-independent IOPF + adaptive pinning -> gains >99% average IOPF reduction and up to 15% DRAM cost savings on 5000 production Alibaba Cloud VMs with 10-15% memory overcommit, at the cost of much weaker gains on block devices (36-49% IOPF reduction vs. 95-97% for NICs) and no support yet for nested vIOMMU / multi-level virtualization scenarios."
  quantitative_claims:
  - "production (5000 VMs, 10-15% overcommit): NIC IOPF reduced >99% on average (38/day baseline to 0.28/day); block-device IOPF reduced 51% on average (66/day to 32/day); up to 15% DRAM cost savings"
  - "ADP vs. simple per-device LRU: 6.28x better resident-page ratio on NICs, 10.56x better on block devices, at 4.3% average pinned memory"
  - "vCPU-affined scheduling: stable ~5000us IOPF latency across 1-16 VMs at up to 10 IOPFs/sec, vs. 10.4x latency increase for serialized scheduling"
  - "PA-BITMAP: 50-100ns lookup, ~2us update, <0.1% baseline I/O throughput impact across 50-200Gbps devices"
  - "unmitigated IOPF impact: a single 5ms IOPF causes ~300ms NIC network interruption; 10 IOPFs/sec burst causes 70% instantaneous throughput reduction"
  why_useful_for_learning: "A production-validated, fully quantified account of the passthrough-vs-overcommit tension that motivates virtio/SR-IOV design choices, and a concrete alternative to IOMMU ATS+PRI for IOPF."
  priority: P0
  related: [VIRT-SOSP24-03, VIRT-OSDI24-05]
  relations:
  - type: TRADEOFF_PAIR
    target: VIRT-SOSP24-03
    basis: "Both solve device-passthrough memory-safety/overcommit costs at the IOMMU/DMA boundary -- F&S cuts the cost of strict per-DMA IOTLB invalidation for a fixed pinned memory footprint, while VPRI removes the need for static pinning at all via software-managed IOPF; together they cover complementary corners of the passthrough safety/performance/memory-elasticity trade-off space."
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Read the author-hosted PDF via SJTU IPADS publication listing; sigops.org's accepted-papers wording ('Optimized I/O Page Fault in Public IaaS') differs slightly from the dblp/paper title used here."

- id: VIRT-SOSP24-03
  title: "Fast & Safe IO Memory Protection"
  title_correction: null
  authors: [Benny Rubin, Saksham Agarwal, Qizhe Cai, Rachit Agarwal]
  venue: SOSP
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://sigops.org/s/conferences/sosp/2024/accepted.html
  fullpaper_source: http://www.cs.cornell.edu/~ragarwal/pubs/fands.pdf
  classification: CORE
  classification_note: "F&S modifies the IOMMU/IOTLB memory-protection mechanism used to safely isolate DMA-capable passthrough devices from unauthorized host memory access -- the IOMMU is the canonical device-virtualization/passthrough isolation primitive, so this is CORE T3."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: []
  physical_resource: NIC
  logical_abstraction: "A passthrough-device DMA target address space (IOVA space) that remains strictly protected (a device cannot access memory after its IOVA mapping is unmapped) at close to zero performance cost"
  problem: "IOMMUs prevent malicious/buggy passthrough devices from accessing unauthorized memory, but strict protection (unmap IOVA + invalidate IOTLB after every DMA) causes 20-65% throughput degradation and orders-of-magnitude tail-latency inflation, because each unmap forces at least one IOTLB miss and a multi-level (4-level) IO page-table walk; prior work traded off either safety or required hardware/OS redesign."
  mechanism: "F&S needs no hardware changes and only 630 LOC of OS changes: it allocates IOVAs in contiguous 256KB ranges mapped to consecutive physical pages (rather than isolated 4KB IOVAs), improving IO-page-table-cache locality (cutting PTcache-L3 misses from up to 64 per descriptor to at most 2); it selectively preserves page-table caches on IOVA unmap, invalidating only when a page-table page is actually reclaimed (observed to be extremely rare for networking workloads) instead of Linux's default of invalidating on every unmap; and it batches multiple 4KB unmaps within a contiguous IOVA range into single invalidation-queue entries."
  isolation_mechanism: "Strict-mode safety is preserved: a malicious/faulty device can no longer access physical memory behind an IOVA once that IOVA is unmapped, enforced by immediate IOTLB invalidation on DMA completion and selective (not blanket) page-table-cache invalidation only on true page-table reclamation."
  multiplexing_mechanism: N/A
  state_mechanism: "IO page-table state (4-level hierarchy) and IOTLB/page-table-cache entries are the protected state; F&S changes only when/how aggressively that cached state is invalidated, not its content or ownership."
  overhead_bottleneck: "IOTLB miss cost (multi-level page-table walk, up to 4 memory accesses) after every mandatory unmap-and-invalidate cycle is the paper's identified root cause of strict-mode overhead; F&S reduces the cost per miss rather than the miss rate itself."
  primary_tradeoff: "Contiguous IOVA allocation + selective cache invalidation -> gains near-IOMMU-off throughput and packet-loss elimination while preserving strict safety, at the cost of no direct reduction in IOTLB miss rate (so very small objects / single-page-descriptor devices see smaller gains), and reliance on estimated (not vendor-published) IO-page-table cache sizes."
  quantitative_claims:
  - "throughput restored from 20-65% degradation (strict IOMMU baseline) to near-identical to IOMMU-disabled performance across most scenarios"
  - "Nginx: baseline 65-70% throughput reduction eliminated; Redis: baseline 38-70% degradation eliminated; SPDK: throughput restored from ~60Gbps to full 100Gbps saturation"
  - "PTcache-L3 misses: 0.045-0.054 per page with F&S vs. 0.36-0.90 baseline"
  - "packet drops: up to 4% under default strict protection, eliminated (matching IOMMU-off) with F&S"
  - "tail latency: within 1.17x of IOMMU-off at P50-P99.9, ~1.42x at P99.99"
  - "under heavy bidirectional Rx/Tx interference: 80% throughput degradation without F&S, near-baseline performance with it"
  why_useful_for_learning: "The clearest mechanistic account in this batch of why IOMMU-based DMA isolation is expensive and exactly which cache-locality/invalidation choices fix it, directly complementary to VPRI's page-fault-based approach to the same passthrough-memory-safety problem."
  priority: P0
  related: [VIRT-SOSP24-02]
  relations:
  - type: TRADEOFF_PAIR
    target: VIRT-SOSP24-02
    basis: "F&S makes strict per-DMA IOMMU protection cheap for a statically-pinned passthrough memory footprint, while VPRI removes the need for static pinning via software-managed IOPF; both attack the passthrough safety/performance/memory-cost triangle from different corners."
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Internal system name F&S; read the author-hosted PDF from Rachit Agarwal's Cornell page, listed there explicitly as [SOSP'24]."


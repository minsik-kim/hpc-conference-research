  - "six-VM multi-tenant: worst-case slowdown reduced from 35% to <6% with Memstrata; CPU overhead <=4% of a single core across all VMs (<1% per VM)"
  - "noisy-neighbor experiment without page coloring: 73% of workloads see >10% slowdown from cross-VM local-memory conflicts; worst case (Redis p95) 480% slowdown"
  - "vs. software tiering (TPP): TPP thrashes on 17% of workloads with >50% degradation under memory pressure"
  - "outlier classifier: 88% validation accuracy (random forest on L3-miss-latency proxy)"
  why_useful_for_learning: "A rare fully-quantified example of a hypervisor-mediated memory-virtualization mechanism (page coloring for inter-VM isolation) paired with a concrete hardware CXL-tiering substrate, directly explaining how memory virtualization and CXL disaggregation interact in production-style multi-tenant hosts."

- id: VIRT-OSDI24-01
  title: "Sabre: Hardware-Accelerated Snapshot Compression for Serverless MicroVMs"
  title_correction: null
  authors: [Nikita Lazarev, Varun Gohil, James Tsai, Andy Anderson, Bhushan Chitlur, Zhiru Zhang, Christina Delimitrou]
  venue: OSDI
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi24/presentation/lazarev
  fullpaper_source: https://www.usenix.org/system/files/osdi24-lazarev_1.pdf
  classification: CORE
  classification_note: "The paper's contribution is a hardware-accelerated compression mechanism integrated directly into the Firecracker microVM snapshot/restore path, i.e. it modifies the VM snapshot mechanism itself, not merely an application that consumes it -- squarely CORE T4 (VM snapshot/restore) with T8 as the deployment context."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T8, T1]
  physical_resource: DRAM
  logical_abstraction: "A compressed microVM memory snapshot file that restores guest-physical memory pages on demand using near-memory hardware (de)compression instead of software codecs"
  problem: "Firecracker microVM snapshotting reduces serverless cold starts by restoring guest memory from a saved snapshot, but restoring large snapshots is I/O- and CPU-bound; software (de)compression to shrink snapshots is too CPU-expensive to use on the restore hot path."
  mechanism: "Sabre integrates with Firecracker's snapshot/restore pipeline and offloads (de)compression to near-memory analytics accelerators present in modern datacenter CPUs, compressing guest-physical memory pages losslessly on snapshot and decompressing them inline on page-fault-driven restore."
  isolation_mechanism: N/A (memory-content transform on top of existing Firecracker/KVM VM isolation boundary)
  multiplexing_mechanism: N/A

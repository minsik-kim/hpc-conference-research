  classification: CORE
  classification_note: "SigmaOS proposes a new lightweight isolation/execution unit (procs in sigma-containers) with a purpose-built tenant-isolation mechanism (sigma-EP tenant-scoped connection tokens replacing IP networking, seccomp/AppArmor-restricted syscall surface) rather than consuming an existing container runtime -- a new container-isolation-architecture contribution, CORE T5 per the brief's explicit criterion."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8, T9]
  physical_resource: CPU core
  logical_abstraction: "A 'proc' -- a unit that can be long-running/stateful or short-lived/parallel, started in a sigma-container in ~2ms, that communicates over tenant-scoped sigma-EP tokens instead of IP sockets and is confined to 67 allowed syscalls (vs. 352 for Docker) via seccomp+AppArmor"
  problem: "Serverless functions start fast but cannot act as long-lived stateful servers with peer communication, while container orchestration (Kubernetes) supports long-lived stateful services but is too slow to start for burst parallelism; no single platform serves both workload styles."
  mechanism: "SigmaOS's sigma-containers skip network-namespace and overlay-filesystem setup (replaced by sigma-EPs and cloud-native S3/etcd APIs), share generic read-only root filesystems across procs, demand-page proc binaries via FUSE from local cache or S3, and restrict the syscall surface to 67 calls via seccomp with AppArmor capability dropping; sigma-EPs are opaque, tenant-scoped connection tokens enabling direct proc-to-proc communication within a tenant 'realm' while structurally preventing cross-tenant network access; a two-tier scheduler (centralized lcsched for latency-critical procs, sharded besched for best-effort) lets best-effort procs opportunistically use idle latency-critical-reserved resources."
  isolation_mechanism: "Tenant isolation is enforced structurally by sigma-EPs (a proc cannot address another tenant's realm because it only ever holds opaque, realm-scoped connection tokens, never raw IPs) plus a restricted syscall surface (67 vs. 352 for Docker) via seccomp/AppArmor, rather than by traditional network-namespace/overlay-network isolation."
  multiplexing_mechanism: "CPU/memory is shared between latency-critical (LC, reserved) and best-effort (BE, elastic) procs via the two-tier scheduler, letting BE procs use LC-reserved idle capacity while guaranteeing LC procs their reservation."
  state_mechanism: N/A
  overhead_bottleneck: "Linux mount-namespace creation is a per-machine lock-serialized bottleneck limiting single-machine container-creation throughput to 1,590 procs/second even though the cluster aggregate reaches much higher."
  primary_tradeoff: "Purpose-built lightweight isolation (sigma-containers + sigma-EPs) -> gains 7.7ms cold starts and 36,650 procs/sec cluster-wide throughput with lower tail latency and higher throughput than Kubernetes on real microservice benchmarks, at the cost of requiring applications to be ported to the sigmaOS API (no out-of-the-box Linux-syscall compatibility) and lacking GPU resource management and rich authorization policy."
  multiplexing_mechanism_note: null
  quantitative_claims:
  - "cold-start: 7.7ms (SigmaOS) vs. 1,290ms (AWS Lambda), 2,671ms (Docker), 1,143ms (Kubernetes); Mitosis (RDMA-dependent) 3.1ms"
  - "warm-start: 2.0ms (SigmaOS) vs. 46ms (Lambda), 469ms (Docker), 217ms (Kubernetes)"
  - "cluster aggregate proc-creation throughput: 36,650 procs/sec across 24 machines, median spawn latency 5.8ms"
  - "sigma-EP networking: 53us per-packet latency and 8.96Gb/s vs. 85us/7.84Gb/s (Docker) and 60us/5.12Gb/s (K8s); connection setup 413us"
  - "Hotel microservice benchmark: 42% lower p99 latency, 1.68x higher peak throughput vs. Kubernetes; Social Network: 47% lower tail latency, 3.01x higher peak throughput"
  - "single-machine container-creation throughput capped at 1,590 procs/sec by mount-namespace lock contention"
  why_useful_for_learning: "A modern, fully-quantified example of building a bespoke lightweight isolation boundary (rather than reusing Docker/Kubernetes namespaces) specifically to unify serverless and microservice execution models."
  priority: P1
  related: [VIRT-SOSP24-07]

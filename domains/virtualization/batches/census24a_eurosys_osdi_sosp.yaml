  classification: CORE
  classification_note: "The paper introduces Intel Flat Memory Mode (hardware-managed CXL tiering) plus Memstrata, a hypervisor-level multi-tenant memory allocator that uses page coloring to eliminate inter-VM local-DRAM contention -- an explicit, VM-granularity memory-virtualization mechanism, which is CORE T2 by definition."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T9]
  physical_resource: DRAM
  logical_abstraction: "A flat guest-physical address space transparently backed by a mix of local DRAM and CXL memory at 64B cache-line granularity, with per-VM page-colored local-DRAM allocation to bound cross-VM interference"
  problem: "Cloud providers want CXL memory to expand capacity/cut cost, but CXL access is ~2x higher latency than local DRAM; software page-granularity tiering has high CPU overhead and lacks virtualization support, while naive hardware tiering lets VMs contend for the same local-memory cache lines, causing up to 480% tail-latency blowups for 'noisy neighbors'."
  mechanism: "Intel Flat Memory Mode maps each 64B physical line to one of two locations (local DRAM or CXL) via a direct-mapped, modulo-based scheme inside the memory controller, promoting/demoting on miss; Memstrata layers page coloring on top so that pages mapping to the same local-memory 'line' are restricted to a single VM (eliminating inter-VM conflicts by construction), and uses a random-forest outlier detector (proxy metric: L3-miss latency of demand loads, r^2=0.87 with local-memory miss ratio) to dynamically migrate extra dedicated local-DRAM pages to VMs at risk of exceeding a 5% slowdown budget."
  isolation_mechanism: "Page coloring at the hypervisor level guarantees a VM can only ever locally-memory-conflict with itself, closing an inter-VM performance side-channel that the paper explicitly identifies (noisy-neighbor local-memory contention causing up to 480% latency degradation without it)."
  multiplexing_mechanism: "Host DRAM+CXL capacity is multiplexed across co-resident VMs at cache-line granularity by hardware, with the software allocator additionally partitioning which local-memory 'colors' (and thus lines) each VM may use, plus a 'mixed mode' that dedicates some local DRAM pages (exposed as a separate NUMA node) outside hardware tiering."
  state_mechanism: "Tiering/placement state lives in the memory controller's cache-line mapping tables (hardware) and in the Memstrata allocator's per-VM color assignment and outlier classifier (software); dynamic reallocation migrates dedicated local pages between VMs at runtime, capped at 10% of a VM's allocation per 10s round."
  overhead_bottleneck: "Cross-VM local-DRAM cache-line conflicts are the dominant source of tail slowdown (larger than LLC-partitioning interference), which is why page coloring rather than pure hardware tiering is needed."
  primary_tradeoff: "Hardware cache-line tiering + software page-coloring isolation -> gains near-DRAM performance for the large majority of workloads (>=82% within 5% of full-DRAM) with <1% per-VM CPU overhead, but costs a fixed 1:1 local:CXL capacity ratio, single-socket/six-VM-scale validation only, and a hardcoded 5% slowdown threshold that needs retraining to change."
  quantitative_claims:

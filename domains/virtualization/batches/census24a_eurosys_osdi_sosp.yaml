  - "verification time: ~6 minutes on a 32-core machine using Verus with the Z3 solver"
  - "performance: context switch 34 cycles, ExtendPCR 37 cycles, SetPagePrivate 82 cycles, LockKernel (8GB) 1.52s; UnixBench overhead near-zero vs. baseline Linux, vs. 40% slowdown for Hecate"

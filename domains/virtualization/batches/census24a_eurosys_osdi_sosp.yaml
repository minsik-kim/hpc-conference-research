batch_observations: >
  This is a from-scratch 2024 census with no seed list, so 'seed_corrections' is
  intentionally empty. Program enumeration completeness differs by venue:
  EuroSys 2024 (71 papers) and SOSP 2024 (43 papers) were enumerated in FULL from two
  independent sources each (the official eurosys.org/sigops.org accepted-papers pages
  and dblp's proceedings listings, which matched exactly on count and title wording
  differences were reconciled), so every title in both venues was individually screened
  against the seed-concept list, not merely keyword-searched. OSDI 2024 was enumerated
  from the official USENIX technical-sessions page across all 9 research sessions
  (42 confirmed titles), but the page's HTML was too large for the fetch tool and was
  repeatedly truncated at the identical point mid-way through the final "Data Management"
  session; dblp's OSDI 2024 page (which would have cross-checked this) returned
  robots.txt/rate-limit errors on every attempt despite dblp's EuroSys/SOSP 2024 pages
  working, so the true OSDI 2024 count is recorded as 43 with a noted +1/+2 uncertainty
  rather than a fully verified figure. Access to full paper text was structurally
  asymmetric across venues: OSDI/USENIX papers are fully open-access PDFs directly from
  usenix.org and every OSDI candidate reached at least ABSTRACT-level evidence; EuroSys
  and SOSP are behind ACM Digital Library, which returned HTTP 403 through this
  environment's egress proxy for every direct access attempt, so EuroSys/SOSP coverage
  depended entirely on finding an author, lab, or institutional-repository mirror of each
  PDF -- this succeeded for about two-thirds of the flagged EuroSys/SOSP candidates
  (Orion, Pronghorn, Desiccant/Frozen-Garbage, RMMAP/Serialization-free, vSoC, VPRI,
  Fast&Safe IO Memory Protection, SigmaOS, Dirigent, KFlex all reached FULL or
  DESIGN_EVAL depth) and failed for the rest (HD-IOV, Hoda, S-NIC, TrEnv, Sesame are
  recorded at TITLE_ONLY/CONTEXT/LOW per hard rule 2, and roughly 18 more borderline
  EuroSys/SOSP titles were left in possible_omissions rather than force weak records).
  General web-search tooling (WebSearch, arxiv.org/export.arxiv.org, dblp.org beyond the
  two proceedings pages, semanticscholar.org, openalex.org, Bing/DuckDuckGo) was blocked
  by robots.txt, rate-limiting (repeated 429s), or an exhausted per-session search budget
  for most of this batch, which is the main reason EuroSys/SOSP coverage required manual
  author/lab-homepage guessing rather than systematic search; this constraint should ease
  in later batches if search budget resets or ACM DL access is separately arranged.
  Threshold calls made, applying the same bar intended for 2025/2026: (1) GPU-sharing
  schedulers over an unmodified GPU (Orion) are SUPPORT, never CORE, because no virtual-
  GPU partition abstraction is created -- consistent with the brief's explicit MIG/MPS
  rule. (2) Checkpoint/restore and memory-reclamation mechanisms for serverless sandboxes
  (Pronghorn, Desiccant, RMMAP) are SUPPORT, not CORE, because they optimize policy over
  an existing checkpoint/isolation engine rather than creating a new one; SigmaOS and
  KFlex, by contrast, were pushed to CORE/SUPPORT respectively because they each define a
  genuinely new isolation boundary (sigma-containers' tenant-scoped connection tokens;
  KFlex's verifier+SFI split), matching the brief's container/kernel-extension isolation-
  architecture CORE criterion. (3) A microkernel (HongMeng) was classified CORE under T5
  even with no VM/hypervisor involved, per the brief's explicit listing of microkernel
  architecture as a CORE isolation-architecture example -- this is the most aggressive
  taxonomy call in the batch and is flagged for auditor attention, since it stretches
  "virtualization" to a pure OS-isolation redesign; the classification_note documents the
  specific evidence (three differentiated isolation classes trading isolation for
  performance) that justified it rather than the title alone. (4) IOMMU/passthrough
  memory-protection and paging mechanisms (Fast & Safe IO Memory Protection, VPRI) and a
  unified shared-virtual-memory device-virtualization design (vSoC) were CORE without
  hesitation as textbook T3 device virtualization. (5) Disaggregated/tiered host memory
  work with no explicit per-tenant/VM isolation claim (Nomad, Atlas/Tale-of-Two-Paths) was
  held to SUPPORT rather than CORE, reserving CORE for the paper that explicitly adds the
  VM-isolation layer on top (Managing Memory Tiers with CXL in Virtualized Environments) --
  this is the same CXL/disaggregation threshold used in the batch1 calibration file. (6)
  Two title-level keyword false positives were DROPped from domain knowledge alone without
  a full read (database ACID "isolation levels"; DNN "nested" data parallelism), which is
  a narrower use of DROP-without-reading than hard rule 2 strictly contemplates (that rule
  is written for failed-access cases) but was judged appropriate for unambiguous standard
  CS-terminology collisions rather than genuine virtualization candidates; all other
  access-failure cases were conservatively recorded as CONTEXT/TITLE_ONLY/LOW rather than
  DROP, per the letter of hard rule 2.

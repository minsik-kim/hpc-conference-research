- id: VIRT-EUROSYS24-03
  title: "Orion: Interference-aware, Fine-grained GPU Sharing for ML Applications"
  title_correction: null
  authors: [Foteini Strati, Xianzhe Ma, Ana Klimovic]
  venue: EuroSys
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3627703.3629578
  official_url: https://2024.eurosys.org/accepted-papers.html
  fullpaper_source: https://anakli.inf.ethz.ch/papers/orion_eurosys24.pdf
  classification: SUPPORT
  classification_note: "Orion is an operator-granularity GPU kernel scheduler layered over an existing, unmodified GPU (CUDA streams + priorities); it improves fine-grained sharing/interference control but does not create a new virtual-GPU partition abstraction, matching the brief's explicit rule that GPU sharing is SUPPORT unless the contribution is the virtual GPU abstraction itself."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T9]
  physical_resource: GPU
  logical_abstraction: "A priority-tiered execution stream per client sharing one physical GPU, where best-effort kernels opportunistically fill idle compute/memory-bandwidth left by a high-priority client's kernels"
  problem: "DNN workloads underutilize GPU compute/memory bandwidth at the level of individual short-lived operators, but coarse-grained sharing techniques (temporal sharing, MPS) cannot exploit these microsecond-scale idle windows without hurting high-priority latency."
  mechanism: "Orion intercepts CUDA kernel launches from multiple co-located DNN clients; a scheduler classifies each kernel offline as compute- or memory-bound and by SM footprint, dispatches high-priority kernels immediately to a priority stream, and admits a best-effort kernel only when no high-priority kernel is running or when the best-effort kernel is small and of opposite resource intensity, throttling by tracked outstanding-kernel duration."
  isolation_mechanism: "Only performance isolation, not security isolation: GPU stream priorities plus size/duration-based admission control bound interference on high-priority p99 latency; the authors explicitly state Orion assumes clients share a trust domain and does not guard against malicious co-tenants, and GPU caches are shared without explicit interference modeling."
  multiplexing_mechanism: "Temporal and resource-profile-aware multiplexing of one physical GPU's SMs/memory bandwidth across kernels from multiple DNN clients, exploiting brief per-operator underutilization windows rather than coarse process- or MPS-level partitioning."
  state_mechanism: N/A
  overhead_bottleneck: "Lack of true hardware preemption on GPUs (kernels cannot be preempted after submission), so isolation relies on heuristic duration/size throttling rather than guaranteed bounds."
  primary_tradeoff: "Fine-grained operator-level collocation -> gains up to 7.3x aggregate throughput and 1.49x cost savings while keeping high-priority p99 latency within ~15% of dedicated execution, but costs no security isolation, no cache-interference modeling, and requires offline hardware-specific kernel profiling that does not generalize across GPU architectures."
  quantitative_claims:
  - "inference-inference collocation: up to 7.3x throughput improvement over dedicated execution, p99 latency within 15% of ideal on average (V100-16GB, Poisson arrivals)"
  - "inference-training collocation: aggregate throughput up to 2.3x vs. high-priority job alone; cost savings 1.26-1.49x (V100)"
  - "training-training collocation: high-priority throughput within 16% of ideal vs. 1.7x degradation for NVIDIA MPS"
  - "multi-client generalization (5 clients, A100): p99 latency within 9% of ideal vs. 21% for REEF-N and 120% for MPS"
  - "profiling/interception overhead: <1% on dedicated execution; Nsight Systems profiling adds ~5% iteration overhead"
  why_useful_for_learning: "Shows the concrete mechanics and limits of software-only fine-grained GPU sharing (kernel-level scheduling, stream priorities, no preemption) that motivate hardware virtual-GPU abstractions like MIG/MPS."
  priority: P1
  related: []
  relations:
  - type: CONTRASTS_WITH
    target: "NVIDIA MIG (hardware GPU partitioning)"
    basis: "Orion achieves sharing purely in software at kernel granularity with no security isolation, the opposite trade-off point from hardware-partitioned MIG instances."
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Read the author-hosted PDF (anakli.inf.ethz.ch), which matches the EuroSys 2024 accepted-papers/dblp title and author list exactly."


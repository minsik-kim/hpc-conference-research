- id: VIRT-EUROSYS24-05
  title: "Pronghorn: Effective Checkpoint Orchestration for Serverless Hot-Starts"
  title_correction: null
  authors: [Sumer Kohli, Shreyas Kharbanda, Rodrigo Bruno, João Carreira, Pedro Fonseca]
  venue: EuroSys
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3627703.3629584
  official_url: https://2024.eurosys.org/accepted-papers.html
  fullpaper_source: https://www.cs.purdue.edu/homes/pfonseca/papers/eurosys24-pronghorn.pdf
  classification: SUPPORT
  classification_note: "Pronghorn is a policy layer that decides when to checkpoint and which of several CRIU snapshots to restore for a serverless function; it reuses an existing checkpoint/restore engine rather than building a new virtualization boundary, matching the brief's SUPPORT category for checkpoint/restore mechanisms that make isolation/startup cheap."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T8]
  physical_resource: DRAM
  logical_abstraction: "A pool of CRIU process snapshots per serverless function, each representing a different degree of JIT warm-up, from which a new worker probabilistically restores the best available state instead of cold- or single-point-starting"
  problem: "JIT-compiled language runtimes (Java, Python, JS) need hundreds to thousands of invocations to reach optimized code, but serverless platforms discard this state on eviction and existing checkpoint-restore schemes snapshot too early (after init or first invocation), wasting most of the achievable warm-up."
  mechanism: "Pronghorn is checkpoint-engine-agnostic (built on CRIU): it samples checkpoint timing from a latency-weighted probability distribution over a request window, maintains a fixed-size pool of snapshots pruned to keep top performers plus a random exploration fraction, and has new workers pick a pool snapshot via softmax weighting on EWMA-tracked per-snapshot latency."
  isolation_mechanism: N/A
  multiplexing_mechanism: N/A
  state_mechanism: "Process-level runtime state (compiled code, JIT profiling metadata, heap) captured via CRIU checkpoint/restore; state moves from a retiring worker's snapshot pool entry to a newly spawned container instance rather than between machines."
  overhead_bottleneck: "Storage overhead during exploration (up to 12x baseline) and ~2x network bandwidth while the snapshot pool is still being explored, plus checkpoint/restore latency itself (60-105ms / 30-80ms)."
  primary_tradeoff: "Automatic, request-driven checkpoint/restore-point selection -> gains 37.2% median latency improvement (up to 58%) over checkpoint-after-first-invocation, but costs exploration storage/bandwidth overhead and requires accurate worker-lifetime estimation to avoid premature or missed-window checkpointing."
  quantitative_claims:
  - "37.2% median latency improvement across 9 of 13 benchmarks vs. state-of-the-art checkpoint-after-1st-invocation (range 20-58%)"
  - "improvement scales with eviction frequency: 37.2% at 1 request/worker, 22.5% at 4, 13.5% at 20"
  - "checkpoint time 60-105ms, restore time 30-80ms, comparable to the state-of-the-art baseline"
  - "outperforms alternatives in 6/9 Azure production-trace scenarios with varying function popularity"
  why_useful_for_learning: "Concretely shows what a serverless snapshot pool's cost/benefit curve looks like (storage/bandwidth vs. cold-start latency), the same trade-off structure that motivates MicroVM-level snapshot work like Sabre."
  priority: P2
  related: [VIRT-OSDI24-01]
  relations:
  - type: SAME_BRANCH
    target: VIRT-OSDI24-01
    basis: "Both optimize serverless cold/hot start via snapshot management (Pronghorn: which/when to checkpoint a CRIU process snapshot; Sabre: how to compress/restore a Firecracker microVM snapshot faster) at different layers of the isolation stack (process checkpoint vs. VM snapshot)."
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Read the author-hosted PDF from Pedro Fonseca's Purdue page; title/authors match the EuroSys 2024 accepted list exactly."

- id: VIRT-EUROSYS24-06
  title: "Characterization and Reclamation of Frozen Garbage in Managed FaaS Workloads"
  title_correction: null
  authors: [Ziming Zhao, Mingyu Wu, Haibo Chen, Binyu Zang]
  venue: EuroSys
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://2024.eurosys.org/accepted-papers.html
  fullpaper_source: https://ipads.sjtu.edu.cn/_media/publications/zhao-eurosys24.pdf
  classification: SUPPORT
  classification_note: "Desiccant reclaims memory inside frozen (paused) FaaS container instances by force-triggering managed-runtime GC and returning pages to the OS; this is a memory-reclamation mechanism that improves serverless instance-caching economics, matching the brief's SUPPORT category (serverless runtime isolation / memory reclamation), not a new virtualization boundary itself."
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T2]
  physical_resource: DRAM
  logical_abstraction: "A frozen (Docker-paused) FaaS container instance whose dead-object memory is proactively reclaimed and returned to the host so more instances can be cached per host"
  problem: "FaaS platforms pause idle instances to save CPU, but managed-runtime GC (HotSpot JVM, V8) never runs during the frozen state, so dead objects ('frozen garbage') accumulate, memory is not returned to the OS, and platforms are forced into more frequent instance eviction and cold boots."
  mechanism: "Desiccant activates only above a dynamic memory-pressure threshold, profiles instances for reclamation throughput (memory freed per CPU-time), selects the highest-throughput candidates, and invokes runtime-specific interfaces to force GC, resize the heap, and mmap-return free pages to the OS, with only 69 LOC changes to HotSpot and 170 LOC to V8."
  isolation_mechanism: N/A
  multiplexing_mechanism: "Reclaimed host memory is returned to a shared pool from which more concurrently-cached (but frozen) FaaS instances can be retained, increasing effective instance density per host."
  state_mechanism: N/A
  overhead_bottleneck: "CPU cost of forced GC/reclamation cycles (measured 6.2% overhead) and post-reclamation execution slowdown (avg. 8.3%) when an instance resumes."
  primary_tradeoff: "Proactive frozen-instance reclamation -> gains up to 6.72x peak memory reduction and up to 4.49x fewer cold boots on production traces, but costs a per-cycle CPU tax and a small resumed-execution slowdown, and only works for runtimes that expose GC/heap-resize hooks."
  quantitative_claims:
  - "peak memory reduction: up to 6.72x per function; average 2.78x (Java) / 1.93x (JavaScript) vs. no reclamation"
  - "Azure production trace replay: cold-boot frequency reduced up to 4.49x, p99 latency improved up to 37.5%, throughput +17.4%"
  - "reclamation CPU overhead: 6.2%; post-reclamation resumed-execution slowdown: avg. 8.3%"
  - "AWS Lambda validation: 2.08x (Java) / 2.76x (JavaScript) memory-reduction improvement"
  why_useful_for_learning: "Illustrates a concrete serverless memory-reclamation mechanism and its CPU/latency cost, directly relevant to explaining why serverless platforms trade instance density against per-invocation overhead."
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Read the author-hosted PDF via SJTU IPADS publication listing; title/authors match the EuroSys 2024 accepted list exactly."

- id: VIRT-EUROSYS24-07
  title: "Serialization/Deserialization-free State Transfer in Serverless Workflows"
  title_correction: null
  authors: [Fangming Lu, Xingda Wei, Zhuobin Huang, Rong Chen, Mingyu Wu, Haibo Chen]
  venue: EuroSys
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://2024.eurosys.org/accepted-papers.html
  fullpaper_source: https://ipads.sjtu.edu.cn/_media/publications/lu-eurosys24.pdf
  classification: SUPPORT
  classification_note: "RMMAP adds new OS primitives (register_mem/rmap) that let one serverless function's memory be RDMA-mapped directly into another's address space across container boundaries, avoiding (de)serialization; this modifies the memory-sharing boundary between isolated serverless containers, which is SUPPORT-level (explains container/serverless isolation trade-offs) rather than a new virtualization abstraction in itself."
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T5]
  physical_resource: DRAM
  logical_abstraction: "A remotely-mapped, copy-on-write virtual memory region that lets a consumer serverless function directly page-fault-read a producer function's object state over RDMA instead of receiving a serialized copy"
  problem: "Serverless workflow steps pass state via message-passing or object storage, both requiring serialization/deserialization that the paper measures at 42-98% (messaging) and 17-97% (storage) of total transfer time; this cost cannot be amortized because most functions run under 20ms."
  mechanism: "RMMAP co-designs RDMA networking, OS kernel (register_mem marks producer memory copy-on-write; rmap maps it into the consumer's address space with RDMA-backed page faulting, ~3.7us/4KB page), pre-planned non-overlapping virtual address ranges per workflow function, extended Python/Java runtimes with coarse-grained remote-object GC, and semantic-aware prefetching that batches an object's pages into one RDMA request."
  isolation_mechanism: "Each function/container keeps its own address space; sharing is opt-in and scoped to the specific registered memory region rather than opening the whole address space, and the platform statically assigns disjoint virtual ranges to avoid producer/consumer address collisions."
  multiplexing_mechanism: N/A
  state_mechanism: "Producer-side state stays resident in the producer's (still-alive, cached) container; the consumer container maps it in and lazily pulls pages over RDMA on fault rather than the platform physically copying/moving the state."
  overhead_bottleneck: "RPC/registration startup cost dominates for very small objects (<1KB payloads are 9.2x slower than messaging); cross-language workflows are unsupported due to incompatible object layouts."
  primary_tradeoff: "Serialization-free RDMA memory mapping across serverless containers -> gains 14-97.8% lower workflow latency and 64.3-86.3% resource-utilization improvement, but costs extra copy-on-write memory pages, no encryption in current RDMA stacks, and no benefit (net overhead) for small/trivial objects."
  quantitative_claims:
  - "workflow execution latency reduced 14-97.8% across tested workflows; 24.6-68% specifically vs. optimized RDMA-KV storage"
  - "microbenchmarks: 54.1-99.2% faster than messaging/storage baselines for various Python data types"
  - "resource utilization under fixed load: 64.3-86.3% pod utilization vs. 100% for competitors"
  - "small payloads (<1KB): 9.2x slower than messaging due to RPC/registration startup cost"
  why_useful_for_learning: "Shows a concrete RDMA-based cross-container shared-memory primitive and where its copy-on-write/page-fault mechanism breaks down, useful background for VM/container memory-sharing and disaggregated-memory CORE papers."
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Internal project name RMMAP; read the author-hosted PDF via SJTU IPADS publication listing, title/authors match the EuroSys 2024 accepted list exactly."

- id: VIRT-EUROSYS24-08
  title: "Just-In-Time Checkpointing: Low Cost Error Recovery from Deep Learning Training Failures"
  title_correction: null
  authors: [Tanmaey Gupta, Sanjeev Krishnan, Rituraj Kumar, "et al."]
  venue: EuroSys
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3627703.3650085
  official_url: https://2024.eurosys.org/accepted-papers.html
  fullpaper_source: UNKNOWN
  classification: CONTEXT
  classification_note: "This is an in-memory, replay-based checkpointing scheme for distributed DNN training-job fault tolerance; it checkpoints application/job state (model weights, minibatch progress), not any virtualization- or container-boundary state, so it lands as CONTEXT (real-world use of checkpoint/restore ideas for a non-virtualization purpose) rather than SUPPORT."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T4]
  physical_resource: GPU
  logical_abstraction: "A DNN training job that can resume from the last minibatch boundary across many GPUs after a hardware/software failure, without a periodic full checkpoint"
  problem: "Multi-week/-month DNN training jobs on many GPUs lose all progress on failure unless periodically checkpointed, but periodic checkpointing has an unclear optimal frequency and non-trivial overhead."
  mechanism: "Replays a single minibatch iteration across all GPUs to reconstruct lost in-memory training state on failure, avoiding both frequent disk checkpoints and large recovery windows."
  isolation_mechanism: N/A
  multiplexing_mechanism: N/A
  state_mechanism: "Training state (model/optimizer state) is reconstructed from the last consistent point via minibatch replay rather than restored from a serialized on-disk checkpoint image."
  overhead_bottleneck: UNKNOWN
  primary_tradeoff: "Replay-based recovery -> reduces recovery cost from minutes to seconds per GPU with near-zero steady-state overhead, at the cost of application-level integration with the training loop rather than being a general-purpose mechanism."
  quantitative_claims:
  - "error-recovery cost reduced from several minutes to a few seconds per GPU (reported in abstract; not independently verified against full paper)"
  why_useful_for_learning: "A contrasting point for VM/container checkpoint-restore mechanisms: shows an application-level, replay-based alternative to full state snapshotting for fast recovery."
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, program-only]

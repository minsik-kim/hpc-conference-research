  classification: CORE
  classification_note: "HongMeng is a production microkernel whose entire contribution is a new isolation-boundary architecture (differentiated isolation classes IC0/IC1/IC2, address-token access control, policy-free kernel paging) trading isolation strength for performance -- the brief explicitly lists microkernel/split-kernel isolation architecture as CORE under T5, independent of whether hardware VMs are involved."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T10]
  physical_resource: CPU core
  logical_abstraction: "OS services (drivers, filesystem, memory manager) as isolated-by-default components whose isolation strength (IC0 shared-kernel-space / IC1 mechanism-enforced kernel-space / IC2 full userspace) is chosen per-deployment rather than fixed, while still exposing a Linux-compatible API/ABI"
  problem: "Classical microkernels are secure but too slow and Linux-incompatible for general-purpose devices (phones, vehicles, routers): rewriting 700+ Linux drivers would cost >5,000 person-years, IPC frequency is up to 70x higher on phones than routers, and capability-based access control adds hundreds of cycles per kernel-object access."
  mechanism: "HongMeng offers three differentiated isolation classes so services can be placed at the isolation/performance point a deployment needs (IC0 verified core services share kernel space with function-call-speed IPC; IC1 uses hardware watchpoints/PKS and CFI for ~50% faster IPC than userspace; IC2 is ordinary userspace isolation for untrusted code like Linux drivers), supports flexible composition (co-locating or separating services, e.g. filesystem+memory-manager, to eliminate double page-cache bookkeeping), replaces capability-slot indirection with address-token-based access control (kernel objects mapped as pages directly into service address spaces, ~6 cycles vs. 526+ for capabilities), and does policy-free kernel paging (kernel handles page faults synchronously within memory-manager-communicated valid ranges, no IPC round-trip)."
  isolation_mechanism: "Three-tier isolation classes (IC0/IC1/IC2) let the same OS trade off isolation strength against performance per service; IC1 specifically substitutes hardware-assisted intra-kernel-space isolation (ARM watchpoints / Intel PKS + CFI) for full address-space isolation."
  multiplexing_mechanism: N/A (OS-service isolation architecture, not resource multiplexing across tenants)
  state_mechanism: "Kernel object state is exposed to services as directly-mapped pages (address tokens) rather than hidden behind capability handles, letting services read/write shared state without repeated privilege transitions; a Linux driver container (LDC) reuses drivers without VM-style nested translation."
  overhead_bottleneck: "IPC frequency and capability-indirection cost are the dominant traditional microkernel overheads that HongMeng's IC1/address-token mechanisms target directly."
  primary_tradeoff: "Differentiated isolation + address-token access control -> gains 17% faster app startup, 32% faster context switches, and 72-75% lower anonymous-page-fault latency than Linux, but costs 2.5-4.8x slower fork() in microbenchmarks, no capability-chain revocation, and only semi-formal verification of critical components."
  quantitative_claims:
  - "app startup time: 17% faster than Linux (geometric mean, smartphone)"
  - "context switching: 32% faster than Linux"
  - "anonymous page-fault latency: 72-75% reduction vs. userspace paging (Raspberry Pi 4b)"
  - "vehicle boot time: 60% reduction (1.5s to 0.6s); cross-domain IPC latency: 60% reduction (250us to 100us)"
  - "router memory footprint: 30% reduction, 30% more concurrent client connections"
  - "fork()/clone() microbenchmarks: 2.5-4.8x slower than Linux due to inter-service IPC"
  why_useful_for_learning: "A production-scale counterpoint to hypervisor-based virtualization: shows how far pure OS-level isolation-architecture redesign (rather than hardware VM boundaries) can go, and exactly what it gives up (capability revocation, full formal verification, fork performance) to get there."

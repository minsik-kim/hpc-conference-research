batch_observations: "VENUE STATUS: ASPLOS 2026 (Pittsburgh, March 22-26 2026) and HPCA 2026 (Sydney, Jan 31-Feb\
  \ 4 2026)\nwere both CONFIRMED HELD before the 2026-09-18 cutoff (both several months in the past), so both are\n\
  correctly in scope and produced records; no venue was excluded for not-yet-having-occurred.\n\nDATA-QUALITY CATCH:\
  \ while verifying individual ASPLOS 2026 papers by DOI, two titles that appeared in a\nraw scrape of the official\
  \ asplos-conference.org program page (\"HybridTier...\" and \"Wave: Offloading\nResource Management to SmartNIC\
  \ Cores\") turned out to carry ACM proceedings DOI prefix 10.1145/3676642.*,\nwhich is the 30th ACM ASPLOS conference\
  \ (ASPLOS 2025 Volume 3), not ASPLOS 2026. They were treated as\nout-of-scope venue/year and given NO records\
  \ in this batch (not even DROP records), rather than being\nmisfiled as ASPLOS26 papers. This looks like a page-template/caching\
  \ artifact on the conference site\nrather than an actual re-submission, but it is worth the orchestrator knowing\
  \ this batch explicitly\nscreened for and excluded it. ASPLOS 2026's own accepted-paper population is itself split\
  \ across at\nleast two ACM proceedings volumes (DOI prefixes 3760250 and 3779212), consistent with ASPLOS's\n\
  multi-cycle (Summer/Fall/Winter-style) submission model feeding one conference; the exact combined\nmain-track\
  \ count could not be pinned to a single verified number (see venue_populations).\n\nTHIN-SEED-LIST SCANNING: HPCA\
  \ 2025 (3 seeds) and MICRO 2025 (3 seeds) were rescanned against their full\nofficial programs (121 and 123 titles\
  \ respectively, both obtained as complete verbatim title lists from\nofficial/DBLP sources). This surfaced 4 genuinely\
  \ new virtualization-adjacent candidates now in\npossible_omissions (Predicting DRAM-Caused Risky VMs, DSAssassin,\
  \ Fault Escaping, SCALE) plus roughly a\ndozen weaker CONTEXT/DROP candidates now recorded individually (Concord,\
  \ DPUaudit, RpcNIC, Grad, Palermo,\nSkyByte, Citadel, Efficient Security Support for CXL Memory, GateBleed, Multi-Dimensional\
  \ ML-Pipeline\nOptimization, plus the pure-virtual-memory screen below). No additional CORE papers beyond the\
  \ seeds were\nfound for HPCA25/MICRO25 at the depth this session could reach, but 4 access-failed candidates (see\n\
  access_failures) remain unresolved and could plausibly be CORE/SUPPORT (DSAssassin and SCALE especially,\ngiven\
  \ their explicit VM/confidential-computing titles).\n\nPURE-VIRTUAL-MEMORY SCREENING (explicit task instruction):\
  \ six architecture-venue GPU/CPU virtual-memory\npapers were identified via the keyword scan and explicitly screened\
  \ per the brief's rule (\"DROP unless\nnested translation, guest-physical address space, or hypervisor-mediated\
  \ memory\"): Marching Page Walks\n(HPCA25, GPU page-table-walk batching), OASIS (HPCA25, single-app multi-GPU\
  \ UVM page placement,\nfull text read), Let-Me-In (HPCA25, GPU pointer bounds-metadata memory *safety*, not memory\n\
  management - keyword false positive), SoftWalker (MICRO25, GPU software page-table walking), LATPC\n(MICRO25,\
  \ GPU TLB prefetching), Learning to Walk (MICRO25, learned CPU/OS page table), and ARIADNE\n(HPCA26, single-app\
  \ GPU UVM oversubscription). All seven were confirmed via at least an abstract read\nto involve no guest OS, VM,\
  \ or hypervisor-mediated translation and were classified DROP\n(drop_reason=pure_virtual_memory, except Let-Me-In\
  \ which is keyword_false_positive since it is a memory\n*safety* mechanism, not memory management at all).\n\n\
  CXL/EDA SCREENING: ASPLOS 2026's CXL-memory cluster of papers was screened against the brief's\ndisaggregation\
  \ rule (\"CORE only if a virtual resource abstraction is built over the disaggregated pool,\notherwise SUPPORT\"\
  ). PIPM, Cxlalloc, and \"A Programming Model for Disaggregated Memory over CXL\" all\nexplicitly do NOT build\
  \ a guest/virtual-memory abstraction over the CXL pool (they are, respectively, a\npage-migration optimization,\
  \ an allocator-correctness mechanism, and a formal programming model/\nconsistency-semantics contribution for\
  \ programmers reasoning about the pool directly) and were classified\nSUPPORT. Two further CXL-adjacent titles\
  \ (vCXLGen, CXLMC) turned out on inspection to be EDA/formal-\nverification tooling for CXL hardware/programs\
  \ rather than virtualization contributions and were DROPped\n(no_virtualization_relation). Two networking/storage\
  \ titles caught by the I/O keyword screen (Toasty,\nHitchhike) were confirmed via their abstracts to be bare-metal,\
  \ non-virtualized optimizations (NIC cache\nmanagement and kernel I/O-request merging respectively) and DROPped\
  \ (keyword_false_positive).\n\nTHRESHOLD CALLS (explicit task list):\n- NVMePass (HPCA25): read via the same authors'\
  \ arXiv:2304.05148 \"LightIOV\" preprint (IEEE Xplore and the\n  official HKUST lab page could not supply the\
  \ camera-ready text); confirmed CORE, T3 device\n  virtualization (control/data-plane split, I/O-queue passthrough,\
  \ LBA+GPA isolation). Flagged MEDIUM\n  confidence because the preprint's exact identity with the published HPCA25\
  \ paper is inferred from\n  matching authorship/mechanism/venue, not confirmed byte-for-byte.\n- SpecMPK (HPCA25):\
  \ read in full. It is INTRA-PROCESS isolation (MPK/WRPKRU permission-domain switching\n  within one address space)\
  \ with no VM/container/hypervisor involvement at all - classified SUPPORT\n  (T5 secondary T7) rather than CORE,\
  \ on the grounds that it is the hardware primitive lightweight\n  in-process sandboxes build on, not a machine/resource-virtualization\
  \ mechanism itself.\n- ccAI (MICRO25): read in full. Its confidential trust boundary EXTENDS PAST THE CPU, across\
  \ the PCIe\n  bus, into GPU/NPU/FPGA accelerators via a hardware PCIe Security Controller - this is the\n  cross-accelerator\
  \ case the task asked to check for, and is recorded explicitly in the record's\n  classification_note/notes for\
  \ future trend analysis. Classified CORE, T7.\n- \"Re-architecting End-host Networking with CXL\" (MICRO25): read\
  \ in full. Applying the disaggregation\n  rule, it exposes NIC memory as coherent NUMA-addressable host memory\
  \ (a disaggregation/coherence\n  redesign) and introduces no VM/vNIC/guest abstraction, so it is SUPPORT, not\
  \ CORE.\n- SG-IOV (ASPLOS26): read via a detailed third-party summary (ACM DL PDF not fetched). Confirmed CORE,\n\
  \  T3 - a genuine new I/O-virtualization granularity (per-socket instead of per-PCIe-function), directly\n  attacking\
  \ SR-IOV's scalability ceiling.\n- gShare (ASPLOS26) vs uShare (HPCA26): the GPU-sharing CORE-vs-SUPPORT rule\
  \ was applied to each\n  separately as instructed. gShare's own PDF confirms its mechanism IS a VM-passthrough\
  \ vGPU\n  virtualization layer (vfio-mdev interception, hot-pluggable vGPU slices with checkpoint/restore) that\n\
  \  a scheduler sits on top of - classified CORE. uShare's abstract could not be obtained after 5 distinct\n  access\
  \ routes (see access_failures), so per the schema's hard rule for title-only evidence it is\n  recorded as CONTEXT/TITLE_ONLY/LOW\
  \ rather than guessed at; its title (\"non-intrusive kernel\n  co-locating\") suggests it may in fact land on\
  \ the SUPPORT side of the same rule (a co-location\n  mechanism/policy rather than a new virtual-GPU partition\
  \ abstraction), but this could not be confirmed,\n  so no such determination was forced onto the record.\n- eGPU\
  \ (HPCA26): kept as INDUSTRY_TRACK per the task's explicit instruction, classified CORE (fine-grained\n  runtime-adjustable\
  \ GPU sharing with fault isolation at 10,000+ GPU production scale), and excluded from\n  the regular-research\
  \ CORE/SUPPORT/CONTEXT/DROP tallies below."

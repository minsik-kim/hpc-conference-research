- id: VIRT-ASPLOS26-13
  title: Enabling Fast Networking in the Public Cloud
  title_correction: null
  authors:
  - Alireza Sanaee
  - Vahab Jabrayilov
  - Ilias Marinos
  - Farbod Shahinfar
  - Divyanshu Saxena
  - Gianni Antichi
  - Kostis Kaffes
  venue: ASPLOS
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3779212.3790158
  official_url: https://dl.acm.org/doi/10.1145/3779212.3790158
  fullpaper_source: https://www.cs.columbia.edu/~kkaffes/papers/enabling-fast-networking-public-cloud-asplos26.pdf
  classification: CONTEXT
  classification_note: Machnet is a userspace network stack that deliberately works within the constraints of whatever
    minimal vNIC a cloud VM exposes, using a microkernel-sidecar/DPDK design rather than modifying or extending
    the underlying virtio/SR-IOV virtualization mechanism itself - it is an application-level system that USES virtualized
    cloud networking, not a device-virtualization contribution.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T3
  physical_resource: NIC
  logical_abstraction: A cross-cloud-portable, kernel-bypass socket-like API for VM applications that assumes only
    a 'least common denominator' vNIC (plain Ethernet I/O, opaque RSS, one TX/RX queue per core)
  problem: High-performance kernel-bypass network stacks assume hardware features (flow steering, deep buffers,
    reconfigurable RSS) that public-cloud vNICs do not expose, and library-OS-style stacks cannot support the multi-process/multi-threaded
    deployments common in cloud applications.
  mechanism: A microkernel sidecar process handles kernel-bypass I/O via DPDK behind a socket-like shim library
    that applications link against, communicating over shared memory; a Least-Common-Denominator NIC model defines
    the minimal cross-cloud vNIC feature set the design relies on, and a randomized-port-selection technique ('RSS--')
    maps flows to specific cores despite opaque, unconfigurable RSS hashing on cloud vNICs.
  isolation_mechanism: N/A (works entirely within the VM's own already-virtualized vNIC; does not alter or bypass
    the hypervisor's network isolation boundary)
  multiplexing_mechanism: One TX/RX queue per CPU core is time-shared among the sidecar's connections using the
    RSS-- flow-to-core mapping technique, operating within (not replacing) the cloud provider's existing vNIC virtualization.
  state_mechanism: Connection/flow state lives in the sidecar process and shared memory between it and the shim
    library; no cross-host migration is discussed.
  overhead_bottleneck: Extra hop through the sidecar process relative to a bare-metal kernel-bypass stack, and inability
    to use hardware flow steering since cloud vNICs do not expose it.
  primary_tradeoff: Software workaround for a minimal vNIC feature set instead of requiring specialized virtualized-NIC
    hardware support -> gains 2.3-9x lower latency and up to 3.3x higher throughput than the Linux TCP/IP stack
    across three major clouds with multi-process/multi-language support, but costs staying ~10% behind a specialized
    bare-metal stack (eRPC) and being unable to exploit any hardware feature a given cloud's vNIC happens to expose
    beyond the least-common-denominator set.
  quantitative_claims:
  - '64B echo latency on Azure: 27us median (Machnet) vs 70us (Linux TCP)'
  - 'Raft median/p99 latency: 185us/625us (Machnet) vs 282us/1000us (Linux) - 37% p99 improvement'
  - 'HTTP server throughput on Azure: 68,000 RPS (Machnet) vs 40,000 RPS (Linux)'
  - 'FASTER KV-store throughput: 700K RPS (Machnet) vs 210K RPS (Linux), 3.3x higher'
  - 'FASTER p99 latency: 50us (Machnet) vs 250us (Linux), 80% reduction'
  - 'connection setup overhead (8x8 engines): <1ms median'
  - 'throughput scaling: 4.12 Mpps (64B) / 49.9 Gbps (8KB) across 5 cores'
  - latency within ~10% of eRPC (a specialized bare-metal stack) while supporting multi-process/multi-language deployment
  why_useful_for_learning: 'A clear, well-measured illustration of the brief''s CONTEXT category: it shows precisely
    which virtualized-NIC constraints (opaque RSS, no flow steering, single queue/core) a cloud tenant must design
    around, which is exactly the information needed to judge why a CORE virtual-NIC/SR-IOV paper''s design choices

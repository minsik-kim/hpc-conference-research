- id: VIRT-ASPLOS26-02
  title: 'gShare: Efficient GPU Sharing with Aggressive Scheduling in Multi-tenant FaaS platform'
  title_correction: null
  authors:
  - Yanan Yang
  - Zhengxiong Jiang
  - Meiqi Zhu
  - Hongqiang Xu
  - Yujun Wang
  - Liang Li
  - Jiansong Zhang
  - Jie Wu
  venue: ASPLOS
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3779212.3790168
  official_url: https://dl.acm.org/doi/abs/10.1145/3779212.3790168
  fullpaper_source: https://cis.temple.edu/~jiewu/research/publications/Publication_files/3779212.3790168.pdf
  classification: CORE
  classification_note: 'Applying the GPU-sharing CORE-vs-SUPPORT rule: gShare''s contribution is a VM-passthrough
    vGPU virtualization layer (kernel-space vfio-mdev interception, hot-pluggable vGPU instances with checkpoint/restore)
    that a scheduler sits on top of, not merely a scheduler over someone else''s existing vGPU primitive - the virtual-GPU
    abstraction itself is the paper''s mechanism, so this is CORE, unlike a pure scheduling paper.'
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T1
  - T8
  physical_resource: GPU
  logical_abstraction: Variable-sized vGPU slices (128MB-40GB) that can be hot-plugged into and reallocated across
    VM-based serverless functions with sub-millisecond attach latency
  problem: Multi-tenant FaaS platforms that back functions with VMs need fine-grained, fast-changing GPU allocation
    to keep utilization high and SLOs met, but PCIe-style GPU (re)attachment is slow (~700ms) and existing serverless
    GPU-sharing schemes do not virtualize the GPU itself for VM-based isolation.
  mechanism: 'Three components: (1) VM-passthrough GPU virtualization via kernel-space vfio-mdev API interception
    giving zero-copy direct I/O to GPU slices; (2) a vGPU Manager that hot-plugs vGPU instances (a pseudo-offloading
    strategy cuts PCIe-insertion-equivalent time from ~700ms to <1ms) and checkpoints/restores/swaps models using
    a GPU-memory-overwrite technique with snapshot caching that avoids explicit swap-out; (3) an SLO-aware Dual-Queue
    Lazy Scheduling (DQLS) algorithm that splits requests into cache/share queues and prioritizes by deadline slack,
    run as a minimum-heap.'
  isolation_mechanism: Each tenant's function runs against its own vGPU slice attached via vfio-mdev passthrough,
    so isolation is at the same VM/device-passthrough boundary as other vfio-mediated-device virtualization, rather
    than a purely software co-location scheme.
  multiplexing_mechanism: Physical A100 GPUs (40GB each) are partitioned into variable-sized vGPU slices (128MB-40GB)
    drawn from 9 slice pools across 20 servers/64 GPUs, dynamically remapped across tenants as functions start/stop.
  state_mechanism: vGPU state (model weights, execution context) lives in GPU memory and is checkpointed/restored
    via a GPU-memory-overwrite technique with snapshot caching, avoiding the swap-out path used by prior serverless
    GPU caches; hot-plugging attaches/detaches the vfio-mdev device with <1ms overhead versus ~700ms for a full
    PCIe-style insertion.
  overhead_bottleneck: vGPU attach/detach latency in the naive PCIe-insertion path (~700ms), which the pseudo-offloading
    hot-plug technique removes as the bottleneck.
  primary_tradeoff: VM-passthrough vGPU virtualization plus aggressive hot-plugging -> gains near-native GPU performance
    (<1% loss) with sub-millisecond reallocation and 43-63% lower GPU usage at >95% SLO compliance, but costs the
    complexity of a custom vfio-mdev-based virtualization layer and checkpoint/restore machinery versus a simpler
    process-level GPU-sharing scheme.
  quantitative_claims:
  - 'GPU usage reduction vs Keep-alive baseline: 43-63% (20 servers, 64 NVIDIA A100 40GB GPUs, production traces)'
  - 'latency SLO compliance: >95%'
  - 'cost savings vs FaaSwap: 24-58%'
  - 'vGPU hot-plug latency: <1ms vs ~700ms PCIe-style insertion baseline'
  - 'scheduling near-optimality: DQLS reaches ~75% of the MINLP optimum at 10-100x faster solving time'
  - 'virtualization overhead: <1% loss vs native (unvirtualized) GPU execution'
  - 'estimated annual cluster cost savings: ~$330k-400k'
  why_useful_for_learning: 'A concrete, currently-published example of what ''CORE, not just scheduling'' GPU sharing
    looks like: the vfio-mdev passthrough plus checkpoint/restore vGPU layer is the mechanism a later scheduler
    (its own DQLS, or any other) is built on top of.'
  priority: P1

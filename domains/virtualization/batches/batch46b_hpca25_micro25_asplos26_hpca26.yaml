- id: VIRT-ASPLOS26-01
  title: 'SG-IOV: Socket-Granular I/O Virtualization for SmartNIC-Based Container Networks'
  title_correction: null
  authors:
  - Chenxingyu Zhao
  - Hongtao Zhang
  - Jaehong Min
  - Shengkai Lin
  - Wei Zhang
  - Kaiyuan Zhang
  - Ming Liu
  - Arvind Krishnamurthy
  venue: ASPLOS
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3779212.3790218
  official_url: https://dl.acm.org/doi/10.1145/3779212.3790218
  fullpaper_source: https://danglingpointers.substack.com/p/sg-iov-socket-granular-io-virtualization
  classification: CORE
  classification_note: SG-IOV is a new I/O-virtualization architecture (socket-granular rather than device/VF-granular)
    that directly attacks SR-IOV's scalability ceiling for containers, which is squarely T3 device virtualization
    as the paper's main contribution.
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T5
  physical_resource: NIC
  logical_abstraction: Thousands of independently virtualized TCP sockets per physical NIC, each with hardware-accelerated
    data movement, instead of the ~100s of SR-IOV virtual functions a NIC can expose
  problem: SR-IOV virtualizes NICs at PCIe-function granularity and 'tops out on the order of 100s of virtual functions
    per physical NIC,' far below the thousands of containers/sockets a dense host needs to virtualize network I/O
    for.
  mechanism: 'Moves the virtualization unit from the PCIe function down to the socket: per-socket ring buffers (''Warp
    Pipes'') hold socket data in host or NIC memory, and ''Cross-FIFOs'' carry small pointer-update messages (ring-buffer
    ID, head/tail, new value) between host CPUs and the NIC''s onboard ARM cores (implemented on an NVIDIA BlueField-3
    SmartNIC), with PCIe used for host->NIC and RDMA for NIC->NIC delivery. The design targets stream-based (TCP)
    sockets and keeps low-level NIC hardware resources stateless/multiplexed across many sockets rather than dedicating
    hardware state per socket.'
  isolation_mechanism: Each socket's Warp Pipe is an independent ring buffer, and cross-FIFO messages are scoped
    per ring-buffer ID, so one tenant/container's socket state cannot be addressed by another's; hardware NIC resources
    stay stateless so no per-VF hardware quota limits how many sockets can be virtualized.
  multiplexing_mechanism: A single physical NIC's stateless hardware resources are time-multiplexed across many
    thousands of per-socket Warp Pipes, coordinated via coarse-grained Cross-FIFO messages rather than one hardware
    queue/VF per tenant.
  state_mechanism: Per-socket state (data + head/tail pointers) lives in the Warp Pipe ring buffer, placed in host
    or NIC memory; Cross-FIFOs propagate only pointer deltas, not data, between host and NIC-resident state.
  overhead_bottleneck: Cross-FIFO message rate for pointer synchronization between host and NIC cores as socket
    count grows.
  primary_tradeoff: Socket-granular virtualization instead of PCIe-function-granular SR-IOV -> gains three-orders-of-magnitude
    higher virtualized-endpoint density on the same NIC hardware while still hardware-accelerating the data path,
    but costs assuming stream-based (TCP) semantics and a SmartNIC with programmable onboard cores (BlueField-3)
    rather than a plain SR-IOV NIC.
  quantitative_claims:
  - latency/bandwidth benchmarks reported in Section 8 (Figures 17-18) showing hardware-accelerated virtualization
    while saving host CPU cycles versus alternative container networking systems (exact figures not extracted from
    the secondary summary read)
  why_useful_for_learning: A direct, contemporary answer to SR-IOV's scalability ceiling for container-dense hosts,
    showing how choosing a finer virtualization granularity (socket vs PCIe function) trades hardware-state simplicity
    for far higher density.
  priority: P1
  related:
  - FastIOV (EuroSys 2025)
  relations:
  - type: ALTERNATIVE
    target: SR-IOV
    basis: Paper explicitly frames its contribution as overcoming SR-IOV's per-NIC virtual-function scalability
      ceiling.
  - type: SAME_BRANCH
    target: 'FastIOV: Fast Startup of Passthrough Network I/O Virtualization for Secure Containers (EuroSys 2025)'
    basis: Both target container-scale network I/O virtualization performance/scalability problems left by SR-IOV/passthrough
      designs.

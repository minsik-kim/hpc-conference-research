- id: VIRT-ASPLOS26-04
  title: 'WorksetEnclave: Towards Optimizing Cold Starts in Confidential Serverless with Workset-Based Enclave Restore'
  title_correction: null
  authors:
  - Xiaolong Yan
  - Qihang Zhou
  - Zisen Wan
  - Feifan Qian
  - Wentao Yao
  - Weijuan Zhang
  - Xiaoqi Jia
  venue: ASPLOS
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3779212.3790249
  official_url: https://dl.acm.org/doi/10.1145/3779212.3790249
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3779212.3790249
  classification: CORE
  classification_note: 'Applying the brief''s serverless threshold rule: the contribution is exactly the mechanism
    that makes confidential (SGX-enclave) isolation cheap for serverless cold starts - a workset-tracking snapshot/restore
    technique for Enclave Page Cache state - which the brief calls out as CORE/SUPPORT-worthy in its own right,
    and here it is squarely about the TEE''s own restore mechanism (T7), not an application that merely runs inside
    an enclave.'
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T8
  physical_resource: CPU core
  logical_abstraction: A restorable SGX enclave snapshot that only carries the working set of Enclave Page Cache
    (EPC) pages an enclave actually touched, rather than its full EPC footprint
  problem: Serverless platforms need Intel SGX-class TEEs for security, but SGX enclave startup latency and Enclave
    Page Cache (EPC) consumption are especially punishing on cold starts, undermining the fast-scaling premise of
    serverless.
  mechanism: Tracks which EPC pages an enclave's workset actually touches during execution and builds a snapshot
    restricted to that workset, so a cold-start restore only has to re-establish the pages that matter rather than
    the enclave's full memory footprint; implemented on both the Gramine and Occlum LibOS platforms to show portability
    across SGX LibOS stacks.
  isolation_mechanism: Isolation is the underlying SGX enclave boundary itself (unchanged); the paper's contribution
    is making that boundary's cold-start cost tractable, not altering what is isolated from what.
  multiplexing_mechanism: N/A (single-enclave lifecycle optimization, not resource sharing across tenants)
  state_mechanism: EPC working-set pages are snapshotted and restored across the enclave's stop/start lifecycle,
    replacing a full-EPC snapshot/restore with a workset-scoped one.
  overhead_bottleneck: EPC paging cost (both time to populate EPC pages and the EPC memory consumed) during cold
    start, which dominates when the full enclave footprint is restored unconditionally.
  primary_tradeoff: Workset-scoped enclave snapshot/restore -> gains large cold-start latency and EPC memory reductions,
    but costs the bookkeeping needed to track per-execution working sets accurately enough that a restored enclave
    still behaves correctly.
  quantitative_claims:
  - 'startup time improvement: 1.9-54x (Gramine and Occlum LibOS platforms, per abstract)'
  - 'memory consumption reduction: 13.37-94.87% (per abstract)'
  why_useful_for_learning: 'A direct, contemporary instance of the brief''s serverless-isolation threshold case:
    it is the snapshot/restore mechanism itself (not an application built on top of confidential serverless) that
    determines whether confidential computing is compatible with serverless''s cold-start economics.'
  priority: P1
  related: []
  relations:
  - type: SAME_BRANCH
    target: Non-confidential serverless snapshot/restore systems (e.g. Catalyzer, REAP-style checkpoint/restore)
    basis: Solves the analogous cold-start problem but specifically for SGX EPC state rather than ordinary process/VM
      memory, the confidential-computing instance of the same design problem.

papers:
- id: VIRT-HPCA25-01
  title: 'NVMePass: A Lightweight, High-performance and Scalable NVMe Virtualization Architecture with I/O Queues
    Passthrough'
  title_correction: null
  authors:
  - Yiquan Chen
  - Zhen Jin
  - Yijing Wang
  - et al.
  venue: HPCA
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://ieeexplore.ieee.org/document/10946776/
  fullpaper_source: https://arxiv.org/abs/2304.05148
  classification: CORE
  classification_note: 'The contribution is the NVMe I/O-queue-passthrough virtualization mechanism itself: guest
    VMs get direct access to physical NVMe submission/completion queues while control-plane resources stay trap-and-emulated,
    which is a device-virtualization architecture, not merely a paper that uses virtualization.'
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T1
  physical_resource: NVMe
  logical_abstraction: A per-VM virtual NVMe controller whose I/O queues are physically passed through, so guests
    get near-native IOPS/latency without SR-IOV/SIOV hardware support
  problem: Software NVMe virtualization (virtio, SPDK vhost-NVMe, Mdev-NVMe) either degrades performance or burns
    dedicated host CPU cores for polling, while hardware-assisted passthrough (SR-IOV/SIOV/FVM) needs special, mostly
    unavailable, SSD controller support; neither scales to thousands of VMs per server cheaply.
  mechanism: NVMe resources are split into control resources (PCIe config space, BAR, admin queue - trap-and-emulated
    by a lightweight hypervisor device model) and data resources (I/O submission/completion queues, doorbells, interrupts,
    LBA ranges - passed through directly). A backend driver in the host kernel creates per-VM I/O queue pairs from
    the device's pool (NVMe allows up to 65,535 I/O queue pairs per Admin Queue) and maps their queue buffers into
    guest-physical memory via the Controller Memory Buffer; a frontend driver in the guest kernel presents a standard
    NVMe device to the guest OS. Guest queue GPA is resolved to HPA lazily through a single EPT page fault per queue,
    after which the guest issues I/O directly to hardware with no per-I/O VM exit; IOMMU DMA remapping and interrupt
    posting keep DMA and completion interrupts VM-exit-free too.
  isolation_mechanism: 'Two independent checks: (1) LBA isolation - the backend allocates each VM a non-overlapping
    logical block address range and the frontend adds a per-VM lba_start offset and range-checks every request;
    (2) GPA isolation - the frontend validates that PRP addresses in submitted NVMe commands fall inside that VM''s
    assigned guest-physical range, and the hypervisor assigns non-overlapping GPA windows per VM at boot so IOMMU
    translation cannot let one VM''s DMA touch another''s memory.'
  multiplexing_mechanism: A single physical NVMe controller's large per-device pool of I/O queue pairs (spec allows
    65,535) is partitioned across VMs, each VM getting its own exclusive queue pair(s) and LBA range while sharing
    the underlying device/controller resources.
  state_mechanism: Per-VM virtualization state is the queue-pair assignment, LBA offset/range and GPA window, held
    in the host backend driver and the hypervisor's lightweight device model; the data path itself (queue contents)
    lives in guest-mapped Controller Memory Buffer, not host software, so nothing needs host-side buffering during
    steady-state I/O.
  overhead_bottleneck: The one-time EPT page fault per queue at first touch; after that the dominant cost approaches
    native device latency because there is no per-I/O trap, polling core, or software copy.
  primary_tradeoff: Software-only I/O-queue passthrough instead of vendor SR-IOV/SIOV hardware -> gains near-VFIO
    performance and NVMe-spec-limited scalability (tens of thousands of VMs) on commodity NVMe SSDs, but costs some
    control-plane flexibility (queue depth/count is still bounded by the physical device's queue-pair pool) and
    needs a custom guest frontend driver.
  quantitative_claims:
  - 'single-VM IOPS: 97.6-100.2% of VFIO passthrough (4KB random read/write, fio, 4 jobs/QD128, Intel Xeon Platinum
    8163, Intel P4510 NVMe SSD)'
  - 'single-VM latency: within 1% of VFIO average latency across fio workloads'
  - '200-VM density latency: 31.4% lower than SPDK vhost-NVMe and 45.1% lower than virtio (2 SSDs, 200 VMs)'
  - '200-VM density IOPS: 45.7% higher than SPDK vhost-NVMe, 75.6% higher than virtio'
  - 'RocksDB readrandom (single VM, 128 threads): 6.8% lower latency than VFIO, 21.3% lower than SPDK-vhost, 27.1%
    higher OPS than SPDK-vhost'
  - 'RocksDB readrandom (100 VMs, 1 thread each): 32.5% lower latency than SPDK-vhost, 29.3% lower than virtio'
  - 'implementation size: 6,600 lines of code (300 guest kernel, 4,200 host kernel, 2,100 Firecracker) on Firecracker
    0.14.0 / Linux 4.19'
  why_useful_for_learning: 'It is a clean worked example of the control/data-plane split that makes device passthrough
    scale without new hardware: trap-and-emulate only what configures the device, pass through everything on the
    per-I/O hot path.'
  priority: P1
  related: []
  relations:
  - type: ALTERNATIVE
    target: SR-IOV / SIOV / FVM hardware-assisted NVMe virtualization
    basis: Paper explicitly contrasts its software-only passthrough against these hardware-dependent alternatives
      on flexibility and availability grounds.
  - type: ALTERNATIVE
    target: SPDK vhost-NVMe / virtio-blk
    basis: Directly implemented and measured as baselines representing the software-mediated end of the NVMe virtualization
      spectrum.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: MEDIUM
  notes: 'IEEE Xplore (document 10946776) would not render abstract/PDF text through this environment, and no author-hosted
    copy under the exact title ''NVMePass'' was found after 3 routes (IEEE Xplore, ResearchGate, HKUST FACT Lab
    publication page which confirms lead author Yiquan Chen and the HPCA 2025 venue but has no PDF/abstract). Read
    instead the same authors'' group arXiv:2304.05148 ''LightIOV: High-performance and Scalable Software-based NVMe
    Virtualization Mechanism with I/O Queues Passthrough'' (Yiquan Chen et al., Zhejiang University/Alibaba), which
    describes the identical core mechanism (NVMe I/O queue passthrough, control/data split, LBA+GPA isolation, Firecracker
    implementation, VFIO/SPDK-vhost/virtio baselines) and is almost certainly the tech-report precursor of the published
    NVMePass paper under a different working name; treat the design/mechanism/numbers above as evidence about that
    lineage rather than a confirmed identical camera-ready text.'
- id: VIRT-HPCA25-02
  title: 'SpecMPK: Efficient In-Process Isolation with Speculative and Secure Permission Update Instruction'
  title_correction: null
  authors:
  - Debpratim Adak
  - Huiyang Zhou
  - Eric Rotenberg
  - Amro Awad
  venue: HPCA
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://hpca-conf.org/2025/main-program/
  fullpaper_source: https://ericrotenberg.wordpress.ncsu.edu/files/2025/06/paper_HPCA-31_SpecMPK.pdf
  classification: SUPPORT
  classification_note: SpecMPK speeds up Intel Memory Protection Keys (WRPKRU) so that in-process/intra-address-space
    compartments can switch permissions cheaply; it never creates a virtual machine, container, or any cross-process/cross-tenant
    resource abstraction, so it is not itself CORE virtualization, but it is exactly the hardware isolation primitive
    that lightweight in-process sandboxes (e.g. MPK-based library/WASM compartmentalization) build on, so it is
    SUPPORT for that CORE branch.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T7
  physical_resource: CPU core
  logical_abstraction: A per-thread set of up to 16 hardware-enforced memory-permission domains inside one process
    address space, switchable via WRPKRU without a page-table walk or TLB shootdown
  problem: Intel MPK's WRPKRU instruction must be executed serially (all later memory accesses wait for it to retire)
    to prevent Spectre-style speculative permission upgrades, which makes frequent domain switches (e.g. per-call
    sandboxing) costs up to 69.76% overhead on real Cascade Lake hardware.
  mechanism: SpecMPK lets WRPKRU execute out-of-order and speculatively like an ordinary instruction, but adds a
    ROBpkru (in-flight PKRU updates), an architectural ARFpkru (committed PKRU), and per-protection-key Access-Disable/Write-Disable
    counters; loads stall while any in-flight WRPKRU could still disable their key's access, and speculative stores
    are blocked from forwarding to loads while a disabling WRPKRU is in flight, so no instruction can observe data
    across a not-yet-committed permission tightening.
  isolation_mechanism: Speculative loads/stores are gated by counting in-flight permission-narrowing WRPKRUs per
    key rather than by serializing the pipeline; on misspeculation, everything replays using the last committed
    ARFpkru state, closing the control-steering, chosen-code, and speculative-store-forwarding attack classes the
    authors demonstrate with a working Flush+Reload proof of concept.
  multiplexing_mechanism: N/A (single core/thread mechanism, not a shared-resource multiplexer)
  state_mechanism: All state (ROBpkru entries, ARFpkru, disabling counters) is per-core microarchitectural state
    that never leaves the pipeline; nothing migrates.
  overhead_bottleneck: Baseline WRPKRU serialization stalls the whole pipeline on every domain switch; SpecMPK's
    residual cost is the small hardware (93 bytes, ~0.19% of L1D) needed to track in-flight permission state.
  primary_tradeoff: Speculative WRPKRU with counter-based gating -> gains 12.21% average (up to 48.42%) speedup
    over serialized MPK at negligible area/power cost, but costs new microarchitectural state and only defends the
    three attack classes analysed, not all possible transient-execution interactions with permission changes.
  quantitative_claims:
  - 'average speedup: 12.21% over serialized WRPKRU baseline (gem5, SPEC2017 with shadow-stack + SPEC2006 with code-pointer-integrity
    instrumentation)'
  - 'maximum speedup: 48.42% (workload-dependent, high WRPKRU-frequency benchmark)'
  - 'real-hardware WRPKRU overhead: 69.76% on Intel Cascade Lake vs 10.28% from a compiler-only mitigation'
  - 'hardware cost: 93 bytes extra sequential state (~0.19% of L1D), 5,887.91 um^2 / 3,103 logic cells at 45nm,
    2.02% dynamic / 0.39% leakage power overhead vs L1D'
  - 'ROBpkru sizing: 8-entry ROBpkru needed to approach NonSecure-SpecMPK performance; 2-entry loses performance
    on high-WRPKRU workloads'
  why_useful_for_learning: It is the concrete hardware mechanism behind cheap in-process compartmentalization, the
    same class of primitive (fast, fine-grained, hardware-checked domain switch) that sandbox/unikernel/WASM isolation
    papers assume exists when they cite MPK as an alternative to full process or VM isolation.
  priority: P2
  related: []
  relations:
  - type: LAYER_BELOW
    target: MPK-based in-process sandboxing systems (e.g. ERIM, Hodor-style compartmentalization)
    basis: SpecMPK optimizes the exact WRPKRU instruction those systems rely on for fast domain switches; it does
      not build the sandbox itself.
  - type: CONTRASTS_WITH
    target: Process/VM-level isolation (namespaces, hypervisor)
    basis: Paper explicitly scopes itself to single-address-space, single-process compartments rather than cross-process
      or cross-VM isolation.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Read the author-hosted camera-ready PDF (Eric Rotenberg's NCSU page); official ACM/IEEE PDF was not attempted
    separately since this copy is the full text with abstract, design, gem5 setup and evaluation tables.
- id: VIRT-HPCA25-03
  title: 'Concord: Rethinking Distributed Coherence for Software Caches in Serverless Environments'
  title_correction: null
  authors:
  - Jovan Stojkovic
  - Chloe Alverti
  - Alan Andrade
  - et al.
  venue: HPCA
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://ieeexplore.ieee.org/document/10946775/
  fullpaper_source: https://iacoma.cs.uiuc.edu/iacoma-papers/hpca25_1.pdf
  classification: CONTEXT
  classification_note: Concord is an application-level, hardware-cache-coherence-inspired distributed caching protocol
    for FaaS function instances; it never touches the hypervisor/container isolation boundary, so it is higher-level
    serverless infrastructure that USES the FaaS platform rather than a virtualization mechanism itself.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T9
  physical_resource: DRAM
  logical_abstraction: A per-application distributed cache spanning function-execution nodes that behaves like one
    coherent cache despite functions starting/stopping independently
  problem: Serverless functions spend 35-93% of response time on remote storage access; single-copy caches force
    remote reads and multi-copy schemes like Faa$T add version-check overhead that dominates for small objects.
  mechanism: A directory-based, MESI-like (no Modified state) coherence protocol runs across per-node Cache Agents,
    using consistent hashing to assign each key's directory home; a write-through policy keeps global storage authoritative,
    coherence domains grow/shrink as function instances start/stop, and a coherence-aware scheduler routes invocations
    toward nodes already caching the data they need.
  isolation_mechanism: N/A (no tenant/security isolation contribution; coherence is a correctness protocol for a
    single application's own cached data)
  multiplexing_mechanism: Unused per-instance application memory (average 56.8MB) is repurposed as cache capacity
    (average 6.2MB, 4.8% of application memory) shared read/write across function instances of the same application
    via the coherence protocol.
  state_mechanism: Cached copies and directory metadata live in each node's Cache Agent and move via the coherence
    protocol's read/write messages; ZooKeeper provides failure detection/recovery coordination when nodes leave.
  overhead_bottleneck: Remote storage round-trips remain on the critical path for writes and coherence misses; write
    latency grows modestly (32.4ms at 30 nodes) because storage, not coherence traffic, dominates.
  primary_tradeoff: Directory-based coherence over ephemeral serverless nodes -> gains 2.4-2.6x latency and 1.7x
    throughput over prior FaaS caches by keeping data local, but costs the complexity of dynamic coherence-domain
    membership as functions scale up/down.
  quantitative_claims:
  - 'latency: 2.4x average speedup over OFC at medium load, 2.6x at high load (OpenWhisk, 16-node cluster, 7 multi-function
    apps)'
  - 'throughput: 1.7x over OFC measured against SLO thresholds'
  - 'cache footprint: 6.2MB average per cache, 4.8% of total application memory (vs 56.8MB average unused memory
    available)'
  - 'local read hit rate: 83% with coherence-aware scheduling vs 75% without'
  - 'transactional workloads: 54% latency reduction vs Saga across 5 transaction-heavy applications'
  why_useful_for_learning: It shows how a FaaS platform's cost structure (per-invocation cold state, remote storage
    as the only durable substrate) forces application-level solutions to problems (caching, coherence) that a VM/container
    platform would otherwise solve with persistent local state, clarifying why serverless isolation/ephemerality
    is a real design constraint rather than a detail.
  priority: P3
  related: []
  relations:
  - type: CONTRASTS_WITH
    target: Faa$T (multi-copy serverless caching with version checks)
    basis: Directly implemented and measured as the state-of-the-art baseline Concord replaces its version-check
      protocol against.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Read the author-hosted (i-acoma group, UIUC) full PDF.

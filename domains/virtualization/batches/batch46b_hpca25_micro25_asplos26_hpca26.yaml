  - T9
  physical_resource: PCIe/CXL fabric
  logical_abstraction: A shared CXL memory pool across multiple hosts where hot cache blocks migrate into a host's
    local DRAM while cold ones stay remote
  problem: Migrating whole pages between local and CXL-shared memory in multi-host disaggregated shared memory is
    wasteful when only some cache blocks in a page are actually hot for a given host, and naively marking migrated
    pages non-cacheable for other hosts hurts their performance.
  mechanism: Selectively migrates only the frequently-accessed cache blocks of a page into a host's local memory
    while leaving less-accessed blocks in shared CXL memory, using remapping tables and a majority-vote migration
    policy that only migrates a page when one host's access count substantially dominates other hosts' access to
    it, avoiding harmful migrations.
  isolation_mechanism: N/A
  multiplexing_mechanism: The shared CXL memory pool is accessed by multiple hosts with hot sub-page blocks selectively
    pulled into each host's local memory based on per-host access frequency.
  state_mechanism: Cache-block-level remapping tables track which blocks of a page have migrated to which host's
    local memory versus remaining in shared CXL memory.
  overhead_bottleneck: Migration overhead and the performance cost of making migrated pages non-cacheable for remote
    hosts under naive whole-page migration.
  primary_tradeoff: Partial, incremental (cache-block-granularity) migration with majority-vote gating -> gains
    an average 1.86x speedup over presumably whole-page migration baselines by avoiding harmful/premature migrations,
    but costs the added remapping-table bookkeeping at sub-page granularity.

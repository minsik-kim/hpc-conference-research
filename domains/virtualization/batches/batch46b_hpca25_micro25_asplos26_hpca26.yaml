- id: VIRT-MICRO25-01
  title: 'ccAI: A Compatible and Confidential System for AI Computing'
  title_correction: null
  authors:
  - Chenxu Wang
  - Danqing Tang
  - Changxu Ci
  - et al.
  venue: MICRO
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3725843.3756104
  official_url: https://dl.acm.org/doi/10.1145/3725843.3756104
  fullpaper_source: https://cse.sustech.edu.cn/faculty/~zhangfw/paper/ccai-micro25.pdf
  classification: CORE
  classification_note: ccAI extends the confidential-VM trust boundary past the CPU across the PCIe bus into GPU/NPU/FPGA
    accelerators via a hardware PCIe Security Controller and TVM-side adaptor, which is exactly the confidential-computing
    / device-virtualization-security architecture the taxonomy's T7 targets, not merely a paper that runs inside
    a TEE.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T3
  - T6
  physical_resource: PCIe/CXL fabric
  logical_abstraction: An end-to-end confidential channel from a Trusted (confidential) VM through the PCIe bus
    into an otherwise-untrusted GPU/NPU/FPGA, so that xPU-side computation on sensitive data is protected without
    touching accelerator firmware or drivers
  problem: Existing confidential computing (SEV/TDX-style TVMs) protects only CPU-side execution; once data crosses
    the PCIe bus to an accelerator, it is exposed to a privileged/untrusted OS, hypervisor, malicious devices, or
    physical bus eavesdropping, and today's TEE ecosystem has no uniform way to extend confidentiality across heterogeneous
    xPU vendors.
  mechanism: 'A PCIe Security Controller (PCIe-SC, prototyped on an Intel Agilex 7 FPGA) sits on the PCIe path and
    classifies every packet via a two-level access-control table into 4 actions: block, encrypt+integrity-check
    (AES-GCM/SHA), integrity-only, or transparent passthrough (e.g. interrupts). A TVM-side kernel adaptor locates
    sensitive data/code via metadata, encrypts it into bounce buffers before DMA, and requires no changes to native
    accelerator drivers/applications. Trust is established via a TPM-compatible hardware root of trust (HRoT-Blade),
    secure boot, and remote attestation (Diffie-Hellman + PCRs); the xPU Environment Guard clears accelerator memory/caches
    when a confidential task ends.'
  isolation_mechanism: 'Confidentiality/integrity is enforced per-PCIe-packet rather than per-VM-page: the trust
    boundary is TVM -> encrypted PCIe transit -> accelerator execution, with accelerator firmware assumed vendor-authenticated
    and malware-free, and side-channel/DoS attacks explicitly out of scope.'
  multiplexing_mechanism: The PCIe-SC is shared hardware sitting on the bus to all attached accelerators, so one
    controller mediates confidential traffic to NVIDIA A100/RTX4090Ti/T4 GPUs, a Tenstorrent NPU, and an Enflame
    GPU simultaneously without per-vendor logic.
  state_mechanism: Workload keys with dynamic IV rotation live in the PCIe-SC and TVM adaptor; batched metadata
    and grouped encryption reduce redundant I/O reads/writes; no cross-machine migration is discussed.
  overhead_bottleneck: Per-packet encryption/integrity-check cost and the extra I/O reads for metadata lookup, mitigated
    by batching metadata collection and grouping encryption operations (88.7-89.8% overhead reduction from these
    two optimizations alone).
  primary_tradeoff: Anchoring protection at the PCIe packet level instead of per-accelerator-architecture -> gains
    vendor-agnostic confidential xPU computing with no driver/application changes, but costs a new hardware TCB
    component (218.6K ALUTs on the FPGA prototype) on the PCIe path and assumes accelerator firmware integrity as
    a trust axiom.
  quantitative_claims:
  - 'end-to-end latency overhead: 0.05-5.67% (Llama-2-7b across token/batch sizes, vs unprotected baseline)'
  - 'overhead across 9 LLMs (1.3b-83b parameters): 0.72-4.76%'
  - 'overhead across 5 accelerator types (A100/RTX4090Ti/T4 GPUs, Tenstorrent NPU, Enflame GPU): 0.58-2.40%'
  - 'optimization efficacy: 88.7-89.8% overhead reduction from batched metadata + grouped encryption vs non-optimized'
  - 'limited-bandwidth case: 4.45% overhead at 8GT/s PCIe with 8 lanes'
  - 'KV-cache swapping: <2% additional overhead under memory pressure'
  - 'TCB addition: 3.1K LoC (TVM-side software), 218.6K ALUTs / 195.7K logic registers / 630 block RAMs (PCIe-SC
    FPGA prototype)'
  why_useful_for_learning: 'It is a concrete answer to ''what happens to confidential computing when the workload
    needs a GPU/NPU/FPGA'': the trust boundary must be re-drawn around the PCIe transport itself, not just the CPU,
    which matters for every CVM/TEE paper that assumes accelerator-attached confidential AI.'
  priority: P1

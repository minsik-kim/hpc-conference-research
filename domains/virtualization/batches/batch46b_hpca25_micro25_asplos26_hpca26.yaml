    guarantees stop at the CPU boundary and the OS below it is untrusted
  problem: TEEs protect a security-critical application's runtime execution and data, but do not ensure the integrity
    of that application's *sealed* (at-rest) data, which an untrusted OS can delete or manipulate outside the TEE's

  fullpaper_source: https://2026.hpca-conf.org/details/hpca-2026-main-conference/66/ARIADNE-Adaptive-UVM-Management-for-Efficient-GPU-Memory-Oversubscription
  classification: DROP
  classification_note: Confirmed via the official abstract that ARIADNE is a runtime change inside NVIDIA's single-GPU
    UVM driver for one application exceeding its own device's physical memory (pipelined fault handling, a 'Sharing
    Degree' locality metric, GPU/zero-copy placement); there is no guest OS, VM, or multi-tenant sharing involved,
    matching the brief's pure-virtual-memory exclusion applied to GPU UVM oversubscription.
  drop_reason: pure_virtual_memory
  taxonomy_primary: T10
  taxonomy_secondary: []
  physical_resource: GPU
  logical_abstraction: UNKNOWN
  problem: GPU Unified Virtual Memory suffers severe performance degradation (page-fault overhead and thrashing)
    when an application's working set exceeds physical GPU memory capacity.
  mechanism: A runtime implemented inside NVIDIA's UVM driver (no hardware modification or recompilation needed)
    that pipelines fault handling to hide migration latency, computes a 'Sharing Degree' metric capturing thread-level
    access locality, and dynamically places data between GPU memory and zero-copy host memory based on observed
    runtime access patterns.
  isolation_mechanism: N/A
  multiplexing_mechanism: N/A (single application oversubscribing its own GPU's memory, not multiple tenants sharing
    one GPU)
  state_mechanism: Page placement between GPU device memory and host zero-copy memory is adjusted dynamically at
    the UVM driver level as access patterns are observed.
  overhead_bottleneck: Page-fault handling latency and thrashing under high memory-oversubscription pressure.
  primary_tradeoff: UNKNOWN (not read beyond abstract, since classification is DROP)
  quantitative_claims:
  - 'speedup: 1.9x, 5.0x, and 4.8x over a state-of-the-art method at varying oversubscription levels (per abstract)'
  why_useful_for_learning: Screened out per the brief's explicit guidance; a clean, current (2026) example distinguishing
    single-application GPU virtual-memory oversubscription from any guest/VM-level GPU memory virtualization.

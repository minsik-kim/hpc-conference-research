- id: VIRT-OSDI26-06
  title: "Nixie: Efficient, Transparent Temporal Multiplexing for Consumer GPUs"
  title_correction: null
  authors: [Yechen Xu, Yifei Wang, Nathanael Ren, Yiran Chen, Danyang Zhuo]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: UNKNOWN
  fullpaper_source: https://arxiv.org/abs/2601.11743
  classification: CORE
  classification_note: "Nixie's contribution is a transparent GPU temporal-multiplexing mechanism -- ensuring one application's working set fully occupies GPU memory at a time and switching between applications via explicit, coordinated migration -- which is a GPU resource-virtualization/multiplexing mechanism, not merely a scheduler over an already-virtualized GPU, matching the brief's CORE bar for accelerator virtualization."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T2]
  physical_resource: GPU
  logical_abstraction: "A consumer GPU whose full memory capacity is time-shared, in whole-working-set units, across multiple unmodified interactive/ML applications with virtual-address-consistent transparency"
  problem: "Consumer machines increasingly run large ML workloads (LLMs, image generation/editing) whose memory footprints individually saturate a single consumer GPU, but existing options fail: stop-and-restart approaches (llama-swap) incur multi-second reload delays, application-specific tools (Ollama) cannot coordinate across different applications, and NVIDIA's Unified Virtual Memory (UVM) causes severe page-thrashing (4-12x slowdown), uses only one PCIe direction at a time, and requires excessive CPU pinned memory (e.g. 72 GB for three 24 GB applications)."
  mechanism: "Nixie comprises a Shim (an LD_PRELOAD library interposing on the CUDA Runtime API in each application) and a Daemon (a centralized coordinator). On a scheduling decision, the Daemon pauses the currently-competing application, waits for its outstanding kernels, migrates its memory chunks (capped at 128 MB, subdivided into 2 MB blocks) into shared pinned memory, migrates the newly-scheduled application's chunks into GPU memory using full-duplex (simultaneous both-directions) PCIe transfer planning, then re-enables execution. CUDA virtual addresses are kept consistent across migrations via the CUDA VMM API, so applications need no modification. Scheduling uses an MLFQ-inspired policy with idleness detection (100 ms timeout) and starvation-avoiding priority inference, plus prefetching of the next-queued application's data."
  isolation_mechanism: "Ensures at most one application's full working set is resident on the GPU at a time (rather than letting the OS/driver page piecemeal), preventing the thrashing that undermines UVM's isolation of concurrent workloads; explicitly designed for single-user, same-UID processes, not multi-tenant security isolation."
  multiplexing_mechanism: "Whole-application-working-set temporal multiplexing of GPU memory and compute, coordinated by a central Daemon rather than left to demand-paging (UVM) or per-application heuristics (Ollama)."
  state_mechanism: "GPU-resident memory chunks (2 MB blocks, 128 MB chunk cap) are the migrated state, moved to/from a shared CPU pinned-memory tier via a global migration plan that schedules all chunk transfers' source/destination simultaneously rather than sequentially evict-then-fetch."
  overhead_bottleneck: "PCIe bandwidth direction (UVM only uses one direction at a time) and CPU pinned-memory footprint (UVM must back all GPU-resident data with pinned memory) are the two costs Nixie's full-duplex, working-set-aware migration is designed to cut."
  primary_tradeoff: "Explicit, coordinated whole-working-set migration instead of demand-paged UVM -> gains up to 3.8x lower latency for interactive tasks and 66.8% less pinned-memory use at equal latency, but costs assuming single-user/same-UID trust (no multi-tenant security isolation) and targeting large, memory-saturating applications rather than many small ones (acknowledged as future work for combining with spatial multiplexing)."
  quantitative_claims:
  - "3.1-3.8x latency improvement over nvshare for interactive code-completion tasks under background load (W=4 setting)"
  - "44.0-82.3% time-to-first-token reduction vs UVM/nvshare for Ollama; 29.7-36.3% for SGLang"
  - "achieves roughly 2x UVM's PCIe bandwidth utilization, near the theoretical bidirectional maximum"
  - "matches UVM performance while using only 33.2-40.2% of UVM's pinned memory; 66.8% overall CPU pinned-memory reduction"
  - "on a second RTX A5000 testbed: 3.4x faster than nvshare, reaching 73% of dedicated (exclusive-GPU) performance"
  - "ResNet-18/152 inference throughput identical to exclusive execution and to plain UVM (no regression for compute-bound, non-thrashing workloads)"
  - "implementation size: ~10,000 lines of Rust (1,900 Shim / 7,400 Daemon / 700 shared)"
  why_useful_for_learning: "A clean, fully-read case study of GPU temporal multiplexing built as an explicit migration mechanism rather than relying on demand-paged virtual memory (UVM), directly showing the isolation/multiplexing/state-movement mapping the brief asks every CORE paper to be read through."
  priority: P0
  related: []

- id: VIRT-EUROSYS26-08
  title: "MTTM: Dynamic Fast Memory Partitioning with Bandwidth Optimization for Multi-tenant Cloud"
  title_correction: null
  authors: [Changjun Lee, Sangjin Choi, Youngjin Kwon]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3769371
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3767295.3769371
  classification: SUPPORT
  classification_note: "Fair-share partitioning of fast-tier (local DRAM) capacity and bandwidth among competing cloud tenants over a CXL-tiered memory system is a resource-partitioning/QoS mechanism (brief's SUPPORT keyword 'memory/resource partitioning'), not itself a new virtual-resource abstraction."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T2]
  physical_resource: DRAM
  logical_abstraction: "A per-tenant share of fast (local DRAM) memory capacity, dynamically re-partitioned to keep aggregate memory-tier bandwidth utilization high under multi-tenant contention"
  problem: "Memory tiering (extending local DRAM with CXL-attached remote DRAM/NVM) helps capacity scaling, but in multi-tenant clouds, how fast-memory capacity is distributed among competing tenants directly affects the memory-request rejection rate and therefore effective bandwidth utilization -- an area the authors say is comparatively underexplored next to data-movement-across-tiers research."

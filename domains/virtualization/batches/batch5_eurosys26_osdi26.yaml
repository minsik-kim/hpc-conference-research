- id: VIRT-OSDI26-12
  title: "What Are You (M)Waiting For: The Hidden Cost of Idle in the Hyperscale Cloud"
  title_correction: null
  authors: [Yun Wang, Xingguo Jia, Ben Luo, Kenan Liu, Shengdong Dai, Jingdong Han, Weihao Chen, Yicheng Gu, Xingzi Yu, Yibin Shen, Jiesheng Wu, Zhengwei Qi, Haibing Guan]
  venue: OSDI
  year: 2026
  publication_type: OPERATIONAL_REFERENCE
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/technical-sessions
  fullpaper_source: https://www.usenix.org/conference/osdi26/technical-sessions
  classification: CORE
  classification_note: "The paper's mechanism (mwait-sched) is a hypervisor-level vCPU idle-state scheduling/passthrough redesign -- a direct T1 CPU-virtualization mechanism -- even though its publication_type is Operational Systems and so it is excluded from regular-research statistics per the brief."
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T9]
  physical_resource: CPU core
  logical_abstraction: "A vCPU whose idle (mwait) state is scheduled deterministically by the hypervisor so that idle time behaves predictably under oversubscription, instead of the guest's own mwait instruction directly controlling physical-core residency"
  problem: "Idle-passthrough mechanisms, in particular mwait-passthrough (letting a guest's idle/mwait instruction act close to bare metal), work well in 1:1 (dedicated-core) VM placements but break down in oversubscribed hyperscale production environments: an idle vCPU using mwait-passthrough can monopolize a physical core in a way that degrades the latency of other, co-located, actually-busy workloads."
  mechanism: "The authors introduce mwait-sched, which reconciles bare-metal-like idle performance with predictable CPU multiplexing by replacing raw mwait-passthrough with deterministic, timer-based emulation of idle states combined with fine-grained classification of what kind of 'idle' a vCPU is actually in, so the hypervisor's scheduler can make informed decisions about reclaiming that core time."
  isolation_mechanism: "Deterministic, timer-based idle emulation bounds how long an ostensibly-idle vCPU can hold a physical core via mwait, preventing it from degrading colocated tenants' latency -- a performance-isolation mechanism specific to the idle/mwait path."
  multiplexing_mechanism: "Physical cores are time-multiplexed across vCPUs under oversubscription; mwait-sched's fine-grained idle classification lets the scheduler decide when an 'idle' vCPU's core time can safely be given to another tenant versus when the vCPU needs to keep near-bare-metal idle-wake latency."
  state_mechanism: "Per-vCPU idle-classification state (what kind of idle the vCPU is in) drives the timer-based emulation decision; exact data structures not given at this evidence depth."
  overhead_bottleneck: "Idle vCPUs monopolizing physical cores under mwait-passthrough in oversubscribed settings, degrading colocated application latency -- identified as a 'hidden cost of idle' in hyperscale fleets."
  primary_tradeoff: "Deterministic timer-based idle emulation with fine-grained classification -> gains predictable CPU multiplexing under oversubscription without sacrificing bare-metal-like idle-wake responsiveness, at the cost of replacing simple mwait-passthrough with a more complex hypervisor-mediated idle path."
  quantitative_claims: []
  why_useful_for_learning: "A production-scale (Alibaba-affiliated authorship) illustration of why a seemingly simple hardware-passthrough optimization (mwait-passthrough) breaks under the multi-tenant oversubscription that virtualization exists to enable -- directly useful CORE/operational context for any CPU-virtualization paper discussing idle-state or passthrough trade-offs."
  priority: P1

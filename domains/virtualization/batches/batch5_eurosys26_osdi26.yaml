- id: VIRT-EUROSYS26-03
  title: "NecoFuzz: Effective Fuzzing of Nested Virtualization via Fuzz-Harness Virtual Machines"
  title_correction: null
  authors: [Reima Ishii, Takaaki Fukai, Takahiro Shinagawa]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3769347
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://arxiv.org/abs/2512.08858
  classification: CORE
  classification_note: "The paper's entire contribution is a fuzzing methodology that directly probes hardware-assisted nested-virtualization interfaces (VMCS/VMCB fields, VM-exit handling) inside real hypervisors, i.e. hypervisor correctness/nested-virtualization is the object of study, not an incidental setting."
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T7]
  physical_resource: CPU core
  logical_abstraction: "The L1-guest-hypervisor-facing virtual CPU/VMCS interface exposed by a host hypervisor for nested virtualization (Intel VMX / AMD SVM)"
  problem: "Nested virtualization (a guest hypervisor L1 running its own guests L2) greatly increases host-hypervisor (L0) complexity, and no prior fuzzer systematically tests the hardware-assisted virtualization interface itself; random mutation of a multi-kilobyte VMCS/VMCB state is impractical and symbolic testing does not scale to that state space."
  mechanism: "NecoFuzz synthesizes 'fuzz-harness VMs' -- executable UEFI binaries that boot as an L1 guest hypervisor and launch L2 nested guests -- via three components: a VM Execution Harness that mutates setup instructions and repeatedly triggers VM exits; a VM State Validator that generates candidate VMCS/VMCB fields, rounds them toward specification-valid values using validation logic extracted from the Bochs CPU emulator, then selectively re-mutates a subset to sit near the valid/invalid boundary (using physical CPUs as oracles); and a vCPU Configurator that mutates CPU feature combinations (e.g. EPT, unrestricted guest). A host-side agent bridges this to AFL++, feeding 2 KiB fuzzing inputs and collecting coverage via KCOV (KVM) or gcov (Xen)."
  isolation_mechanism: "N/A -- NecoFuzz studies isolation-boundary correctness rather than proposing an isolation mechanism itself."
  multiplexing_mechanism: "N/A"
  state_mechanism: "The fuzz target's state is exactly the hypervisor's own nested-virtualization control state (VMCS12 on Intel, VMCB12 on AMD); NecoFuzz's contribution is generating and mutating that state near its validity boundary rather than managing state migration."
  overhead_bottleneck: "Boundary-state generation cost: producing VM instances that are 'near-valid' (to reach deep validation/error-handling code) rather than either trivially valid or trivially rejected."
  primary_tradeoff: "Boundary-oriented, specification-guided state generation -> gains far higher coverage of nested-virtualization-specific error-handling code than blind mutation (Syzkaller) or general hypervisor fuzzers (IRIS), but costs a hypervisor-specific validator built from an external CPU emulator's semantics and is restricted to single-vCPU, single-level (L2, not L3) nesting and synchronous (instruction-triggered) VM exits only."
  quantitative_claims:
  - "code coverage of nested-virtualization-specific code on KVM (48h runs): 84.7% Intel / 74.2% AMD for NecoFuzz vs 61.4% Intel / 7.0% AMD for Syzkaller (1.4x and 11.0x improvement; p=0.012 Intel, p=0.014 AMD)"
  - "Xen coverage (24h runs): 83.4% Intel / 79.0% AMD for NecoFuzz vs 20.4% Intel / 10.8% AMD for the XTF baseline (63.0 and 68.2 percentage-point improvement)"
  - "vs IRIS (Intel-only baseline): 1.6x coverage improvement (IRIS reached 52.3% and terminated after minutes in the nested setting)"
  - "component ablation (24h, KVM): removing the VM State Validator costs 16.9 pp coverage on Intel and 15.8 pp on AMD; removing the VM Execution Harness costs 6.1 pp Intel / 20.2 pp AMD; removing all three components costs 28.2 pp Intel / 22.5 pp AMD"
  - "six previously unknown vulnerabilities found across KVM, Xen and VirtualBox; two received CVE assignments (CVE-2023-30456 on KVM/Intel; CVE-2024-21106 on VirtualBox/Intel), four confirmed/fixed"
  why_useful_for_learning: "Concretely explains the VMCS/VMCB nested-virtualization interface (the exact structures and validity constraints a guest hypervisor must satisfy), which is the low-level mechanism every CORE nested-virtualization paper (e.g. JANUS, this batch) builds on top of."
  priority: P1
  related: [VIRT-OSDI26-01]
  relations:
  - {type: LAYER_BELOW, target: VIRT-OSDI26-01, basis: "NecoFuzz tests the correctness of the hardware-assisted nested-virtualization mechanism (VMCS/VMCB handling) that a cooperative nested-virtualization architecture such as JANUS would run on top of."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: "Read via arXiv preprint 2512.08858 (listed there as 'To appear in EuroSys 2026'), which supplied full abstract, architecture, evaluation, and limitations; official EuroSys program (papers.html) independently confirmed title/authors/DOI. This is the deepest read in the batch alongside Nixie."

- id: VIRT-EUROSYS26-04
  title: "Everything You Need to Know About Virtual Machine Live Migration Between Heterogeneous Processors"
  title_correction: null
  authors: [Kenta Ishiguro, Caleb Fonyuy-Asheri, Elouan Barraud, Renaud Lachaize, Yérom-David Bromberg, Alain Tchana]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3803609
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3767295.3803609
  classification: CORE
  classification_note: "Live migration feasibility across heterogeneous (same-ISA, different-capability) processors is the paper's entire subject; it introduces MigCheck, a dedicated simulation tool to predict migration feasibility, which is a direct virtualization/migration-mechanism contribution."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T1]
  physical_resource: CPU core
  logical_abstraction: "A VM whose vCPU is portable across physical hosts that share an ISA but differ in exposed CPU features/microarchitecture ('semi-heterogeneous' processors)"
  problem: "Cloud fleets are never perfectly homogeneous over their lifetime (hardware refreshes, hypervisor updates, added/removed capacity), and processor feature/capability mismatches between source and destination host can silently block or break a live migration, but operators currently lack a way to know this before attempting (and paying the cost of) a real migration."
  mechanism: "The authors perform the first systematic feasibility analysis of VM live migration across semi-heterogeneous (same-ISA, differently-capable) processors and build MigCheck, a simulation tool that predicts whether a given migration will succeed without performing a costly real migration, validated across scenarios including hardware additions/removals, hypervisor updates, and platform configuration changes."
  isolation_mechanism: "N/A -- the paper is about migration feasibility/compatibility prediction, not tenant isolation."
  multiplexing_mechanism: "N/A"
  state_mechanism: "VM CPU state (feature/capability-dependent architectural state) is the object being checked for portability between source and destination host before/at migration time; MigCheck statically/predictively evaluates this rather than performing an actual live transfer."
  overhead_bottleneck: "The cost of a failed or broken real migration attempt when source/destination processor capabilities are incompatible -- the paper's tool moves this cost from 'discovered during migration' to 'predicted beforehand'."
  primary_tradeoff: "Predicting migration feasibility via simulation (MigCheck) -> avoids the cost and risk of attempting real migrations that may fail, but costs the effort of building and maintaining an accurate model of processor-capability compatibility across vendors/generations."
  quantitative_claims: []
  why_useful_for_learning: "Directly addresses the practical operational question every live-migration CORE paper glosses over -- 'can this VM even move to that host' -- and is explicitly flagged as the priority read for the live-migration branch of this corpus."
  priority: P0
  related: ["TGVM: Live Migration of Virtual Machines on Heterogenous Same ISA Processors (SPMA 2022, same research group)"]
  relations:
  - {type: EXTENSION, target: "TGVM: Live Migration of Virtual Machines on Heterogenous Same ISA Processors (SPMA 2022)", basis: "Found on Alain Tchana's personal publication page while searching for this paper; a 2022 workshop paper by an overlapping group on the same same-ISA heterogeneous-processor live-migration problem, suggesting this EuroSys 2026 paper is a matured/extended treatment of that earlier workshop-scale result."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, documentation]
  confidence: MEDIUM
  notes: "Flagged as a P0 priority read by the task brief, but only the abstract (via OpenAlex ACM-DOI lookup) was reachable: ACM DL blocks automated fetches (403) in this environment, the authors' personal/lab pages (ENS Lyon, IRISA/Univ. Rennes, Grenoble) were either stale (last updated ~2022) or blocked by robots.txt, and no arXiv preprint was found. This record should be revisited with the actual PDF once accessible -- the MigCheck architecture, validation methodology and quantitative accuracy numbers are all still unread."

- id: VIRT-EUROSYS26-05
  title: "Squeezy: Rapid VM Memory Reclamation for Serverless Functions"
  title_correction: null
  authors: [Orestis Lagkas Nikolos, Chloe Alverti, Stratos Psomadakis, Georgios Goumas, Nectarios Koziris]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3769357
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3767295.3769357
  classification: CORE
  classification_note: "This is exactly the brief's 'mechanism that makes isolation cheap' case: the contribution is a new VM memory-reclamation mechanism (segregating and lifespan-bounding hotplugged memory) implemented in the Linux kernel, not a system that merely consumes serverless VMs."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T8]
  physical_resource: DRAM
  logical_abstraction: "VM-sandboxed serverless function memory that can be elastically inflated and rapidly, predictably deflated without long reclamation stalls"
  problem: "VM-sandboxed serverless functions need elastic memory, but traditional memory hot-unplugging suffers long reclamation latencies and burns CPU, because the guest kernel has no notion that a given memory region was hotplugged and therefore cannot preferentially and quickly reclaim it."
  mechanism: "Squeezy segregates hotplugged memory from ordinary VM memory inside the guest allocator and bounds hotplugged regions' lifespans, so the kernel can identify and reclaim exactly the hotplugged pages fast; implemented as a patch to the Linux kernel (v6.6)."
  isolation_mechanism: "N/A (memory-capacity elasticity mechanism, not a tenant-isolation boundary)"
  multiplexing_mechanism: "Physical host DRAM is shared across FaaS VMs by returning hotplugged guest memory to the host quickly once a function's burst demand subsides, rather than holding it until a slow generic reclamation path completes."
  state_mechanism: "Guest-kernel-tracked hotplugged-memory regions are the state; Squeezy's contribution is making the guest kernel aware of which physical memory is hotplugged so it can be reclaimed with bounded latency."
  overhead_bottleneck: "Long reclamation latency and CPU cost of traditional memory hot-unplugging, caused by the guest kernel treating hotplugged and non-hotplugged memory identically."
  primary_tradeoff: "Segregating and lifespan-bounding hotplugged memory -> gains order-of-magnitude faster, sub-second reclamation of multiple gigabytes during live FaaS workloads, at the cost of guest-kernel changes that constrain how hotplugged memory can be used/allocated."
  quantitative_claims:
  - "reclamation latency: 'order-of-magnitude faster' than existing (traditional hot-unplug) methods (per abstract; exact baseline numbers not read)"
  - "sub-second recovery of multiple gigabytes of memory during active FaaS workloads (per abstract)"
  why_useful_for_learning: "Directly explains why ballooning/hot-unplug is normally slow (no guest awareness of which pages were hotplugged) and how segregating that state fixes it -- a concrete case study for the T2 memory-virtualization branch alongside HyperAlloc (batch1)."
  priority: P1
  related: [VIRT-EUROSYS25-03]
  relations:
  - {type: ALTERNATIVE, target: VIRT-EUROSYS25-03, basis: "Both attack slow VM memory de/inflation (HyperAlloc via a shared page-frame allocator interface, Squeezy via segregating and lifespan-bounding hotplugged memory); different mechanisms for the same overhead_bottleneck."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, documentation]
  confidence: MEDIUM
  notes: "Abstract obtained via OpenAlex ACM-DOI lookup; ACM DL PDF and any preprint were inaccessible in this environment (no arXiv preprint found). Flagged by the task brief as a mechanism (not consumption) paper; the abstract confirms this directly."

- id: VIRT-EUROSYS26-06
  title: "SKernel: An Elastic and Efficient Secure Container System at Scale with a Split-Kernel Architecture"
  title_correction: null
  authors: [Xiaohu Chai, Keyang Hu, Jianfeng Tan, Tiwei Bie, Guotao Tan, Tianyu Zhou, Anqi Shen, Dawei Shen, Xinyao Yang, Xin Chen, Xu Wang, Feng Yu, Zhengyu He, Dong Du, Yubin Xia, Kang Chen, Yu Chen]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3769332
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3767295.3769332
  classification: CORE
  classification_note: "Explicitly a container isolation architecture (a per-container split guest kernel replacing the shared-kernel model), which the brief names as CORE (as opposed to container image/runtime mechanism, which would be SUPPORT)."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T1]
  physical_resource: CPU core
  logical_abstraction: "A secure container that gets its own split guest kernel (isolated from the host and from other containers) while remaining elastic/on-demand like a lightweight container rather than a full VM"
  problem: "Existing secure-container designs force a choice: VM-based approaches (e.g. Kata) get strong isolation via a full guest kernel but sacrifice elasticity/on-demand scaling for unpredictable serverless-style workloads, while lightweight approaches (e.g. gVisor) avoid a second kernel but depend on host-kernel mechanisms, causing performance loss from guest-host interdependency."
  mechanism: "SKernel introduces a split-kernel architecture: rather than a monolithic guest kernel per VM (Kata-style) or intercepting syscalls into the host kernel (gVisor-style), it splits kernel responsibilities so each container gets an isolated kernel slice that can be instantiated/torn down elastically at scale."
  isolation_mechanism: "Per-container split guest kernel, isolating kernel state per tenant without the full weight of a monolithic per-VM guest kernel."
  multiplexing_mechanism: "Host resources are multiplexed across many elastic split-kernel containers rather than a fixed number of heavyweight guest-kernel VMs."
  state_mechanism: "UNKNOWN (not present at abstract depth) -- no migration/checkpoint detail retrieved."
  overhead_bottleneck: "The elasticity-vs-isolation trade-off itself: Kata-style monolithic guest kernels are slow to scale on-demand; gVisor-style host-kernel-dependent designs degrade performance from guest-host interdependency."
  primary_tradeoff: "Splitting the guest kernel per container -> aims to gain both elasticity (fast on-demand scaling like gVisor) and isolation strength (independent from host-kernel coupling, closer to Kata), at the cost of split-kernel design/engineering complexity (exact overhead not given at abstract depth)."
  quantitative_claims: []
  why_useful_for_learning: "A third point on the container-isolation spectrum (monolithic guest kernel vs host-kernel-dependent sandbox vs split guest kernel) directly comparable to CofferOS (same batch) and gVisor/Kata, useful for understanding why 'secure container' architecture choices matter."
  priority: P1
  related: [VIRT-EUROSYS26-01]
  relations:
  - {type: CONTRASTS_WITH, target: VIRT-EUROSYS26-01, basis: "CofferOS keeps a single shared kernel and hardens it in Rust; SKernel instead splits the kernel per container -- two different answers to the same container-isolation-vs-performance problem."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT_INTRO
  evidence_kinds: [official-web, documentation]
  confidence: MEDIUM
  notes: "OpenAlex-reconstructed abstract was cut short before the mechanism/evaluation sections; author list from OpenAlex differs slightly from the official EuroSys program in one name ('Yiqun Chen' vs official 'Yu Chen') -- official program list used here. Authors Dong Du and Yubin Xia are SJTU IPADS faculty; ACM DL PDF and any preprint were inaccessible in this environment."


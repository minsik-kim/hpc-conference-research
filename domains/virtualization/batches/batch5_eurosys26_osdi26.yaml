- id: VIRT-EUROSYS26-01
  title: "CofferOS: Hardening OS-level Virtualization with Rust"
  title_correction: null
  authors: [Minkyu Jung, Chanshin Kwak, Junho Ahn, Sunho Park, Changjun Lee, Jongyul Kim, Jeehoon Kang, Youngjin Kwon]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3803569
  official_url: http://2026.eurosys.org/papers.html
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3767295.3803569
  classification: CORE
  classification_note: "The contribution is a hardened OS-level virtualization (container) design that keeps the shared-kernel model but rewrites the isolation-critical kernel surface in Rust to close the container/VM security gap without VM-level overhead."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T7]
  physical_resource: CPU core
  logical_abstraction: "An OS-level (container) sandbox whose kernel-facing attack surface is memory-safe, aiming to approach VM-grade isolation without a second guest kernel"
  problem: "Linux containers share one kernel, so a single memory-safety bug in the shared kernel can break isolation across all tenants on a host, while switching to VM-based sandboxes (gVisor/Kata-style) to fix this imposes substantial performance and elasticity costs."
  mechanism: "CofferOS hardens the OS-level virtualization boundary itself (the parts of the shared kernel a container can reach) by rewriting the isolation-critical surface in Rust, aiming to keep the low overhead of shared-kernel containers while removing the memory-safety-driven isolation escapes that motivate full VM sandboxing."
  isolation_mechanism: "Memory-safe (Rust) reimplementation of the container-facing kernel surface, reducing the class of memory-corruption bugs that let a container escape into the shared kernel."
  multiplexing_mechanism: "Standard OS-level virtualization multiplexing (namespaces/cgroups) is retained; the paper's change is to the safety of the mediation code, not the multiplexing model."
  state_mechanism: "N/A at abstract depth — no migration/checkpoint mechanism described in the retrieved material."
  overhead_bottleneck: "The performance/isolation trade-off between shared-kernel containers (fast, weak isolation) and VM-sandboxed containers (slow, strong isolation) that CofferOS is positioned to narrow."
  primary_tradeoff: "Rewriting the container-kernel boundary in Rust -> gains memory-safety-driven isolation without a second guest kernel, but costs re-implementation effort and (per abstract) does not fully match VM-based sandbox isolation guarantees."
  quantitative_claims: []
  why_useful_for_learning: "Gives a concrete example of the isolation-vs-performance spectrum between namespace/cgroup containers and VM-sandboxed containers (gVisor/Kata), the same spectrum SKernel (this batch) also addresses with a split-kernel design."
  priority: P2
  related: [VIRT-EUROSYS26-06]
  relations:
  - {type: CONTRASTS_WITH, target: VIRT-EUROSYS26-06, basis: "Both target the container isolation/performance gap; CofferOS hardens the shared-kernel model in Rust while SKernel (same batch) splits the kernel per-container instead."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, documentation]
  confidence: MEDIUM
  notes: "Official EuroSys program (papers.html) confirmed title/authors/DOI. Abstract text obtained via OpenAlex (works/doi lookup on ACM DOI) since dl.acm.org itself returns 403 to automated fetches in this environment; USENIX/ACM full text and arXiv preprint were not found (no arXiv preprint located across cs.OS Sep 2025-Jun 2026 listings). Abstract was reconstructed from an inverted index and appears truncated before mechanism/evaluation detail, so DESIGN-level claims above are inferred from the stated problem framing, not read from a methods/eval section."


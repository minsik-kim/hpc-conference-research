  multiplexing_mechanism: "Node capacity is shared among microservice groups; worst-fit placement deliberately leaves headroom for peaks."
  state_mechanism: "Rescheduling moves container replicas, so per-instance state must be externalised or recreated; the paper's cost model is the reschedule count."
  overhead_bottleneck: "Rescheduling overhead (migration/restart churn) versus SLO violations from a stale placement."
  primary_tradeoff: "Response-time-triggered rescheduling with grouped worst-fit placement -> gains SLO compliance under peaks but costs reschedule churn, which the design then has to minimise."
  quantitative_claims:
    - "average response time reduced by up to 68.5% under dynamic cluster conditions; rescheduling overhead reduced by 80%"
  why_useful_for_learning: "Landscape: it shows the operational reason container placement is rarely static, which is the demand that migration and checkpoint mechanisms exist to serve."

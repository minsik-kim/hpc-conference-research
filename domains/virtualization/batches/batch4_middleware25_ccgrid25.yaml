  classification_note: "Re-checked against the paper's own full abstract: every contribution is workflow composition, deployment and profiling (XFaaS workflow patterns, workflow partitioning, adaptive polling) plus quantum circuit-level compilation (circuit cutting, qubit reuse). There is no isolation boundary, no multiplexing of a physical resource among tenants, and no virtual-resource abstraction — the FaaS platforms and QPU queues on AWS, Azure and IBM are consumed as given. The prior audit's REMOVE_DUPLICATE judgement is upheld."

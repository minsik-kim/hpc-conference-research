  problem: "FaaS schedulers struggle to keep load balanced, keep cold starts down and cope with bursty workloads at the same time."
  mechanism: "Decouple worker selection from task assignment: idle workers proactively request new tasks, so assignment follows actual worker availability instead of a hash or a central estimate."

  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T9]
  physical_resource: DRAM
  logical_abstraction: "A serverless stream operator whose state lives on the worker node that executes it, addressable in batch"
  problem: "Serverless functions cannot hold state, so stream operators pay remote-storage latency; existing stateful-serverless frameworks add node-local state servers but still cannot meet real-time streaming requirements."
  mechanism: "ScalaSSC co-locates requests with the state they act on to avoid cross-worker state access, introduces state parallelism to cut executor contention, batches requests that touch the same state, and exposes batch APIs so a batch needing several states fetches them in one operation."
  isolation_mechanism: "N/A — state partitioning is for contention, not for security isolation."
  multiplexing_mechanism: "State parallelism: one logical operator state is split so multiple executors can work on it concurrently instead of serialising."
  state_mechanism: "Operator state is held in node-local state servers next to the functions, with placement driven by request affinity; this is the design point being explored."
  overhead_bottleneck: "Cross-worker state access latency and executor contention on shared state."
  primary_tradeoff: "Node-local, affinity-placed, parallelised operator state -> gains orders-of-magnitude throughput but costs the location transparency and free elasticity that the stateless abstraction gave you."
  quantitative_claims:
    - "up to 845x higher throughput than another stateful serverless system at similar end-to-end latency"
    - "14x higher throughput than AWS Lambda at microsecond-level latency versus Lambda's second-level latency"
  why_useful_for_learning: "It documents the price of statelessness — the property that makes serverless isolation cheap in the first place — and thus why so much serverless work is really state-placement work."

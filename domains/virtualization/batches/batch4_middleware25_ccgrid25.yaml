- id: VIRT-MIDDLEWARE25-12
  title: "MVTEE: Multi-Variant Trusted Execution for Secure Model Inference"
  title_correction: null
  authors: ["Kailun Qin", "Dawu Gu"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3730956
  official_url: https://dl.acm.org/doi/10.1145/3721462.3730956
  fullpaper_source: https://kailun-qin.github.io/files/mvtee_middleware25.pdf
  classification: SUPPORT
  classification_note: "The headline contribution is multi-variant execution for integrity, with TEEs as substrate — but it is directly useful for explaining CORE confidential-computing designs because it exercises the SGX-enclave versus TDX-confidential-VM boundary as an explicit diversity dimension and builds an attestation-gated, cross-TEE monitor architecture."
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T1, T5]
  physical_resource: CPU core
  logical_abstraction: "A model-inference service made of N diversified variants, each in its own TEE, with a separate small-TCB monitor TEE that votes on their agreement at graph checkpoints"
  problem: "A TEE protects a model against the platform owner but, by design, does nothing about software vulnerabilities and fault attacks inside the enclave's own ML framework and libraries — so TEE-protected inference can give a false sense of integrity."
  mechanism: "MVTEE diversifies at three levels: model graph (dummy/equivalent operators, channel manipulation, selective optimization over ONNX), inference instance (different frameworks, ONNX Runtime execution providers, TVM-compiled variants) and system (sanitizers/ASLR, and TEE-level variants — SGX enclave versus TDX confidential VM — plus ABI/ISA diversification). A random-balanced min-cut partitioning of the DNN graph inserts checkpoints; a monitor TEE compares variant outputs at checkpoints with a configurable metric (cosine similarity, MSE, max absolute difference, toleranced assertions) and a voting rule (unanimous consent by default)."
  isolation_mechanism: "One-to-one mapping of variant to TEE to process, with the monitor in a separate TEE so a compromised variant cannot reach it; a two-stage bootstrap loads a public init-variant first and only after remote attestation does the monitor release a variant-specific key that decrypts that variant's private files and second-stage manifest, so an untrusted orchestrator never learns the MVX configuration."
  multiplexing_mechanism: "N variants are run per inference request; the async/pipelined mode overlaps variant execution across graph partitions so the CPU is multiplexed between variants instead of stalling on the slowest."
  state_mechanism: "Per-variant keys and encrypted filesystems, RA-TLS secure channels established after attestation, and sequence numbers for freshness; checkpoint intermediates cross the monitor boundary at partition cuts."
  overhead_bottleneck: "Checkpoint comparison plus encrypted-channel cost dominates: 13.6-50.7% in sequential mode and 50.4-93.6% in pipelined mode; full 5-partition MVX collapses throughput."
  primary_tradeoff: "N-variant execution inside N TEEs with a monitor TEE -> gains integrity against in-enclave memory-safety bugs and fault attacks but costs N-fold compute, checkpoint synchronisation and a large latency penalty unless pipelined and selectively applied."
  quantitative_claims:
    - "sequential execution: throughput down 1.7-62.2%, latency up 1.7-164.3% as partition count grows (dual-socket Xeon Gold 6354, 378GB RAM, 128GB SGX EPC, SGX + Gramine 1.7, Ubuntu 22.04; EfficientNet-b7/GoogleNet/InceptionV3/MnasNet/MobileNetV3/ResNet-50/ResNet-152, fp32, batch 1, 3x224x224)"
    - "pipelined execution: throughput 1.7-5.4x baseline and latency 63.4-84.4% lower than the sequential-partitioned configuration"
    - "encryption + checkpointing overhead: 13.6-50.7% sequential, 50.4-93.6% pipelined"
    - "selective MVX (one partition activated): throughput 1.7-3.8x, latency 0.3-0.6x in pipelined execution; latency still 18.7-128.5% above baseline in sequential mode"
    - "full 5-partition MVX: throughput ~0.3x and latency >3x baseline"
    - "asynchronous mode gains: throughput +5.2-34.2% sequential and +3.1-17.8% pipelined; latency -5-25.6% and -3.1-15.2%"
  why_useful_for_learning: "It is an unusually explicit statement of what a CPU TEE does not cover, and it treats 'enclave versus confidential VM' as a design variable rather than a given — exactly the distinction a confidential-computing learner needs."
  priority: P2

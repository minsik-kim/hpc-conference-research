  classification: DROP
  classification_note: "Technically this is a syscall-interposition boundary mechanism (the brief's CORE case), but the official Middleware 2025 program labels it a short paper, so it is excluded from the regular-research corpus on publication criteria alone."
  drop_reason: publication_criterion
  taxonomy_primary: T5
  taxonomy_secondary: [T10]
  physical_resource: CPU core
  logical_abstraction: "A user-space hook that sees every system call an unmodified ARM64 binary issues, with no kernel feature and no source access"
  problem: "Syscall interposition techniques built around x86 syscall/sysenter rewriting (zpoline and successors) do not carry over to ARM64, where the svc instruction has a different encoding and branch-range constraints, and the portable alternative (ptrace) is orders of magnitude too slow."
  mechanism: "Before main() runs, svc-hook scans the loaded target's code, computes reachable branch ranges, emits a per-site trampoline, and replaces every svc instruction with a b (branch) to its trampoline; the trampoline saves CPU context, calls the hook function from a library named by the LIBSVCHOOK environment variable, restores context and returns to the instruction after the svc."
  isolation_mechanism: "All system calls are funnelled into the hook library, which is where a sandbox or policy layer would be implemented; svc-hook itself supplies the interception, not a policy."
  multiplexing_mechanism: N/A
  state_mechanism: "Rewrite state (per-site trampolines and the rewritten code pages) lives in the target process image; hook state lives in the loaded hook library."
  overhead_bottleneck: "Per-call trampoline context save/restore; the cost being avoided is the ptrace stop/resume round trip through the kernel."
  primary_tradeoff: "Per-site trampolines with a plain branch instruction -> gains ARM64 interception at roughly native branch cost, but costs a code-scanning/rewriting pass whose correctness depends on distinguishing code from data (the same pitfall class Clair Obscur enumerates)."
  quantitative_claims:
    - "reported as ~1000x faster than ptrace (artifact documentation; the paper's own measured setup was not accessible)"
  why_useful_for_learning: "It is the ARM64 half of the syscall-interposition story: reading it next to Clair Obscur shows how much of an interposition design is architecture-specific instruction encoding rather than policy."

- id: VIRT-MIDDLEWARE25-01
  title: "Clair Obscur: The Light and Shadow of System Call Interposition – From Pitfalls to Solutions with K23"
  title_correction: 'seed list said: "Clair Obscur: The Light and Shadow of System Call Interposition - From Pitfalls to Solutions with K23" (hyphen instead of en dash; official proceedings prints an en dash and the paper PDF adds an asterisk after "Obscur")'
  authors: ["Jesús María Gómez Moreno", "Vissarion Moutafis", "Antreas Dionysiou", "Bart Coppens", "Georgios Smaragdakis", "Fernando Kuipers", "Alexios Voulimeneas"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3770772
  official_url: https://dl.acm.org/doi/10.1145/3721462.3770772
  fullpaper_source: https://backoffice.biblio.ugent.be/download/01KCHA8SW28AMRGNSX0KZTGR6W/01KCHAJ5YGWQTVSTBCH09QJJVQ
  classification: CORE
  classification_note: "The contribution is the syscall-interposition boundary itself — a systematic pitfall taxonomy for ptrace/seccomp/SUD/zpoline/lazypoline plus K23, a mechanism that guarantees exhaustive, non-bypassable interception, which is exactly the boundary sandboxes and introspection tools are built on."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T7, T10]
  physical_resource: CPU core
  logical_abstraction: "A complete, tamper-resistant user-space view of every system call a process issues, delivered to an in-process interposer library"
  problem: "No existing system call interposition mechanism is a general-purpose solution: each either misses system calls, can be silently disabled by the target, corrupts code/data through mis-disassembly, or costs far too much."
  mechanism: "Offline phase runs the application under a Syscall-User-Dispatch-based logger to enumerate the addresses of legitimate syscall/sysenter instructions in non-writable executable regions. Online phase uses a ptrace-based interposer to cover process startup and library loading (including vDSO), injects libK23 via LD_PRELOAD into a dedicated dlmopen namespace, performs a single selective zpoline-style rewrite of only pre-validated instruction addresses, and keeps an SUD fallback for anything missed."
  isolation_mechanism: "Every system call is funnelled through libK23, whose trampoline page at address 0 is made execute-only with Protection Keys for Userspace (PKU); LD_PRELOAD removal and prctl-based SUD disabling (the two known bypasses) are closed off, and a hash set of valid rewrite addresses prevents attacker-directed rewriting of data or partial instructions."
  multiplexing_mechanism: N/A
  state_mechanism: "Interposition state lives in the offline log (made immutable after the offline phase) plus libK23's in-process hash set, selector and dedicated interposer stack; the ptracer hands its state to libK23 at startup via fake system calls and process_vm_writev."
  overhead_bottleneck: "Per-syscall trampoline/dispatch cost on the rewritten fast path, and the pipeline of validity checks; SUD-only interception is the pathological case at 15.3x."
  primary_tradeoff: "Selective binary rewriting validated by an offline profiling pass -> gains near-zpoline speed with exhaustive, non-bypassable coverage, but costs an offline phase that needs representative inputs and leaves coverage dependent on that input quality."
  quantitative_claims:
    - "syscall microbenchmark (100M invocations of non-existent syscall 500, Xeon w5-3425, Ubuntu 22.04.5, Linux 6.8): K23-default 1.2788x native vs zpoline-default 1.1267x, lazypoline 1.3801x, SUD 15.3022x"
    - "macrobenchmark geometric-mean relative throughput vs native (nginx/lighttpd/redis/sqlite): K23-default 98.62%, zpoline-default 98.93%, lazypoline 98.26%, SUD 56.70%"
    - "redis with 6 I/O threads: K23-default 99.97% of native throughput"
    - "K23-ultra / ultra+ variants (NULL-execution checks + stack switching enabled): 1.3919x-1.3948x on the syscall microbenchmark"
    - "offline phase enumerated 7-44 unique syscall/sysenter instruction sites in coreutils, 20-92 in nginx..redis"
  why_useful_for_learning: "It is the cleanest single source on why a syscall boundary is hard to make both complete and cheap — the exact trade-off that decides whether a sandbox or lightweight-isolation design can rely on syscall interposition at all."
  priority: P1
  related: ["VIRT-MIDDLEWARE25-11", "zpoline", "lazypoline", "Syscall User Dispatch", "gVisor"]
  relations:
    - {type: SAME_BRANCH, target: "VIRT-MIDDLEWARE25-11", basis: "svc-hook solves the same interposition-by-binary-rewriting problem on ARM64 where K23's x86 syscall/sysenter rewriting does not apply"}
    - {type: PRECURSOR, target: "zpoline (ATC 2023)", basis: "K23 reuses zpoline's callq *%rax rewrite and address-0 trampoline but adds offline address validation"}
    - {type: PRECURSOR, target: "lazypoline", basis: "paper enumerates lazypoline's bypass (prctl), atomicity and I-cache pitfalls as motivation"}
    - {type: LAYER_ABOVE, target: "Linux Syscall User Dispatch / ptrace / seccomp", basis: "K23 composes all three kernel facilities rather than choosing one"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Read the Ghent University institutional-repository copy of the accepted paper (abstract, intro, pitfall taxonomy P1-P5, K23 design, implementation, evaluation tables, limitations). ACM DL PDF returns 403 through this environment."

- id: VIRT-MIDDLEWARE25-02
  title: "Full Trust Alchemist: Reforging Attestation for Cloud-based Confidential Workloads"
  title_correction: null
  authors: ["Anna Galanou", "Florian Lubitz", "Christof Fetzer", "Rüdiger Kapitza"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3770778
  official_url: https://dl.acm.org/doi/10.1145/3721462.3770778
  fullpaper_source: https://www.comsys.rwth-aachen.de/publication/2025/2025_galanou_trust-alchemist/
  classification: CORE
  classification_note: "The contribution is the attestation machinery of confidential VMs themselves: it replaces SEV-SNP's static boot-time measurement with policy-driven, context-aware attestation across the CVM lifecycle."
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T1, T9]
  physical_resource: CPU core
  logical_abstraction: "A confidential VM whose trustworthiness can be re-established continuously at runtime against a declarative policy, not only at boot measurement time"
  problem: "Confidential VMs give strong isolation from an untrusted cloud operator, but their attestation is limited to static boot-time measurements, so nothing about the workload's runtime state can be proven to a relying party."
  mechanism: "A policy-driven attestation layer inside the CVM built on eBPF programs and Linux Security Module hooks, so that security-relevant events during the CVM's lifetime can be measured and matched against a dynamically managed policy; demonstrated for secure software supply chains and multi-tenant cloud workloads on AMD SEV-SNP."
  isolation_mechanism: "AMD SEV-SNP hardware memory encryption and integrity for the guest, with the attestation report extended by in-guest eBPF/LSM-collected runtime evidence so a remote verifier can bound what the guest may have done."
  multiplexing_mechanism: N/A
  state_mechanism: "Attestation evidence accumulates inside the CVM (guest-resident measurement/policy state) rather than only in the boot-time launch measurement held by the AMD-SP; not established from the abstract how that state is anchored across reboot or migration."
  overhead_bottleneck: "UNKNOWN — not establishable from the abstract; expected cost is the eBPF/LSM hook path on security-relevant events plus attestation report generation."
  primary_tradeoff: "Runtime, policy-driven attestation -> gains context-aware trust decisions over the whole CVM lifecycle but costs a larger in-guest TCB (eBPF + LSM + policy engine) and per-event measurement overhead."
  quantitative_claims: []
  why_useful_for_learning: "It shows where the confidential-VM abstraction actually stops — hardware gives you an encrypted, measured boot, and everything about runtime trust has to be rebuilt in software inside the guest."
  priority: P1
  related: ["VIRT-MIDDLEWARE25-12", "Trustworthy confidential virtual machines for the masses (Middleware 2023)", "AMD SEV-SNP attestation"]
  relations:
    - {type: SAME_BRANCH, target: "VIRT-MIDDLEWARE25-12", basis: "both harden TEE-protected workloads beyond what the hardware attestation alone guarantees"}
    - {type: LAYER_BELOW, target: "AMD SEV-SNP", basis: "builds directly on SEV-SNP launch measurement and attestation reports"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, program-only]
  confidence: MEDIUM
  notes: "Access failure: ACM DL PDF and abstract pages both 403 through this environment; RWTH Publications record returned empty; ResearchGate 429. Only the author-hosted abstract on the RWTH COMSYS group page was obtained, so design/eval fields are deliberately thin or UNKNOWN."

- id: VIRT-MIDDLEWARE25-03
  title: "Tiaccoon: Unified Access Control with Multiple Transports in Container Networks"
  title_correction: null
  authors: ["Hiroya Onoe", "Daisuke Kotani", "Yasuo Okabe"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3770783
  official_url: https://dl.acm.org/doi/10.1145/3721462.3770783
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3721462.3770783
  classification: SUPPORT
  classification_note: "A container-networking mechanism: it keeps the overlay network's access-control semantics while swapping the transport underneath, which the brief places in SUPPORT — but it sits right on the CORE boundary because the unified socket abstraction is itself a virtual-network layer replacing the overlay."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T5, T9]
  physical_resource: NIC
  logical_abstraction: "A single socket-level connection abstraction for containers whose policy semantics are transport-independent, backed by TCP/IP, UNIX domain sockets or RDMA as appropriate"
  problem: "Container overlay networks enforce network access policy but are slow; faster transports (UDS, RDMA) each have scenario-specific limits, and applications cannot pick a transport freely without losing consistent policy enforcement."
  mechanism: "Tiaccoon intercepts the socket API calls a containerised process makes, applies the access-control policy to the connection at that point, and then transparently replaces the established connection with a faster inter-container transport link."
  isolation_mechanism: "Policy decisions are taken once, at the intercepted socket API boundary, so the same access-control rules hold regardless of which transport carries the bytes; the fast transport is only established after the policy check."
  multiplexing_mechanism: "Multiple containers on a host share the NIC and host network stack; Tiaccoon short-circuits intra-host pairs onto UDS and RDMA-capable pairs onto RDMA instead of forcing all traffic through the overlay datapath."
  state_mechanism: "Connection/policy binding state lives in the interposition layer alongside the container's socket state; migration behaviour is not described in the material obtained."
  overhead_bottleneck: "The overlay network datapath (encapsulation plus extra user/kernel transitions) is the cost Tiaccoon removes; the residual cost is the socket-API interception and connection-replacement handshake."
  primary_tradeoff: "Intercepting sockets to swap transports -> gains near-host-network throughput, latency and CPU efficiency while preserving access control, but costs an interposition layer that must understand every transport's semantics."
  quantitative_claims:
    - "throughput, latency and CPU efficiency comparable to a native host network and substantially better than traditional container overlay implementations (magnitudes not obtained; only the abstract was accessible)"
  why_useful_for_learning: "It makes concrete why container network virtualization costs what it costs, and shows the standard escape hatch — keep the policy plane, bypass the virtualized datapath."
  priority: P2
  related: ["Grafting sockets for fast container networking (ANCS 2018)", "NetKernel", "VXLAN/Geneve overlays"]
  relations:
    - {type: ALTERNATIVE, target: "VXLAN/Geneve container overlay networks", basis: "Tiaccoon replaces the overlay datapath while keeping its policy semantics"}
    - {type: SAME_BRANCH, target: "Grafting sockets for fast container networking (ANCS 2018)", basis: "same socket-level transport substitution idea for containers"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: "Access failure: ACM DL 403 (both /doi/ and /doi/pdf/); no preprint or author-hosted copy found. Abstract reconstructed from OpenAlex. Classification is SUPPORT but flagged as a CORE-boundary case for the orchestrator."

- id: VIRT-MIDDLEWARE25-04
  title: "Roadrunner: Accelerating Data Delivery to WebAssembly-Based Serverless Functions"
  title_correction: null
  authors: ["Cynthia Marcelino", "Thomas Pusztai", "Stefan Nastic"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3770777
  official_url: https://dl.acm.org/doi/10.1145/3721462.3770777
  fullpaper_source: https://arxiv.org/pdf/2511.01888
  classification: SUPPORT
  classification_note: "The mechanism is the cost of crossing the WebAssembly sandbox boundary: Roadrunner re-plumbs how data enters and leaves Wasm linear memory, which is the standard 'make the isolation boundary cheap' lever rather than a new isolation abstraction."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8, T3]
  physical_resource: DRAM
  logical_abstraction: "A near-zero-copy data path between a Wasm sandbox's linear memory and the outside world, exposed to functions as ordinary memory reads/writes"
  problem: "Stateless serverless functions exchange data through remote services, so every hand-off costs serialization/deserialization, multiple copies and user/kernel transitions — overhead that dominates short Wasm function invocations."
  mechanism: "An OCI-compliant sidecar shim owns the Wasm VM lifecycle and mediates all function ingress/egress. Functions in the same workflow share a Wasm VM and read/write each other's data directly in linear memory via host APIs (read_memory_host, write_memory_host, allocate_memory, deallocate_memory); across processes the shim uses UNIX domain sockets, and across nodes it uses splice()/vmsplice() to move data between user memory and kernel buffers without serialization."
  isolation_mechanism: "Wasm's own linear-memory sandbox plus shim-mediated access control: only pre-registered memory regions are reachable, the shim bounds-checks every access, and only functions of the same workflow and tenant are co-located in one Wasm VM. The authors concede the model targets trusted single-tenant workflows."
  multiplexing_mechanism: "One Wasm VM is shared by the functions of a workflow (same tenant), so the sandbox is the unit of multiplexing rather than one sandbox per function."
  state_mechanism: "Data lives in the Wasm instance's linear memory and in shim-registered regions; the design is stateless across invocations and state management is explicitly future work."
  overhead_bottleneck: "Serialization plus copy/context-switch cost of the Wasm host boundary; after Roadrunner the residual 'Wasm IO' cost to reach host data is 8-20% of latency, and over the network the link itself dominates."
  primary_tradeoff: "Co-locating a workflow's functions in one Wasm VM with direct linear-memory access -> gains large latency/throughput/CPU wins but costs the per-function isolation boundary (single-tenant assumption) and restricts functions to languages with direct memory control (C/Rust, not Java/Python)."
  quantitative_claims:
    - "intra-node user-space: latency 44-89% lower than WasmEdge and 10-80% lower than RunC; throughput 64x WasmEdge and 3x RunC; CPU up to 94% lower than WasmEdge (2 VMs, 4 vCPU 2GHz, 8GB, Ubuntu 22.04, Intel Xeon Skylake; chained 2-function workflows, 1-500MB payloads)"
    - "intra-node kernel-space: latency 76-83% lower than WasmEdge, ~13% lower than RunC; throughput 4x RunC"
    - "inter-node (100 Mbps, ~1ms RTT via tc): total latency 62% lower than WasmEdge and 7% lower than RunC; serialization overhead 97% lower than WasmEdge, 46% lower than RunC; throughput 2.8x WasmEdge"
    - "inter-node resources: CPU up to 85% lower and memory up to 25% lower than WasmEdge"
  why_useful_for_learning: "It quantifies the tax of a language-level sandbox boundary on the data path, and shows how quickly relaxing per-function isolation buys performance — the same bargain container-based FaaS makes with pooled sandboxes."
  priority: P2
  related: ["VIRT-MIDDLEWARE25-05", "VIRT-MIDDLEWARE25-06", "WasmEdge", "Faasm"]
  relations:
    - {type: TRADEOFF_PAIR, target: "VIRT-MIDDLEWARE25-05", basis: "both trade Wasm's cheap isolation against native/container execution speed, from opposite directions"}
    - {type: USES_MECHANISM_FROM, target: "WasmEdge", basis: "implemented as host-function extensions over the WasmEdge runtime"}
    - {type: CONTRASTS_WITH, target: "Faasm (ATC 2020) software-fault-isolation shared memory", basis: "same shared-linear-memory idea, different safety argument"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, paper]
  confidence: HIGH
  notes: "Read arXiv:2511.01888 (the authors' preprint of the Middleware'25 paper): abstract, design, implementation, evaluation setup and results, limitations."

- id: VIRT-MIDDLEWARE25-05
  title: "A Hybrid Runtime for Function-as-a-Service at the Edge"
  title_correction: null
  authors: ["Adam Hall", "Umakishore Ramachandran"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3770785
  official_url: https://dl.acm.org/doi/10.1145/3721462.3770785
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3721462.3770785
  classification: SUPPORT
  classification_note: "It is a serverless-isolation-runtime mechanism — RUNE composes container-based and WebAssembly-based isolation so the cold-start/execution-speed trade-off can be resolved per invocation — which is the 'make isolation cheap' side of the brief's serverless rule, not a new isolation boundary."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8]
  physical_resource: CPU core
  logical_abstraction: "A single FaaS runtime handle that can be backed either by a container instance (fast steady-state execution) or a Wasm instance (fast cold start, low memory)"
  problem: "Container-based FaaS pays cold-start latency, and the usual fix — pre-warming and keeping idle containers alive — wastes the resources an edge site does not have; WebAssembly starts far faster but executes more slowly and cannot simply replace containers."
  mechanism: "RUNE (RUNtime for FaaS at the Edge) runs both isolation runtimes under one platform and combines their strengths, serving invocations from the Wasm path when cold-start latency dominates and from the container path when execution speed dominates."
  isolation_mechanism: "Two isolation boundaries are used side by side: OS-level container isolation (namespaces/cgroups) and the WebAssembly language-level sandbox; the platform chooses which boundary hosts a given invocation."
  multiplexing_mechanism: "Idle capacity is multiplexed by not holding warm containers open: cheap Wasm instances absorb bursts, so the same edge node serves more functions per unit of memory."
  state_mechanism: "Function instance state lives in whichever runtime is serving the invocation; how (or whether) state crosses between the container and Wasm backings is not establishable from the abstract."
  overhead_bottleneck: "Cold-start latency for containers versus in-sandbox execution speed for Wasm; keep-alive memory footprint is the resource cost being attacked."
  primary_tradeoff: "Two isolation runtimes under one platform -> gains 99th-percentile latency and memory efficiency but costs platform complexity and a function that must be deployable under both runtimes."
  quantitative_claims:
    - "tail latency at the 99th percentile reduced by more than half, with improved memory utilisation of the underlying platform (abstract-level claim; hardware/workload qualifiers not obtained)"
  why_useful_for_learning: "It is the clearest statement of the cold-start-versus-execution-speed trade-off between OS-level and language-level isolation, which is the fork every lightweight-isolation design has to take."
  priority: P2
  related: ["VIRT-MIDDLEWARE25-04", "VIRT-MIDDLEWARE25-06", "Firecracker", "WasmEdge"]
  relations:
    - {type: TRADEOFF_PAIR, target: "VIRT-MIDDLEWARE25-04", basis: "Roadrunner attacks Wasm's data-path cost; RUNE attacks Wasm's execution-speed cost by falling back to containers"}
    - {type: ALTERNATIVE, target: "microVM snapshot/restore (Firecracker-style)", basis: "a different answer to the same cold-start problem — cheap restore of a heavier boundary instead of a lighter boundary"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: "Access failure: ACM DL 403; no preprint on arXiv; the first author's advisor's publication page lists the paper without a PDF. Abstract from OpenAlex (which carries the full abstract for this record). System name RUNE comes from the abstract."

- id: VIRT-MIDDLEWARE25-06
  title: "FaaSImage: An Efficient Image Manager for FaaS"
  title_correction: null
  authors: ["Abhisek Panda", "Smruti R. Sarangi"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3730951
  official_url: https://dl.acm.org/doi/10.1145/3721462.3730951
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3721462.3730951
  classification: SUPPORT
  classification_note: "A container image/runtime mechanism — it modifies Docker's layered image architecture and fetch path to cut cold start — which the brief places in SUPPORT rather than CORE (no change to the isolation boundary itself)."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8]
  physical_resource: NVMe
  logical_abstraction: "A container image whose contents are laid out and fetched so that a function can start before the whole image is materialised"
  problem: "Cold start latency contradicts the premise of millisecond-scale stateless functions, and a large share of it is spent materialising the container image."
  mechanism: "FaaSImage restructures the Docker image manager. The paper positions itself against the two existing lines — fusing Docker layers into a flatter image, and on-demand (lazy) fetching of image data — and proposes an image manager that improves on both."
  isolation_mechanism: "N/A — the container isolation boundary is unchanged; only image storage/fetch is reworked."
  multiplexing_mechanism: "Shared image content across function instances (layer/block sharing) is the resource being multiplexed."
  state_mechanism: "Image state lives in the registry and the local image store; the per-instance writable layer sits on top, as in stock Docker."
  overhead_bottleneck: "Image pull and materialisation time (and the duplicate work that layer fusing versus lazy fetching each leave behind) inside cold-start latency."
  primary_tradeoff: "Reworking image layering/fetch -> gains lower cold-start latency but costs deviation from the standard OCI image path and its tooling."
  quantitative_claims: []
  why_useful_for_learning: "It isolates the part of 'cold start' that is really a storage/image problem rather than an isolation problem — a distinction the brief asks you to keep separate."
  priority: P2
  related: ["VIRT-MIDDLEWARE25-05", "Slacker (FAST 2016)", "SOCK (ATC 2018)", "DADI / lazy image pulling"]
  relations:
    - {type: SAME_BRANCH, target: "Slacker: fast distribution with lazy docker containers (FAST 2016)", basis: "FaaSImage's own framing sets it against on-demand image fetching work"}
    - {type: LAYER_BELOW, target: "VIRT-MIDDLEWARE25-05", basis: "image materialisation is one of the cold-start components a hybrid runtime tries to avoid paying"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web]
  confidence: MEDIUM
  notes: "Access failure: ACM DL 403; no preprint found. OpenAlex holds only a truncated abstract (it stops after the related-work framing), so mechanism detail and all numbers are absent. Records no quantitative claims rather than guessing."

- id: VIRT-MIDDLEWARE25-07
  title: "WasmEye: Language- and Platform-independent Anomaly Detection for WebAssembly"
  title_correction: null
  authors: ["Arne Vogel", "Timothee Glörfeld", "Alexander Szekely-Schenker", "Thomas Trenner", "Rene Ermler", "Rüdiger Kapitza"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3730957
  official_url: https://dl.acm.org/doi/10.1145/3721462.3730957
  fullpaper_source: https://api.openalex.org/works/doi:10.1145/3721462.3730957
  classification: CONTEXT
  classification_note: "Monitoring and anomaly detection over Wasm modules running on someone else's isolation boundary; it observes the sandbox rather than constructing or changing it."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T7]
  physical_resource: CPU core
  logical_abstraction: "A behavioural profile of a Wasm module that is independent of source language and host platform"
  problem: "WebAssembly is now used across IoT, edge and cloud, but existing anomaly-detection approaches either break Wasm's platform/source-language independence or only catch specific attack classes."
  mechanism: "WasmEye detects anomalies in Wasm modules from signals available at the Wasm abstraction level, so the same detector works regardless of the source language the module was compiled from or the host it runs on."
  isolation_mechanism: "Relies on the existing Wasm sandbox; WasmEye adds detection of bugs or malicious code that stay inside that sandbox."
  multiplexing_mechanism: N/A
  state_mechanism: "Detection state is the learned/observed module profile, held by the monitoring layer outside the module."
  overhead_bottleneck: "UNKNOWN — not establishable from the abstract; expected cost is instrumentation on the Wasm execution path."
  primary_tradeoff: "Observing at the Wasm level -> gains language and platform independence but costs visibility into host-specific or below-sandbox behaviour."
  quantitative_claims: []
  why_useful_for_learning: "Useful as the introspection counterpart to Wasm isolation: it shows what a Wasm sandbox does and does not let an operator see, which is the same question VM introspection answers for hypervisors."
  priority: P3
  related: ["VIRT-MIDDLEWARE25-04", "VM introspection"]
  relations:
    - {type: LAYER_ABOVE, target: "VIRT-MIDDLEWARE25-04", basis: "operates over Wasm-based deployments of the kind Roadrunner accelerates"}
    - {type: ALTERNATIVE, target: "VM introspection", basis: "same observe-a-guest-from-outside problem at the language-sandbox level instead of the hypervisor level"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web]
  confidence: MEDIUM

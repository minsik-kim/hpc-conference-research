  logical_abstraction: "A placement of container-based microservice replicas across edge and cloud nodes, revised only when response time says it must be"
  problem: "Edge-cloud microservice deployments hit unexpected peak loads with limited compute and bandwidth, causing SLO violations, and the underlying node and network state keeps changing so a one-off placement will not hold."
  mechanism: "A Placer clusters frequently interacting microservices into groups and places the groups worst-fit; a Rescheduler watches recent request response times to decide whether rescheduling is warranted and which nodes are better, explicitly minimising the number of reschedules."

  overhead_bottleneck: "Duplicate page-cache footprint of shared blocks in existing CoW clones, and the metadata/indirection cost of the cloning layer itself."
  primary_tradeoff: "A pluggable cloning layer with deferred processing -> gains cloning on filesystems that lack it plus memory-efficient sharing, but costs an extra indirection layer and a consistency/recovery burden the filesystem did not previously carry."

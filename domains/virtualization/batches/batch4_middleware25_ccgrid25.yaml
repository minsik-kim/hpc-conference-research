  classification: CONTEXT
  classification_note: "A storage system that serverless functions consume; the virtualization content is limited to the policies it exposes (image caching, warm-container keep-alive) rather than any isolation or virtual-resource mechanism it builds."
  drop_reason: null
  taxonomy_primary: T8

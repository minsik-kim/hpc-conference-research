- id: VIRT-MIDDLEWARE25-08
  title: "Capybara: an Edge-Friendly Distributed Object Store for Diverse Serverless Functions"
  title_correction: null
  authors: ["Xin Chen", "Manoj Prabhakar Paidiparthy", "Chen Qian", "Liting Hu"]
  venue: Middleware
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3721462.3730946
  official_url: https://dl.acm.org/doi/10.1145/3721462.3730946

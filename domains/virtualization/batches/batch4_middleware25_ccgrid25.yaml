  problem: "MIG makes a physical GPU divisible into hardware-isolated instances, but the partition layout is normally fixed, so a datacenter either wastes capacity on a badly matched layout or pays the cost of repartitioning; the paper asks how often and how to re-cut partitions to minimise energy without unacceptable job tardiness."

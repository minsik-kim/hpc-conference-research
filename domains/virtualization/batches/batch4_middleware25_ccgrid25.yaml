  problem: "Building and managing hybrid quantum-classical applications that span x86/ARM classical logic and quantum circuit blocks across public and private clouds with different capabilities, costs and queue times is hard, and the available circuit-level optimizations expose cost/time/accuracy/parallelism trade-offs that developers must navigate by hand."
  mechanism: "A framework layered on the authors' XFaaS workflow system that composes quantum-classical FaaS workflows from workflow patterns and applies cloud-system optimizations (workflow partitioning across clouds, adaptive polling of quantum job queues) alongside quantum-circuit optimizations (circuit cutting, qubit reuse) from the IBM Qiskit toolchain, with detailed experimental profiling on AWS, Azure and IBM quantum hardware and simulators."

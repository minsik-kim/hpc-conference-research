  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: []
  physical_resource: DRAM
  logical_abstraction: A tiered memory system (fast local DRAM plus slower NUMA/CXL memory) in which pages/objects are placed by predicted performance impact rather than by raw access frequency
  problem: Hotness-based tiered-memory policies promote frequently-accessed pages to the fast tier, but frequent access does not necessarily mean performance-critical access - memory-level parallelism (MLP) can hide the latency of a "hot" page's misses, so hotness-based placement leaves performance on the table and wastes migration bandwidth, with impact varying up to 4x across workloads.
  mechanism: 'The paper introduces Amortized Offcore Latency (AOL = latency / MLP) as a performance-criticality metric instead of raw access frequency. Soar (static) uses one offline profiling run to rank objects by call-chain-tracked AOL contribution and places performance-critical objects on the fast tier ahead of time; Alto (dynamic) tracks live AOL via hardware performance counters at ~1s intervals and throttles or enables page promotions based on current memory-access overlap, and can be layered onto existing tiering systems (TPP, Nomad, NBT, Colloid) to change their migration policy rather than replace their mechanism.'
  isolation_mechanism: N/A - pages/objects are distinguished by address range and allocation call-chain for placement purposes only; there is no security or tenant isolation boundary.
  multiplexing_mechanism: Fast-tier capacity is multiplexed across objects/pages by AOL-ranked static placement (Soar) or by dynamically throttling which pages are allowed to migrate based on current AOL-inflation from bandwidth contention (Alto), rather than by a first-come or pure-recency policy.
  state_mechanism: Soar maintains per-object metadata (lifespan, virtual address, size, allocation type) and an accumulated performance score from offline profiling; Alto maintains a runtime AOL estimate from periodic hardware-counter sampling that governs migration-intensity decisions; neither maintains any hypervisor- or guest-physical-layer state.
  overhead_bottleneck: Page migration itself costs about 12us per page, so mis-prioritized migrations (moving pages that are hot but not performance-critical) directly erode or negate tiering's benefit; under heavy memory-bandwidth contention, queuing delay inflates the AOL signal itself, requiring threshold recalibration to keep Alto effective.
  primary_tradeoff: Performance-criticality-aware placement (AOL) instead of hotness-based placement -> substantially reduces slowdown and migration counts for workloads where MLP masks pure hotness, but Soar requires an offline profiling pass and Alto's thresholds are hardware-dependent and need manual recalibration under high bandwidth contention.
  quantitative_claims:
  - 'Soar on bc-urand (GAPBS, SKX/NUMA), 90% slow-tier ratio: <20% slowdown vs baselines; outperforms Nomad by 14-547%, NBT by 4-79%, TPP by 31-1242%'
  - 'across 8 realistic graph/ML/HPC workloads: Soar slowdown 4-18% vs baseline systems'' 6-1246% slowdown'

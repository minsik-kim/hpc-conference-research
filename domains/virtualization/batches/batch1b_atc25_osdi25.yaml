- id: VIRT-ATC25-14
  title: 'Para-ksm: Parallelized Memory Deduplication with Data Streaming Accelerator'
  title_correction: null
  authors:
  - Houxiang Ji
  - Minho Kim
  - Seonmu Oh
  - Daehoon Kim
  - Nam Sung Kim
  venue: ATC

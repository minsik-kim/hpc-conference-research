  classification: CORE
  classification_note: The paper's contribution is a redesign of same-page memory deduplication (Linux KSM), which the brief's T2 taxonomy explicitly names as a CORE memory-virtualization mechanism (guest memory dedup/reclamation) for reducing VM/container memory footprint.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: []
  physical_resource: DRAM
  logical_abstraction: A pool of physical memory pages behind co-located VMs/processes, from which content-identical pages are found and merged into one copy-on-write page without the host CPU paying the full scan cost
  problem: Linux KSM's page-comparison (memcmp) and checksum (xxhash) scanning consumes 14-65% of a CPU core and pollutes the cache hierarchy, degrading co-running tenants even as it saves memory that is 30-50% of server hardware cost.
  mechanism: 'Para-ksm offloads memcmp and xxhash to Intels on-chip Data Streaming Accelerator (DSA). A naive per-page offload (DSA-ksm) suffers 2.6-2.7x higher per-operation latency than CPU due to submission overhead, so Para-ksmC batches 256 consecutive KSM candidate pages into one DSA descriptor, exploiting the proven property that red-black-tree rebalancing does not change a candidate pages predecessor/successor (P1), and uses a hash table to insert batch results into the stable/unstable trees without sequential dependency; DSA accesses guest/process virtual memory directly via its on-chip Address Translation Cache coordinated with the IOMMU, avoiding memory pinning.'
  isolation_mechanism: N/A - operates within the existing Linux KSM kernel mechanism and does not add a new isolation boundary; DSA memory access is scoped by IOMMU-mediated address translation.
  multiplexing_mechanism: DRAM is multiplexed across co-located VMs/processes by merging content-identical anonymous pages into shared copy-on-write pages, freeing physical memory for other tenants; the DSA work-queue/processing-engine hardware (one WQ group, four PEs in the evaluated config) is itself time-shared across offloaded batches.
  state_mechanism: Deduplication metadata (stable/unstable red-black trees keyed by page content) lives in the kernel as in stock KSM; Para-ksmC adds per-batch predecessor/successor search-result structures and a hash table for lock-free-style batched tree insertion, all in kernel memory.
  overhead_bottleneck: For naive DSA offload, communication/submission latency per single-page descriptor dominates (2.6-2.7x slower than CPU per operation) until batching (256 pages) amortizes it; for Para-ksmC, CPU-side intra-batch comparison and successor/predecessor bookkeeping remain the residual cost, explaining its higher CPU utilization than pure DSA-ksm.
  primary_tradeoff: Batched DSA offload of comparison/checksum -> cuts KSM's CPU cost (from 48.2% to 31.0% utilization, Para-ksmC) and reduces application slowdown (from 3.3x to 2.1x geometric mean), but recovers less memory-savings efficiency than a naive full-DSA offload variant, which itself saves far more CPU (7.3%) at the cost of far slower memory-savings accumulation (12% of CPU-ksm's savings initially).
  quantitative_claims:
  - 'application slowdown (geometric mean, normalized to no-KSM): 3.3x (CPU-ksm) vs 1.3x (DSA-ksm) vs 2.1x (Para-ksmC)'
  - 'CPU utilization (geometric mean): 48.2% (CPU-ksm) vs 7.3% (DSA-ksm) vs 31.0% (Para-ksmC)'
  - 'deduplication efficiency (memory saved per CPU cycle) vs CPU-ksm: DSA-ksm 5-65%, Para-ksmC 1.3-1.5x higher'
  - 'memory saved after 200s on Liblinear: ~18GB (CPU-ksm) vs ~2GB/12% initial (DSA-ksm) vs ~17.8GB, comparable by end (Para-ksmC)'

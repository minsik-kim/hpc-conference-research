  classification: SUPPORT
  classification_note: Remote attestation is the trust-establishment mechanism confidential-VM/TEE papers in this corpus depend on to prove a client is really talking to an unmodified guest inside a genuine TEE; this paper's TLS integration explains that mechanism's cost and failure-independence design without itself building a new virtualization abstraction.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: A standard TLS 1.3 connection whose handshake also cryptographically proves it terminates inside a specific attested TEE (confidential VM or discrete/firmware TPM), without a second encryption layer or extra round trip
  problem: Establishing a secure channel to a TEE requires proving the channel actually terminates inside the TEE, but prior designs either add handshake round trips/extra encryption layers (nested channels) or lose independence between the TLS certificate key and the attestation root of trust, so compromising one breaks the guarantee of the other.
  mechanism: 'TLS+RA extends the TLS 1.3 handshake messages (client hello carries an attestation request/nonce, the certificate message carries the attestation report) and computes a "linking hash" over the handshake transcript plus the mandatory ephemeral Diffie-Hellman shared secret, which is sent to the attestation root of trust as its challenge; the resulting attestation report and the ordinary TLS-key-signed transcript hash form two independently-rooted cryptographic bindings to the same session, so compromising either the TLS private key or the attestation root of trust alone does not forge the other bond.'
  isolation_mechanism: Trust is anchored in whichever TEE (AMD SEV-SNP CVM, firmware TPM, or discrete TPM) generates the attestation report, and the paper's threat model tolerates compromise of either the TLS key or the attestation root of trust but not both simultaneously.
  multiplexing_mechanism: N/A - this is a point-to-point handshake protocol extension, not a resource-sharing mechanism.
  state_mechanism: Per-session ephemeral state (fresh DHE key material, the derived linking hash) is generated per connection and included in the attestation report; no long-lived virtualization state is created or migrated.
  overhead_bottleneck: Attestation report generation dominates handshake latency and varies hugely by hardware root of trust - about 6ms for AMD SEV-SNP versus about 210ms for a discrete TPM - with report size growing the handshake from 1.5KiB to 6.4KiB for the firmware-TPM case.
  primary_tradeoff: Embedding attestation directly in the TLS handshake with a dual-linking hash -> avoids the round-trip and double-encryption cost of nested attested channels and needs no PKI changes, but accepts attestation-generation latency on the critical path, which is severe for discrete-TPM roots of trust and only partly hidden by network latency.
  quantitative_claims:
  - 'handshake latency (co-located, loopback): SEV-SNP ~24ms (TLS+RA) vs ~10ms baseline TLS; discrete TPM ~230ms (TLS+RA) vs ~20ms baseline'
  - 'with 80ms one-way network delay: SEV-SNP overhead drops to 5%; discrete TPM overhead remains 1.3x'
  - 'nested-channel alternative: >100% overhead for SEV at >=10ms network latency; throughput ~0.02 GiB/s (dual encryption) vs ~2 GiB/s for both TLS and TLS+RA post-handshake'
  - 'attestation report generation time: ~6ms (AMD SEV-SNP), minimal (firmware TPM), ~210ms (discrete TPM)'
  - 'handshake message size growth: 1.5KiB (baseline TLS) to 6.4KiB (with firmware-TPM attestation report)'
  why_useful_for_learning: It quantifies the real cost of the attestation step that every confidential-VM/TEE CORE paper in this corpus assumes clients can cheaply verify, and shows the general pattern (dual cryptographic linking) for keeping a TLS channel's trust independent of the attestation root of trust.

  - T10
  physical_resource: CPU core
  logical_abstraction: A kernel extension written in a safe-Rust subset whose safety (memory bounds, exception handling, termination, stack safety) is guaranteed by the Rust compiler and a thin runtime, instead of by the eBPF verifier's symbolic execution
  problem: eBPF's verifier enforces safety by static analysis of compiled bytecode, but this creates a "language-verifier gap" - code that a high-level language's own type system already proves safe is often rejected or must be awkwardly refactored because the verifier's symbolic execution cannot follow it, especially as extensions grow large and complex.
  mechanism: Rex forbids unsafe Rust, forget, floating point and the std library in extensions, wraps eBPF helpers in a safe kernel-facing crate (kernel pointers become safe references or bounds-checked slices via generics/monomorphization), and adds a lightweight per-CPU runtime for the properties Rust's static checks cannot cover - custom stack unwinding with a per-CPU landing pad on panic, RAII-based (Drop trait) automatic release of kernel resources, and dedicated per-CPU 8-page extension stacks - with a dispatcher switching stack pointers and tracking whether the CPU is in extension code, a kernel helper, or panic handling.
  isolation_mechanism: Isolation is enforced by Rust's type system at compile time (bounds-checked/lifetime-checked references to kernel memory) rather than by the eBPF verifier at load time; a crash-stop model removes a panicked extension and cascades removal to programs sharing its maps, with RAII ensuring kernel resources it held are still released.
  multiplexing_mechanism: N/A in the resource-sharing sense - Rex assumes no nesting of extension programs and simply dispatches one extension's code at a time per hook, tracking per-CPU state of what is currently executing.
  state_mechanism: Kernel resources acquired by an extension are wrapped in RAII types; on panic, a per-CPU buffer of held resources is walked to release them before control returns to an in-kernel landing pad that resets context, so extension-held state cannot leak past the extension's lifetime.
  overhead_bottleneck: Wrapping-code overhead versus eBPF's JIT-inlined helpers, measured at 2-4ns extra per map lookup and about 1ns for setup/teardown across eight additional instructions - negligible next to real workload latency in the paper's macrobenchmark.
  primary_tradeoff: Compile-time language safety instead of load-time verifier analysis -> removes the eBPF instruction-count/branch limits and 72 documented verifier-workaround patterns the authors found in production code, but trusts the (larger) Rust compiler toolchain as part of the TCB and requires the extension author to use Rust.
  quantitative_claims:
  - 'code size: 326 lines (Rex-BMC) vs 513 lines (eBPF-BMC, split into 7 programs to fit verifier limits)'
  - 'throughput at 8 cores: 1.98M RPS (Rex-BMC) vs 1.92M RPS (eBPF-BMC), both 5.43x over userspace Memcached'
  - 'micro-overhead: ~50ns per spinlock resource-recording operation; 2-4ns extra per map lookup vs inlined eBPF; ~1ns setup/teardown difference'
  - 'eliminated verifier-workaround patterns found in production eBPF projects: 27 refactoring cases, 22 compiler-hinting workarounds, 15 verification-assistance changes'
  why_useful_for_learning: It is a precise illustration of trading a hardware/verifier-checked isolation boundary for a language-checked one at the kernel-extension layer, the same design axis Asterinas uses for whole-kernel services and bpftime uses for userspace eBPF.

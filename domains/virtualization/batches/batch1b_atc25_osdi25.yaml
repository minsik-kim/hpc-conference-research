  problem: Cloud quantum computing must juggle hardware constraints, noise/crosstalk errors and QPU heterogeneity at once, and naive resource management forces an unnecessary trade-off between fidelity and utilization/waiting time.
  mechanism: 'QOS is layered into four components - an error mitigator, a QPU-fidelity estimator, a multi-programmer, and a scheduler. The multi-programmer computes a compatibility score across candidate Qernels (effective utilization, entanglement ratio, parallelism) and bundles compatible ones onto disjoint qubit regions of one QPU (a "restrict" policy) or onto overlapping regions with transpilation to resolve conflicts (a "re-evaluation" policy), separated by up to two qubits of buffer to exploit the exponential decay of crosstalk with distance; the scheduler then orders bundled/solo jobs to trade fidelity against waiting time, and the estimator picks which QPU a job should run on.'

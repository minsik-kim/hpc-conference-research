- id: VIRT-OSDI25-01
  title: To PRI or Not To PRI, That's the Question
  title_correction: null
  authors:
  - Yun Wang
  - Liang Chen
  - Jie Ji
  - Xianting Tian
  - Ben Luo
  - Zhixiang Wei
  - Zhibai Huang

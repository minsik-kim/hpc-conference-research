batch_observations: >
  Both official USENIX technical-sessions HTML pages truncated mid-program when fetched directly by the
  page-summarization tool (ATC25 cut off partway through Tuesday afternoon, OSDI25 cut off at the start of
  the File and Storage Systems session); the complete, authoritative paper+author lists were instead
  obtained from the official proceedings table-of-contents PDFs (atc25_contents.pdf, osdi25-contents.pdf),
  which are shorter, cleaner documents that fetched in full and were used as the basis for both the venue
  population counts and the full-program keyword scan. Threshold calls actually made: (1) GPU/accelerator
  sharing papers (GPU-sharing-kernel-interception, GMI-DRL, GPreempt, Torpor, Resource-Multiplexing,
  Sirius/Colocating, XSched) were held to the brief's "CORE only if it is the virtual-GPU/accelerator
  abstraction itself, not merely a scheduler" line; only the kernel-space-interception paper (ATC25-03,
  which defines and enforces a persistent IGPU(s,t,m) instance abstraction) was judged CORE, the rest
  SUPPORT. (2) Container/serverless "mechanism vs consumption" line: image/layer-provisioning and
  container-partitioning papers (Poby, On-Demand Container Partitioning) were SUPPORT; papers whose stated
  contribution was scheduling/orchestration/leasing over an unmodified sandbox (Burst Computing, DeepServe,
  Stateful Serverless Workflows, BlitzScale) were CONTEXT; papers that changed the sandbox/isolation
  mechanism itself (LiteShield, MettEagle, Fork-in-the-Road's VM-fork+seed-tree, Deterministic Client,
  bpftime, Omniglot) were CORE or SUPPORT depending on how novel the mechanism itself was versus how much
  it was inherited (Fork-in-the-Road extends but does not invent VM-fork, so SUPPORT; MettEagle, Deterministic
  Client, bpftime and Omniglot each construct their isolation boundary directly, so CORE). (3) Kamino (VM
  admission-time placement/scheduling) was treated exactly like the already-classified VMR2L in batch1.yaml
  (SUPPORT, VM placement constrained by virtualization semantics, opposite lifecycle end from live
  migration) rather than CORE, since it never touches a virtualization mechanism itself. (4) FineMem and
  Tiered-Memory-Management-Beyond-Hotness were both explicit tests of the brief's disaggregation rule:
  neither builds a virtual/elastic memory abstraction over its pool (FineMem is a raw fine-grained
  malloc/free allocator; the tiering paper explicitly has "no VM involvement"), so both landed SUPPORT
  rather than CORE, while EMT (memory-translation-architecture OS framework) was DROPped outright because
  its authors state virtualization support is not yet implemented (future work), matching the brief's
  pure_virtual_memory DROP criterion precisely. (5) Quantum Virtual Machines (HyperQ) was kept CORE per
  instruction with existing_corpus_overlap set to hpc_quantum and the analysis scoped to its virtualization
  delta (qVM guest interface, space/time qubit multiplexing, physical-buffer-zone isolation, and the
  explicit absence of a quantum context switch since there is no QRAM); the adjacent QOS (Quantum Operating
  System) paper was found by proximity in the program and classified SUPPORT as the accelerator-sharing/
  scheduling counterpart to HyperQ's CORE virtual-QPU abstraction. (6) A handful of full-program keyword
  hits were checked and excluded without individual records because they were confirmed keyword false
  positives with no virtualization link at all: "Disentangling the Dual Role of NIC Receive Rings"
  (explicitly single-host, non-virtualized NIC tuning) and, on a lighter read, other CXL/NIC/GPU-adjacent
  papers (Tigon: A Distributed Database for a CXL Pod; Scalio: DPU-based JBOF KV store; FuseLink: multi-NIC
  GPU communication; KPerfIR and Neutrino: GPU kernel profiling tooling; Söze and DeDe: network/compute
  resource-allocation scheduling) whose contributions are databases, profiling tools or scheduling policies
  with no isolation, multiplexing or virtual-abstraction content addressed to a physical resource.

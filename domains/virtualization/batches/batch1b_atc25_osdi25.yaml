  fullpaper_source: https://arxiv.org/abs/2412.17246
  classification: CONTEXT
  classification_note: BlitzScale is a network-multicast parameter-distribution and live-autoscaling system for LLM serving infrastructure; it neither introduces nor modifies a virtualization/isolation boundary, matching the brief's generic-LLM-serving/autoscaling CONTEXT category.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: []
  physical_resource: GPU
  logical_abstraction: A serving fleet in which a newly-added GPU instance can start generating tokens immediately by streaming model parameters from exactly one cached source instance over the cluster's compute fabric, rather than reloading from storage
  problem: Scaling out a large-model serving instance normally means loading tens to hundreds of GB of parameters from storage, taking 30-80 seconds, forcing a choice between over-provisioning (wasted GPU-hours) and under-provisioning (SLO violations) since neither static allocation nor naive autoscaling can add capacity fast enough.
  mechanism: BlitzScale keeps only one host's cache holding the complete parameters for a model (O(1) caching) and multicasts them to new instances over a serial forwarding chain that prioritizes fast scale-up links (NVLink) before scale-out links (RDMA), aggregating bandwidth across both via model-sharded all-gather; old instances cooperatively lend cached parameters while borrowing spare compute from new instances so loading and inference overlap instead of stopping the world.
  isolation_mechanism: N/A - this is a data-distribution and scheduling mechanism among cooperating serving instances, not a resource-isolation boundary.
  multiplexing_mechanism: The cluster's compute-fabric network capacity (NVLink then RDMA) is multiplexed to carry parameter multicast traffic in the underutilized bandwidth alongside ongoing inference traffic, and per-model host caching is size-multiplexed to O(1) copies rather than one copy per host.
  state_mechanism: Model parameters exist as a single authoritative cached copy on one source host; new instances receive them via multicast rather than an independent load path, and instance addition/removal is "live" (no stop-the-world pause) because compute and loading are overlapped.
  overhead_bottleneck: Parameter distribution is bandwidth-bound rather than latency-bound, and loading proceeds roughly 5x slower than per-layer inference execution, so network bandwidth availability is the fundamental limiting resource.
  primary_tradeoff: Network-multicast live scaling instead of per-host storage reloads or static allocation -> removes the 30-80s reload penalty and avoids over-provisioning, but finding an optimal multicast/scaling plan is NP-hard, forcing fast heuristic online planning, and benefits depend on the cluster's compute-fabric bandwidth being underutilized.
  quantitative_claims:
  - 'tail latency: up to 94% lower than ServerlessLLM (state-of-the-art live-autoscaling baseline)'
  - 'GPU-time used for serving: 49% lower than non-autoscaling serving systems (DistServe, vLLM)'
  - 'original model loading (baseline, storage-path): 30-80 seconds for larger models, cited as the cost BlitzScale''s multicast data plane avoids'
  why_useful_for_learning: It is a CONTEXT-layer illustration of the operational cost (model reload time) that motivates CORE/SUPPORT snapshot- and memory-handover-style mechanisms elsewhere in the corpus, without itself introducing an isolation or virtualization mechanism.

  - Jack Toubes
  - Tyler Potyondy
  - Pat Pannuto
  - Mae Milano
  - Amit Levy
  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/schuermann
  fullpaper_source: https://www.usenix.org/system/files/osdi25-schuermann.pdf
  classification: CORE
  classification_note: Omniglot builds a hardware-domain-based intra-process sandbox (RISC-V PMP or x86 MPK protection domains) around untrusted foreign-language code with zero-copy cross-boundary references - a lightweight isolation-boundary architecture directly comparable to bpftime's MPK-based extension sandboxing, matching the brief's CORE "sandbox boundary" category.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T10
  physical_resource: CPU core
  logical_abstraction: A foreign-code protection domain (an RISC-V PMP region for embedded Tock-style processes, or an x86 MPK-tagged memory region for Linux userspace) that safe Rust can call into and read/write across via validated, zero-copy typed references instead of serialization or full process isolation
  problem: Safe languages like Rust eliminate memory/type-safety bugs by construction, but must still call into untrusted foreign (typically C) libraries sharing the same address space, which can violate every safety invariant Rust guarantees and reintroduce the vulnerability classes safe languages were meant to remove.
  mechanism: 'Foreign library code and its memory are confined to a hardware-enforced protection domain - RISC-V Physical Memory Protection for embedded kernels (OGPMP, loading libraries similarly to Tock processes at lower privilege with no kernel memory visible) or Intel Memory Protection Keys for Linux userspace (OGMPK, tagging all foreign-library pages with one protection key and disabling access to everything else). Cross-boundary pointers pass through a three-stage validation pipeline - raw pointer, OGMutRef<T> (checked against tracked allocations), OGVal<T> (bit-pattern-validated as an actual instance of T) - and Rust''s borrow checker enforces AllocScope/AccessScope lifetimes at compile time so foreign memory cannot be created, freed, or concurrently accessed outside its scope.'
  isolation_mechanism: Hardware memory-protection domains (PMP or MPK) physically prevent host code from touching foreign memory outside the validation pipeline and vice versa; scope-based mutual exclusion enforced by the Rust type system at compile time additionally guarantees host code never holds a live reference into foreign memory while that foreign code is executing, closing the same class of TOCTOU/use-after-free issues a full process boundary would, without paying its cost.
  multiplexing_mechanism: N/A in the resource-sharing sense - Omniglot creates one protection domain per loaded foreign library and enforces single-threaded, scope-bounded interaction between host and foreign code rather than time/space-multiplexing a shared physical resource among many tenants.
  state_mechanism: Foreign-side objects are allocated within the protection domain via a runtime stack/heap allocator (rt.stack_alloc()); their validity is tracked as OGMutRef/OGVal typed handles rather than raw pointers, and validation re-checks size/alignment/bit-pattern on every promotion from raw pointer to typed reference rather than trusting foreign-side state.
  overhead_bottleneck: Domain-transition cost dominates for small calls - a PMP domain switch costs 6.57us (hot path) to 10.49us (cold, reconfiguring), while an MPK domain switch costs only 98.90ns (though MPK setup itself costs 4.08ms, dominated by dlopen); validation cost is linear in data size (e.g. 70.94us for an 8kB string under MPK, 161.5us under PMP), so small, frequent calls (e.g. LwIP ICMP echo, +52.1% overhead) are hit hardest.
  primary_tradeoff: Hardware-domain isolation with zero-copy validated references instead of serialization-based FFI sandboxing (e.g. Sandcrust) or full process isolation -> keeps overhead low (0.44%-12.7% across most benchmarks, worst case 52.1% for tiny networking packets) and needs no data copying, but the weaker MPK variant cannot stop a malicious library from escaping via raw syscalls/signal handlers/mmap without additional seccomp-style mitigation, and existing unsafe FFI bindings are incompatible without mechanical transformation.
  quantitative_claims:
  - 'domain-transition cost: PMP invoke 6.57us hot / 10.49us cold vs MPK invoke 98.90ns (MPK setup itself costs 4.08ms, dominated by dlopen)'
  - 'validation cost (8kB string): 70.94us (MPK) vs 161.5us (PMP), confirmed linear in data size'
  - 'CryptoLib HMAC-SHA256 (4kB, embedded/PMP): +0.44% total overhead'
  - 'LittleFS file I/O (embedded/PMP): +20.1% from memory isolation alone, +0.5% additional from Omniglot''s validation layer'
  - 'LwIP ICMP networking (embedded/PMP, small packets): +52.1% from isolation, +3.4% additional from Omniglot'
  - 'libpng decoding, 23kB (userspace/MPK): +12.7% from isolation, +0.8% additional from Omniglot'
  - 'hardware: RISC-V rv32imc at 24MHz (embedded FPGA) for PMP; Intel Xeon Silver 4114 at 2.2GHz, single core pinned, for MPK'
  why_useful_for_learning: It is a direct sibling case study to bpftime''s MPK-based extension isolation, but applied to arbitrary unmodified foreign libraries rather than eBPF extensions, and adds a compile-time (Rust borrow-checker) temporal-safety layer on top of the hardware domain boundary - useful for contrasting how much of an isolation guarantee comes from hardware versus from the type system.

  classification_note: Rex replaces the eBPF verifier's load-time bytecode analysis with compile-time safe-Rust guarantees as the kernel-extension isolation boundary - understanding it clarifies the language-based-vs-hardware/verifier-based isolation trade-off that CORE papers in this corpus (e.g. Asterinas, HyperTurtle's hyperupcalls, bpftime) rely on or contrast with.

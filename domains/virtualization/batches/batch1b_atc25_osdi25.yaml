  fullpaper_source: https://www.usenix.org/system/files/osdi25-miemietz.pdf
  classification: CORE
  classification_note: 'MettEagle replaces namespace/cgroup/seccomp-based Linux container isolation with capability-based microkernel isolation (L4Re) for the container boundary itself - exactly the brief''s CORE trap: "container isolation architecture (microkernel/split-kernel/unikernel/sandbox boundary...) is CORE."'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: A container ("compartment") that by construction holds zero ambient authority and must be explicitly granted capabilities to every resource (files, network endpoint, memory, IPC gate) it may use, running atop the L4Re microkernel instead of Linux
  problem: Linux containers must bolt on seccomp-bpf, cgroups and namespaces to restrict processes that otherwise have ambient authority by default, and each of these mechanisms is itself a documented CVE source; the paper asks whether a microkernel's capability model can give container-grade isolation without needing any of them.
  mechanism: 'A root task (moe) allocates initial memory; a compartment service (analogous to runc) launches tasks with only the capabilities the FaaS runtime Phlox explicitly delegates; system services (SPAFS filesystem, LUNA networking, LSMM memory) expose per-client IPC gates so each compartment''s visible interface and resource budget is attached to its own gate rather than enforced globally; capabilities are revoked (triggering kernel object cleanup) when a compartment exits.'
  isolation_mechanism: Capability-based access control with zero ambient authority - a compartment can reach only the specific IPC gates and memory capabilities delegated to it, so restricting its visible "system surface" is achieved by choosing what to delegate rather than by post-hoc filtering (seccomp) or namespace remapping; per-session resource budgets are attached directly to a service's IPC gate.
  multiplexing_mechanism: Each system service multiplexes many compartments by creating a dedicated IPC gate per client session, with resource-consumption context attached per gate so CPU/memory/network limits are enforced session-by-session inside userspace services rather than by one central cgroup-like subsystem.
  state_mechanism: Per-compartment state is a writable filesystem instance plus a shared read-only filesystem for binaries and a single bound network endpoint per session; capability delegation/revocation is the only "state transfer" - there is no live migration or checkpoint mechanism in this system.
  overhead_bottleneck: 'Coarse-grained kernel locking for capability delegation/revocation and a single lock in the root task (moe) for kernel-object creation limit parallel compartment startup (100ms for 64 parallel launches vs runc''s 70ms single-instance baseline), and the in-memory filesystem SPAFS is roughly 10x slower per call than Linux''s ramfs (a stat call: ~4us on L4Re vs ~460ns on Linux).'
  primary_tradeoff: Capability-based zero-ambient-authority isolation instead of namespace/cgroup/seccomp restriction -> gives a dramatically smaller, CVE-cleaner TCB (89,271 SLOC for the whole L4Re container stack vs 2,699,812 SLOC for Linux+containerd+runc) and fully avoids 8/8 studied seccomp-bpf CVEs, but costs slower filesystem operations, weaker network throughput at low parallelism, and worse scaling for many parallel compartment launches due to coarse kernel locking.
  quantitative_claims:
  - 'TCB size: 89,271 SLOC (L4Re kernel+services) vs 2,699,812 SLOC (Linux 1.45M + containerd + runc)'
  - 'CVE mitigation: of 33 high/critical container CVEs studied, MettEagle fully avoids all 8 seccomp-bpf CVEs (no seccomp used), 4/22 namespace-related CVEs, 0/3 cgroup CVEs'
  - 'cold start (single instance): ~200us (bare Linux process) vs ~1ms (L4Re compartment) vs ~70ms (runc)'
  - 'cold start (64 parallel launches): ~100ms (L4Re) vs ~200ms (runc)'
  - 'filesystem stat() latency: ~4us (L4Re/SPAFS) vs ~460ns (Linux ramfs), roughly 10x'
  - 'network bandwidth scaling: Linux/runc plateaus at ~900MiB/s and declines beyond 28 threads; L4Re starts at ~350MiB/s at low parallelism but reaches line-rate ~1250MiB/s at 16+ threads'
  - 'SeBS Python FaaS benchmarks: L4Re ~10% faster than runc on HTML manipulation, ~2x slower on ZIP compression (filesystem-bound); ~45ms median per-function overhead attributed to Python module init (repeated stat/open/read)'
  - 'hardware: dual Intel Xeon Platinum 8358 (64 cores), 500GB RAM, 10Gbit NICs; kernel 6.7.4, runc 1.1.10, Firecracker/Kata 3.3.0 as reference points'
  why_useful_for_learning: It is a rigorous, CVE-grounded head-to-head between Linux's namespace/cgroup/seccomp container isolation and a capability-based microkernel alternative, showing exactly which container CVE classes each architecture eliminates versus merely mitigates.

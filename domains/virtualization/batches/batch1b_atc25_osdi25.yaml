  primary_tradeoff: Compatibility-scored spatial bundling plus a fidelity-aware scheduler -> cuts waiting time substantially at small fidelity cost when utilization is moderate, but at higher target utilization (88%) bundling multiple programs costs about 18% fidelity versus running each alone, exposing a direct fidelity-vs-utilization dial.

  - 'performance vs Linux (geometric mean, single-core QEMU, Linux mitigations/huge-pages disabled for fair comparison): LMbench 1.08x, Nginx 4KB files 1.19x, Redis 1.31x, SQLite 0.85x, loopback TCP latency 1.95x (2.725us vs 5.326us)'
  - 'safety-check overhead: frame-allocator ownership check 6.7% CPU cycles (largest single cost); most other checks <3%'
  - 'safety verification: custom Miri extension (KERNMIRI) covers 93% of OSTD code lines; 100% of unsafe blocks covered by unit tests; 2 real undefined-behavior bugs found and fixed during development'
  - 'TCB growth rate: non-TCB code grows ~40 KLoC/year vs TCB ~2 KLoC/year over 3 years of development'
  why_useful_for_learning: It is a rigorous, measured demonstration that an isolation boundary can be moved from hardware privilege levels into a type system without giving up monolithic-kernel performance, directly extending the CORE microkernel/secure-container design space to a full general-purpose OS.

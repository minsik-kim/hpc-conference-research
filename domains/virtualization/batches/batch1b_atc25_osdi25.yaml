- id: VIRT-OSDI25-08
  title: 'FineMem: Breaking the Allocation Overhead vs. Memory Waste Dilemma in Fine-Grained Disaggregated Memory Management'
  title_correction: null
  authors:
  - Xiaoyang Wang
  - Yongkun Li
  - Kan Wu
  - Wenzhe Zhu
  - Yuqi Li
  - Yinlong Xu
  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/wang-xiaoyang
  fullpaper_source: https://www.usenix.org/system/files/osdi25-wang-xiaoyang.pdf
  classification: SUPPORT
  classification_note: FineMem is a fine-grained malloc/free allocator over an RDMA-disaggregated memory pool with no guest-physical translation, overcommitment or elasticity layer; per the brief's disaggregation rule this is SUPPORT (an allocation/isolation mechanism enabling disaggregated memory use), not CORE, because it does not build a virtual resource abstraction over the pool.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary:
  - T3
  physical_resource: PCIe/CXL fabric
  logical_abstraction: A shared RDMA-attached memory pool exposing plain malloc(size)/free(addr) at 4KB-2MB granularity to multiple independent client systems (a KV store, a user-space allocator, a kernel swap system) simultaneously
  problem: RDMA-based disaggregated memory forces a choice between coarse-grained allocation (1GB+, to amortize ~480us memory-region registration cost, but causing ~75% fragmentation waste) or fine-grained allocation (4KB, avoiding waste but paying registration/RPC/contention costs on every allocation).
  mechanism: 'The memory node pre-registers its entire pool once at boot and issues per-chunk RDMA memory windows (MWs) with unique rkeys (generated/invalidated at ~1 per microsecond) instead of registering memory regions per allocation; allocation metadata is a two-layer bitmap tree (sections of 16 spans, spans of 32 128KB chunks) updated via one-sided RDMA compare-and-swap, with span-header contention bits (free/normal/contended/full) letting allocators detect contention and redirect to less-contended spans; a per-compute-node allocation-service thread mediates all malloc/free via IPC so applications never touch shared metadata directly, and a temporary+full redo-log scheme with heartbeat-based failure detection recovers allocations after a compute-node crash.'
  isolation_mechanism: Access control is enforced by RDMA memory windows - a client can only reach a chunk/span/section it holds a valid rkey for, and rkeys are invalidated/regenerated by one-sided CAS without memory-node CPU involvement; a trusted per-compute-node allocation service is the only entity holding rkeys to metadata regions, so applications cannot corrupt shared bitmaps directly, and in multi-tenant clouds this service can run at the hypervisor layer for isolation from untrusted tenants.
  multiplexing_mechanism: The shared pool is concurrently multiplexed across heterogeneous systems (malloc-style clients, a KV store, a kernel swap system) and mixed allocation granularities at once; lock-free one-sided RDMA CAS on the bitmap tree plus contention-aware span redirection allows many compute nodes to allocate concurrently without funneling through the memory node's CPU.
  state_mechanism: Allocation commit is defined as the CAS that flips a bitmap entry; a 29-bit temporary redo-log is embedded directly in each 64-bit span header for the CAS operation itself, backed by a persistent, per-chunk full redo-log on the memory node, so a crashed compute node's in-flight allocations can be recovered by comparing temporary vs full log timestamps and reclaiming stale chunks.
  overhead_bottleneck: Under high contention, CAS retries dominate for prior one-sided designs (45.1 average retries per allocation at 512 threads for a flat-bitmap baseline); FineMem's two-layer bitmap plus contention control cuts this to 1.33 average retries, shifting the residual bottleneck to plain network round-trip latency (~43us at 512 threads).
  primary_tradeoff: Pre-registered memory windows plus a two-layer contention-aware bitmap -> matches coarse-grained allocators' low per-op cost while keeping 4KB granularity's low fragmentation, but the isolation-mediating allocation-service IPC adds 2-10us per call, and the whole design is RDMA-memory-window-specific, requiring "additional design effort" to port to CXL (which lacks rkeys/MWs and would need MPK-style protection instead).
  quantitative_claims:
  - 'allocation latency (4KB, Redis-based microbenchmark): 43.2us average (P99 79.3us) for FineMem vs 763.0us average (P99 16,143.5us) for a one-sided-RDMA baseline (Premmap-One-sided) - a 95% reduction'
  - 'CAS retries per allocation at 512 threads: 1.333 average (max 142) for FineMem vs 45.108 average (max 20,637) for Premmap-One-sided'
  - 'memory utilization (FineMem-User, ThreadTest/Shbench/Larson): 2.25-2.8x better than a static pre-mapped baseline (e.g. Shbench-large: ~35GB utilized vs 80GB allocated for the baseline at the same workload)'
  - 'KV-store throughput (YCSB-A, 512B KV pairs): 27-110% higher than Premmap-RPC; memory cost 45% lower than a 2MB-granularity baseline at similar throughput; fragmentation ~10% (FineMem 4KB) vs ~20% (2MB) vs ~75% (1GB)'
  - 'kernel-swap job throughput (200-job mixed XGBoost/Snappy/Redis workload): memory utilization 74.06% (FineMem-Swap) vs 41.39% (FastSwap baseline); throughput improvement 17.71% (200 jobs), 8.38% (500 small jobs, 5 nodes), 10.69% (500 large jobs, 40 nodes, 1.28TB DM)'
  - 'multi-system pool sharing (8 KV-store + 8 malloc nodes concurrently): FineMem shows no throughput/latency degradation vs isolated operation, while Premmap-RPC loses 46.8% bandwidth and Premmap-One-sided loses 75.5%'
  - 'metadata overhead: ~0.4% of pool memory (8B rkey + 8B redo-log per 4KB chunk, ~400MB per 100GB pool); rkey-regeneration background service uses 15% of one CPU core for a 100GB pool'
  - 'hardware: 16 compute nodes + 1 memory node, Intel Xeon 8360Y, Mellanox ConnectX-6 100Gb NIC, 256GB/node, Ubuntu 22.04/Linux 5.15, Mellanox OFED 5.8'
  why_useful_for_learning: It is a precise worked example of the brief's disaggregation-vs-virtualization boundary - a genuinely fine-grained, multi-tenant memory-pool allocator with real isolation guarantees that still stops short of building a virtual (elastic, overcommitted) memory abstraction, unlike VM-memory papers such as HyperAlloc.
  priority: P2
  related:
  - VIRT-EUROSYS25-03
  relations:
  - type: CONTRASTS_WITH
    target: VIRT-EUROSYS25-03
    basis: HyperAlloc builds an elastic guest-physical memory abstraction (de/inflation) on local DRAM shared with a hypervisor; FineMem instead gives fast, isolated, fine-grained raw allocation over a remote disaggregated pool without any guest-physical translation layer - the same T2 memory-management problem addressed with and without a virtualization abstraction.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - code
  - official-web
  confidence: HIGH
  notes: Artifact at github.com/ADSLMemoryDisaggregation/FineMem; authors explicitly note CXL portability would need a different isolation primitive (MPK-style) since CXL lacks RDMA memory windows/rkeys.
- id: VIRT-OSDI25-09
  title: 'Deterministic Client: Enforcing Determinism on Untrusted Machine Code'
  title_correction: null
  authors:
  - Zachary Yedidia
  - Geoffrey Ramseyer
  - David Mazieres
  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/yedidia
  fullpaper_source: https://www.usenix.org/system/files/osdi25-yedidia.pdf
  classification: CORE
  classification_note: DeCl builds a real sandbox boundary for untrusted native machine code - either OS page-protection isolation or a software-fault-isolation (Lightweight Fault Isolation) sandbox with position-oblivious code - which is the brief's explicit CORE "sandbox boundary" category, plus a deterministic-execution guarantee layered on top.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T10
  physical_resource: CPU core
  logical_abstraction: A sandboxed region of native x86-64 or Arm64 machine code, verified at load time to be drawn entirely from a deterministic instruction subset and metered so its instruction count (and therefore effects) is reproducible across runs and machines
  problem: Systems needing deterministic untrusted execution (e.g. smart contracts) normally compile to a portable bytecode (Wasm, EVM) run by a trusted interpreter/JIT, paying large overhead; running native machine code directly is fast but neither deterministic (undefined flags, microarchitecture-dependent behavior) nor verifiable as safe without a trusted translator.
  mechanism: 'A load-time verifier checks a binary against a binary-decision-diagram model of every deterministic x86-64 (~100 base + 125 SIMD) or Arm64 (~180 base + 430 SIMD) instruction, rejecting instructions with undefined/non-deterministic behavior (e.g. x86 BT''s undefined flags); code is laid out in bundle-aligned blocks (32B on x86-64) so no instruction or branch target can straddle a bundle boundary, preventing mid-instruction jumps; deterministic metering (branch-based counting with basic-block checks, or timer-based counting combined with interrupts) bounds runtime and enables deterministic preemption before effects are applied; the memory-isolation boundary is either plain OS page protection (DeCl-HW) or integration with Lightweight Fault Isolation (DeCl-LFI), which confines the program to a 4GiB sandbox by rewriting memory accesses to base+32-bit-offset form and makes the code "position-oblivious" (it cannot observe its own absolute address beyond a 32-bit subset in reserved registers).'
  isolation_mechanism: DeCl-HW isolates via ordinary hardware page-table protection; DeCl-LFI instead confines all memory accesses of the untrusted code to a 4GiB software fault-isolation sandbox with guard pages between 4GiB-aligned sandbox slots, and position-oblivious code prevents the sandboxed program from using absolute addresses to escape its intended memory view.
  multiplexing_mechanism: Many LFI sandboxes coexist in one Linux process's shared address space, each mapped to a 4GiB-aligned slot; sandbox startup is accelerated to under 15us by pre-allocating 128KiB code/data regions with page aliasing so a new sandbox avoids repeated mmap/mprotect calls.
  state_mechanism: Sandbox memory is deterministically initialized by zeroing, and between executions regions are cleared via memset so no residual non-deterministic state leaks between runs; reserved registers hold the instruction counter, the runtime call-table address, and the LFI sandbox base, keeping execution state itself reproducible.
  overhead_bottleneck: Metering instructions dominate cost - branch-based metering costs 20-40% overhead (worse on x86-64 due to flags-preserving counting sequences), reduced to about 19% with timer-based metering that removes per-basic-block underflow checks; software-fault-isolation memory rewriting (LFI) and position-oblivious code add further, smaller overhead (~8% and ~9% respectively) on top.
  primary_tradeoff: Verifying native machine code directly instead of compiling to a portable bytecode -> gets near-native performance (19-20% metered overhead vs 76-109% for a Wasm bytecode interpreter/JIT with fuel metering) and no trusted translator, but is architecture-specific (binary translation across architectures costs a further 25-65%) and excludes floating point, atomics and parallelism from the deterministic subset entirely.
  quantitative_claims:
  - 'SPEC CPU2017 overhead (8 benchmarks): DeCl-HW 4.4% (x86-64), -0.14% (Arm64, i.e. within noise); DeCl-LFI-timer 19.2% (x86-64), 19.1% (Arm64); DeCl-LFI-branch 39.3% (x86-64), 24.1% (Arm64); Wasmtime-fuel 76.5% (x86-64), 109% (Arm64)'
  - 'zero-knowledge proof verification (smart-contract workload): DeCl ~1.1x native (timer-based) vs Wasmtime-fuel ~2.4x native vs Wasm3 interpreter ~30x native'
  - 'sandbox startup latency: <15us (load and execute) after pre-allocation optimization'
  - 'multi-core scalability (Groundhog smart-contract integration): linear scalability to 192 cores on AWS c7a.metal/c8g.metal (EPYC/Graviton4)'
  - 'binary translation across architectures adds a further 25-65% overhead on top of the base metering cost'
  - 'hardware: AMD Ryzen 9 7950X (x86-64), Apple M2 (Arm64), AWS c7a.metal/c8g.metal (192-core)'
  why_useful_for_learning: It is a clean, modern instance of software-fault-isolation sandboxing (the classical alternative to hardware-privilege-based VM/container isolation) with a deterministic-execution property layered on top, useful for contrasting SFI-based isolation against the page-table- and capability-based isolation mechanisms elsewhere in this corpus (LiteShield, MettEagle, bpftime).
  priority: P1
  related:
  - VIRT-ATC25-01
  - VIRT-OSDI25-10
  relations:
  - type: SAME_BRANCH
    target: VIRT-ATC25-01
    basis: Both build a narrow, mediated isolation boundary around untrusted code without relying on a full VM, one via software-fault-isolation-sandboxed native code (DeCl), the other via userspace syscall interposition around a whole guest application (LiteShield).
  - type: CONTRASTS_WITH
    target: VIRT-OSDI25-10
    basis: DeCl sandboxes arbitrary native machine code via SFI plus deterministic metering; bpftime instead sandboxes small eBPF extensions inside a host process via hardware memory-protection-key domains - different points in the "isolate untrusted code inside one process" design space.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Built for and evaluated with the Groundhog smart-contract execution environment; excludes floating point, atomics and parallel execution from its deterministic instruction subset.

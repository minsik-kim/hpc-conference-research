  - T9
  physical_resource: GPU
  logical_abstraction: An XQueue - a preemptible command queue abstraction hosting one XPU task's command sequence - uniform across GPUs (NVIDIA/AMD/Intel), NPUs (Ascend/Intel/NVIDIA), ASICs (NVIDIA PVA/OFA) and FPGAs (Xilinx)
  problem: GPUs, NPUs, ASICs and FPGAs each expose only coarse hardware scheduling (FCFS or simple round robin) with no unified way to express priority or fairness across multitasking workloads, and no single preemption solution works across this hardware diversity.
  mechanism: 'XSched implements three preemption levels chosen per hardware capability: level 1 blocks a pending commands launch before it reaches the hardware queue (pure software, no context save needed); level 2 deactivates/reactivates an in-flight hardware queue either by stalling the microcontrollers dequeuing or by a "guardian" that flushes/aborts and relaunches in-flight commands; level 3 preempts a running command via hardware interrupts, either letting the GPU save implicit context (TSG-based) or using dynamic binary instrumentation to inject a guardian that detects the interrupt and restarts an idempotent kernel from the beginning. A distributed XQueue design separates control and data planes so command submission overhead and per-application errors stay isolated to that application''s process.'
  isolation_mechanism: Each task gets its own XQueue, and the distributed control/data-plane split confines command-submission errors to the issuing application process; the design explicitly assumes cooperative (not malicious) command submission and notes that untrusted tenants would need API remoting to enforce this.
  multiplexing_mechanism: The three preemption levels let a scheduler interleave XQueues at different granularities depending on what the underlying XPU/driver stack supports, from simply delaying an unsent command (Lv1) to interrupting and resuming/restarting an already-executing one (Lv3), enabling priority- and fairness-aware multiplexing across heterogeneous accelerator types with a single scheduling API.
  state_mechanism: Level 1 and stalling-based level 2 need no saved context (nothing has started or the hardware queue is merely paused); flushing-based level 2 relies on relaunching aborted commands from scratch; TSG-based level 3 lets the GPU hardware save implicit execution context on interrupt; queue-based level 3 has no true resume and instead restarts an idempotent kernel entirely from its beginning.
  overhead_bottleneck: Level 1's progressive command-launching synchronization costs under 3.4% overhead on all tested XPUs; level 2 flushing adds 2.1-4.0% from guardian-code flag-read polling; a few platforms (Ascend 910B, NVIDIA PVA) see higher CPU overhead (11.9-18.3%) from driver-level spinning.
  primary_tradeoff: Multi-level preemption chosen per hardware capability -> gives sub-40us preemption latency and large tail-latency wins across very different accelerator families without redesigning each driver stack, but level-3 queue-based preemption only supports idempotent kernels restarted from the beginning (no true mid-kernel resume), and the whole approach assumes cooperative, non-malicious task submission.
  quantitative_claims:

  fullpaper_source: https://www.usenix.org/system/files/osdi25-domingo.pdf
  classification: SUPPORT
  classification_note: Kamino decides which admission-time allocation agent (and thus, indirectly, which cached rule set) resolves a VM placement request; it is VM placement/scheduling constrained by cache-locality economics, not a virtualization mechanism itself, matching the brief's explicit SUPPORT example of "VM placement constrained by virtualization semantics."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T1
  physical_resource: CPU core
  logical_abstraction: A VM allocation request routed to whichever allocation agent's private two-level cache (exact-match fast path, partial-match slow path) is predicted to resolve it soonest
  problem: Cloud VM schedulers cache repetitive/similar allocation requests and their resolution rules per allocation agent to cut computation, but ignoring each agent's current cache and queue state when routing a new request causes avoidable latency and memory/CPU imbalance across agents.
  mechanism: Each allocation agent (AA) keeps a private two-level cache (a fast path for identical requests, a slower path for requests sharing a subset of traits) and a FIFO queue processed one request at a time with no preemption or drops; Kamino estimates, from historical latencies plus each AA's current queue and cache state, which AA will finish a new request soonest, and routes it there, then commits the resulting placement to a central store under optimistic concurrency (retrying on conflicts).
  isolation_mechanism: N/A - AAs use private per-agent caches specifically to avoid concurrency-control/synchronization overhead between them, not to isolate tenants or virtualized resources.
  multiplexing_mechanism: Multiple allocation agents run concurrently per node, each single-threaded with its own queue and cache, so incoming requests are multiplexed across agents by predicted completion latency rather than by round robin.
  state_mechanism: Per-AA cache state (fast-path exact-match entries, slow-path partial-match entries) updates asynchronously as requests are resolved; the authoritative placement record is written to a central placement store, with optimistic-concurrency retries resolving races between AAs.
  overhead_bottleneck: Memory is the binding resource per node (cache size determines how many AAs a node can host) while CPU is comparatively under-utilized, so cache-size/AA-count balance, not raw compute, limits throughput.
  primary_tradeoff: Latency-driven cache-aware routing -> raises cache hit rate and cuts tail latency versus naive cache-oblivious or round-robin routing, but pure cache-locality pinning alone would create hotspots under bursty load, so the scheduler must trade some cache hits for load balance when queuing dominates.
  quantitative_claims:
  - 'simulation on production traces: 42% average latency reduction vs cache-oblivious baseline; 95% cache hit rate (LatCache-rule) vs 81% (round-robin); 2x throughput during request bursts'
  - 'production deployment (5 zones, 15 days): 21.1% average latency reduction, 11.9% P90 latency reduction, cache-miss rate cut 33% (hit rate 80% -> 86.6%), memory per AA down 17%, CPU per AA down 18.6%'
  - 'hit/miss-time prediction error averages 29%, while classifying a request as a hit or miss is 99.1% accurate'
  why_useful_for_learning: 'It is the admission-time counterpart to migration-based VM rescheduling (VMR2L): both attack host/agent-level fragmentation and locality from opposite ends of the VM lifecycle without altering the virtualization mechanism itself.'

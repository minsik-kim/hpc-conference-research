  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/wang-yun
  fullpaper_source: https://www.usenix.org/system/files/osdi25-wang-yun.pdf
  classification: CORE
  classification_note: The paper is squarely about I/O device virtualization under passthrough - eliminating IOMMU/PCIe Page Request Interface page faults on the DMA critical path while preserving memory overcommitment - which is exactly the brief's T3 IOMMU/passthrough CORE category.
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary:
  - T2
  physical_resource: NIC
  logical_abstraction: A passthrough VirtIO device whose guest memory can still be overcommitted/reclaimed by the host, without ever generating an in-critical-path IOMMU page fault
  problem: Passthrough devices normally require static pinning of all guest memory so DMA never faults, which blocks host memory overcommitment; the PCIe Page Request Interface (PRI) standard exists to let devices fault and wait for a mapping instead, but PRI has poor hardware availability (80% of the paper's production VMs cannot use it), 3-80x higher latency than a CPU page fault, and injects packet loss/retransmission storms directly into the I/O critical path.
  mechanism: 'VIO runs entirely in the hypervisor with no guest modification, using three mechanisms: IOPA-Snoop proactively inspects VirtIO ring commands before the device touches a buffer (via a shadow available ring so device and driver see separate page-table views), ensuring the target page is mapped before DMA instead of after a fault; Adaptive Lockpage pins only frequently-accessed I/O pages using Linux-kernel-style Active/Inactive list tracking at 2MB granularity; and Elastic Passthrough dynamically switches a device between snooping (VIO) mode and full passthrough mode based on measured IOPS, proactively swapping pages back in during the transition to hide latency.'
  isolation_mechanism: Guest memory pages are only unpinned when not in the lockpage set, and mode transitions unmap the available ring in the EPT and block in-flight requests before switching, so the device's view (shadow ring/index) and the driver's real ring stay consistent without either side observing a torn state.
  multiplexing_mechanism: Host DRAM is shared across VMs by keeping most guest I/O pages reclaimable (only the lockpage working set stays pinned) and by switching each device between VIO-snooping and full-pin passthrough as its IOPS crosses a production-tuned 100k-IOPS threshold, trading snooping CPU cost against passthrough's total pinning cost.
  state_mechanism: A per-VM lockpage bitmap (2MB granularity) plus Active/Inactive page lists track which I/O pages must stay resident; EPT and IOMMU translation tables are the only virtualization state touched, and nothing is migrated - pages are simply pinned/unpinned as the working set changes.
  overhead_bottleneck: 'Per-operation snooping cost (~4us: ~90ns lockpage-bitmap check, ~1us page-table check, plus a ~700us page-fault/swap-in path when a page is genuinely absent) grows with IOPS until it exceeds the cost of just pinning everything, which is why the system must fall back to full passthrough at high IOPS.'
  primary_tradeoff: Proactive hypervisor-side snooping instead of reactive hardware PRI -> removes IOPFs from the DMA critical path and needs no special IOMMU/device hardware or guest changes, but adds a small per-operation snooping cost that becomes worse than static pinning at very high IOPS, requiring the elastic passthrough fallback.
  quantitative_claims:
  - 'production deployment: 300K VMs across 300 nodes; ~120GB/day of memory reclaimed (equivalent to ~30 extra 2vCPU/4GB VMs per day); IOPFs reduced to <1% of CPU page faults'
  - 'snooping latency: 3.5us (lockpage hit) to 4.5us (lockpage miss); swap-in path averages 700us when a page must be fetched'
  - 'one-hour production Redis trace: 1,464,225 unique page accesses with only 1 IOPF observed'
  - 'fault-injection microbenchmark (4 applications, 10ms injected fault latency): VIO throughput degrades <10% vs 45-60% degradation for a PRI-based baseline (VPRI)'
  - 'TCP_RR (netperf): 87.0k transactions/sec (VIO snooping) vs 100.0k (full passthrough), a 10% gap; iPerf: VIO holds ~10Gbps steady while VPRI shows near-zero throughput bursts during retransmission'
  - 'elastic passthrough: up to 10% additional daily memory reduction in production; hardware Intel Xeon Platinum 8269CY (52C/52T), 192GB DRAM, DPU with PCIe Gen3 x8'
  - 'PRI hardware availability: 80% of legacy production VMs cannot use PRI at all; PRI-capable paths measured at ~3x-80x higher latency than a CPU page fault'
  why_useful_for_learning: It is a precise, production-scale account of exactly why device passthrough and host memory overcommitment conflict, and demonstrates a software-only fix that avoids relying on PRI hardware most fleets do not have.
  priority: P0
  related:

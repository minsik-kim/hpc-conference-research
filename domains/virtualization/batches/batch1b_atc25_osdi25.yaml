  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T5
  physical_resource: CPU core
  logical_abstraction: A UEFI firmware environment in which each boot-phase module runs deprivileged in its own page-table-isolated sandbox, interacting with the core and other modules only through mediated, capability-checked services
  problem: UEFI firmware has grown 9x in codebase size (EDK2, 2018-2025) with CVEs rising sharply (72 in 2022, 73 in 2023), yet Secure Boot only checks module signatures at load time and gives no protection against vulnerabilities inside legitimately-signed modules, so one module's bug compromises the entire firmware.
  mechanism: 'An offline analyzer parses UEFI protocol definitions into a protocol database describing parameter semantics; an online sandbox manager (itself a UEFI module) then runs each other module in its own page table, replaces the system table with a per-sandbox "shadow" table so every service call becomes a mediated syscall-like request, injects dynamically-generated read-only "trampolines" to redirect cross-module and core-to-sandbox calls, and uses an interface proxy that validates parameters (via the offline protocol database) and copies data across the sandbox boundary, with cascading memory cleanup when a callee frees memory it allocated for a caller.'
  isolation_mechanism: Each module executes in a separate address space/page table verified for read/write/execute attributes by the sandbox manager; the shadow system table and interface proxy enforce two levels of access control (service-level and protocol-level) so a sandboxed module can only reach capabilities its type is granted, and a compromised module cannot directly corrupt another module's or the core's memory.
  multiplexing_mechanism: UEFI's single-threaded, event-driven execution model means the sandbox manager simply serializes module execution (CREATE_SANDBOX/START_SANDBOX) rather than needing preemptive CPU multiplexing or synchronization primitives.
  state_mechanism: Per-sandbox metadata (memory allocation records, shadow system table, interface/trampoline data) lives in the sandbox manager; cross-module memory ownership is tracked hierarchically so that a callee's memory allocated on behalf of a caller is freed in cascade when the callee's sandbox releases it.
  overhead_bottleneck: Context-switch cost between sandboxes is the dominant overhead - about 1,126 cycles per switch on x86_64 (QEMU/KVM) versus about 5,262 cycles on ARM (Raspberry Pi 4), the latter inflated by required cache invalidation.
  primary_tradeoff: Deprivileging firmware modules into page-table-isolated sandboxes with no source modification required -> contains vulnerable/malicious modules' memory access at the cost of per-call context-switch and data-copy overhead, and requires heuristic (97.5-99.8% automatable) offline parameter-semantics analysis to handle untyped void* interfaces.
  quantitative_claims:

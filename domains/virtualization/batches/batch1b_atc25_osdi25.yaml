  classification: CORE
  classification_note: 'Asterinas is a new kernel isolation architecture ("framekernel") that replaces hardware-privilege-based microkernel isolation with Rust-language-enforced intra-kernel privilege separation, matching the brief''s CORE trap that microkernel/split-kernel isolation architectures are CORE, not merely an application that runs inside one.'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T7
  physical_resource: CPU core
  logical_abstraction: A single-address-space kernel in which a small, unsafe-Rust "OS framework" (the only trusted part) exposes safe APIs so that de-privileged OS services (drivers, filesystems, networking, schedulers, allocators) can be written entirely in safe Rust and yet cannot touch sensitive CPU/memory/device state, giving microkernel-grade isolation without IPC.
  problem: Rust-based OS kernels still rely on unsafe Rust throughout the codebase to reach hardware, which inflates the trusted computing base and reintroduces the memory-safety bugs Rust was meant to eliminate, while true microkernels achieve small TCBs only by paying IPC costs for every service call.
  mechanism: 'Resources are split into sensitive (kernel-mode registers, kernel code/stack/page tables, core devices like APIC/IOMMU) versus insensitive (user-mode registers, user memory/DMA buffers exposed as "untyped memory", peripheral devices) classes. The OS framework (OSTD) is the only component allowed unsafe Rust and enforces 10 documented safety invariants (e.g. sensitive memory never mapped to a client, DMA-mappable regions restricted to untyped memory, a task runs on at most one CPU); de-privileged services access hardware only via safe abstractions (UserMode/UserContext/VmSpace, IoMem/IoPort/DmaStream, Frame<M>) and inject their own scheduling/allocation policy through safe traits (Scheduler, FrameAlloc) rather than by touching sensitive state directly.'
  isolation_mechanism: Both the framework and de-privileged services run in kernel mode and communicate via ordinary function calls (no IPC), but Rust's type system - not a CPU privilege ring - prevents services from constructing references to sensitive memory or issuing privileged instructions; untyped memory is restricted to a plain-old-data read/write interface so externally-modifiable (MMIO/DMA) memory cannot violate Rust's aliasing/type invariants.
  multiplexing_mechanism: CPU scheduling and physical-frame allocation policy are left to de-privileged services via safe "policy injection" traits (Scheduler, FrameAlloc), while the framework retains only the mechanism (tracking which frames are unused, enforcing that a task runs on at most one CPU at a time) needed to keep the safety invariants regardless of which policy is plugged in.
  state_mechanism: Per-physical-frame metadata (reference counts plus a service-supplied type parameter) lives in a framework-managed array; kernel stacks carry guard pages checked against compile-time stack-usage analysis; page tables are entirely framework-owned even though allocation/replacement policy is supplied by a service.
  overhead_bottleneck: Safety-check overhead is small per-mechanism (mostly <3% CPU cycles) but the frame allocator's ownership check costs 6.7%, the single largest source measured; IOMMU-mediated dynamic DMA mapping (needed to keep DMA buffers restricted to untyped memory) is a secondary bottleneck until pooling/static mapping is used.
  primary_tradeoff: Language-based (Rust-safety) intra-kernel isolation instead of hardware-based (IPC/process) isolation -> matches monolithic-kernel performance (no IPC) with a microkernel-scale TCB (14.0% of 75.3 KLoC vs 43.8% Tock, 62.4% Theseus, 66.1% RedLeaf), but trusts the Rust compiler toolchain itself as part of the TCB and forgoes some mature Linux-specific optimizations (sendfile, pwrite64, TCP congestion control).
  quantitative_claims:

  logical_abstraction: An eBPF extension running as ordinary userspace code inside the same process as its host application, isolated from the host by hardware memory-protection-key domain switches instead of a kernel trap, while still using the existing eBPF toolchain (libbpf, bcc) and map syscalls transparently
  problem: Existing userspace extension mechanisms cannot get all three of safety (extension cannot harm host), isolation (host cannot harm extension) and efficiency (near-native speed) at once - heavyweight OS-process isolation costs context switches, software fault isolation adds runtime checks, and native in-process execution has no safety guarantee; kernel eBPF is safe but every uprobe/uretprobe costs a full kernel trap (~2500-3000ns).
  mechanism: 'The Extension Interface Model (EIM) lets a host declare capability-based safety/interconnectedness constraints per extension point, which bpftime compiles into eBPF verifier constraints (assertions and mock kfuncs) checked by the existing eBPF verifier running in userspace (via UbiBPF) - reusing kernel-grade verification without a kernel trap. A binary rewriter (Frida/libcapstone, via ptrace) injects trampolines at extension entry points (function-level uprobes get a direct instruction trampoline; syscall entries use a zpoline two-byte call mechanism since a syscall instruction is too short for a normal trampoline) so verified, JIT-compiled extension code runs inline in the host process. At runtime, isolation is enforced with ERIM-style Intel Memory Protection Keys (MPK): extension code pages are marked non-writable, a dedicated protection key is assigned per extension, and WRPKRU instructions switch the active memory domain on entry to and return from extension code so the host cannot modify extension state and vice versa.'
  isolation_mechanism: Intel MPK domain switching (WRPKRU on entry/exit) is the hardware isolation boundary - extension code pages are non-writable to the host and the extension''s own memory domain is inaccessible outside its WRPKRU-bracketed execution window; this trades kernel-trap-based process isolation for a much cheaper intra-process hardware domain switch, at the cost of being vulnerable to known ERIM syscall-based bypasses (acknowledged, with syscall-filtering defenses proposed as future work) and requiring Intel x86 MPK hardware (ARM memory domains noted as an unimplemented analogue).
  multiplexing_mechanism: 'bpftime maps replace kernel eBPF maps with a syscall-free shared-memory abstraction supporting three sharing modes (process-local, inter-process shared, process-kernel shared) across hash maps, arrays, LPM tries, ring buffers and per-CPU variants with lock-free synchronization, so multiple extensions and the kernel can multiplex the same state without a syscall per access; the current prototype supports only one extension per entry point, using a dispatcher pattern for more.'
  state_mechanism: eBPF map syscalls are interposed on and routed to bpftime''s own userspace map implementation instead of the kernel, so existing eBPF tooling (libbpf, bcc) works unmodified while state actually lives in shared userspace memory; a kernel-kprobe-to-userspace-bpftime-map interaction (demonstrated via a Redis durability use case) shows kernel and userspace extensions can consistently share state through these maps.
  overhead_bottleneck: Per-invocation trampoline dispatch (~84ns) is the main fixed cost added to a bare extension call (1.35ns), and unused extension entry points are removed entirely from the compiled binary ("concealed extension entries") to avoid paying even this cost when an extension is not attached.
  primary_tradeoff: Verified userspace execution plus MPK domain isolation instead of kernel-trap-enforced eBPF -> gives 10-16x faster uprobe/uretprobe invocation and near-native application throughput, at the cost of a larger specification burden (EIM capability annotations must be written and trusted to be complete) and reliance on Intel-specific MPK hardware with known ERIM-class attack surface.
  quantitative_claims:
  - 'uprobe latency: 190.02ns (bpftime) vs 2561.57ns (kernel eBPF), 13.5x faster; uretprobe 187.10ns vs 3019.45ns, 16x faster'
  - 'user-memory-read helper: 1.5ns (bpftime) vs 23.3ns (kernel eBPF), 15.5x faster'
  - 'Nginx firewall plugin throughput: bpftime 2% overhead (4,461 vs 4,536 RPS native) vs 11-12% overhead for Lua/WebAssembly/ERIM/RLBox baselines (5.5-6x lower overhead than Lua/Wasm)'
  - 'DeepFlow microservice monitoring: kernel eBPF reduces throughput up to 54%; bpftime improves DeepFlow throughput by at least 1.5x over the kernel-eBPF configuration'
  - 'sslsniff SSL monitoring on Nginx: kernel eBPF up to 28.06% throughput reduction vs bpftime 7.41% worst case, a 3.79x improvement'
  - 'syscount syscall monitoring: kernel eBPF reduces monitored-process throughput 10.3% and unmonitored-process throughput 9.6%; bpftime reduces monitored throughput 3.36% with zero impact on unmonitored processes'
  - 'FUSE caching (passthrough fstat): 3.65s native/uncached vs 0.176s with a bpftime extension; LoggedFS openat 17.0s vs 0.074s'
  - 'extension load latency: 48ms (bpftime) vs 30ms (LD_PRELOAD)'
  - 'hardware: dual-socket Intel Xeon Gold 5418Y (24-core) and dual-socket Intel Xeon E5-2697v2 (48-core) test systems'
  why_useful_for_learning: It is the corpus''s clearest example of trading a kernel-trap isolation boundary for a cheaper intra-process hardware-domain boundary (MPK), directly paired with Rex (ATC25-17, language-based eBPF safety) and HyperTurtle (ATC25-02, verified-eBPF-as-hypervisor-extension) as three different answers to "how do you make an eBPF-style extension both safe and fast".

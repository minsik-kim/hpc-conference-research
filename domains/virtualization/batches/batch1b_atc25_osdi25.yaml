- id: VIRT-OSDI25-04
  title: Quantum Virtual Machines
  title_correction: null
  authors:
  - Runzhou Tao
  - Hongzheng Zhu
  - Jason Nieh
  - Jianan Yao
  - Ronghui Gu
  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/tao
  fullpaper_source: https://www.cs.columbia.edu/~nieh/pubs/osdi2025_hyperq.pdf
  classification: CORE
  classification_note: HyperQ defines a quantum virtual machine abstraction (a qVM presenting the same gate/qubit-topology interface as real hardware) and time/space-multiplexes a physical QPU among several qVMs with explicit fault isolation - a direct quantum analogue of CPU/machine virtualization (T1) and accelerator sharing (T6).
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary:
  - T6
  physical_resource: QPU
  logical_abstraction: A qVM - a quantum-circuit interface with a fixed qubit count and topology, backed by a sub-region of a physical QPU's repeating qubit lattice (e.g. IBM Eagle's I-shaped 7-qubit unit) or by a time-multiplexed slice of one
  problem: Cloud quantum computers run one program at a time on the entire machine regardless of its size, so small programs still monopolize the whole QPU and users can wait days in queue even though most qubits sit idle.
  mechanism: 'A space-scheduling algorithm greedily assigns each qVM to a contiguous, non-overlapping region of the physical qubit lattice that matches the machine''s repeating topology unit (so no per-qVM recompilation for a different coupling map is needed), leaving unused qubits as isolation buffers between regions; a time-scheduling algorithm appends shorter qVM programs after longer ones on the same physical qubits within a batch, inserting mid-circuit measurement and reset between them; all scheduled qVMs are compiled into one composite quantum circuit (virtual-to-physical qubit translation, gate-direction adjustment) and submitted to the cloud service as a single job.'
  isolation_mechanism: Fault/crosstalk isolation is physical, not logical - qVM regions are separated by a buffer of unused qubits so no two qVMs share a direct qubit-qubit coupling; the paper measures 81% success running two concurrent 2-qubit programs on adjacent qubits versus 85% with one qubit of separation, confirming the buffer meaningfully preserves fidelity, and one qVM's program failure cannot corrupt the physical hardware or later executions.
  multiplexing_mechanism: Spatial multiplexing partitions the QPU's qubit grid into same-shaped regions sized as multiples of the hardware's basic repeating unit; temporal multiplexing reuses one region's qubits sequentially across programs within a batch via measurement-and-reset, since there is no way to suspend qubit state.
  state_mechanism: 'There is no quantum context switch: current QPUs have no QRAM, so qubit state cannot be saved outside the QPU. HyperQ works around this by batching an entire schedule into one composite circuit submitted and executed as a single job, and by using mid-circuit measurement/reset (rather than state save/restore) to hand a region from one temporally-multiplexed program to the next.'
  overhead_bottleneck: Cloud queueing time dominates end-to-end latency far more than HyperQ's own overhead - offline compilation/scheduling/aggregation costs only 0.14s across 145 benchmark programs - and external fragmentation from discrete region sizes caps physical-qubit utilization (only 85 of 127 IBM Eagle qubits usable when all 9 qVM regions are occupied, ~67% ceiling).
  primary_tradeoff: Partitioning into hardware-topology-matched qVM regions and reusing qubits temporally via reset -> gives 8-9x throughput and multi-hour-to-day queue-time reductions at essentially unchanged fidelity for spatial sharing, but temporal (measurement/reset-based) sharing measurably degrades fidelity, qVMs are tied to one machine's specific topology (no portability), and programs cannot be preempted once a batch starts.
  quantitative_claims:
  - 'throughput vs directly running on IBM Quantum: 8.4-9.7x (all-at-once arrivals), 3.0-3.4x (Poisson arrivals)'
  - 'utilization: 3.3% -> 28-35% (all-at-once, 8.6-11x), 3.3% -> 10-26% (Poisson, 3.0-3.6x)'
  - 'average per-program latency: 229s -> 28-30s (all-at-once, 7.6-8.2x), 159s -> 3.7-4.0s (Poisson, 17-43x)'
  - 'fidelity (L1 distance, lower is better): 0.55 (IBM baseline) vs 0.55 (HyperQ spatial, all-at-once) vs 0.64 (HyperQ temporal scheduling, showing measurement/reset noise cost)'
  - 'wall-clock example: small-only and small&med benchmark suites took 19h and 40h respectively directly on IBM Quantum vs 2-3h with HyperQ'
  - 'crosstalk isolation test: 81% success for two concurrent 2-qubit programs on adjacent qubits vs 85% with one qubit of separation'
  - 'scheduling overhead: 0.14s across 145 benchmark programs'
  why_useful_for_learning: It shows every classical virtualization concept (guest interface, spatial partition, temporal multiplexing, fault isolation) reappearing on a QPU, and precisely where the analogy with a classical VM breaks down - there is no context switch because there is no QRAM to save state into.
  priority: P1
  related: []
  relations: []
  existing_corpus_overlap: hpc_quantum
  previous_analysis_depth: 'analysed in hpc_quantum corpus: prior analysis covered the HyperQ system generally; this pass focuses specifically on the virtualization delta - how HyperQ time/space-multiplexes and isolates a QPU as a guest-facing virtual-machine abstraction.'
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: KEEP_CORE_ALREADY_ANALYZED - retained as CORE per instruction regardless of prior-corpus analysis; existing_corpus_overlap set to hpc_quantum.

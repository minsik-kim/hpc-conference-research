papers:
- id: VIRT-ATC25-01
  title: 'LITESHIELD: Secure Containers via Lightweight, Composable Userspace μKernel Services'
  title_correction: null
  authors:
  - Kaesi Manakkal
  - Nathan Daughety
  - Marcus Pendleton
  - Hui Lu
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.5555/3768039.3768096
  official_url: https://www.usenix.org/conference/atc25/presentation/manakkal
  fullpaper_source: https://www.usenix.org/system/files/atc25-manakkal.pdf
  classification: CORE
  classification_note: 'The contribution is a new secure-container isolation architecture that decomposes the guest kernel into userspace uKernel services communicating over shared-memory IPC, replacing the host-kernel-sharing boundary of a normal container with a syscall-interposition boundary reminiscent of a microkernel/exokernel guest.'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T1
  physical_resource: CPU core
  logical_abstraction: A container whose only interface to the host is a fixed set of ~22 syscalls, with all other guest-visible syscalls (~170) served by isolated userspace uKernel service processes rather than the shared host kernel
  problem: Standard containers share the host kernel and its 300+ syscall attack surface, while VM-based isolation (Kata, Firecracker) removes that sharing only by adding a monolithic guest kernel plus hypervisor, which is heavyweight and still a large TCB.
  mechanism: 'Guest syscalls are split into delegable (~142, e.g. file I/O, networking, timers) and non-delegable (~28, e.g. fork/mmap/mprotect) classes. Delegable calls are redirected via an LD_PRELOAD/binary-rewriting interception library to userspace uKernel service processes over polling shared-memory IPC; non-delegable calls are trapped with ptrace and arbitrated by a core uKernel service. A deny-all seccomp profile forces every guest syscall through one of these two paths, and the uKernel services themselves run under a ~22-syscall seccomp whitelist.'
  isolation_mechanism: Application and uKernel-service processes are separate OS processes (page-table isolated) pinned to separate cores; a compromised uKernel service is confined to its own restricted userspace process rather than gaining host-kernel privilege, and the guest's user-to-host interface is reduced from 300+ syscalls to 22.
  multiplexing_mechanism: CPU cores are statically split between application and uKernel-service processes to avoid same-core context switches; the fast IPC path uses busy-polling shared-memory buffers with no kernel involvement, while the slow ptrace path costs 15-35 microseconds per non-delegable syscall.
  state_mechanism: Filesystem state is held in-memory by a userspace ext2-compatible uKernel service and written through to host NVMe; network state lives in a ported userspace network stack (f-stack) inside its uKernel service; syscall arguments/results cross via fixed shared-memory buffers, so nothing is migrated across a hypervisor boundary because there is none.
  overhead_bottleneck: The ptrace-based arbitration path for non-delegable syscalls (mmap, futex, fork, clock_nanosleep), which the paper measures at 15-35 microseconds of added latency per call versus native.
  primary_tradeoff: Replacing the shared host kernel with userspace uKernel services -> gains a VM-like thin interface (22 syscalls) without a hypervisor or guest kernel, but costs compatibility for statically-linked/inline-syscall binaries that bypass the interception library, and leaves ptrace-mediated syscalls slower than native.
  quantitative_claims:
  - 'user-to-host interface: 22 syscalls (LiteShield) vs 300+ (standard container) vs 20+ hypercalls/60+ VM-exits (KVM)'
  - 'ptrace overhead on non-delegable syscalls: mmap 99.1% (25.485us vs 0.220us native), futex 98.4% (15.476us vs 0.254us native), fork 46.8%, clock_nanosleep 29.0%'
  - 'UDP throughput: ~3.0M pkt/s (LiteShield) vs ~3.2M native vs ~2.2M gVisor vs ~2.5M Firecracker'
  - 'Redis+YCSB workload A (50% read/50% update): ~110k ops/s (LiteShield, 110% of native) vs ~100k native vs ~85k Firecracker vs ~70k gVisor'
  - 'Redis+YCSB workload B (95% read/5% update): ~160k ops/s (LiteShield, 114% of native) vs ~140k native'
  - 'implementation size: ~7,000 LOC (LiteShield) vs ~1.4M LOC for QEMU+hypervisor stack'
  - 'testbed: Intel Xeon Gold 6430, 96GB DDR5, Micron 7450 NVMe, Ubuntu 22.04/Linux 5.15, 16 cores/32GB per container, hyperthreading disabled'
  why_useful_for_learning: It is a concrete, measured example of moving the isolation boundary from hardware virtualization to syscall interposition plus process separation, directly illustrating the brief's container-isolation-architecture-vs-runtime-mechanism distinction.
  priority: P1
  related:
  - VIRT-EUROSYS25-17
  relations:
  - type: ALTERNATIVE
    target: gVisor / Firecracker / KVM+Kata
    basis: All are implemented and measured as baselines on the same syscall-latency, network, storage-I/O and Redis/YCSB benchmarks.
  - type: SAME_BRANCH
    target: VIRT-EUROSYS25-17
    basis: Both reduce the cost of the secure-container isolation boundary versus hardware-virtualized (Kata/HVM) baselines, one via userspace uKernel decomposition and syscall interposition, the other via intra-kernel privilege separation (PKS).
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Title spelled LITESHIELD (small caps) in the paper; seed title matched exactly. AFRL co-authors carry a public-release distribution statement, no effect on classification.
- id: VIRT-ATC25-02
  title: Accelerating Nested Virtualization with HyperTurtle
  title_correction: null
  authors:
  - Ori Ben Zur
  - Jakob Krebs
  - Shai Aviram Bergman
  - Mark Silberstein
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.5555/3768039.3768097
  official_url: https://www.usenix.org/conference/atc25/presentation/zur
  fullpaper_source: https://www.usenix.org/system/files/atc25-zur.pdf
  classification: CORE
  classification_note: The paper's entire contribution is reducing the cost of the nested-virtualization boundary itself (L0/L1/L2 world switches), which is the canonical T1 CPU/machine-virtualization problem.
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary:
  - T3
  physical_resource: CPU core
  logical_abstraction: A nested guest (L2) whose EPT faults, network policy enforcement and profiling are serviced by the bare-metal hypervisor (L0) directly, without trapping into the virtualized hypervisor (L1) on the common path
  problem: Nested virtualization (an L1 hypervisor, e.g. Kata's VMM, running L2 guest VMs on top of an L0 hypervisor) multiplies world switches - an EPT fault takes 6 switches versus 2 in non-nested virtualization - so common operations like page faults, network policy and profiling become several times more expensive.
  mechanism: 'HyperTurtle lets L1 register small eBPF programs ("hyperupcalls") that L0 loads and runs directly in its own context when L2 causes an EPT fault, sends/receives network packets, or is profiled, using shared eBPF maps for L0-L1 state (a frame pool for EPT faults, fault logs, policy counters, a profiling ring buffer) instead of trapping to L1. The standard kernel eBPF verifier plus a new bpf_probe_read_hyperupcall helper confine each hyperupcall to its owning L1s memory; the path falls back to the traditional L0->L1->L0 handling when a lock is contended or the frame pool is exhausted.'
  isolation_mechanism: Each hyperupcall is verified by the standard (or a stricter) eBPF verifier before L0 loads it, can only read memory belonging to the L1 that installed it (enforced by bpf_probe_read_hyperupcall), and per-vNIC/per-L2 hooks prevent one L1's eBPF from seeing another L1's traffic or EPT state; cloud-vendor-supplied hyperupcalls can additionally be required to be cryptographically signed.
  multiplexing_mechanism: Network and profiling hyperupcalls are attached per-vNIC/per-L2 so multiple L1s can each install independent policies on the same L0; the EPT-fault hyperupcall is currently a single global L0 hook and so supports only one L1 per L2 at a time.
  state_mechanism: L0-L1 state (pre-allocated EPT frame pool, hyperupcall fault log, page-fault log, L1's VMM cr3, hyperupcall lock, network-policy counters, profiling ring buffer) lives in shared eBPF maps exposed to L1 via a shared-memory PCI device installed by hypercall; nothing is migrated, only the handling locus of certain vm-exits moves from L1 back into L0.
  overhead_bottleneck: World switches between L0/L1/L2 on the common event paths - 6 switches for an EPT fault versus 2 non-nested, each switch costing about 1us and roughly a third of vm-exit handling time - is the bottleneck HyperTurtle targets directly.
  primary_tradeoff: Executing L1 logic as verified eBPF inside L0 -> eliminates most of the extra nested world switches (5x lower EPT-fault latency, 27% faster Kata boot) but costs eBPF's expressiveness limits (no unbounded loops/free locking, restricted memory access, no huge-page or page-cache-backed EPT faults) and currently only one L1 per L2 for the EPT-fault path.
  quantitative_claims:
  - 'EPT fault latency: 28.39us (plain L2) vs 5.58us (non-nested L1 baseline) vs 5.40us (L2+HyperTurtle), a 5.26x improvement over plain nested'
  - 'Kata container boot time: ~27% faster with 4KiB pages, ~8% faster with 2MiB pages, across Alpine/Java/JavaScript/Python+Pandas/Ubuntu images'
  - 'profiling sampling latency: 60.68us (L1->L2 vanilla) vs 8.49us (HyperTurtle->L2), a 7.15x improvement'
  - 'UDP round-trip latency/throughput: HyperTurtle+Pass 55.0us/17.3 Gb/s vs Nested-VirtIO 90.21us/12.1 Gb/s (33% lower latency, 41% higher throughput), vs Direct-Assignment upper bound 54.52us/17.4 Gb/s'
  - 'Nginx throughput: 1.8 KQPS (HyperTurtle+TCP-Top+RateLimiter) vs 1.24 KQPS (Nested-VirtIO), 45% higher'
  - 'Redis throughput: 65% higher than Nested-VirtIO, within 6% of Direct-Assignment configurations'
  - 'memcached at 500us P99 SLA with profiling: 55->49 KQPS (1000Hz, +12%) and 42->53 KQPS (4000Hz, +26%) vs plain HyperTurtle'
  - 'hardware: 2x Xeon Silver 4216 (16-core), 512GB RAM; L1 12 vCPU/64GB QEMU; L2 1 vCPU/2GB Cloud-Hypervisor; SMT off'
  why_useful_for_learning: It gives a precise, measured account of exactly which vm-exit types dominate nested-virtualization cost and demonstrates eBPF-as-hypervisor-extension as an alternative to redesigning the nested boundary itself.
  priority: P1
  related:
  - VIRT-EUROSYS25-17
  relations:
  - type: TRADEOFF_PAIR
    target: VIRT-EUROSYS25-17
    basis: HyperTurtle makes nested virtualization cheaper by shortcutting L0-L1-L2 world switches; CKI (EUROSYS25-17) instead avoids the nested VMX path altogether by de-privileging the guest kernel with PKS. Both are answers to the cost of nested/secure-container virtualization.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - paper
  - code
  - official-web
  confidence: HIGH
  notes: Artifact and evaluation scripts published at github.com/acsl-technion/hyperturtle.
- id: VIRT-ATC25-03
  title: Efficient Performance-Aware GPU Sharing with Compatibility and Isolation through Kernel Space Interception
  title_correction: null
  authors:
  - Shulai Zhang
  - Ao Xu
  - Quan Chen
  - Han Zhao
  - Weihao Cui
  - Zhen Wang
  - Yan Li
  - Limin Xiao
  - Minyi Guo
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc25/presentation/zhang-shulai
  fullpaper_source: https://www.usenix.org/system/files/atc25-zhang-shulai.pdf
  classification: CORE
  classification_note: 'The paper defines and enforces a new virtual-GPU-instance abstraction IGPU(s,t,m) (spatial MIG slice x temporal token x memory quota) with kernel-mediated fault and performance isolation, not merely a scheduling policy layered over an existing GPU-sharing primitive.'
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T9
  physical_resource: GPU
  logical_abstraction: 'An IGPU(s,t,m): an isolated GPU instance combining an MIG spatial slice, a temporal execution-time quota and a memory quota, runtime-configurable and enforced independently of the CUDA/Vulkan runtime version'
  problem: Existing GPU-sharing mechanisms force a choice between compatibility (API-remoting breaks on new CUDA/Vulkan versions), isolation (MPS contexts crash together on cross-border memory errors) and utilization/performance guarantees (coarse static MIG partitioning).
  mechanism: 'A kernel module intercepts the ioctl calls used at GPU-context creation to locate each processs command-buffer pages and changes their page-protection flags (do_mprotect_pkey); when a paused tenant tries to write a command, the resulting segfault is caught by a handler that checks a per-process CPU token before allowing the write, giving cooperative but kernel-enforced temporal time-slicing on top of MIGs hardware spatial partitions. A two-stage bin-packing orchestrator picks (s,t,m) tuples that meet each tenants throughput target using the measured relation Thr(s,t,m) = Thr(s,100%,m) x t, and a feedback loop reads GPU utilization from NVML/DCGM every ~100ms to correct the token allocation.'
  isolation_mechanism: MIG hardware partitioning gives strong spatial fault isolation (a crashing tenant cannot corrupt another spatial instance's memory or SMs); within a spatial instance, kernel-mediated command-buffer write-protection prevents a paused tenant's commands from reaching the GPU at all, and per-context device-memory ioctl interception enforces per-tenant memory quotas.
  multiplexing_mechanism: Physical GPU SMs/memory/bandwidth are spatially divided by MIG into up to 7 static instances, and each instance is further time-sliced by a kernel-enforced CPU-token scheme (default 100ms tokens, 1% minimum quota) that mprotects a tenant's command buffer when its token is inactive.
  state_mechanism: Per-GPU scheduler state (process-to-IGPU mapping, command-buffer addresses, CPU-token ownership, memory quotas) lives in the kernel module (~4.8MB); GPU execution context/state itself remains owned by the vendor driver and MIG hardware and is not migrated by this system.
  overhead_bottleneck: The segfault-based access-control path taken every time a currently-paused tenant attempts a GPU write, plus token-switch frequency versus batch size (shorter tokens raise P99 latency QoS violations for large batches, longer tokens raise them for small batches).
  primary_tradeoff: Kernel-space command-buffer interception -> gains broad CUDA/Vulkan-version compatibility and fault isolation simultaneously (no prior single approach had both) with strong throughput-target accuracy, but costs the loss of MIG's live spatial re-configuration, so it cannot elastically reclaim spatial capacity when a workload's demand drops.
  quantitative_claims:
  - 'GPU count reduction to meet the same throughput targets across 10 workload mixes: 32.1% fewer GPUs than pure temporal sharing, 23.1% fewer than Best-fit-MIG, 20.5% fewer than GPUlet-MIG (Nvidia A100 40GB and RTX 4090)'
  - 'normalized throughput target error: 3.3% average with full feedback control vs 53.6% pass-through, 24.2% GaiaGPU-style API-remoting, 21.6% without adaptive feedback'
  - 'isolation stress test: adversary spawning 48 CUDA contexts crashes 7/8 (kernel interception) to 8/8 (MPS) victim processes under MPS, while the kernel-interception mechanism keeps all victims isolated'
  - 'P99 latency QoS violation rate: 1.23% average across token-length configurations'
  - 'distributed training (Transformer-XL, 2x RTX4090): 1.8% relative throughput error'
  - 'compatibility tested across CUDA 11.x-12.1, Vulkan 1.1 and 1.3, PyTorch 2.2.1'
  why_useful_for_learning: It shows the difference between a GPU-sharing scheduler and an actual virtual-GPU abstraction, and demonstrates combining a hardware partitioning primitive (MIG) with a software-mediated temporal layer to get properties neither provides alone.
  priority: P1
  related: []
  relations:
  - type: SAME_BRANCH
    target: VIRT-ATC25-05
    basis: Both interpose on the GPU driver stack to bound interference between co-located tenants below the CUDA runtime, one via command-buffer write-protection for spatial+temporal sharing, the other via GPU hardware timeslice reconfiguration for latency-critical preemption.
  - type: CONTRASTS_WITH
    target: NVIDIA MIG / MPS / API-remoting GPU sharing (TGS, GaiaGPU, GSlice)
    basis: Directly implemented and measured as baselines for compatibility, isolation and utilization comparisons.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: The proceedings PDF header names an internal codename for the system distinct from the title; the official title (as in the program) is used here. Proceedings pages 1003-1019.
- id: VIRT-ATC25-05
  title: 'GPREEMPT: GPU Preemptive Scheduling Made General and Efficient'
  title_correction: 'seed title said: GPreempt (seed title abbreviated)'
  authors:
  - Ruwen Fan
  - Tingxu Ren
  - Minhui Xie
  - Shiwei Gao
  - Jiwu Shu
  - Youyou Lu
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.5555/3768039.3768055
  official_url: https://www.usenix.org/conference/atc25/presentation/fan
  fullpaper_source: https://www.usenix.org/system/files/atc25-fan.pdf
  classification: SUPPORT
  classification_note: 'GPreempt is GPU preemptive scheduling - the brief lists "GPU preemption" as a canonical SUPPORT topic (it explains a major GPU-sharing trade-off) rather than a virtual-GPU abstraction in itself.'
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T6
  physical_resource: GPU
  logical_abstraction: A GPU on which a latency-critical (LC) task can preempt a best-effort (BE) task within tens of microseconds regardless of whether the BE kernel is idempotent
  problem: Prior GPU preemption is either general but slow (wait-based, ~5ms because it waits for the running kernel to finish or reach a checkpoint) or fast but only safe for idempotent kernels (reset-based, which kills and restarts the BE kernel).
  mechanism: 'GPreempt repurposes an undocumented GPU hardware timeslice-allocation mechanism (found by reading open-source NVIDIA/AMD driver code): it shortens a BE tasks timeslice (e.g. to 200us) so that on LC-task arrival the BE task yields the GPU within its own next quantum, and it hides most of the ~44.3MB per-GPU context save/restore cost via "hint-based pre-preemption" that starts context-saving during the LC tasks CPU-side data-preparation phase, before the LC kernel is actually ready to launch.'
  isolation_mechanism: LC and BE tasks run in independent hardware scheduling groups; when only BE tasks are present the GPU does not force switches between them, and full per-SM context (164KB shared memory + 64K 32-bit registers per SM, ~44.3MB total) is saved and restored so BE task state is not corrupted by preemption.
  multiplexing_mechanism: GPU hardware timeslice rotation is reconfigured at initialization (not at runtime) to give BE tasks short quanta and LC tasks long ones, so hardware itself performs the temporal multiplexing rather than a software scheduler.
  state_mechanism: The preempted BE kernel's full execution context (registers + shared memory per SM) is saved to and restored from GPU/host memory across the ~1.1TB/s memory bus on an A100; nothing is migrated off-GPU.
  overhead_bottleneck: Context-switch cost dominates when it cannot be hidden - saving ~44.3MB of GPU context takes about 40us baseline, and BE-task timeslice-yield latency (average t1/2, max t1 ~=160us) adds further delay when pre-preemption cannot overlap with LC data preparation.
  primary_tradeoff: Hardware timeslice manipulation plus pre-preemption -> gains ~40us preemption latency for arbitrary (non-idempotent) kernels, matching reset-based speed with wait-based generality, but costs dependence on reverse-engineered, undocumented, GPU-vendor- and generation-specific hardware scheduling behavior.
  quantitative_claims:
  - 'LC task latency increase vs LC-only baseline (NVIDIA A100): +58.4% no preemption, +96.3% sequential, +15.3% block-level wait-based, +2.4% GPreempt'
  - 'LC task latency increase (AMD MI100): +170.1% no preemption, +43.5% block-level wait-based, +13.2% reset-based (REEF), +10% GPreempt'
  - 'BE task throughput retained (A100): 66.0% sequential, 79.7% block-level wait-based, 30.3% LC-only, 88.6% GPreempt'
  - 'preemption latency: <40us (single LC task with pre-preemption) vs 200-1100us for wait-based approaches, on A100'
  - 'context footprint: 164KB shared memory + 64K 32-bit registers per SM = ~420KB/SM, ~44.3MB aggregate GPU context, save completed in ~40us at 1.1TB/s'
  - 'hardware: NVIDIA A100-40GB, AMD MI100, Intel Xeon Gold 5420+; workloads: VGG/ResNet/DenseNet/BERT inference, BFS/SSSP/PageRank/CC graph, weather-simulation scientific computing'
  why_useful_for_learning: It is a clean case study in the classic GPU-sharing trade-off (preemption speed vs generality) that any CORE GPU-virtualization paper has to navigate, and shows that hardware "features" not exposed by the vendor driver stack are sometimes the real multiplexing mechanism.
  priority: P1
  related:
  - VIRT-ATC25-03
  relations:
  - type: SAME_BRANCH
    target: VIRT-ATC25-03
    basis: Both bound GPU-sharing interference below the CUDA/vendor runtime; GPreempt targets fast, general preemption for latency-critical co-location while the kernel-interception paper targets a persistent spatio-temporal partition abstraction.
  - type: CONTRASTS_WITH
    target: REEF (reset-based GPU preemption) / wait-based block-level preemption
    basis: Directly implemented and measured as baselines on both NVIDIA and AMD hardware.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - code
  - official-web
  confidence: HIGH
  notes: 'Resolves seed screening gap: official title is "GPREEMPT: GPU Preemptive Scheduling Made General and Efficient" by Fan et al. Artifact at github.com/thustorage/GPreempt.'
- id: VIRT-ATC25-06
  title: 'Poby: SmartNIC-accelerated Image Provisioning for Coldstart in Clouds'
  title_correction: null
  authors:
  - Zihao Chang
  - Jiaqi Zhu
  - Haifeng Sun
  - Yunlong Xie
  - Kan Shi
  - Ninghui Sun
  - Yungang Bao
  - Sa Wang
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.5555/3768039.3768041
  official_url: https://www.usenix.org/conference/atc25/presentation/chang
  fullpaper_source: https://www.usenix.org/system/files/atc25-chang.pdf
  classification: SUPPORT
  classification_note: 'Poby accelerates container image download/decompression/extraction on a SmartNIC; this is the container image/runtime mechanism the brief classifies as SUPPORT, not a new isolation or virtual-resource abstraction (the paper itself states it is orthogonal to lightweight-isolation optimizations).'
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T8
  - T3
  physical_resource: NIC
  logical_abstraction: A container image whose download, decompression and unpacking are pipelined through SmartNIC DRAM instead of executing serially on the host CPU
  problem: Container coldstart latency is dominated by image provisioning, and prior work optimizes warm-starts, snapshots, or download but overlooks image extraction, which the paper measures at over 68.8% of provisioning latency.
  mechanism: 'An NVIDIA BlueField-2 SmartNIC pulls image layers over RDMA into NIC DRAM in 16MB blocks, decompresses them with the NICs hardware accelerator, and streams decompressed blocks over PCIe to host DRAM, where a host thread pool unpacks them into the container filesystem; a centrally-tracked image-metadata index records image locations and per-node download load to pick download sources.'
  isolation_mechanism: N/A (the paper explicitly treats isolation as an orthogonal, unaddressed concern)
  multiplexing_mechanism: Work is pipelined at 16MB block granularity across download/decompress/transmit/unpack stages so multiple blocks are in flight concurrently; host-side unpacking is parallelized across a thread pool but is storage-bandwidth-limited beyond about 2 concurrent unpacking threads.
  state_mechanism: Image metadata (locations, download load) is centrally tracked alongside the registry; in-flight blocks carry their own index/status fields and reside transiently in NIC DRAM before being copied to host memory - nothing here is VM/container runtime state, only image bytes.
  overhead_bottleneck: Host-CPU image unpacking remains the largest remaining cost even after SmartNIC offload of download+decompression, consuming 71.6% of total provisioning time in the optimized pipeline.
  primary_tradeoff: Offloading download+decompression to a SmartNIC -> frees host CPU cycles and cuts coldstart latency sharply, but costs dependence on specific SmartNIC hardware and only partially addresses the bottleneck since unpacking remains host-bound.
  quantitative_claims:
  - 'end-to-end coldstart speedup: 13.2x vs containerd, 8.0x vs iSulad (averaged across workloads: 11.5x and 7.1x)'
  - 'large image (2.45GB) latency: ~6.8s (Poby) vs 55.3s (iSulad) vs >90s (containerd)'
  - 'host CPU cycles: 87.5% fewer than iSulad; on-NIC CPU utilization peaks at 16.3%, averages 3.0%'
  - 'concurrency: 4.8x faster than Kraken/iSulad at 8 concurrent requests'
  - 'image extraction is 68.8% of total provisioning latency in the unoptimized baseline; unpacking is 71.6% of the remaining time after SmartNIC offload'
  - 'distributed download: 22% latency improvement with one extra provider node; 18% overhead penalty for remote decompression'
  why_useful_for_learning: It quantifies exactly where container coldstart time goes (image extraction, not just download) and shows offloading a data-movement/decompression pipeline to a SmartNIC as an alternative to the usual warm-pool or snapshot approaches to coldstart.
  priority: P2
  related:
  - VIRT-OSDI25-05
  relations:
  - type: LAYER_BELOW
    target: VIRT-OSDI25-05
    basis: Fork in the Road measures cold-start latency components in production and finds code/dependency deployment dominates in some regions; Poby attacks exactly that image-provisioning component with SmartNIC offload.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - paper
  - official-web
  confidence: HIGH
  notes: Evaluated on a two-node testbed; centralized image-metadata index is a noted scaling concern.
- id: VIRT-ATC25-07
  title: 'Burst Computing: Quick, Sudden, Massively Parallel Processing on Serverless Resources'
  title_correction: null
  authors:
  - Daniel Barcelona-Pons
  - Aitor Arjona
  - Pedro García-López
  - Enrique Molina-Giménez
  - Stepan Klymonchuk
  venue: ATC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/atc25/presentation/barcelona-pons
  fullpaper_source: https://www.usenix.org/system/files/atc25-barcelona-pons.pdf
  classification: CONTEXT
  classification_note: The paper itself frames its contribution as grouping/scheduling semantics (a "flare" group-invocation primitive and packing policies) layered on an existing FaaS platform (OpenWhisk), not a new isolation or virtualization mechanism.
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary:
  - T9
  physical_resource: CPU core
  logical_abstraction: A "flare" - a coordinated group of parallel workers scheduled and packed into containers as a unit, exposing group collectives (broadcast/reduce/all-to-all) to serverless code
  problem: FaaS platforms invoke functions independently, giving no parallelism guarantees, forcing complex external orchestration for burst-parallel jobs, and moving data between isolated function sandboxes rather than exploiting locality.
  mechanism: A modified OpenWhisk controller assigns a packing granularity g (workers per container) using heterogeneous/homogeneous/mixed strategies, invokers spawn containers running a custom Rust runtime that hosts g workers as threads, and a Burst Communication Middleware provides at-least-once message passing and collectives, using zero-copy intra-container communication and network communication only across containers.
  isolation_mechanism: Isolation is raised from per-invocation to per-job granularity; workers packed into one container share that container's sandbox and are separated from each other only by the Rust runtime's thread-safety, not by independent sandboxes.
  multiplexing_mechanism: Multiple logical workers are multiplexed onto one container/sandbox via intra-process threads at a scheduler-chosen granularity g, trading container-creation overhead against resource fragmentation.
  state_mechanism: Worker state is exchanged via BCM message passing and collectives with sequence-numbered at-least-once delivery; persistent state can additionally go to external storage, and nothing is migrated across a hypervisor or container-runtime boundary.
  overhead_bottleneck: Container creation dominates invocation latency; once containers are warm, inter-pack (cross-container) communication is the main remaining bottleneck since intra-pack communication is a negligible zero-copy path.
  primary_tradeoff: Packing many workers into one container -> cuts container-creation and cross-worker communication cost sharply, but costs per-pack resource reclamation granularity (idle resources when worker durations vary) and assumes elastic, lockstep-progressing application code.
  quantitative_claims:
  - 'job invocation latency: 11.5x faster than plain FaaS at 960 workers, packing granularity g=48'
  - 'worker start-time dispersity: 43x lower than plain FaaS'
  - 'shared-dataset loading: 32.6x speedup'
  - 'PageRank: 98.5% reduction in remote network traffic, 13x overall speedup'
  - 'TeraSort: 2x speedup with single-stage execution'
  - 'collective broadcast latency: ~98% reduction with packing vs unpacked baseline'

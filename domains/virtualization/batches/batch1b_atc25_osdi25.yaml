  classification: SUPPORT
  classification_note: XSched is a unified preemptive-scheduling layer (the XQueue abstraction plus a three-level preemption mechanism) generalized across seven accelerator software stacks; like GPreempt it is a scheduler/multiplexing mechanism over existing XPUs rather than a new virtual-accelerator partition abstraction, matching the brief's GPU/accelerator-preemption SUPPORT category extended to XPUs generally.
  drop_reason: null
  taxonomy_primary: T6

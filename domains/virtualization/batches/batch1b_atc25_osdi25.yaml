  - 'AOL-based performance predictor: Pearson correlation 0.951 with actual performance impact (one noted outlier)'
  - 'page migration cost: ~12us per page'
  why_useful_for_learning: It is a clear instance of the brief''s disaggregation-vs-virtualization boundary applied to memory tiering rather than remote pools - a real CXL/NUMA-tiering mechanism with measurable impact but no virtual-memory abstraction layered on top.

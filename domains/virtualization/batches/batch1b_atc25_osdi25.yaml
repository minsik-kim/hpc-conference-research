  - 'multi-XPU cooperative scheduling: 2.63x reduction in P99 NPU latency'
  - 'GPU resource harvesting in a multi-tenant setting: 2.74x more harvested GPU resources than TGS'
  - 'application-level wins: 9.26x lower P99 frame latency for video conferencing; 30.0% lower P99 latency for Triton inference serving'
  - 'preemption latency (level 3, NVIDIA GV100): 32us, independent of the preempted commands duration'
  - 'implementation effort: 214-841 lines of C++ per level-1 XPU backend'
  - 'bandwidth-partitioning overhead: 1.5% average'
  why_useful_for_learning: It generalizes the GPU-preemption design space (the same wait-vs-reset-vs-hybrid trade-off GPreempt explores for NVIDIA/AMD GPUs) across the full range of accelerator types, making explicit which preemption level each hardware/driver stack can support.

  - 'module execution overhead: 0.35% (FAT alone) to 0.78% (FAT+DiskIo cross-sandbox) on x86_64; 3.85-4.11% on ARM (Raspberry Pi 4)'
  - 'context-switch cost: ~1,126 cycles (x86_64/QEMU-KVM) vs ~5,262 cycles (ARM)'
  - 'memory overhead per sandboxed module: ~40KB (17KB memory management, 8KB shadow system table, 648B interface metadata/trampolines, ~33KB per-call stack/temporaries)'
  - 'offline protocol/parameter analysis coverage: 99.8% of protocol fields, 99.74% of compound-type fields, 97.5% of function parameters automatically classified (2.5% ambiguous void* cases need manual effort)'
  why_useful_for_learning: It shows the microkernel-isolation-boundary pattern (deprivilege + page-table separation + mediated services) applied one layer below the OS, at firmware, and is the corpus's clearest instance of the brief's "virtual firmware" CORE category.

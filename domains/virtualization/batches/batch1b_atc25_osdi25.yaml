- id: VIRT-OSDI25-07
  title: 'KRR: Efficient and Scalable Kernel Record Replay'
  title_correction: null
  authors:
  - Tianren Zhang
  - Sishuai Gong
  - Pedro Fonseca
  venue: OSDI
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi25/presentation/zhang-tianren
  fullpaper_source: https://www.cs.purdue.edu/homes/pfonseca/papers/osdi25-krr.pdf
  classification: CONTEXT
  classification_note: KRR is a kernel-execution record/replay debugging tool that happens to be deployed inside KVM/QEMU and uses a hypervisor-side recorder to capture hardware inputs, but its contribution (a split guest/hypervisor recorder and a replay-coherent spinlock for scalable kernel-only record-replay) is a kernel-debugging mechanism, not a virtualization or resource-multiplexing abstraction in itself.
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: A recorded trace of one guest kernel's execution (software inputs from a guest-side recorder, hardware inputs such as interrupts/DMA from a hypervisor-side recorder) that can be deterministically replayed to reproduce a production failure
  problem: Kernel bugs are hard to reproduce because full-system record-replay is too slow on concurrent, I/O-intensive, multi-core cloud workloads to be usable in production.
  mechanism: A guest-side recorder captures software-visible non-determinism (system calls, copy_from_user, page-table updates, other non-deterministic instructions) while a hypervisor-side recorder captures hardware inputs (interrupts, I/O, device DMA) since the VM boundary is a convenient place to intercept them; a Replay-Coherent (RC) spinlock serializes only kernel-mode execution across vCPUs (recording spin order/counts) while letting user-space code run in true parallel, and per-vCPU instruction counts from hardware performance counters timestamp asynchronous events for deterministic replay.
  isolation_mechanism: N/A - KRR relies on the pre-existing KVM/QEMU guest/hypervisor boundary as a convenient recording interface; it does not add or modify an isolation mechanism.
  multiplexing_mechanism: The RC spinlock effectively serializes kernel-mode execution to one vCPU at a time (multiplexing many vCPUs' kernel code onto a single logical recording stream) while user-space instructions on other vCPUs continue to run and are captured separately.
  state_mechanism: A synchronous VM snapshot of kernel memory (not full VM memory) is taken at recording start; periodic checkpoints during replay are tagged with per-vCPU instruction-count vectors to support reverse debugging from any checkpoint forward.
  overhead_bottleneck: RC-spinlock contention becomes the dominant cost on VMs beyond about 8 cores, since kernel-mode execution is serialized across vCPUs regardless of core count.
  primary_tradeoff: Recording only the kernel (not full-system) -> scales far better on multi-core, I/O-heavy workloads than whole-VM record-replay, but cannot reproduce bugs that require true parallel kernel execution across multiple cores or races with extremely narrow timing windows.
  quantitative_claims:
  - 'RocksDB, 8-core: 1.52x-2.79x slowdown (KRR) vs 8.97x-29.94x (whole-VM record-replay baseline)'
  - 'kernel compilation, 8-core: 1.56x slower (KRR) vs 11.47x slower (VM-RR baseline)'
  - 'Redis with DPDK, 4-core (kernel-bypass): <=1.05x throughput overhead'
  - 'bug reproduction: 16 of 17 real-world bugs reproduced, including 5 of 6 non-deterministic bugs and all 5 tested CVEs'
  - 'storage: 48.9% trace-size reduction on kernel-bypass workloads; up to 6.91x compression on traditional workloads'
  - 'replay speed: 20x-150x slower than real time (single-step QEMU emulation)'
  why_useful_for_learning: It is a clear example of a system that depends on, but does not extend, the guest-hypervisor boundary - useful contrast for identifying when a KVM/QEMU-based system is actually a virtualization-mechanism paper versus a tool that merely exploits an existing VM interface.

papers:
- id: VIRT-ASPLOS25-01
  title: "Vela: A Virtualized LLM Training System with GPU Direct RoCE"
  title_correction: null
  authors: [Apoorve Mohan, Robert Walkup, Bengi Karacali, Ming-Hung Chen, Abdullah Kayi, Liran Schour, Shweta Salaria, Sophia Wen, I-Hsin Chung, Abdul Alim, Constantinos Evangelinos, Lixiang Luo, Marc Dombrowa, Laurent Schares, Ali Sydney, Pavlos Maniotis, Sandhya Koteshwara, Brent Tang, Joel Belog, Rei Odaira, Vasily Tarasov, Eran Gampel, Drew Thorstensen, Talia Gershon, Seetharami Seelam]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3676641.3716280
  official_url: https://dl.acm.org/doi/10.1145/3676641.3716280
  fullpaper_source: UNKNOWN
  classification: CORE
  classification_note: "The contribution is the virtualized machine/IO stack itself - KVM VMs with PCIe-passthrough GPUs plus SR-IOV RoCE virtual functions made to carry GPUDirect peer-to-peer DMA at near-bare-metal speed - not an application that merely runs in VMs."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T1, T6, T9]
  physical_resource: NIC
  logical_abstraction: "A VM that presents a faithful copy of the host accelerator topology - passthrough GPUs, SR-IOV RoCE VFs and correct GPU/NIC/CPU-socket affinity - so that an unmodified NCCL/PyTorch stack can do GPUDirect RDMA from inside the guest"
  problem: "Cloud operators want VM-level flexibility (re-provisioning, multi-tenancy, bring-your-own-stack) for large-scale LLM training, but naive KVM virtualization destroys the GPU-to-NIC RDMA data path that distributed training depends on."
  mechanism: "GPUs are given to the guest by PCIe passthrough while the RoCE NIC is exposed as SR-IOV virtual functions; the VM definition mirrors the physical PCIe/NUMA topology so the guest can compute correct GPU-NIC affinity. GPUDirect RDMA inside the guest is enabled by turning on IOMMU, PCIe ACS and Address Translation Services on the NIC and on the virtual functions so the NIC can DMA directly into GPU BAR memory, plus huge pages and enlarged PCIe max-read-request sizing along the whole stack (firmware, host, hypervisor, guest)."
  isolation_mechanism: "Hardware-enforced: IOMMU/EPT-based memory isolation per VM, ACS on PCIe controllers, and per-tenant SR-IOV virtual functions; software-defined networking marks and separates RoCE traffic (DSCP) from tenant TCP traffic."
  multiplexing_mechanism: "Node-granular: a training VM owns its passthrough GPUs exclusively; multiplexing happens at the cluster level by re-provisioning whole nodes/VMs between training and inference pools. The NIC is multiplexed by SR-IOV virtual functions."
  state_mechanism: "Virtualization state is the guest's device assignments plus IOMMU/EPT mappings; because GPUs are passed through and the NIC uses VFs, the VM is effectively pinned - no live migration of a training VM is offered, and re-provisioning means tearing the VM down."
  overhead_bottleneck: "The guest-to-device DMA path: without ATS/ACS/huge-page tuning the NIC-to-GPU peer-to-peer path collapses and out-of-the-box KVM RoCE performance is far below bare metal; residual PCIe link degradation remains an operational bottleneck."
  primary_tradeoff: "Virtualize the training node -> gains operational flexibility (fast re-provisioning, heterogeneous software stacks, fine-grained quota, multi-tenancy) but costs a few percent of throughput and, structurally, gives up live migration and easy memory overcommit because GPUs are passed through and DMA is direct."
  quantitative_claims:
  - "~80% of ideal throughput when training a 50-billion-parameter decoder model at ~1500 GPU scale (from the ASPLOS abstract)"
  - "~70% per-GPU FLOPS relative to a single-VM baseline at that scale (from the ASPLOS abstract)"
  - "companion preprint arXiv:2407.05467 (same Vela system, overlapping authors, NOT the ASPLOS paper): <=5% virtualization overhead vs bare metal, e.g. NMT-12 training 147K words/s bare metal vs 140K words/s in VM; OpenShift-on-VM adds a further <=4%"
  why_useful_for_learning: "It is the clearest production-scale statement of what it costs to put a high-performance accelerator I/O path (GPUDirect RDMA over RoCE) inside a VM, and exactly which virtualization knobs (IOMMU, ACS, ATS, SR-IOV VFs, huge pages, topology fidelity) have to line up for passthrough-class performance."
  priority: P1
  related: [VIRT-ASPLOS25-13, "To Virtualize or Not to Virtualize: Experiences from Building Two Generations of Virtualized Infrastructure for LLM Training (SC25, non-archival talk)"]
  relations:
  - {type: PRECURSOR, target: "The infrastructure powering IBM's Gen AI model development (arXiv:2407.05467)", basis: "Same Vela system and overlapping author set; describes the KVM/SR-IOV/ATS design and the 5% overhead measurements that the ASPLOS paper builds on"}
  - {type: TRADEOFF_PAIR, target: "device passthrough vs software-mediated virtio/vSwitch I/O", basis: "Vela chooses passthrough + SR-IOV for performance and thereby forfeits live migration and transparent memory management"}
  existing_corpus_overlap: ai_hpc_systems
  previous_analysis_depth: "analysed in ai_hpc_systems: full system analysis as an LLM-training infrastructure paper (cluster architecture, network fabric, training throughput at scale); the virtualization I/O path was not the focus there"
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web, preprint, existing-corpus]
  confidence: MEDIUM
  notes: "KEEP_CORE_ALREADY_ANALYZED. Virtualization-specific delta: Vela shows that the accelerator I/O virtualization question for AI clusters is not 'emulate the device' but 'get the guest out of the DMA path' - GPUs by PCIe passthrough, NIC by SR-IOV VF, and GPUDirect peer-to-peer DMA made legal inside the guest via IOMMU + PCIe ACS + Address Translation Services, with the VM's PCIe/NUMA topology faithfully mirrored so the guest's collective library can pick the right GPU-NIC pairs. The trade-off it accepts is the classic passthrough trade-off taken deliberately at production scale: it keeps ~95% of bare-metal performance and VM-level operational flexibility, but gives up live migration, memory overcommit and device-state portability for training VMs, and pushes the remaining risk into firmware/PCIe-level operational failures. ACCESS NOTE: dl.acm.org and dblp.org are blocked from this environment (proxy denies CONNECT) and OpenReview returned a browser-verification page, so the ASPLOS camera-ready text could not be read; design/eval detail above comes from the companion preprint arXiv:2407.05467 read at DESIGN_EVAL depth, and the two abstract-level numbers come from IBM's official publication page for the ASPLOS paper. evidence_depth is reported as ABSTRACT for the ASPLOS paper itself, deliberately."
- id: VIRT-ASPLOS25-02
  title: "HyperHammer: Breaking Free from KVM-Enforced Isolation"
  title_correction: null
  authors: [Wei Chen, Zhi Zhang, Xin Zhang, Qingni Shen, Yuval Yarom, Daniel Genkin, Chen Yan, Zhe Wang]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3676641.3716002
  official_url: https://dl.acm.org/doi/10.1145/3676641.3716002
  fullpaper_source: https://yuval.yarom.org/pdfs/ChenZZSYGYW25.pdf
  classification: CORE
  classification_note: "The object of attack is the hypervisor's own memory-virtualization state - it corrupts an Extended Page Table entry to escape the guest - and the attack primitives are all KVM memory-management features (THP, virtio-mem, vIOMMU, iTLB-multihit hugepage splitting)."
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T2, T1, T3]
  physical_resource: DRAM
  logical_abstraction: "Guest-physical memory backed by host pages through EPT; the paper shows this abstraction is not opaque to the guest"
  problem: "Can a guest VM break hardware-assisted, KVM-enforced memory isolation on a fully-featured modern hypervisor, rather than only attacking a co-resident VM or a system with security features disabled?"
  mechanism: "Three steps. (1) Address disclosure: the guest enables transparent huge pages so the hypervisor backs guest memory with 2MB host hugepages, which leaks the low 21 bits of the host physical address - enough to derive DRAM bank/row. (2) Page steering: the guest creates ~60,000 vIOMMU I/O mappings to drain the host buddy allocator's small-order free lists, then voluntarily releases Rowhammer-vulnerable pages through virtio-mem; it then executes code on a hugepage, which forces KVM (because of the iTLB-multihit countermeasure) to split the hugepage and allocate a fresh EPT page into exactly those released, vulnerable frames. (3) Exploitation: single-sided Rowhammer from within the guest flips a bit in a leaf EPT entry so it points at another EPT page, giving the guest write access to its own translations and hence to arbitrary host physical memory."
  isolation_mechanism: "The isolation being broken is EPT-based GPA->HPA translation plus IOMMU protection; the paper's proposed defence is to quarantine guest-initiated memory-size change requests in virtio-mem (reject a request whose delta exceeds or opposes the hypervisor's target), or to disable THP / virtio-mem overcommit / VFIO-vIOMMU."
  multiplexing_mechanism: "N/A (the abused features are memory-overcommit multiplexing features - virtio-mem ballooning-style hotplug and THP-backed guest memory)"
  state_mechanism: "Virtualization state lives in the two-level EPT hierarchy (leaf EPTEs, page-frame number in bits 12-47) plus vIOMMU I/O page tables and the host buddy allocator's free lists and migration types; the attack works precisely by controlling where that state is physically placed."
  overhead_bottleneck: "Attack cost, not system overhead: memory profiling takes 48-72 hours and each page-steering + hammer attempt ~4-5 minutes, with success probability roughly (VM memory)/(512 x host memory), so the end-to-end expected attack is months."
  primary_tradeoff: "Hypervisor memory-overcommit and device-assignment features (THP, virtio-mem, vIOMMU/VFIO) -> gain density and I/O performance but cost the guest-opacity of host physical placement, which is what makes cross-privilege Rowhammer steering possible."
  quantitative_claims:
  - "memory profiling: 72 h on Intel Core i3-10100 yielded 96 exploitable bits; 48 h on Intel Xeon E-2124 yielded 90 exploitable bits (Apacer DDR4-2666 non-ECC DIMMs, 16 GB)"
  - "exploitation: 250 attempts over 16.7 h (4.0 min/attempt) on the i3 system; 432 attempts over 33.8 h (4.7 min/attempt) on the Xeon system"
  - "expected end-to-end attack time: 192 days (i3) and 137 days (Xeon)"
  - "page steering: with a 10 GB VM and 100 released blocks, 10-13% of released pages were reused by EPT pages; ~60,000 vIOMMU mappings needed to drive noise pages below threshold"
  why_useful_for_learning: "It is the best single paper for understanding that the guest-physical-to-host-physical layer is a real attack surface: you learn what THP, virtio-mem, vIOMMU and hugepage splitting each expose, and why hypervisor memory-management convenience features are security-relevant."
  priority: P1
  related: ["Reload+Reload: Exploiting Cache and Memory Contention Side Channel on AMD SEV", "Sharing is leaking: blocking transient-execution attacks with core-gapped confidential VMs"]
  relations:
  - {type: ALTERNATIVE, target: "Rowhammer attacks against co-resident VMs", basis: "Paper positions itself against prior virtualized-Rowhammer work that targeted only co-resident VMs or required disabled security features"}
  - {type: LAYER_BELOW, target: "confidential VM architectures (AMD SEV, Intel TDX, Arm CCA)", basis: "Shows DRAM-level disturbance defeats page-table-level isolation, motivating memory-encryption/integrity designs"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, preprint]
  confidence: HIGH
  notes: "Read the authors' accepted-manuscript PDF (Yarom's publication page) covering abstract, background, attack design, implementation, evaluation and mitigations. Note: arXiv:2506.07190 surfaces under similar search terms but is a different paper (a simulation-based evaluation framework for inter-VM Rowhammer mitigations)."
- id: VIRT-ASPLOS25-03
  title: "Tally: Non-Intrusive Performance Isolation for Concurrent Deep Learning Workloads"
  title_correction: null
  authors: [Wei Zhao, Anand Jayarajan, Gennady Pekhimenko]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3669940.3707282
  official_url: https://dl.acm.org/doi/10.1145/3669940.3707282
  fullpaper_source: https://arxiv.org/html/2410.07381v3
  classification: SUPPORT
  classification_note: "Threshold call: Tally builds a real CUDA API-remoting layer, but its contribution is a GPU preemption/temporal-multiplexing scheduler built from PTX kernel transformation - it never hands the workload a partitioned virtual GPU, so by the brief's GPU-sharing rule it is SUPPORT, not CORE."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T9, T4]
  physical_resource: GPU
  logical_abstraction: "An unmodified CUDA device that transparently yields to a high-priority tenant - i.e. a priority-scheduled GPU, not a partitioned vGPU"
  problem: "Co-locating latency-critical inference with best-effort training on one GPU raises utilization but existing sharing mechanisms (time slicing, MPS, MIG, kernel-level schedulers) either destroy inference tail latency or require intrusive framework changes."
  mechanism: "An LD_PRELOAD client intercepts CUDA calls and forwards them over shared memory to a server process that owns the device. The server rewrites best-effort kernels at the PTX level in two alternative forms - block-level slicing (add a block-index offset parameter so a kernel can be launched as small sub-kernels) and persistent-thread-block wrapping (a fixed pool of worker blocks that walk a global work counter and poll a preemption flag). A profile-guided scheduler picks slicing or preemption per kernel based on measured turnaround latency, and runs best-effort work only in the gaps between high-priority kernels."
  isolation_mechanism: "Performance isolation by priority-preemptive scheduling: high-priority kernels dispatch immediately; best-effort kernels are constrained so they can relinquish the GPU within a target turnaround latency (default threshold 0.0316 ms). No security isolation beyond process separation."
  multiplexing_mechanism: "Temporal multiplexing at thread-block granularity, explicitly contrasted with MPS (spatial, per-client) and MIG (static hardware partition)."
  state_mechanism: "Client keeps local CUDA context handles to avoid round-trips; the server holds kernel metadata, transformed-PTX caches, per-kernel profiled turnaround latencies and the two priority queues. No checkpoint/migration of GPU state."
  overhead_bottleneck: "The transformation tax on best-effort kernels (~25% average slowdown of transformed kernels) plus the initial per-kernel profiling pass; the API-interception layer itself is ~1%."
  primary_tradeoff: "Authors' framing: 'Slicing is a lightweight transformation but can incur overhead due to multiple kernel launches. Conversely, the preemption kernel requires only a single launch, but the additional synchronization and control flow can introduce noticeable overhead to certain kernels.' System-level: strong tail-latency isolation -> costs best-effort throughput (80.3% of a throughput-first baseline)."
  quantitative_claims:
  - "99th-percentile inference latency overhead 7.2% average vs 188.9% (TGS), 252.3% (time slicing), 345.0% (MPS); 6 training + 6 inference models, NVIDIA A100, MAF2 trace at 50% load"
  - "system throughput 80.3% of TGS while preserving isolation"
  - "worst-case high-priority degradation 23% (ResNet50 inference co-located with training) vs 10x+ for kernel-level schedulers"
  - "under 10-90% idle-time traffic loads TGS shows up to 5.8x slowdown for BERT inference where Tally stays near-ideal"
  - "kernel transformation overhead averages 25% on best-effort kernels only; interception overhead ~1%"
  why_useful_for_learning: "It shows concretely why GPUs are hard to virtualize: without hardware preemption you must rewrite the kernel itself to create a yield point, and it quantifies how far software preemption gets you compared with MPS and MIG."
  priority: P1
  related: [VIRT-ASPLOS25-06, VIRT-SC25-01, VIRT-HPDC25-02]
  relations:
  - {type: ALTERNATIVE, target: "MIG/MPS hardware and driver-level GPU partitioning", basis: "Paper directly measures MPS and discusses MIG's static-partition and reconfiguration-latency limits as the alternative design point"}
  - {type: SAME_BRANCH, target: VIRT-ASPLOS25-06, basis: "Both intercept CUDA to arbitrate one GPU between tenants; Dilu adjusts SM quotas elastically, Tally preempts at block granularity"}
  - {type: CONTRASTS_WITH, target: VIRT-SC25-01, basis: "BOER layers MPS on MIG partitions (spatial) where Tally argues spatial sharing cannot bound tail latency and uses transformed-kernel temporal sharing"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint]
  confidence: HIGH
  notes: "Read arXiv:2410.07381v3 (abstract, intro, design, implementation, evaluation, limitations). Author list taken from the arXiv record; verify against the ACM camera-ready if the orchestrator gains DL access. Stated limitation relevant to virtualization: Tally cannot transform device code inside closed-source libraries such as cuBLAS and substitutes CUTLASS kernels instead."
- id: VIRT-ASPLOS25-04

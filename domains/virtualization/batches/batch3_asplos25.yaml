  classification: SUPPORT
  classification_note: "The virtual SSD is the given abstraction; FleetIO contributes a runtime arbiter (RL agents + ghost superblocks) over it. Its decisive value is that it states and measures the hardware-isolation-vs-utilization trade-off of device virtualization directly."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T9]
  physical_resource: NVMe
  logical_abstraction: "A virtual SSD (vSSD) per tenant whose bandwidth can elastically borrow idle capacity from co-located vSSDs"
  problem: "Cloud platforms slice flash SSDs into vSSDs, and must choose between hardware isolation (dedicated flash channels: strong isolation, poor utilization) and software isolation (shared channels with token-bucket throttling: good utilization, 2x worse tail latency). Neither point is acceptable."
  mechanism: "Host-based framework on an open-channel SSD: one RL agent per vSSD reads I/O counters and issues three actions - Harvest(bandwidth) to borrow from co-located vSSDs, Make_Harvestable(bandwidth) to offer idle capacity, and Set_Priority(level) to change request scheduling priority - with an admission-control stage validating actions. A ghost-superblock manager adds an extra indirection level (vSSD LBA -> ghost-superblock LBA -> physical block) so borrowed superblocks spanning several channels can be attached to a vSSD and later reclaimed via garbage collection."
  isolation_mechanism: "Best-effort rather than hard: SLO-violation targets (default 1%) act as soft constraints, priority-based request scheduling protects latency-sensitive tenants, and harvesting only happens when a donor vSSD has spare bandwidth."
  multiplexing_mechanism: "Dynamic, fine-grained flash-channel multiplexing: instead of a static channel partition, superblocks are lent between vSSDs at runtime."
  state_mechanism: "Distributed: per-vSSD RL agent state (bandwidth/IOPS/latency/SLO counters, read-write ratio, queue delay, GC status), ghost-superblock metadata in superblock headers recording ownership and harvest status, and a harvested-block table distinguishing regular from harvested blocks; 2.2 MB of model state per vSSD."
  overhead_bottleneck: "Background inference/fine-tuning cost (1.1 ms inference per time window, 51.2 ms fine-tuning every 10 windows, 0.8 ms per 1000-action admission batch) and garbage-collection write amplification (<5%) from migrating harvested blocks back."
  primary_tradeoff: "Elastic bandwidth harvesting between vSSDs -> gains most of software isolation's utilization and most of hardware isolation's tail latency, but costs a learned controller and reaches neither extreme optimally (~89% of software-isolation bandwidth, within 1.2x of the strongest isolation)."
  quantitative_claims:
  - "storage utilization 1.30-1.39x better than hardware isolation (2-vSSD mixes of bandwidth-intensive and latency-sensitive workloads, open-channel SSD prototype)"
  - "P99 tail latency 1.47x better than software isolation on average, on the same mixes"
  - "P95/P99.9 tail latency only 3%/8% worse than hardware isolation"
  - "8-vSSD scaling: 1.18x utilization over hardware isolation while reaching 94-99% of software-isolation performance"
  - "within 5% of pre-trained performance when the workload mix changes mid-run"
  why_useful_for_learning: "It gives the cleanest quantitative statement of the central device-virtualization dilemma - partition the hardware for isolation or share it for utilization - and shows a third option built by adding one more level of address indirection inside the virtual device."

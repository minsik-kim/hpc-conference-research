- id: VIRT-ASPLOS25-12
  title: "Coach: Exploiting Temporal Patterns for All-Resource Oversubscription in Cloud Platforms"
  title_correction: null
  authors: [Benjamin Reidys, "et al. (Microsoft, Meta, Google, University of Washington, UIUC)"]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3669940.3707226
  official_url: https://dl.acm.org/doi/10.1145/3669940.3707226
  fullpaper_source: https://arxiv.org/html/2501.11179
  classification: CORE
  classification_note: "Beyond the placement policy, Coach redefines the VM itself - the CoachVM splits each resource into a guaranteed portion (1 GB huge pages mapped directly into guest-physical memory, static CPU groups) and an oversubscribed portion (virtually addressed memory exposed through a zero-size NUMA node so the guest needs no modification), with Hyper-V enforcement and ATS/PRI or enlightenments for direct-device DMA. That is an explicit change to the guest-host memory interface."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T9, T1, T4]
  physical_resource: DRAM
  logical_abstraction: "A CoachVM: a VM whose CPU, memory, network and storage are each split into a guaranteed allocation and an oversubscribed allocation, offered to users as a discounted instance type"
  problem: "Cloud servers stay underutilized, and oversubscribing CPU alone just moves the allocation bottleneck to memory and network; meanwhile VMs have complementary daily usage peaks that static per-VM allocation throws away."
  mechanism: "Coach predicts P95 utilization per resource for each of six 4-hour time windows of a VM's life with a random-forest model, then bin-packs VMs with complementary peaks onto servers. On each host, guaranteed memory is physically backed with 1 GB huge pages while oversubscribed memory is virtually addressed and surfaced via a zero-size NUMA node (keeping the guest OS unmodified); CPU uses Hyper-V CPU groups. A local agent samples contention (CPU wait time, page read/write) every 20 s, predicts near-term contention with EWMA/LSTM, and mitigates by trimming pages, extending the oversubscribed pool with unallocated server memory, or live-migrating a VM."
  isolation_mechanism: "Two layers: conservative provisioning (guaranteed resources sized for P95 so only ~5% of accesses can touch the oversubscribed pool) plus reactive host-level mitigation (page trimming, pool extension, live migration) driven by 20 s contention monitoring; hypervisor primitives (CPU groups, memory partitions, NUMA policy) do the enforcement."
  multiplexing_mechanism: "Temporal multiplexing of every resource across VMs with complementary diurnal peaks, at 4-hour window granularity, with the oversubscribed portion of each resource being the shared pool."
  state_mechanism: "Oversubscription decisions live in a logically centralized cluster manager (daily offline training over 1M+ VMs); per-host agents hold live contention state. Guest memory state can be trimmed or moved, and live migration is the escape hatch when a host becomes contended - so VM state mobility is part of the safety mechanism."
  overhead_bottleneck: "Memory's non-fungibility: guaranteed memory must be statically physically backed, which caps how much temporal multiplexing memory can contribute; and prediction error (19-24% memory over-allocation error) bounds achievable density."
  primary_tradeoff: "Split each virtualized resource into guaranteed + oversubscribed -> gains up to ~26% more VMs per platform but costs a small, explicit SLO risk for the oversubscribed portion (and the paper prices that risk as a discounted VM type)."
  quantitative_claims:
  - "hosts up to ~26% more VMs with minimal performance degradation"
  - "six 4-hour windows save ~15% memory and ~20% CPU vs static allocation, versus ~8% for a single 24-hour window"
  - "latency-sensitive cache/KV-store workloads see 4-10% P99 tail-latency slowdown under Coach; memory-intensive LLM fine-tuning 24%; full oversubscription baseline 2.35x"
  - "added CPU contention +1%, memory violations <1%; random-forest over-allocation error 19-24% (memory) and 23-30% (CPU) with 1-2% under-allocation"
  - "testbed: production server with 160 hyperthreaded Intel cores and 512 GB DRAM; 2-week Azure trace of ~1M VMs across 10 clusters in 7 regions"
  why_useful_for_learning: "It shows how a hyperscaler actually implements memory oversubscription without paravirtualizing the guest - guaranteed huge-page-backed memory plus a virtually addressed pool hidden behind a zero-size NUMA node - and why direct-device DMA (ATS/PRI) is the hard constraint on any such scheme."
  priority: P1
  related: [VIRT-ASPLOS25-10, VIRT-ASPLOS25-04]
  relations:
  - {type: ALTERNATIVE, target: "memory ballooning and hypervisor-driven page reclamation", basis: "Coach deliberately avoids guest modification, using a zero-size NUMA node and page trimming instead of a balloon driver"}
  - {type: USES_MECHANISM_FROM, target: "VM live migration", basis: "Live migration is one of Coach's reactive mitigations when host contention is detected"}
  - {type: SAME_BRANCH, target: VIRT-ASPLOS25-10, basis: "Guaranteed-plus-harvestable split of a virtualized resource, applied to VM memory/CPU rather than to vSSD bandwidth"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint]

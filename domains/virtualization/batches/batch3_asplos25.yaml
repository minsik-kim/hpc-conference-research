  - "handles failures in a cluster of 100,000 nodes within 10 seconds"
  why_useful_for_learning: "It illustrates a multi-tenancy consequence at the application layer: in containerized clouds, capacity loss is managed by choosing what to switch off, which is the operational counterpart to admission control and oversubscription mechanisms lower in the stack."

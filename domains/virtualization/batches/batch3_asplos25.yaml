- id: VIRT-ASPLOS25-13
  title: "Harmonia: A Unified Framework for Heterogeneous FPGA Acceleration in the Cloud"
  title_correction: null
  authors: [Luyang Li, Heng Pan, Xinchen Wan, Kai Lv, Zilong Wang, Qian Zhao, Feng Ning, Qingsong Ning, Shideng Zhang, Zhenyu Li, Layong Luo, Gaogang Xie]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3676641.3716259
  official_url: https://doi.org/10.1145/3676641.3716259
  fullpaper_source: https://xcwanandy.github.io/papers/2025/harmonia-asplos25.pdf
  classification: CORE
  classification_note: "The artifact contributed is the cloud FPGA shell - the mediation layer between the physical device and tenant logic - together with its tenant-isolation mechanisms (1K isolated DMA queues, packet filter, flow director) and partial-reconfiguration multi-tenancy, deployed on tens of thousands of production FPGAs. That is device/accelerator virtualization infrastructure, even though the paper's headline is cross-vendor portability."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T3, T9]
  physical_resource: FPGA
  logical_abstraction: "A vendor-independent FPGA platform: a tailorable shell assembled from Reusable Building Blocks that exposes a user role to five uniform interface types (clock, reset, streaming, mem_map, reg, irq) plus a command-based host software interface"
  problem: "Clouds run heterogeneous FPGAs (multiple vendors, generations, and device classes such as SmartNIC vs SmartSSD), and 66-87% of the code needed per platform is shell development; migrating a role across platforms also forces ad-hoc host-software rewrites."
  mechanism: "A two-layer architecture: a platform-specific layer of automated vendor adapters and interface wrappers, and a platform-independent layer providing the unified shell. The shell is composed of Reusable Building Blocks (Network, Memory, Host) from which a role selects concrete instances (e.g. 25G vs 100G MAC); hierarchical tailoring removes unneeded blocks and exposes only role-relevant properties. Vendor IP (MAC, PCIe DMA, DDR) is wrapped into the uniform interface types with a parameterized asynchronous FIFO doing clock-domain and data-width conversion without pipeline bubbles."
  isolation_mechanism: "Host RBB provides 1K DMA queues so tenant data paths are separated; a packet filter drops packets not destined for the local machine and a flow director steers incoming flows to the owning host queue, giving network isolation; roles are separated by partial reconfiguration."
  multiplexing_mechanism: "Role-level multi-tenancy via partial reconfiguration on top of the shared shell, plus per-tenant DMA-queue and flow-level multiplexing of the NIC/PCIe paths."
  state_mechanism: "Shell state lives in FPGA fabric (registers, monitoring logic, queue state); control state is centralized in a unified control kernel on a soft processor (Nios); role/application state is managed across partial reconfiguration, and the paper does not detail preserving queue state across a reconfiguration."
  overhead_bottleneck: "Shell generality: the unified shell costs 3-25.1% more FPGA resources than a hand-optimized single-purpose shell (mitigated by hierarchical tailoring); the centralized soft-processor control kernel is a potential control-path bottleneck, worked around by exposing raw irq signals."
  primary_tradeoff: "One unified, vendor-independent shell -> gains 69-93% shell code reuse and drastically simpler host software, but costs some fabric resources versus a bespoke shell and requires the provider to write an adapter whenever a genuinely new peripheral or architecture appears."
  quantitative_claims:
  - "shell development effort reduced 69-93% (cross-vendor reuse 69-76%, cross-family 84-93%) across Xilinx and Intel devices"
  - "configuration items reduced 8.8-19.8x by role-oriented property exposure; host software modification reduced 88-107x for the Host Network case"
  - "interface wrappers <0.37% and unified control kernel <0.67% of resources, total <0.63% overhead; end-to-end latency increase <1% with no throughput loss"
  - "3.5-14.9% lower shell resource use than Vitis, oneAPI and Coyote; 15-23x simpler software configuration"

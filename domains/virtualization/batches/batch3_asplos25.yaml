  logical_abstraction: "A containerized application whose criticality annotations let the platform shed non-critical containers instead of failing uniformly"
  problem: "When a containerized cloud loses capacity at scale, uniform degradation takes down critical services along with everything else; operators and applications have no shared mechanism to degrade cooperatively."
  mechanism: "Diagonal scaling - deactivating non-critical containers during capacity constraints - realized by Phoenix, an automated controller for Kubernetes that uses application-supplied criticality metadata to choose what to keep running, plus AdaptLab, an open-source benchmarking framework for failure scenarios."

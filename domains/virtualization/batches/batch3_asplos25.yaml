- id: VIRT-ASPLOS25-06
  title: "Dilu: Enabling GPU Resourcing-on-Demand for Serverless DL Serving via Introspective Elasticity"
  title_correction: null
  authors: [Cunchi Lv, Xiao Shi, Zhengyu Lei, Jinyue Huang, Wenting Tan, Xiaohui Zheng, Xiaofang Zhao]
  venue: ASPLOS
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3669940.3707251
  official_url: https://dl.acm.org/doi/10.1145/3669940.3707251
  fullpaper_source: https://arxiv.org/html/2503.05130v1
  classification: SUPPORT
  classification_note: "Threshold call: Dilu gives each function instance an elastic SM quota enforced by CUDA-call interception and token issuing, but that is rate-limited temporal/spatial sharing over an unpartitioned GPU rather than a vGPU/MIG-like partition abstraction - an accelerator-sharing primitive, hence SUPPORT."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T8, T9]
  physical_resource: GPU
  logical_abstraction: "A serverless DL function instance with Kubernetes-style <request, limit> SM quotas that can be resized at ~5 ms granularity, plus horizontal instance scaling"
  problem: "Serverless DL serving wastes 15-94% of GPU capacity because allocation is static and coarse-grained, keep-alive wastes time-dimension capacity, and horizontal-only scaling cannot reclaim fragmentation inside a GPU."
  mechanism: "An LD_PRELOAD interception library in each container intercepts CUDA kernel launches and blocks them until it holds tokens from a per-node Real-time CUDA Kernel Manager. The manager re-issues tokens every 5 ms, moving SM share between co-located instances within profiled <request, limit> bounds, and the scheduler bin-packs complementary (compute-bound vs memory-bound) instances onto GPUs. 'Introspective elasticity' is this two-dimensional co-scaling: vertical SM-quota resizing inside a GPU plus lazy horizontal instance launch/termination across GPUs."
  isolation_mechanism: "Container isolation for security; performance interference bounded by monitoring each instance's Kernel Launch Cycle and throttling co-located instances (EMERGENCY state) plus oversubscription caps on the sum of requests (omega=1.0) and limits (gamma=1.5) per GPU."
  multiplexing_mechanism: "Hybrid: spatial co-location of multiple instances per GPU via bin-packing, plus temporal SM timesharing enforced by token issuing at 5 ms cycles - deliberately avoiding fixed MPS partition sizes."
  state_mechanism: "Scheduler holds per-function resource metadata; the per-node kernel manager holds token budgets and per-instance kernel counters in memory; scaling-in is a graceful terminate with no checkpoint/restore of GPU state."
  overhead_bottleneck: "Token request/issue traffic on the 5 ms cycle plus the CUDA interception hop; reported as <1% throughput loss for training and negligible for inference. The real cost is the offline profiling pass (roughly 8-16 trial runs per model)."
  primary_tradeoff: "Fine-grained software SM sharing -> gains defragmentation and elasticity without touching the closed-source GPU driver, but costs profiling effort and accepts conservative oversubscription caps because interference can only be detected, not prevented."
  quantitative_claims:
  - "GPU fragmentation reduced from 15-94% to 10-46% (mixed DL functions, A100 40GB)"
  - "up to 1.8x inference throughput and ~1.1x training throughput vs baselines (RoBERTa/LLaMA2, DDP/DeepSpeed on 4-GPU setups)"
  - "SLO violation rate 1.8-9.8% vs 6-20% for INFless+ on Azure production traces (bursty/periodic/sporadic)"
  - "saves 25-30% of GPUs vs exclusive allocation while adding <=9% latency"
  - "vertical scaling costs <1% training throughput; scheduling overhead <1 ms per instance"
  why_useful_for_learning: "It shows what a software-only 'elastic GPU quota' looks like when you cannot reprogram the GPU: interception plus token-based rate limiting, with interference handled by introspection (kernel launch cycle) instead of hardware partitioning."
  priority: P2
  related: [VIRT-ASPLOS25-03, VIRT-SC25-01, VIRT-HPDC25-02]
  relations:
  - {type: SAME_BRANCH, target: VIRT-ASPLOS25-03, basis: "Both are CUDA-interception arbiters over one physical GPU; Tally optimises tail-latency isolation, Dilu optimises elasticity/fragmentation"}
  - {type: ALTERNATIVE, target: "MPS-based fixed spatial partitions (e.g. GPUlet, FaST-GS)", basis: "Paper positions token-based dynamic quotas against prior work's fixed MPS allocations"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint]
  confidence: HIGH
  notes: "Read arXiv:2503.05130v1 (abstract, intro, design, algorithms, evaluation, limitations). Large-scale (1000-node) results are simulation only; the physical testbed is 5 nodes / 20 GPUs. No GPU memory oversubscription or swapping - memory is statically assigned per instance, which is the main limit on collocation density."
- id: VIRT-ASPLOS25-07
  title: "Litmus: Fair Pricing for Serverless Computing"
  title_correction: null
  authors: [Qi Pei, Yipeng Wang, Seunghee Shin]

  multiplexing_mechanism: "Cluster capacity is re-multiplexed toward critical containers when capacity shrinks."
  state_mechanism: N/A
  overhead_bottleneck: "Controller decision time at scale (reported as handling failures in a 100,000-node cluster within 10 seconds)."
  primary_tradeoff: "Cooperative, criticality-aware degradation -> gains critical-service availability during large failures but costs application cooperation (criticality annotations) and deliberate loss of non-critical functionality."
  quantitative_claims:

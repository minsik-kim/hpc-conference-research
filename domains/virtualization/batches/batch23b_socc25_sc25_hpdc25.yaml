- id: VIRT-HPDC25-03
  title: "Virtualization So Light, it Floats! Accelerating Floating Point Virtualization"
  title_correction: null
  authors: [Nick Wanninger, Nadharm Dhiantravan, Peter Dinda]
  venue: HPDC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3731545.3731584"
  official_url: "https://hpdc.sci.utah.edu/2025/program.html"
  fullpaper_source: "https://users.cs.northwestern.edu/~pdinda/Papers/hpdc25.pdf"
  classification: CORE
  classification_note: "Deliberately classified CORE/T10 (boundary case), not DROP or CONTEXT: the paper's own mechanism is a textbook trap-and-emulate design (hardware exception intercepted by a user-level monitor that selectively emulates only the operations native hardware cannot execute correctly, leaving everything else running at full native speed) -- structurally the same technique classical CPU virtualization uses to virtualize privileged instructions (Popek-Goldberg trap-and-emulate), here applied to floating-point arithmetic semantics instead of CPU privilege. It is not machine/OS virtualization (no VM, no guest/host address space, no hypervisor privilege ring), so it is placed under T10 (boundary/other conceptually useful adjacent virtualization mechanism) with T1 as a secondary tag purely for the trap-and-emulate technique lineage, rather than under T1 itself."
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: [T1]
  physical_resource: CPU core
  logical_abstraction: "An alternative floating-point arithmetic system (e.g. arbitrary-precision MPFR, posits, interval arithmetic) transparently substituted for IEEE 754 hardware semantics on a per-instruction basis, for an unmodified binary, via NaN-boxed references to out-of-band alternative-arithmetic values."
  problem: "Floating-point virtualization (transparently swapping in an alternative arithmetic system for an unmodified binary) is theoretically attractive but practically unusable because standard POSIX-signal-based trap delivery costs over 5,000 cycles per instruction, producing slowdowns exceeding 1000x."
  mechanism: "FPVM installs via LD_PRELOAD and lets hardware floating-point instructions execute natively whenever their result would be precise IEEE 754; only instructions that would need special handling (exceptions: rounding, overflow, underflow, NaN consumption) trap to a user-space handler, which decodes the faulting x64 instruction (Capstone), binds its operands from register/memory state, and delegates the arithmetic to the alternative-arithmetic library, boxing the result as a signalling-NaN-encoded pointer; two optimizations amortize the remaining trap cost -- trap short-circuiting (a custom kernel module shortcuts POSIX-signal delivery) and instruction-sequence emulation/caching (subsequent traps at the same PC replay a cached decode/bind/emulate sequence instead of re-decoding)."
  isolation_mechanism: "Per-process opt-in via a kernel-module registration; a process not registered falls back to standard POSIX signal delivery, so the mechanism is backward-compatible and does not cross any privilege boundary beyond the existing kernel trap-handler entry point."
  multiplexing_mechanism: "Per-thread execution contexts: each thread gets its own FPVM state (initialized on pthread/clone()), so multiple threads/alternative-arithmetic computations are multiplexed on the same cores without a shared virtualization layer."
  state_mechanism: "On each trap, FPVM saves/restores general-purpose and floating-point registers, control state (mxcsr) and flags in a ucontext-like structure; NaN-boxed heap-allocated alternative-arithmetic values are tracked with a specialized mark-and-sweep garbage collector, and values are demoted back to plain IEEE754 doubles when they escape to memory or cross function boundaries."
  overhead_bottleneck: "The cost of delivering a hardware floating-point exception to a user-space handler via the standard POSIX-signal path (>5,000 cycles/instruction), which dominates over the cost of the alternative arithmetic itself."
  primary_tradeoff: "Trap-and-emulate selective virtualization -> gains full binary compatibility (no recompilation) and near-native speed on the (common) hardware-precise fast path, but costs a 1.65x-7.70x residual overhead above the alternative arithmetic system's own intrinsic cost, plus incomplete instruction/vector-operation coverage and a required custom kernel module for the fast path."
  quantitative_claims:
    - "end-to-end slowdown before optimization: 198.6x-5617.7x; after trap short-circuiting + sequence emulation: 37.3x-287.3x (average 7.2x improvement, best case 11.5x)"
    - "virtualization overhead above the alternative-arithmetic system's own intrinsic cost: reduced from 5.48x-20.62x down to 1.65x-7.70x"
    - "MPFR-backed overhead: 1.35x-5.09x above MPFR's own intrinsic cost"
    - "trap short-circuiting alone: 3.2x-3.8x reduction in hardware+kernel+return overhead; without the kernel module, per-trap cost is ~5,980 vs. ~760 cycles"
    - "sequence-cache size: under 2,000 entries even for the largest workload (Enzo, ~307K LOC); sequence lengths 3-32 instructions"
    - "hardware: Dell R6515, AMD EPYC 7443P 24-core, 512GB DDR4, Linux 5.15"
  why_useful_for_learning: "A genuine taxonomy boundary case worth keeping in the corpus specifically because it shows trap-and-emulate -- the foundational CPU-virtualization technique -- generalized to a completely different semantic domain (arithmetic correctness rather than privileged execution), clarifying what is essential to 'virtualization' (selective interception + transparent substitution) versus what is incidental (guest/host address spaces, hypervisor rings)."
  priority: P2
  related: ["VIRT-SOCC25-22"]
  relations:
    - {type: SAME_BRANCH, target: "VIRT-SOCC25-22", basis: "both are boundary-case virtualizations built from trap/syscall interception rather than full guest/host machine virtualization"}
    - {type: CONTRASTS_WITH, target: "VIRT-SOSP25-03", basis: "SOSP25-03 specifies/verifies a real hypervisor's trap-and-emulate-style stage-2 isolation; this paper applies the same conceptual pattern (selective trap interception) one layer away from any hypervisor, to arithmetic semantics"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Full text read from the authors' Northwestern University copy. The task explicitly flagged this as a genuine boundary case requiring justified taxonomy placement; classification_note documents the reasoning in full so a reviewer can contest the T10-vs-T1 call if desired."


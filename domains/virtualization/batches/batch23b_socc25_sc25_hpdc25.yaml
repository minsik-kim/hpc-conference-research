- id: VIRT-SOCC25-07
  title: "CPU-Limits kill Performance: Time to rethink Resource Control"
  title_correction: null
  authors: [Chirag Shetty, Sarthak Chakraborty, Hubertus Franke, Larisa Shwartz, Chandra Narayanaswami, Indranil Gupta, Saurabh Jha]
  venue: SoCC
  year: 2025
  publication_type: SHORT_PAPER
  doi: "10.1145/3772052.3772219"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "https://arxiv.org/abs/2510.10747"
  classification: DROP
  classification_note: "Excluded on publication-type grounds: the authors' own arXiv listing states this is a 'Vision paper accepted to SoCC 2025' (a 9-page, non-full-paper submission track per the SoCC CFP's Vision Paper category), so it is not part of the main archival research corpus regardless of content."
  drop_reason: publication_criterion
  taxonomy_primary: T9
  taxonomy_secondary: [T5]
  physical_resource: CPU core
  logical_abstraction: "cgroup/CFS CPU quota (\"CPU limit\") as the resource-control primitive under critique; the paper argues for removing this virtualization-adjacent throttling boundary for latency-sensitive containers."
  problem: "The paper argues that CPU limits (cgroup CFS bandwidth throttling), the standard mechanism underlying container autoscalers, actively harm application performance and cost more than they help for latency-sensitive workloads, contradicting standard practice."
  mechanism: "Position/vision argument (with supporting measurements) that autoscalers should stop relying on adjusting CPU limits and instead move to a class of 'limitless autoscalers' that allocate CPU without hard quota throttling while still meeting latency SLOs in multi-tenant settings."
  isolation_mechanism: "cgroup CFS bandwidth control (the mechanism being critiqued) is the isolation boundary discussed, not a new one proposed."
  multiplexing_mechanism: "Standard Linux CFS time-slicing of CPU cores among containers under quota constraints."
  state_mechanism: N/A
  overhead_bottleneck: "Latency/SLO breaches induced by CPU-limit throttling itself, which the paper identifies as the dominant harm rather than a mitigable side effect."
  primary_tradeoff: "Removing CPU limits -> gains latency/SLO compliance for sensitive workloads but costs the safety margin CPU limits provide against runaway background tasks, which the paper says should instead be handled by a different (limitless) mechanism."
  quantitative_claims: []
  why_useful_for_learning: "Directly informs the practical trade-offs of the cgroup CPU-quota mechanism that underlies almost all container resource-isolation designs discussed elsewhere in this corpus, even though it is excluded from the main archival count."
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [preprint, official-web]

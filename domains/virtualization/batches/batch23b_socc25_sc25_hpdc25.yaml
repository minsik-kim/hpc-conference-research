# ============================== SoCC 2025 ==============================

- id: VIRT-SOCC25-01
  title: "Hydra: Virtualized Multi-Language Runtime for High-Density Serverless Platforms"
  title_correction: "preprint (arXiv 2212.10131) circulated under the name 'Graalvisor: Virtualized Polyglot Runtime for Serverless Applications'; official SoCC 2025 title is Hydra"
  authors: [Rodrigo Bruno, et al.]
  venue: SoCC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3772052.3772267"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "https://arxiv.org/pdf/2212.10131"
  classification: CORE
  classification_note: "Builds a new lightweight isolation/runtime-sharing mechanism (GraalVM Native Image isolates + Truffle JIT sharing + custom seccomp-based sandbox snapshotting) purpose-built to replace container+language-runtime virtualization stacks for serverless functions."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8, T4]
  physical_resource: DRAM
  logical_abstraction: "A shared multi-language runtime instance exposing per-invocation memory isolates (lightweight sandboxes) that multiplex one process's compiled code cache, initial heap and JIT infrastructure across many concurrent, mutually-isolated function invocations of possibly different languages."
  problem: "Serverless platforms pay for a full virtualization stack (container/VM plus a per-function language runtime) on every invocation even though most functions are short-lived and infrequently invoked, forcing a choice between high idle memory cost and long cold starts."
  mechanism: "Hydra compiles functions ahead-of-time via GraalVM Native Image into shared native libraries loaded by a common Truffle-based host runtime; each invocation gets a memory isolate (not a full process) that shares the compiled-code cache and JIT-optimized state with other isolates of the same function, and a custom syscall/memory-tracing snapshot mechanism (seccomp-bpf, disjoint 1TB virtual-address reservations per function) checkpoints/restores isolates far more cheaply than CRIU-style whole-process checkpointing."
  isolation_mechanism: "Per-invocation memory isolates provide the security/fault boundary within one host process; native/unmanaged code that cannot be isolate-sandboxed falls back to process-level forking."
  multiplexing_mechanism: "Many function invocations (same or different tenants/languages) share one Hydra runtime instance's code cache, heap template and Truffle JIT compiler; a tenant-aware scheduler co-locates invocations from the same tenant to maximize this sharing."
  state_mechanism: "Sandbox-level snapshot state (dirty writable pages + a replay log of syscalls) is captured post-first-invocation and memory-mapped back on restore, instead of migrating a whole VM/container image."
  overhead_bottleneck: "Cold JIT warm-up and duplicated per-runtime memory (interpreter + heap + compiled code) across containers/VMs, which the shared isolate model amortizes across invocations."
  primary_tradeoff: "Sharing one runtime's compiled code/JIT state across isolates -> gains 4.47x function density and 2.1x memory reduction, but costs isolation granularity (native/unmanaged code needs process fallback) and immature multi-language (Python) performance."
  quantitative_claims:
    - "function density: 4.47x higher ops/GB-sec average vs. NodeJS/JVM/CPython on OpenWhisk (SEBS/Photons benchmarks, single-node Intel Xeon Gold 5320)"
    - "memory footprint: 2.1x reduction vs. OpenWhisk (Azure Functions trace replay, 200-node simulation)"
    - "cold starts: 4x-48x reduction depending on function popularity (same trace replay)"
    - "first-request latency: 36.62x reduction and 3.15x memory reduction from snapshotting (microbenchmark)"
    - "tenant-aware scheduling: 2.8x fewer cold starts vs. round-robin placement"
  why_useful_for_learning: "Shows a concrete, evaluated alternative to container+VM-per-function isolation for serverless: sharing JIT/runtime state across sandboxes while keeping a lighter checkpoint/restore boundary than full-VM live migration."
  priority: P1
  related: ["VIRT-SOCC25-02", "Faascale: Scaling MicroVM Vertically for Serverless Computing with Memory Elasticity"]
  relations:
    - {type: SAME_BRANCH, target: "VIRT-SOCC25-02", basis: "both reduce serverless memory overhead via a lighter-weight substitute for classic OS/VM isolation (isolate sandboxes vs. unikernel library deduplication)"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: "ACM DL page and abstract blocked (403); full evidence taken from the arXiv preprint (2212.10131), which the SoCC 2025 abstract/DOI records reference as the same work under its final title 'Hydra'. Author full list not independently re-verified beyond 'Rodrigo Bruno et al.' (INESC-ID group, per github.com/arg-inescid/hydra)."

- id: VIRT-SOCC25-02
  title: "Memory Matters: Load-Time Deduplication for Unikernels"
  title_correction: null
  authors: [Gaulthier Gain, Benoît Knott, Cyril Soldani, Laurent Mathy]
  venue: SoCC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3772052.3772247"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "https://orbi.uliege.be/bitstream/2268/341121/1/socc25-gaingaulthier.pdf"
  classification: CORE
  classification_note: "Contribution is a new unikernel memory-sharing mechanism (load-time library deduplication, Spacer-SLT) that replaces runtime KSM scanning as the multi-tenant density mechanism for a lightweight VM-class isolation boundary (Firecracker/Unikraft unikernels)."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T2]
  physical_resource: DRAM
  logical_abstraction: "A shared, read-only library page pool (in /dev/shm) that many statically-linked unikernel instances map into their own address space at load time instead of each holding a private copy of common library code."
  problem: "Unikernels are statically compiled per-instance, so identical library code is duplicated across many co-located instances; the standard fix (Linux KSM runtime scanning) has convergence delay, unpredictable CPU cost, timing side-channels, and unfair sharing under high concurrency."
  mechanism: "A build-time toolchain extracts library code into aligned, page-identical .desc-described chunks stored in a shared library pool; a custom Firecracker-based loader maps identical pages directly from the pool into each new unikernel's address space at boot, bypassing ELF parsing and skipping the scan-and-merge step entirely; only read-only pages are deduplicated (writable pages are left private to avoid COW security issues), and ASLR is preserved via trampoline tables."
  isolation_mechanism: "Each unikernel instance is a separate Firecracker microVM; deduplication only touches read-only shared library pages, so no cross-tenant writable state is shared."
  multiplexing_mechanism: "Multiple unikernel instances' identical library pages are physically backed by one shared page frame via a common mmap'd pool rather than per-instance private copies."
  state_mechanism: "Dedup state is static (library-pool metadata built once at compile/link time) rather than dynamic scanner state; no runtime merging or re-scanning is needed once pages are mapped."
  overhead_bottleneck: "KSM's runtime scanning cost and convergence delay under high instance-launch concurrency, which load-time mapping eliminates by construction."
  primary_tradeoff: "Deduplicating at load time instead of at runtime -> gains deterministic, zero-variance memory savings and fewer page faults/TLB flushes, but costs the ability to deduplicate writable pages (KSM can still win at very low concurrency) and requires a custom toolchain/loader per unikernel target."
  quantitative_claims:
    - "memory savings at 128 FaaS instances (10s lifetime), KSM-quiet baseline: 24% less than DCE, 27% less than Default, 30% less than vanilla Spacer"
    - "page faults: 3x-5x fewer than DCE/Default/Spacer(KSM) in the 20-application heterogeneous benchmark"
    - "load time: up to 1.4x faster than Spacer+KSM"
    - "TLB flushes: up to 10x-13x fewer than KSM-based configurations"
    - "disk footprint (vanilla mode, 20 apps): 3.3x-5.8x smaller than DCE/Default/Spacer"
    - "hardware: 32GB RAM, Intel Xeon E5-2650 v2 (32 cores@2.6GHz), Linux 6.1, Unikraft 0.8.0 + Firecracker"
  why_useful_for_learning: "Direct case study in the classic virtualization memory-density trade-off (scan-based vs. construction-time deduplication) applied to unikernels, the lightest-weight VM-class isolation boundary in the corpus."
  priority: P1
  related: ["VIRT-SOCC25-01", "uIO: Lightweight and Extensible Unikernels"]
  relations:
    - {type: ALTERNATIVE, target: "VIRT-SOCC25-01", basis: "both attack serverless/unikernel density via a substitute for classic OS-level page/process sharing, one at load time (this paper) and one via JIT/runtime isolate sharing (Hydra)"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "SoCC schedule marks this paper an Honorable Mention. Full text read from the authors' ORBi institutional repository copy."


batch_observations: |
  Threshold calls made in this batch:

  1. SoCC pub-type screening (task priority #1): both flagged seeds were investigated to conclusion.
     "CPU-Limits kill Performance" is confirmed a Vision Paper via the authors' own arXiv venue
     annotation and is excluded (publication_criterion). "Serverless Elasticsearch" could NOT be
     shown to be an Industry Paper despite an all-industry author list (the SoCC CFP explicitly
     allows industry-affiliated authors in the regular research track); it is kept as
     ARCHIVAL_MAIN_PAPER but DROPped on content grounds instead (no virtualization relation).

  2. SC25's XaaS Containers and coMtainer: XaaS Containers was fully read and confirmed SUPPORT
     (container image/build representation only, standard OCI runtime, no isolation-boundary
     change) exactly as the task predicted. coMtainer could not be read at all after four
     distinct access routes failed (ACM DL x3, author homepage, a wrong-paper arXiv id); it is
     left at the conservative TITLE_ONLY/CONTEXT default per hard rule 2 rather than assumed
     SUPPORT by title-similarity to XaaS Containers, even though that is the likely outcome.

  3. HPDC25 "Virtualization So Light, it Floats!": classified CORE under T10 (boundary/other)
     with T1 as a secondary tag, on the reasoning that its trap-and-emulate mechanism (selective
     hardware-exception interception + transparent substitution of only the operations needing
     it) is structurally the same technique used by classical CPU virtualization, just applied to
     floating-point arithmetic semantics rather than privileged CPU instructions -- not placed
     under T1 primary because there is no guest/host machine, address space, or hypervisor
     privilege ring involved. This is flagged in the record's classification_note for review.

  4. HPDC25 FluidFaaS and SC25 BOER: both explicitly build on top of an existing hardware/software
     GPU-sharing primitive (MIG and MPS respectively) rather than inventing a new virtual-GPU
     abstraction, so both are SUPPORT per the brief's explicit GPU-sharing threshold rule, matching
     VIRT-SOCC25-14's and VIRT-SOCC25-15's treatment of the same MPS/MIG-sharing-is-usually-SUPPORT
     principle.

  5. Two SoCC papers explicitly literal-keyword-matched the taxonomy ("VLCs: ...Virtualized
     Libraries" and REEF's "Oversubscribed") during a supplementary full-schedule scan undertaken
     on this batch's own initiative (not required by the task for SoCC, only for SC25). VLCs turned
     out to be a genuine intra-process resource-view virtualization boundary case (SUPPORT/T10);
     REEF turned out to be pure application-thread scheduling with an explicit authorial statement
     that virtualized/containerized environments were NOT evaluated, and was kept CONTEXT (not
     DROP) per the "ambiguous -> CONTEXT" default even though it is arguably a keyword false
     positive, because "oversubscription" of threads is close enough to the taxonomy's T9 resource-
     oversubscription language to warrant caution.

  6. The full SC25 technical program (137 papers) could not be enumerated due to a combination of
     ACM DL blocking all automated access (403 on every path), dblp disallowing the fetch tool via
     robots.txt, and the official sc25.conference-program.com schedule site being unreachable
     through the sandboxed egress proxy (robots.txt fetch timeouts on every URL pattern tried,
     including individual presentation/session pages whose IDs were discovered via Google-indexed
     snippets). The task's instruction to "scan the SC25 technical program properly" was therefore
     only partially satisfiable: it was compensated with roughly a dozen targeted multi-keyword
     web searches spanning every concept the task listed, which is a materially lower-recall
     substitute for a full line-by-line pass and should not be treated as a clean bill of health
     for the remaining ~130 unreviewed titles. This is the single largest residual risk in this
     batch and is called out explicitly here and in access_failures.

  7. ResearchGate returned HTTP 429 on essentially every attempt across the whole session (SoCC,
     SC, and HPDC candidates alike), removing what would otherwise have been a useful secondary
     abstract source for several access-failed papers.

  8. Broad-preservation stance: per the brief's explicit instruction that this is not a pruning
     exercise, all 9 access-failed candidates (6 SoCC, 2 SC, 1 HPDC-adjacent PathFence which DID
     yield a partial mechanism description) were kept as CONTEXT/TITLE_ONLY records rather than
     omitted from the corpus, so a future pass with institutional ACM/ResearchGate access can
     upgrade them without re-discovering that they exist.

  problem: "Existing MIG-based serverless GPU sharing treats each function as a monolithic unit needing one contiguous MIG partition, causing severe fragmentation as idle capacity scatters across many partially-used MIG instances that cannot individually fit new requests (prior work, ESG, over-allocates by 167% on average)."
  mechanism: "FluidFaaS decomposes serverless functions into pipeline stages mapped onto fragmented MIG slices, and applies hotness-aware eviction to time-share MIG slices between instances based on observed request-load patterns, rather than requiring one function to hold one whole contiguous partition."
  isolation_mechanism: "Relies entirely on NVIDIA MIG's hardware-enforced isolation (separate compute units, cache, memory, data paths per instance); no new isolation mechanism is introduced."
  multiplexing_mechanism: "Multiple pipeline stages from different function instances are packed into and time-shared across the fixed set of MIG partitions (e.g. one 4g.40gb, one 2g.20gb, one 1g.10gb per A100 in the evaluated config), rather than one function per whole partition."
  state_mechanism: "Pipeline stage inter-communication uses CPU shared memory (10-40ms overhead per stage) because MIG's hardware isolation prevents direct cross-partition GPU memory sharing."
  overhead_bottleneck: "Cross-stage data-transfer overhead via CPU shared memory, imposed by MIG's isolation, offset by much shorter queuing time from reduced fragmentation."
  primary_tradeoff: "Pipelined time-sharing of fixed MIG partitions -> gains large fragmentation-driven throughput/latency wins without giving up MIG's strong hardware isolation, but costs CPU-mediated inter-stage communication latency and works only within MIG's existing fixed partition-size menu (no dynamic MIG reconfiguration)."

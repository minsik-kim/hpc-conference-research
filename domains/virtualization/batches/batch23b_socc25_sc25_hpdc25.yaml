- id: VIRT-SOCC25-04
  title: "Scheduling Cloud VMs on Variable Capacity Datacenters"
  title_correction: null
  authors: [Rajini Wijayawardana, Andrew A. Chien]
  venue: SoCC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3772052.3772250"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "http://people.cs.uchicago.edu/~aachien/lssg/research/zccloud/IAS_SoCC25.pdf"
  classification: CONTEXT
  classification_note: "The contribution is a VM placement/termination scheduling policy (Interval-Aware Scheduler) for datacenters whose physical capacity varies for grid/carbon reasons; it treats VMs as opaque schedulable units and does not touch the hypervisor/VM virtualization mechanism itself."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: []
  physical_resource: CPU core
  logical_abstraction: "VMs scheduled onto machines whose usable capacity varies over time (\"machine intervals\"); the abstraction exposed to the scheduler is availability-interval statistics, not a virtualized resource per se."
  problem: "Decarbonization-driven datacenter power flexing creates variable machine capacity that a capacity-oblivious scheduler handles by terminating running VMs/jobs, causing 12-24% goodput loss and SLO violations for long-running cloud services."
  mechanism: "The Interval-Aware Scheduler (IAS) models each machine's available-capacity period as a stochastic \"interval\" and combines three heuristics -- place big/long jobs on statistically stable machines, align small-job starts with predicted capacity-change times, and use a conservativeness parameter over the interval-duration distribution -- to choose placements that minimize terminations without advance knowledge of exact capacity changes."
  isolation_mechanism: N/A
  multiplexing_mechanism: "Physical machine capacity is time-multiplexed among VM placements according to predicted interval statistics rather than by a virtualization mechanism; no new resource-partitioning primitive is introduced."
  state_mechanism: N/A
  overhead_bottleneck: "VM/job terminations forced by unpredicted capacity reductions, which IAS reduces via interval-aware placement rather than by making termination itself cheaper (e.g. via migration/checkpoint)."
  primary_tradeoff: "Placing jobs by predicted interval stability -> gains large termination reductions (32-98%) without needing exact future capacity knowledge, but costs accuracy under LIFO-only machine-management assumptions and offers no benefit when job-duration and interval-duration distributions are poorly aligned."
  quantitative_claims:
    - "goodput loss under baseline FCFS/First-Fit scheduling: 12-24% (Azure and Google Borg traces plus synthetic Zipf workloads)"
    - "termination reduction: 92% for the Azure workload; 32-98% across synthetic workloads"
    - "with conservativeness Z=0.9: 99.4% availability, comparable to industry SLOs, leaving only ~2% of terminations"
  why_useful_for_learning: "CONTEXT case showing how virtualization's classic 'opaque VM to be placed/terminated' abstraction interacts with a new resource-management problem (grid-responsive variable capacity), without changing the virtualization mechanism itself."
  priority: P3
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Full text read from the authors' University of Chicago project page copy (co-authored with Argonne National Laboratory)."

- id: VIRT-SOCC25-05
  title: "Funky: Cloud-Native FPGA Virtualization and Orchestration"
  title_correction: null
  authors: [Atsushi Koshiba, Charalampos Mainas, Pramod Bhatotia]
  venue: SoCC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3772052.3772226"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "https://dse.in.tum.de/wp-content/uploads/2025/10/Funky-SoCC-2025.pdf"
  classification: CORE
  classification_note: "Directly builds a new FPGA virtualization abstraction (vFPGA slots exposed through a unikernel guest + thin hypervisor) with hypervisor-mediated isolation, state capture and preemption -- squarely CORE T6 accelerator virtualization, not merely scheduling over existing FPGA sharing."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T4, T1]
  physical_resource: FPGA
  logical_abstraction: "vFPGA: a reconfigurable-slot virtual FPGA exposed to guest applications through unikernel guest APIs, backed by a static Shell (PCIe DMA/MMU) and dynamic per-tenant partial-reconfiguration regions."
  problem: "Cloud orchestrators lack FPGA support because vendor containers are not lightweight sandboxes, FPGA workloads are not preemptible/checkpointable for multi-tenant sharing, and device plugins cannot enforce CRI/OCI-compliant multi-tenant isolation."
  mechanism: "Guest applications run inside lightweight Funky unikernels (IncludeOS on Solo5) that cannot touch the FPGA directly; a thin Funky hypervisor/monitor mediates all access via hypercalls (vfpga_init/vfpga_free) and an exitless shared-queue protocol (MEMORY/TRANSFER/EXECUTE/SYNC requests); the FPGA Shell statically reserves PCIe DMA/MMU infrastructure and dynamically partitions the reconfigurable fabric into per-tenant vFPGA regions via Dynamic Partial Reconfiguration, with a per-vFPGA MMU providing memory isolation; three modified Kubernetes-compatible components (scheduler, runtime, CRI annotations) add preemptive eviction, checkpoint/resume and OCI images 28.7x smaller than vendor containers."
  isolation_mechanism: "Per-vFPGA MMU-enforced virtual memory space plus unikernel sandboxing of the guest application; the hypervisor is the only component with direct device access."
  multiplexing_mechanism: "One physical FPGA's reconfigurable fabric is spatially partitioned into multiple concurrently-active vFPGA regions via Dynamic Partial Reconfiguration, with the static Shell region shared by all tenants."
  state_mechanism: "FPGA state is tracked in three layers -- transient on-chip logic (flushed at kernel completion), FPGA memory (tracked init/sync/dirty, only dirty buffers saved), and VM state (vCPU registers + dirty guest pages) -- captured on hypervisor-triggered eviction/checkpoint and restored on resume/replication."
  overhead_bottleneck: "Synchronization latency while waiting for in-flight FPGA operations to drain before a checkpoint/eviction can complete, mitigated by chunking large data transfers."
  primary_tradeoff: "Unikernel + hypercall-mediated FPGA virtualization -> gains preemption, checkpoint/restore and 28.7x smaller OCI images at only 7.4% overhead vs. native, but costs vendor lock-in (single Alveo U50/Vitis Shell) and no access to fine-grained on-chip state (flip-flops/BRAM) for checkpointing."
  quantitative_claims:
    - "end-to-end overhead: 7.4% vs. native execution across 23 Vitis Accel Examples + Rosetta applications; only 0.6% above a non-virtualizing Docker container baseline"
    - "OCI image size: 28.7x smaller than AMD's Docker container for FPGA access"
    - "code portability: 3.4% average source modification across 23 applications"
    - "eviction of a 1GB FPGA buffer: 177.2ms; VM checkpoint of 1GB: ~2s (disk-based)"
    - "task preemption benefit: 16.7% execution-time reduction for short high-priority tasks in a 3-FPGA cluster"
    - "production trace (Google ClusterData 2019, scaled): 1.1x throughput at 25% FPGA acceleration rate with minimal virtualization overhead retained"
    - "hardware: 4 x86 servers (3 workers: Xeon Gold 6238R; 1 leader: Gold 5317), each worker with 1x AMD Alveo U50 FPGA over PCIe Gen3 x16"
  why_useful_for_learning: "One of the clearest 2025 statements of accelerator virtualization done the same way CPU virtualization is done -- hypervisor-mediated hypercalls, MMU-based spatial partitioning, and explicit multi-layer state capture for checkpoint/migration -- applied to FPGAs instead of CPUs."
  priority: P0
  related: ["Proteus: Heterogeneous FPGA Virtualization", "F3: An FPGA-accelerated FaaS Framework"]
  relations:
    - {type: SAME_BRANCH, target: "F3: An FPGA-accelerated FaaS Framework", basis: "both from the TUM/MPI-SWS group, both use a unikernel guest + per-node FPGA manager mediating hypercalls to a partitioned reconfigurable region; Funky targets cloud-native orchestration generally, F3 targets FaaS specifically"}
    - {type: ALTERNATIVE, target: "Proteus: Heterogeneous FPGA Virtualization", basis: "both virtualize FPGA slots for multi-tenant cloud use via different isolation/orchestration designs"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds: [paper, preprint, official-web]
  confidence: HIGH
  notes: "Full text read from the authors' TUM lab copy (matches the arXiv 2510.15755 preprint)."


- id: VIRT-SOCC25-22
  title: "VLCs: Managing Parallelism with Virtualized Libraries"
  title_correction: null
  authors: [Yineng Yan, William Ruys, Hochan Lee, Ian Henriksen, Arthur Peters, Sean Stephens, Bozhi You, Henrique Fingler, Martin Burtscher, Milos Gligoric, Keshav Pingali, Mattan Erez, George Biros, Christopher J. Rossbach]
  venue: SoCC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3772052.3772265"
  official_url: "https://acmsocc.org/2025/schedule.html"
  fullpaper_source: "https://arxiv.org/abs/2512.04320"
  classification: SUPPORT
  classification_note: "VLCs are an intra-process resource-view virtualization (linker-namespace isolation + ptrace-based interposition on resource-query syscalls), explicitly distinguished by the authors from OS/machine virtualization since libraries still share one address space and directly access shared data; genuinely useful boundary case for understanding virtualization-style resource-view interposition below the OS/VM layer, hence SUPPORT/T10 rather than CORE."
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: [T5]
  physical_resource: CPU core
  logical_abstraction: "A Virtual Library Context (VLC): a process subunit that encapsulates a set of libraries and a private view of allocated CPU-core/GPU resources, so that resource-oblivious libraries (OpenMP, OpenBLAS, LibTorch) believe they own exclusive hardware even when several VLCs coexist in one process."
  problem: "Composed parallel applications link multiple libraries that each assume exclusive access to hardware resources; when several run concurrently in one process they contend destructively, and fixing this normally requires modifying the libraries or the OS."
  mechanism: "VLCs use per-library linker namespaces (dlmopen) to give each library its own static/global state, and ptrace-based system-call interposition to intercept resource-query syscalls (e.g. sched_getaffinity) so each VLC reports only its own allocated resource slice; a 'service VLC' pattern handles libraries incompatible with dlmopen (TBB, CUDA, older pthreads), and a transparent mode avoids explicit function-pointer management."
  isolation_mechanism: "Performance/resource-view isolation only (no data isolation): libraries in different VLCs still share the process address space and can access each other's data directly; only their view of available CPU/GPU resources is separated."
  multiplexing_mechanism: "A fixed pool of CPU cores and GPUs is statically partitioned across VLCs within one process, with each VLC's resource-query syscalls redirected to see only its own partition."
  state_mechanism: "Per-library static/global state is duplicated per linker namespace so each VLC instance of a library has independent internal state despite sharing one process."
  overhead_bottleneck: "None significant reported: end-to-end application overhead is under 0.54%, with syscall interposition costing ~20us per intercepted call."
  primary_tradeoff: "Intra-process resource-view virtualization -> gains most of the contention-avoidance benefit of full OS/process isolation at near-zero overhead and with only 13-27 lines of application changes, but costs the ability to isolate data (unlike real process/VM isolation) and is capped at 16 (extendable to 32+) VLCs by glibc's linker-namespace limit."
  quantitative_claims:
    - "synthetic workloads: up to 2.85x speedup (average 2.05x)"
    - "LibTorch hyperparameter tuning: 2.61x over default concurrent config, 1.35x over best PyTorch API option"
    - "Kokkos multi-GPU Heat3D: 1.46x over an MPI baseline"
    - "VLC initialization: 40.2us (C++), 3.96ms (Python); end-to-end overhead <0.54%"
    - "hardware: 24-core dual-socket Intel E5-2650 v4, 128GB RAM, 4x NVIDIA Tesla P100 GPUs"
  why_useful_for_learning: "A genuine boundary case for the corpus's virtualization taxonomy: shows the same conceptual machinery as OS/device virtualization (namespace-based state separation + syscall interposition to control what a consumer 'sees' of a shared resource) applied one level below the OS, inside a single process."
  priority: P2
  related: ["VIRT-HPDC25-03"]
  relations:

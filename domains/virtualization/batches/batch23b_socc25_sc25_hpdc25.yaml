- id: VIRT-HPDC25-01
  title: "F3: An FPGA-accelerated FaaS Framework"
  title_correction: null
  authors: [Charalampos Mainas, Martin Lambeck, Bruno Scheufler, Laurent Bindschaedler, Atsushi Koshiba, Pramod Bhatotia]
  venue: HPDC
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: "10.1145/3731545.3731582"
  official_url: "https://hpdc.sci.utah.edu/2025/program.html"
  fullpaper_source: "https://binds.ch/papers/f32025.pdf"
  classification: CORE
  classification_note: "Builds a complete FPGA virtualization stack for FaaS -- unikernel guest isolation, a per-node vFPGA manager mediating hypercalls, and Shell-based hardware partitioning with per-vFPGA MMUs -- directly matching the CORE definition of accelerator virtualization with hypervisor-mediated isolation, not merely a scheduler over shared FPGAs."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T5, T8]
  physical_resource: FPGA
  logical_abstraction: "vFPGA: a per-tenant dynamically-reconfigurable FPGA region reachable only through hypercalls from an F3 unikernel guest, with the FPGA Shell providing a virtual memory space per vFPGA via dedicated MMUs."
  problem: "FPGAs offer large speedups for serverless functions but conflict with FaaS requirements: complex low-level vendor APIs, no virtualization/isolation for multi-tenant sharing, high reconfiguration/communication overhead, and no orchestration support."
  mechanism: "CPU-side function code runs in lightweight F3 unikernels (IncludeOS on Solo5) that cannot access the FPGA directly; a per-node vFPGA manager mediates every FPGA request as hypercalls, preventing direct device access; the FPGA Shell statically reserves PCIe DMA/MMU infrastructure and creates multiple dynamic vFPGA regions via Dynamic Partial Reconfiguration, each with its own MMU-managed virtual memory space; a bitstream cache, watchdog process and state-flushing protocol support safe reassignment between tenants, and a FunkyCL-style OpenCL-compatible layer with zero-copy transfers eases porting."
  isolation_mechanism: "Unikernel sandboxing of guest CPU code plus per-vFPGA MMU-enforced memory isolation; all device access is mediated through hypercalls to the vFPGA manager, which enforces multi-tenant boundaries."
  multiplexing_mechanism: "One physical FPGA fabric is spatially divided into multiple concurrently-active vFPGA regions (13.1% static Shell + 29% dynamic region on an Alveo U50 in the evaluated configuration) via Dynamic Partial Reconfiguration."
  state_mechanism: "FPGA control/status registers, tracked memory buffers (init/sync/dirty) and unikernel VM state (vCPU registers, dirty pages) are captured on eviction and restored on resume, enabling safe multi-tenant reassignment."
  overhead_bottleneck: "FPGA reconfiguration/bitstream-loading latency for cold starts, mitigated with a bitstream cache and warm-boot reuse."
  primary_tradeoff: "Unikernel + hypercall-mediated FPGA virtualization -> gains safe multi-tenant sharing, preemption and orchestration integration at low overhead, but costs workload applicability (not all serverless workloads benefit, e.g. AES loses to CPU AES-NI) and fabric fragmentation under dynamic partial reconfiguration."
  quantitative_claims:
    - "single-function speedup: 28.6x average over CPU baseline (range 1.6x-150.3x) across 10 diverse applications; 9 of 10 faster than CPU"
    - "cold-boot overhead vs. Docker: 11.6% latency increase; with reconfiguration: 15.6%"
    - "hypercall latency: ~5us per call; total API overhead 10.8us (call_fpga_acc) / 4.6us (wait_fpga_acc) vs. 167.9ms average app runtime"
    - "function chaining (GZIP->AES): 1.4x-1.7x faster than client-/server-side piping baselines"
    - "concurrent SHA256 (30 clients): linear scaling, 2x speedup with 2 vFPGAs, 4x with 4 vFPGAs"
    - "Azure trace simulation (200-node cluster): 3x average latency reduction; 2.0x-6.4x at 25%-100% acceleration ratios"
    - "hardware: 1 leader + 3 worker nodes (Intel Xeon Gold), each worker with 1x AMD Alveo U50 FPGA, 100GbE"
  why_useful_for_learning: "A near-ideal CORE reference for accelerator virtualization: shows the full stack (guest isolation, hypercall mediation, MMU-based spatial partitioning, multi-layer state capture) applied specifically to make FPGA sharing safe for FaaS multi-tenancy."
  priority: P0

papers:
- id: VIRT-HPCA24-01
  title: 'Data Enclave: A Data-Centric Trusted Execution Environment'
  title_correction: null
  authors:
  - Yuanchao Xu
  - James Pangia
  - Chencheng Ye
  - Yan Solihin
  - Xipeng Shen
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: http://yuanchaoxu6.github.io/files/HPCA2024_DataEnclave.pdf
  classification: CORE
  classification_note: The contribution is a new data-centric TEE abstraction (independently-lived 'data
    enclaves' decoupled from SGX enclave lifecycle) that redefines the trust/isolation boundary for inter-enclave
    sharing, i.e. confidential-computing isolation architecture is the paper's main contribution.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T2
  physical_resource: DRAM
  logical_abstraction: Independently-lived 'data enclave' objects that any number of authenticated SGX
    enclaves can attach to with asymmetric read/write permissions
  problem: Existing enclave TEEs bind data lifecycle to a single enclave, forcing slow software encryption
    or inflexible sharing schemes for legitimate inter-enclave data exchange.
  mechanism: Introduces 'data enclaves' as separate cryptographically-isolated containers with their own
    AES counter-mode keys, integrity trees and access-control metadata cached in a 32-entry structure
    in the memory controller; an Authenticator enclave verifies measurements before granting attach permissions,
    and 'attachable integrity trees' let multiple data enclaves compose under an SGX enclave's Merkle
    root to bound on-chip root-register pressure.
  isolation_mechanism: Per-data-enclave AES-CTR keys and MACs/integrity trees give cryptographic isolation;
    TLB-enforced access control faults on non-SGX or unauthorized-enclave accesses; measurement-based
    authentication blocks rogue-enclave impersonation and replica attacks.
  multiplexing_mechanism: N-to-M attach relationships let many enclaves share one data enclave's physical
    DRAM region directly in place, instead of each enclave holding a private encrypted copy.
  state_mechanism: Data enclave state (ciphertext, counters, MAC/integrity-tree nodes) lives in DRAM regions
    outside any one enclave's private EPC; a data-enclave cache in the memory controller tracks PFN ranges/IDs/permissions,
    and attachable trees move state between an independent root and a hosting SGX enclave's root as needed.
  overhead_bottleneck: Integrity-tree management once many data enclaves exceed the MEE's limited on-chip
    root-register capacity, forcing tree sealing/spilling to DRAM.
  primary_tradeoff: Decoupling data from enclave lifecycle -> gains 1-3 orders of magnitude faster inter-enclave
    sharing and 20-179% application throughput over scalable SGX, but costs new hardware (data-enclave
    cache, extra root registers) and a new attach-authentication protocol surface.
  quantitative_claims:
  - 'synthetic producer-consumer inter-enclave sharing: up to 2000x latency speedup vs scalable SGX (4KB
    messages, gem5, x86-64 4GHz single core)'
  - 'IOZone random read: 1.5-3.2x bandwidth vs scalable SGX (16KB records)'
  - 'recommender system (64 users): 1.6-2.1x throughput vs scalable SGX'
  - 'Redis 100% search workload: 81-179% throughput improvement vs scalable SGX'
  - 'SPEC CPU microbenchmarks: 13.1% average improvement (hybrid design) vs SGXv1'
  - 'on-chip storage added: 1,984 bytes'
  why_useful_for_learning: Shows how page/enclave-centric TEE isolation becomes the bottleneck for legitimate
    multi-tenant data sharing, and one concrete redesign (decoupled data ownership) that trades new hardware
    for that flexibility.
  priority: P1
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: Read the author-hosted camera-ready PDF; exact DOI not confirmed (IEEE Xplore document 10476466
    blocked from direct retrieval).
- id: VIRT-HPCA24-02
  title: 'Salus: Efficient Security Support for CXL-Expanded GPU Memory'
  title_correction: null
  authors:
  - Rahaf Abdullah
  - Hyokeun Lee
  - Huiyang Zhou
  - Amro Awad
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://hzhou.wordpress.ncsu.edu/files/2024/02/Salus_HPCA_24_Camera_Ready.pdf
  classification: SUPPORT
  classification_note: Salus optimizes the security-metadata cost of GPU memory encryption/integrity when
    GPU memory is expanded over CXL; it hardens an existing memory-encryption mechanism rather than building
    a new virtual/tenant-facing GPU or memory abstraction, so it is background for CORE CXL/GPU-memory
    papers rather than CORE itself.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T2
  - T3
  physical_resource: GPU HBM/GDDR plus CXL-attached expansion memory
  logical_abstraction: A single encrypted GPU address space spanning fast on-package memory and slower
    CXL-expansion memory without re-encryption on migration
  problem: Dynamic page migration between GPU device memory and CXL-expansion memory forces expensive
    re-encryption/re-MACing under conventional per-tier security metadata, causing up to a 2.04x slowdown
    from security overhead alone.
  mechanism: Computes encryption pads and MACs from a page's permanent CXL address regardless of its current
    physical tier; restructures counter blocks so each 256B interleaving chunk shares a major counter
    (Interleaving-Friendly Split Counters), collapses minor counters into MACs during transfer, and fetches
    security-metadata blocks lazily only on access via a CXL-to-GPU address mapping table with per-GPC
    caches.
  isolation_mechanism: Standard counter-mode encryption plus a Bonsai Merkle Tree for integrity/freshness
    over untrusted off-chip memory; the GPU chip is the trust boundary and all off-chip memory (device
    or CXL) is untrusted.
  multiplexing_mechanism: N/A for tenants; the mechanism multiplexes security-metadata bandwidth across
    CXL and device-memory channels via interleaved 256B chunks and a hashed mapping table with 128-entry
    per-GPC caches.
  state_mechanism: Security metadata (counters, MACs, integrity tree) is keyed to the permanent CXL address
    and moves with fine-grained dirty tracking; no re-encryption occurs when pages physically migrate
    between HBM and CXL.
  overhead_bottleneck: Security-metadata traffic between heterogeneous memory tiers, previously fetched
    for every access regardless of need.
  primary_tradeoff: Unifying the security domain across tiers removes migration re-encryption cost but
    adds an address-remapping/caching layer, and only pays off once GPU memory is itself expanded over
    an untrusted CXL fabric.
  quantitative_claims:
  - 'IPC improvement: +29.94% geometric mean, up to +190.43% (GPGPU-Sim v4.0, Volta-like GPU, 80 SMs,
    868 GB/s HBM, Rodinia/Parboil/Lonestar/Pannotia)'
  - 'security metadata traffic: reduced to 47.79% of baseline'
  - 'CXL bandwidth overhead: 14.92% lower than conventional design'
  - 'baseline security-only slowdown observed: 2.04x from data-movement re-encryption'
  why_useful_for_learning: Explains the security cost that CXL-based GPU memory expansion (device/memory
    disaggregation) adds on top of ordinary GPU memory encryption -- relevant background whenever a CORE
    paper virtualizes or pools GPU memory over CXL.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: null
- id: VIRT-HPCA24-03
  title: Supporting Secure Multi-GPU Computing with Dynamic and Batched Metadata Management
  title_correction: null
  authors:
  - Seonjin Na
  - Jungwoo Kim
  - Sunho Lee
  - Jaehyuk Huh
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://seonjinna.github.io/assets/pdf/hpca24_slides.pdf
  classification: SUPPORT
  classification_note: The contribution is workload-aware pad-table/MAC management that lowers the cost
    of an existing multi-GPU interconnect security mechanism; it hardens accelerator interconnect security
    rather than creating a new virtual GPU or multi-tenant abstraction.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T3
  physical_resource: GPU-to-GPU interconnect (NVLink-class) and GPU HBM
  logical_abstraction: An authenticated, replay-protected multi-GPU interconnect whose per-pair security-metadata
    storage is reallocated online to match communication intensity
  problem: Securing inter-GPU transfers with fixed private pad tables and per-block MACs costs 19.5% average
    performance, dominated by per-block security metadata traffic and pad management that ignores actual,
    skewed and time-varying GPU-pair communication patterns.
  mechanism: Dynamically resizes/allocates per-GPU-pair pad-table entries based on observed communication
    intensity instead of static per-pair reservations, and batches 16-64 data blocks under a single MAC
    to amortize authentication metadata.
  isolation_mechanism: Authenticated encryption (confidentiality+integrity) over the multi-GPU interconnect
    with replay protection via sender IDs and counters, so a receiver only accepts the latest version
    of data from a given sender.
  multiplexing_mechanism: Shared pad-table capacity is time-multiplexed across communicating GPU pairs
    by tracking which pairs are currently 'hot' (69.2% of gathered data concentrates in short intervals)
    and reallocating storage to them.
  state_mechanism: Pad-table entries and batched-MAC state live per-GPU at the memory-controller/interconnect
    interface and are reshuffled online as communication patterns shift.
  overhead_bottleneck: Authenticated en/decryption (8.2%) plus security metadata traffic (11.3%) dominate
    the 19.5% baseline overhead.
  primary_tradeoff: Dynamic, workload-aware pad/MAC management cuts overhead from 19.5% to 7.9%, at the
    cost of runtime monitoring logic and batching latency that must be hidden behind communication.
  quantitative_claims:
  - 'overall secure multi-GPU overhead: reduced from 19.5% to 7.9% (11.6 percentage-point improvement
    over private per-pair pad tables)'
  - 'security metadata traffic: 20% reduction'
  - 'latency hiding: 59.6% improvement from better pad-table allocation'
  why_useful_for_learning: Shows the interconnect-security cost analogous to Salus's memory-security cost,
    but for the GPU-to-GPU fabric itself -- relevant to any CORE paper on secure multi-GPU or accelerator
    virtualization.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds:
  - official-web
  confidence: MEDIUM
  notes: Read only the authors' own conference slide deck; IEEE Xplore/ACM DL blocked and no author-hosted
    full PDF was located after three routes, so mechanism/results are as presented in slides, not the
    full paper text.
- id: VIRT-HPCA24-04
  title: 'DockerSSD: Containerized In-Storage Processing and Hardware Acceleration for Computational SSDs'
  title_correction: null
  authors:
  - Donghyun Gouk
  - Miryeong Kwon
  - Hanyeoreum Bae
  - Myoungsoo Jung
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://ee.kaist.ac.kr/en/research-achieve/prof-myoungsoo-jungs-research-team-develops-dockerssd-a-smart-ssd-that-can-be-utilized-as-independent-server-without-computer/
  classification: CORE
  classification_note: The contribution is embedding OS-level (Docker) container virtualization plus a
    'virtual firmware' layer directly into an SSD's own embedded compute, i.e. a genuinely new device-level
    container-isolation architecture, matching the brief's 'container isolation architecture is CORE'
    rule applied to storage hardware.
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary:
  - T3
  physical_resource: NVMe SSD embedded compute/firmware
  logical_abstraction: A Docker-compatible OS-level virtualization environment plus a 'virtual firmware'
    layer that lets standard containerized applications run directly inside an SSD's own embedded processor
  problem: Computational/in-storage-processing SSDs expose proprietary vendor interfaces, forcing applications
    to be rewritten per device and preventing portable, standardized, or safely multi-tenant in-storage
    processing.
  mechanism: Embeds Docker (OS-level virtualization) into SSD firmware together with a lightweight virtual-firmware
    layer that reproduces a host-like execution environment for containers on the drive's embedded processor,
    and exposes cross-node access to computational SSDs over Ethernet-over-NVMe for disaggregated/pooled
    storage.
  isolation_mechanism: Container-level OS isolation (namespaces/cgroups via Docker) between concurrently-running
    in-storage applications, mediated by the virtual-firmware layer instead of the vendor's raw proprietary
    firmware API.
  multiplexing_mechanism: The SSD's embedded compute and DRAM are time/space-shared across containers
    the same way a host OS shares a CPU across containers, relocated onto the storage device itself.
  state_mechanism: Container images/state are managed by the embedded Docker runtime; network-attached
    (Ethernet-over-NVMe) access lets an ISP-capable SSD be treated as an independent, disaggregated compute-storage
    node.
  overhead_bottleneck: Virtualization/container-runtime overhead inside a resource-constrained embedded
    SSD controller, traded against eliminating vendor lock-in.
  primary_tradeoff: Standardizing SSD compute behind Docker plus virtual firmware gains portable, hardware-agnostic
    in-storage applications and disaggregation, but costs some of the raw efficiency of vendor-specific
    bare-metal firmware.
  quantitative_claims:
  - 'execution acceleration: up to 2x vs conventional host-side processing (KAIST press-release figure)'
  - 'power consumption: up to 2x reduction vs conventional host-side processing (KAIST press-release figure)'
  - 'I/O-intensive workloads: up to 2.0x performance improvement (2025 extended arXiv report by the same
    authors, arXiv:2506.06769)'
  - 'distributed LLM inference: up to 7.9x improvement (same extended arXiv report)'
  why_useful_for_learning: A concrete, unusual instance of the 'container isolation architecture is CORE'
    rule applied to a non-CPU device (an SSD's own embedded processor), showing OS-level virtualization
    pushed all the way into storage firmware.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds:
  - official-web
  - preprint
  confidence: MEDIUM
  notes: The HPCA 2024 paper text itself sits behind IEEE Xplore; pieced together from the KAIST press
    release (mechanism + 2x/2x figures) and a 2025 arXiv extended report (2506.06769) by the same author
    team describing the same DockerSSD mechanism plus SSD disaggregation (I/O and LLM-inference figures);
    numbers above are attributed to their respective source and not verified against the original conference
    PDF.
- id: VIRT-HPCA24-05
  title: A Quantum Computer Trusted Execution Environment
  title_correction: null
  authors:
  - Theodoros Trochatos
  - Chuanqi Xu
  - Sanjay Deshpande
  - Yao Lu
  - Yongshan Ding
  - Jakub Szefer
  venue: HPCA
  year: 2024
  publication_type: UNKNOWN
  doi: 10.1109/LCA.2023.3325852
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://arxiv.org/abs/2308.03897
  classification: CORE
  classification_note: The contribution is a hardware trusted-execution-environment architecture (obfuscating
    decoy pulses plus tamper-resistant in-refrigerator hardware) protecting a user's quantum circuit from
    a hostile cloud host, i.e. confidential-computing isolation architecture extended to a new physical
    domain.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary:
  - T10
  physical_resource: Superconducting-qubit analog control electronics inside a cloud quantum computer's
    dilution refrigerator
  logical_abstraction: A trusted execution boundary around a user's quantum circuit and its analog control
    pulses, treating the cloud quantum-computing provider itself as a potentially hostile host
  problem: Cloud-hosted quantum computers expose users' proprietary quantum circuits and embedded input
    data -- encoded as analog control pulses that cannot simply be encrypted the way digital data can
    -- to the cloud provider itself.
  mechanism: Users add software-generated 'decoy' obfuscating pulses to their circuit; dedicated tamper-resistant
    hardware inside the dilution refrigerator attenuates/removes the decoy pulses before they reach the
    physical qubits, so only that trusted in-refrigerator hardware, not the cloud host's classical control
    stack, ever sees the true circuit.
  isolation_mechanism: Physical/analog obfuscation plus tamper-resistant hardware placed inside the untrusted
    host's own refrigerator, acting as a hardware root of trust for a control path that has no encryption
    primitive.
  multiplexing_mechanism: N/A (single-user protection design, not resource sharing).
  state_mechanism: Obfuscation/de-obfuscation state (the decoy-pulse pattern) is generated by the user
    and only ever decoded by the trusted in-refrigerator hardware; nothing migrates.
  overhead_bottleneck: Fidelity loss from the decoy-pulse/attenuation pipeline, measured via variational
    distance between protected and unprotected circuit output distributions.
  primary_tradeoff: Protecting an inherently analog, unencryptable control path gains the first hardware
    TEE for a quantum computer, at the cost of some circuit fidelity and new tamper-resistant hardware
    physically inside the provider's own refrigerator.
  quantitative_claims:
  - 'variational distance between protected and unprotected circuit output distributions: 0.16-0.26'
  why_useful_for_learning: Extends the TEE/confidential-computing concept -- one of this batch's expected
    strong 2024 yield areas -- to a physical-analog domain with no encryption primitive available, clarifying
    what 'trusted execution' must mean when the protected artifact is a control waveform rather than digital
    memory.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN
  evidence_kinds:
  - preprint
  - program-only
  confidence: MEDIUM
  notes: Presented at HPCA 2024 in the retrospective 'Best of CAL' session (Session 5C); the original
    publication is IEEE Computer Architecture Letters 2023 (DOI 10.1109/LCA.2023.3325852) -- an invited
    reprint of already-published work, not a fresh HPCA-reviewed submission. Retained and classified here
    as instructed for archival, already-published work presented at the venue, but excluded from the HPCA
    2024 regular-research population count (see excluded_by_pubtype); publication_type left UNKNOWN because
    no schema value cleanly names an invited 'Best of Journal' reprint.
- id: VIRT-HPCA24-06
  title: 'LibPreemptible: Enabling Fast, Adaptive, and Hardware-Assisted User-Space Scheduling'
  title_correction: arXiv preprint 2308.02896 uses the working title 'Towards Fast, Adaptive, and Hardware-Assisted
    User-Space Scheduling'
  authors:
  - Yueying Li
  - Nikita Lazarev
  - David Koufaty
  - Yijun Yin
  - Andy Anderson
  - Zhiru Zhang
  - G. Edward Suh
  - Kostis Kaffes
  - Christina Delimitrou
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://arxiv.org/abs/2308.02896
  classification: SUPPORT
  classification_note: LibPreemptible builds hardware-assisted preemptive user-level thread scheduling
    on ordinary Linux threads/processes; it is a CPU-multiplexing mechanism directly analogous to vCPU
    preemption/harvesting inside a hypervisor, useful to explain CORE CPU-virtualization trade-offs, but
    it does not itself create a VM, container, or other virtual-resource abstraction.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T1
  physical_resource: CPU core
  logical_abstraction: Preemptible user-level threads scheduled with microsecond time quanta on top of
    ordinary Linux threads, using hardware interrupts instead of kernel-mediated scheduling
  problem: Microsecond-scale, highly dispersive datacenter request latencies are hurt by thread over-subscription
    (50-500 threads/core); prior user-space preemption (e.g. Shinjuku) needs privileged APIC access and
    heavy kernel bypass, hurting security/portability and scaling poorly with core count.
  mechanism: Uses Intel Sapphire Rapids UINTR (user interrupts) so a dedicated per-core timer thread can
    directly interrupt a worker thread without kernel mediation (SENDUIPI to a receiver's UPID via a UITT
    entry); LibUtimer gives 3-microsecond-resolution user-space timers, and an adaptive controller adjusts
    each thread's time quantum from load, queue depth and a tail-latency index.
  isolation_mechanism: Interrupt senders are restricted to trusted timer threads inside the same security
    domain, narrowing the attack surface that native UINTR would otherwise expose.
  multiplexing_mechanism: A single physical core's cycles are time-sliced across co-located latency-critical
    and best-effort user-level threads via preemption at quanta as fine as 5 microseconds, letting a latency-critical
    thread reclaim the core almost immediately.
  state_mechanism: Per-thread scheduling state (deadline, quantum, queue position) is kept in user space;
    UINTR posted-interrupt descriptors and a customized fcontext library with pooled memory carry the
    actual context-switch state.
  overhead_bottleneck: Preemption cost (~1 microsecond per preemption combining sender+receiver work)
    and deployment overhead (below 1-1.2% tail-latency overhead at 20-89% load).
  primary_tradeoff: Hardware-assisted, kernel-bypass preemption gains 10x better tail latency than Shinjuku
    with only ~3% extra application code, but depends on a specific new CPU feature (UINTR) and restricts
    who may send interrupts to preserve security.
  quantitative_claims:
  - 'tail latency: 10x better than Shinjuku across bimodal, exponential and dynamic workloads (Intel Sapphire
    Rapids, 56 CPUs/112 threads, 1.7GHz fixed)'
  - 'throughput: 22% higher than Shinjuku under workload A1, 33% higher under workload C'
  - 'co-location (MICA+Zlib), fixed 30us quantum: LC tail latency reduced 3.2-4.4x (to 33us at 55kRPS)'
  - 'co-location, fixed 5us quantum: 18.5x improvement (to 8us)'
  - 'user-interrupt IPC latency: 0.734us average vs 29.688us (eventFD) and 15.325us (signals)'
  - 'integration cost: 3% extra code; 3-7 hours to add to MICA/Zlib/an RPC service'
  why_useful_for_learning: A process/thread-level analogue of vCPU preemption and CPU-harvesting policies
    used inside VMMs; shows what fine-grained, hardware-assisted preemption costs and buys at the OS-thread
    layer, directly informing CPU-multiplexing trade-offs made one layer up inside a hypervisor.
  priority: P2
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds:
  - preprint
  confidence: HIGH
  notes: Read the arXiv preprint (2308.02896); authors, mechanism (UINTR-based LibPreemptible) and venue-program
    placement match the HPCA 2024 program entry exactly, only the title differs (see title_correction).
- id: VIRT-HPCA24-07
  title: 'MINOS: Distributed Consistency and Persistency Protocol Implementation & Offloading to SmartNICs'
  title_correction: null
  authors:

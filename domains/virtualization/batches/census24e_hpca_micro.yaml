  guest, live migration, SR-IOV, IOMMU, passthrough, virtio, container, sandbox, TEE/SEV-SNP/TDX/SGX/CCA,
  GPU sharing/MIG/MPS, FPGA, SmartNIC/DPU, serverless, multi-tenancy, oversubscription, partitioning,
  interference, nested/two-level page tables, address-translation offload). This was closer-to-exhaustive
  title screening than possible for the ACM-DL-heavy 2024 venues in earlier batches, because both hpca-conf.org
  and microarch.org publish complete, freely-fetchable program pages (unlike EuroSys/SOSP''s accepted-papers.html-plus-dblp
  approach in batch census24a, and unlike dblp itself, which returned ROBOTS_DISALLOWED for both conf/hpca/hpca2024.html
  and conf/micro/micro2024.html on every attempt this batch, exactly as it did for SOSP in a prior batch).
  Both venues'' program-derived counts (81 HPCA gross listed items, 113 MICRO listed items) were independently
  cross-checked against openaccept.org''s historical acceptance-rate table, which gave exactly 75/410
  (18.29%) for HPCA 2024 and exactly 113/497 (22.74%) for MICRO 2024 -- the MICRO figure matches the raw
  program-page count with no adjustment needed, while the HPCA figure requires subtracting 3 Industry
  Track papers (Session 9) and 3 ''Best of CAL'' retrospective reprints (Session 5C) from the 81 gross
  listed items to land exactly on 75, which is treated as strong independent confirmation that both the
  HPCA and MICRO enumerations are complete and that the ''Best of CAL'' items are correctly identified
  as non-regular-submission content.


  Candidate screening depth: every title flagged by the keyword list above was chased to at least one
  non-paywalled source (author homepage, lab page, arXiv, institutional repository, press release, or
  conference slide deck) before classification; 7 candidates (listed in access_failures) could not be
  read beyond bibliographic metadata after 3+ attempted routes each and are recorded per hard rule 2 as
  CONTEXT/TITLE_ONLY/LOW rather than guessed from title, even where the title alone strongly suggests
  a likely classification (e.g. ''Distributed Page Table'' and ''CacheCraft ... under Memory Protection''
  both read, on title alone, as probable pure-virtual-memory or reliability-not-security papers, but this
  was not confirmed and so was not used to classify them DROP).


  Pure-virtual-memory false positives explicitly screened and dropped (drop_reason: pure_virtual_memory),
  per the brief''s mandated first-class deliverable: (1) ''A Case for Speculative Address Translation
  with Rapid Validation for GPUs'' (Avatar, MICRO 2024) -- confirmed by reading the full paper that it
  addresses only single-level GPU virtual memory (CPU-host-to-discrete-GPU UVM), with no nested translation,
  guest-physical addressing, or hypervisor/multi-tenant content. (2) ''SUV: Static analysis guided Unified
  Virtual Memory'' (MICRO 2024) -- confirmed single-process GPU UVM prefetch/pinning via static analysis,
  no nested/hypervisor/multi-tenant content. By contrast, ''Elastic Translations: Fast virtual memory
  with multiple translation sizes'' (MICRO 2024), despite an almost identical single-level-sounding title
  and appearing in the same ''Virtual Memory/Virtualization'' session, was read in full and found to explicitly
  manage KVM''s nested (stage-2) page-table contiguous bit during nested faults and to report virtualized-execution
  speedups (30% average, up to 150%) -- this is the brief''s stated nested-translation exception rather
  than the false-positive pattern, so it was classified CORE rather than DROP; this pair is flagged as
  the batch''s clearest illustration of why each such title must actually be read rather than pattern-matched.


  Side-channel-attack false positives and near-misses explicitly screened: ''SegScope: Probing Fine-grained
  Interrupts via Architectural Footprints'' (HPCA 2024) was checked via its public proof-of-concept README
  and confirmed to target a single-OS/bare-metal or single-cloud-instance threat model (KASLR breaking,
  website fingerprinting) with no cross-VM or hypervisor-detection component, so it was not given a paper
  record (it does not meet even the low bar of ''uses a VM as the attack setting''). Two side-channel
  papers were read in full and found to be genuinely virtualization-relevant rather than false positives:
  ''IvLeague'' (MICRO 2024) attacks and then repairs a shared-metadata leak between isolated SGX-style
  enclave domains on one processor (classified CORE, since the fix is itself a new enclave-isolation mechanism),
  and ''Veiled Pathways'' (MICRO 2024) demonstrates that GPU ''uncore'' covert/side channels bypass both
  MPS and MIG''s existing GPU-virtualization isolation guarantees (classified SUPPORT, since it evaluates
  but does not itself propose a new vGPU abstraction). One side-channel paper, ''Ghost Arbitration'' (MICRO
  2024, GPU interconnect timing attacks), could not be read past its title/venue after 3 routes and is
  recorded as an access failure with an explicit note that its true classification (genuine multi-tenant-GPU
  false positive vs. a Veiled-Pathways-like real isolation finding) remains unresolved.


  Other threshold calls made, applying the same bar intended for 2025/2026: (1) GPU-sharing papers that
  operate strictly within an existing MIG/MPS partition scheme without creating the virtual-GPU abstraction
  themselves (STAR''s shared-L3-TLB fix) were held to SUPPORT, consistent with the brief''s explicit MIG/MPS
  threshold rule, even though STAR''s subject matter (a shared hardware structure inside a virtualized
  GPU) is otherwise very CORE-adjacent. (2) ''Mosaic'' (MICRO 2024) was pushed to CORE rather than SUPPORT
  because its contribution is a genuinely new hardware partitioning/isolation mechanism (tagged, retainable
  per-function cache/TLB/BTB ''tiles'') purpose-built for serverless multi-tenancy, not merely a scheduling
  policy over an existing isolation mechanism -- this is judged analogous to the brief''s ''container
  isolation architecture is CORE'' rule extended to microarchitectural cache/TLB partitioning, and is
  flagged for auditor attention as the batch''s second-most aggressive taxonomy call after DockerSSD.
  (3) ''DockerSSD'' was classified CORE as a container-isolation-architecture paper applied to SSD firmware
  (OS-level virtualization plus a ''virtual firmware'' layer embedded in the drive''s own embedded processor)
  even though its full paper text could not be read (IEEE Xplore paywalled); the classification rests
  on a KAIST press release plus a 2025 arXiv extended report by the same authors describing an unambiguous
  Docker/OS-level-virtualization mechanism, so evidence_depth is marked DESIGN (not FULL) and confidence
  MEDIUM rather than HIGH. (4) CXL/disaggregation papers with no multi-tenant or per-VM virtual-abstraction
  claim (StarNUMA, NeoMem, M2NDP/''Low-overhead ... CXL Memory Expanders'', PIM-MMU, ''Demystifying a
  CXL Type-2 Device'', GRIT, RELIEF, ''Data Motion Acceleration'') were all held to DROP (no_virtualization_relation)
  as single-host/single-job resource-placement or data-movement optimizations, consistent with the same
  CXL/disaggregation threshold used in the batch1 calibration file and in census24a/b; LightPool (HPCA
  Industry Track) was the one storage-disaggregation paper that crossed into SUPPORT because it is explicitly
  a cluster-wide pooled resource exposed through a scheduler across nodes, not a single-host optimization.
  (5) ''MINOS'' (SmartNIC-offloaded distributed consistency protocol) and ''GRIT''/''RELIEF''/''Data Motion
  Acceleration'' (single-job multi-accelerator scheduling/placement papers) were held to DROP (keyword_false_positive
  / no_virtualization_relation respectively) despite surfacing under the SmartNIC/DPU and accelerator-sharing
  retrieval keywords, because none of them virtualizes, partitions, or isolates the device among multiple
  tenants -- each uses a fixed hardware target for one workload or protocol. (6) The three ''Best of CAL''
  retrospective-session papers (Quantum TEE, PIM-for-LLM-inference, Computational CXL-Memory) were treated
  as archival-but-non-submission content per the brief''s ''invited/industry-vendor presentation'' exclusion
  category: still classified and recorded when virtualization-relevant (Quantum TEE: CORE; Computational
  CXL-Memory: CONTEXT/access-limited), but excluded from the HPCA 2024 regular-research population count
  and listed in excluded_by_pubtype, with publication_type left as UNKNOWN because no schema enum value
  cleanly names an invited reprint of already-published work. (7) As expected by the batch brief, the
  genuine 2024 CORE yield at these two architecture venues concentrated almost exactly where predicted:
  confidential computing/TEE hardware (Data Enclave, HyperTEE, IvLeague, the Quantum TEE Best-of-CAL reprint)
  and accelerator/CPU partitioning hardware for multi-tenancy (the NPU virtualization paper, STAR, Mosaic),
  with device/IOMMU-style virtualization contributing one strong hit (DockerSSD) and comparatively little
  from plain CXL pooling once papers lacking any multi-tenant virtual abstraction were screened out.'

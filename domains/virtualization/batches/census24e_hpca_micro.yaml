- id: VIRT-MICRO24-01
  title: Hardware-Assisted Virtualization of Neural Processing Units for Cloud Platforms
  title_correction: null
  authors:
  - Yuqi Xue
  - Yiqi Liu
  - Lifeng Nai
  - Jian Huang
  venue: MICRO
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://microarch.org/micro57/program/
  fullpaper_source: https://arxiv.org/abs/2408.04104
  classification: CORE
  classification_note: The paper's entire contribution is a new virtual-NPU (vNPU) abstraction plus an
    ISA extension (NeuISA) and hypercall-based hypervisor/para-virtualized-driver stack for multiplexing
    a physical NPU across cloud tenants -- textbook accelerator virtualization, the exact CORE example
    the brief lists for T6.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T1
  - T9
  physical_resource: NPU (TPUv4-class matrix engines/ME and vector engines/VE)
  logical_abstraction: 'vNPU: a per-tenant virtual NPU with a user-chosen ratio of matrix (ME) and vector
    (VE) engines, exposed to a guest VM via a para-virtualized driver and SR-IOV-style passthrough after
    setup'
  problem: Individual ML inference workloads cannot fully utilize an NPU's matrix and vector engines because
    their demand ratios differ, and existing systems lack fine-grained NPU virtualization, architectural
    support for concurrent multi-tenant execution, or the ability to dynamically schedule around VLIW
    ISA rigidity.
  mechanism: 'NeuISA decouples each VLIW instruction stream into independent micro-Tensor Operators (uTops:
    ME-uTops needing one ME slot plus VE slots, or VE-only uTops) organized into dependency groups; a
    uTop scheduler tracks per-vNPU contexts and dynamically allocates ME/VE slots, harvesting idle compute
    units from under-utilized vNPUs for others; a host-kernel vNPU manager and guest para-virtualized
    driver issue hypercalls for vNPU lifecycle, with SR-IOV PCIe passthrough used for steady-state guest-device
    communication.'
  isolation_mechanism: Hierarchical memory segmentation with fixed-size SRAM/HBM segments (2MB/1GB) and
    address-translation-by-offset; hardware-isolated mode gives dedicated MEs/VEs per vNPU (spatial partitioning),
    software-isolated mode uses temporal sharing with priority-based preemptive scheduling; the IOMMU
    enforces DMA remapping for guest memory isolation.
  multiplexing_mechanism: A compile-time allocator picks each vNPU's ME:VE ratio from profiled workload
    activity ratios (m, v), and at runtime the uTop scheduler harvests idle MEs/VEs from a vNPU that isn't
    fully using its allocation and hands them to another vNPU's ready uTops.
  state_mechanism: On a harvesting context switch, register-file contents and systolic-array partial sums
    are saved to SRAM (256-cycle overhead for a 128x128 array); the vNPU execution table mapping groups
    to uTop code addresses stays on-chip; nothing crosses host/guest boundary except via the para-virtualized
    driver's hypercalls.
  overhead_bottleneck: Context-switch/harvesting preemption overhead (0.01%-10.63% depending on workload
    pair) and NeuISA compilation overhead (typically <1%, up to 8.8% when a matmul partitions its reduction
    dimension).
  primary_tradeoff: Splitting VLIW execution into independently schedulable uTops gains dynamic, harvestable
    NPU multi-tenancy at negligible (0.04% of a TPUv4 chip) hardware cost, but requires a new ISA layer
    (NeuISA) and compiler backend, and only pays off when tenants' ME/VE demand ratios are imbalanced
    enough to leave idle capacity to harvest.
  quantitative_claims:
  - 'p95 tail latency: 4.6x improvement over V10, 1.56x average reduction (TPUv4-class simulator, 4 ME/4
    VE per core, 128x128 systolic arrays, 1.2TB/s HBM, MLPerf v2.1 models)'
  - 'average latency: 1.33x better than PREMA, 1.12x better than V10'
  - 'throughput: up to 1.41x improvement in high-contention collocation'
  - 'ME/VE utilization: 1.26x/1.2x improvement over PREMA'
  - 'LLaMA-13B collocation: 1.6x throughput boost when paired with a compute-intensive workload'
  - 'hardware area cost: 0.04% of a TPUv4 chip'
  - 'context-switch overhead: 256 cycles for a 128x128 systolic array'
  why_useful_for_learning: A clean, modern example of accelerator virtualization built from first principles
    (new ISA + hypervisor stack + IOMMU-backed isolation), directly comparable to GPU MIG/MPS but for
    NPUs, and a strong anchor for the batch's expected 'accelerator partitioning hardware' yield.

- id: VIRT-HPCA24-08
  title: 'Ursa: Lightweight Resource Management for Cloud-Native Microservices'
  title_correction: null
  authors:
  - Yanqi Zhang
  - Zhuangzhuang Zhou
  - Sameh Elnikety
  - Christina Delimitrou
  venue: HPCA
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.hpca-conf.org/2024/program/main.php
  fullpaper_source: https://people.csail.mit.edu/delimitrou/papers/2024.hpca.ursa.pdf
  classification: CONTEXT
  classification_note: Ursa is an analytical replica/CPU-allocation scheduler for existing Kubernetes
    microservices; it consumes container isolation as a substrate and never changes it, matching the brief's
    'generic microservice/Kubernetes scheduling' CONTEXT bucket.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T8
  physical_resource: CPU core
  logical_abstraction: Per-microservice-replica CPU allocations computed from an analytical latency model,
    running over unmodified Kubernetes containers
  problem: ML-driven microservice resource managers need tens of thousands of training samples, cannot
    track frequent service updates, and add inference latency on the critical path.
  mechanism: Decomposes an end-to-end SLA into per-microservice latency budgets via mixed-integer programming

- id: VIRT-MICRO24-02
  title: 'Elastic Translations: Fast virtual memory with multiple translation sizes'
  title_correction: null
  authors:
  - Stratos Psomadakis
  - Chloe Alverti
  - Vasileios Karakostas
  - Christos Katsakioris
  - Dimitrios Siakavaras
  - Konstantinos Nikas
  - Georgios Goumas
  - Nectarios Koziris
  venue: MICRO
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://microarch.org/micro57/program/
  fullpaper_source: https://www.cslab.ece.ntua.gr/~knikas/files/papers/2024-micro-et.pdf
  classification: CORE
  classification_note: Although framed as general TLB-coalescing, the paper explicitly manages the contiguous
    bit in KVM's nested (stage-2) page tables during nested faults and caches coalesced 2D GVA-to-HPA
    translations in the TLB, i.e. it directly improves nested/two-stage address translation under virtualization
    -- this is the pure-virtual-memory threshold trap's exception, not the false positive itself.
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary:
  - T1
  physical_resource: CPU TLB / page-table hierarchy (host and nested/guest)
  logical_abstraction: Intermediate-size (64KiB, 32MiB) coalesced TLB translations, including coalesced
    2D guest-virtual-to-host-physical (GVA->HPA) nested translations
  problem: Modern memory-intensive workloads suffer heavy TLB-miss overhead; classic huge pages (2MiB/1GiB)
    become scarce under memory fragmentation, and the intermediate translation sizes ARMv8-A/RISC-V TLB
    coalescing can offer are left unused, including in virtualized (KVM nested-paging) execution where
    fragmentation is worse.
  mechanism: Elastic Translations (ET) opportunistically sets the ARMv8-A/RISC-V contiguous bit to coalesce
    16 contiguous page-table entries into one TLB entry (Transparent Contig-Bit Management); CoalaPaging
    allocates aligned, contiguous physical pages across page faults without large synchronous allocations;
    CoalaKhugepaged asynchronously promotes regions via migration exploiting partial contiguity; a Leshy
    profiler uses the ARMv8-A Statistical Profiling Extension to sample TLB misses and pick translation
    sizes. Under KVM, the same contiguous-bit management is applied to nested page tables during nested
    faults, letting the TLB cache coalesced 2D GVA->HPA translations.
  isolation_mechanism: N/A for security; nested-paging isolation between guest and host address spaces
    is KVM's existing EPT/stage-2 mechanism, which ET's contiguous-bit management operates within rather
    than replaces.
  multiplexing_mechanism: N/A (single-guest TLB-efficiency mechanism, not resource sharing across tenants).
  state_mechanism: Coalesced translation state lives in ordinary page-table entries (contiguous bits)
    and is cached in the TLB as usual; under virtualization the same state exists at both stage-1 (guest)
    and stage-2 (nested/KVM) page tables.
  overhead_bottleneck: TLB miss rate under fragmentation, when only intermediate-size (not full huge-page)
    contiguity is available.
  primary_tradeoff: Exploiting intermediate translation sizes instead of only 2MiB/1GiB huge pages gains
    large native and virtualized speedups even under heavy fragmentation, at the cost of extra page-table/allocator
    bookkeeping (CoalaPaging/CoalaKhugepaged) and a hardware profiling extension dependency.
  quantitative_claims:
  - 'native, non-fragmented, 32MiB-beneficiary workloads (BTree, SVM, Hashjoin, GUPS): up to 39% over
    THP'
  - 'virtualized execution: 30% average, up to 150% over THP for large workloads (KVM nested paging)'
  - 'under 99% memory fragmentation, 32MiB-beneficiary workloads: 12% average, up to 20% over THP'
  - 'hardware: Ampere Altra N1, 80 cores, 256GiB per socket; workloads: SPEC CPU (astar, omnetpp), PARSEC
    (canneal), custom microbenchmarks'
  why_useful_for_learning: A rare case where a 'pure virtual memory' paper genuinely earns CORE status
    by directly targeting nested/stage-2 page tables under KVM and reporting virtualized-execution results
    -- a template for correctly applying the brief's nested-translation exception rather than reflexively
    dropping every TLB paper at an architecture venue.
  priority: P1

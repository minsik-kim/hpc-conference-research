- id: VIRT-MICRO24-07
  title: 'STAR: Sub-Entry Sharing-Aware TLB for Multi-Instance GPU'
  title_correction: null
  authors:
  - Bingyao Li
  - Yueqi Wang
  - Tianyu Wang
  - Lieven Eeckhout
  - Jun Yang
  - Aamer Jaleel
  - Xulong Tang
  venue: MICRO
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://microarch.org/micro57/program/
  fullpaper_source: https://arxiv.org/pdf/2404.18361
  classification: SUPPORT
  classification_note: STAR improves the one hardware structure (the shared L3 TLB) that NVIDIA's Multi-Instance
    GPU (MIG) leaves unpartitioned across otherwise-isolated GPU instances; per the brief's threshold
    trap it is SUPPORT rather than CORE because it optimizes an existing vGPU partitioning scheme's shared
    resource rather than creating the virtual-GPU abstraction itself.
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary:
  - T2
  physical_resource: GPU L3 TLB (shared across MIG instances)
  logical_abstraction: Dynamically shared TLB entries across multiple MIG-instance base addresses, while
    preserving MIG's per-instance compute/cache/memory-controller isolation
  problem: NVIDIA MIG partitions SMs, local memory, L1/L2 caches and memory controllers per GPU instance,
    but the L3 TLB remains shared, so co-running MIG instances suffer TLB contention and under-utilize
    each entry's 16 sub-entries (each mapping a 64KB page within an aligned 1MB range) before eviction.
  mechanism: STAR allocates 8 sub-entries per base address (supporting 2-address sharing per TLB entry)
    in sequential (contiguous) or stride (interleaved) layouts depending on observed access pattern, dynamically
    switching an entry between shared and non-shared states as demand changes; layout bits and address-identifier
    bits track which base address owns which sub-entries.
  isolation_mechanism: Relies on MIG's existing hardware partitioning of SMs/local memory/caches/memory
    controllers for isolation; STAR only changes how the L3 TLB's own capacity is shared, reverting an
    entry to exclusive access once an instance's demand exceeds its allotted sub-entries.
  multiplexing_mechanism: TLB capacity is multiplexed by letting two MIG instances' base addresses share
    sub-entries within one L3 TLB entry when each uses fewer than 8 of the 16 sub-entries, instead of
    statically partitioning TLB entries per instance.
  state_mechanism: Layout/sharing state (2 layout bits, 16 address-identifier bits, a second base address
    field, 2 metadata bits -- 50 bits total per entry) lives directly in the L3 TLB entry; nothing migrates
    across instances.
  overhead_bottleneck: L3 TLB contention/low sub-entry utilization under multi-instance MIG workloads
    before STAR's dynamic sharing.
  primary_tradeoff: Sharing sub-entries dynamically across MIG instances gains substantial TLB hit-rate
    and performance improvement at only 1.4% L3 TLB area overhead, at the cost of a sequential-check latency
    penalty when looking up a shared entry's second base address.
  quantitative_claims:
  - 'average performance improvement: 30.2% across multi-tenant (multi-instance) workloads, up to 51.3%
    (HHM category)'
  - 'L3 TLB hit-rate improvement: 28.8% average'
  - 'hardware area overhead: 1.4% of the original L3 TLB (22nm)'
  - 'combined with MASK (state-of-the-art dynamic partitioning): additional 17.6% improvement (orthogonal
    gains)'
  why_useful_for_learning: 'A precise illustration of the GPU-sharing threshold trap: it operates entirely
    inside an existing MIG vGPU partition scheme, showing what is left unisolated (a shared L3 TLB) even
    after spatial GPU virtualization and how to fix just that gap without touching the virtualization
    abstraction itself.'
  priority: P1
  related: []
  relations: []
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL

- id: VIRT-MICRO24-15
  title: 'IvLeague: Side Channel-resistant Secure Architectures Using Isolated Domains of Dynamic Integrity
    Trees'
  title_correction: null
  authors:
  - Md Hafizul Islam Chowdhury
  - Fan Yao
  venue: MICRO
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://microarch.org/micro57/program/
  fullpaper_source: http://hafizul-islam.com/files/ivleague.pdf
  classification: CORE
  classification_note: 'The paper''s contribution is fixing a genuine isolation flaw in secure-enclave
    architectures (SGX-style): a single global integrity tree implicitly shares metadata across security
    domains, letting one enclave infer another''s activity; the fix (TreeLings) is itself a new enclave-isolation
    mechanism, matching the brief''s confidential-computing/isolation-architecture CORE criterion.'
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: []
  physical_resource: Off-chip DRAM protected by a secure processor's integrity-tree hardware
  logical_abstraction: 'Per-domain ''TreeLings'': fixed-size (64MB) integrity subtrees with independent
    on-chip roots, replacing one global integrity tree shared by all enclaves'
  problem: Secure processors (e.g. SGX) verify off-chip memory with one global tree-based integrity structure,
    but memory accesses in one enclave unavoidably exercise integrity-tree nodes shared with other domains;
    the paper demonstrates a MetaLeak attack extracting an RSA private exponent from a victim enclave
    at 91.6% accuracy purely from this shared-metadata timing side channel.
  mechanism: The global integrity tree is split into 4,096 fixed-size 64MB TreeLings, each with its own
    on-chip root register, dynamically allocated to security domains so that no domain's memory accesses
    ever touch another domain's tree nodes; IvLeague-Invert maps pages to intermediate tree nodes to shorten
    verification paths, and IvLeague-Pro relocates frequently-accessed pages closer to their TreeLing's
    root.
  isolation_mechanism: Physical partitioning of the integrity-tree metadata itself into per-domain TreeLings
    with independent roots eliminates the shared-node timing channel that MetaLeak exploited; this is
    isolation at the level of a shared security metadata structure, not just of the protected data.
  multiplexing_mechanism: TreeLings are dynamically allocated to domains from a fixed pool of 4,096, so
    the number of domains supported is bounded by TreeLing count rather than by on-chip root-register
    capacity alone.
  state_mechanism: Each domain's on-chip root register anchors its own TreeLing; TreeLing utilization
    stays above 99.5% with 16MB memory overhead for the scheme.
  overhead_bottleneck: 'Shorter/composed verification paths cost extra tree-walk overhead relative to
    one large flat tree, especially for large working sets (Large configuration: -13.2% to -17.4% before
    the Invert/Pro optimizations).'
  primary_tradeoff: Splitting one shared, timing-observable integrity tree into isolated per-domain TreeLings
    closes the MetaLeak side channel entirely, but a naive split costs 2.7-17.4% performance depending
    on working-set size; the Invert/Pro extensions recover this to a net 5-19% speedup over the flat-tree
    baseline.
  quantitative_claims:
  - 'MetaLeak attack: 91.6% accuracy extracting an RSA private exponent via shared integrity-tree metadata
    timing'
  - 'IvLeague-Basic: -2.7%/-5.5%/-17.4% (Small/Medium/Large) vs flat global tree (45nm, 0.355mm2 hardware
    cost)'
  - 'IvLeague-Pro: +5% to +19% (14% average) vs flat global tree'
  - 'TreeLing utilization: >99.5%, 16MB memory overhead'
  why_useful_for_learning: Demonstrates that even a supposedly-isolated enclave architecture can leak
    through a shared, isolation-adjacent hardware structure (the integrity tree), and shows the general
    pattern -- partition the shared metadata itself -- for closing such gaps; directly extends the CORE
    TEE literature (SGX/TDX/SEV, HyperTEE, Data Enclave in this same batch).
  priority: P1
  related:
  - VIRT-MICRO24-04
  - VIRT-HPCA24-01
  relations:
  - type: SAME_BRANCH
    target: VIRT-MICRO24-04
    basis: Both fix a shared/central management or metadata structure (EMS mailbox vs integrity-tree)
      that leaks information across otherwise-isolated enclave/TEE domains on the same physical processor.
  - type: SAME_BRANCH
    target: VIRT-HPCA24-01
    basis: Both extend SGX-class enclave isolation with a new structural mechanism (data enclaves vs TreeLings)
      addressing a limitation of the stock SGX integrity/sharing model.
  existing_corpus_overlap: null

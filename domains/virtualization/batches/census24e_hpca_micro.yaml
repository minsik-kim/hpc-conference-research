- id: VIRT-MICRO24-17
  title: 'Mosaic: Harnessing the Micro-Architectural Resources of Servers in Serverless Environments'
  title_correction: null
  authors:
  - Jovan Stojkovic
  - Esha Choukse
  - Enrique Saurez
  - Inigo Goiri
  - Josep Torrellas
  venue: MICRO
  year: 2024
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://microarch.org/micro57/program/
  fullpaper_source: https://jovans2.github.io/files/Mosaic_MICRO.pdf
  classification: CORE
  classification_note: Mosaic's contribution is a new hardware isolation/partitioning mechanism -- tagged
    'chunks' and per-function 'tiles' carved out of the L2/L2-TLB/LLC/branch-predictor structures, with
    hardware-enforced ownership tags -- purpose-built to give serverless functions genuine microarchitectural-state
    isolation and reuse across context switches; this is resource-partitioning hardware for multi-tenancy,
    the exact CORE pattern the brief flags as an expected 2024 yield area.
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary:
  - T5
  - T8
  physical_resource: CPU core (L2 cache, L2 TLB, LLC, BTB, branch-predictor table)
  logical_abstraction: Per-function 'tiles' -- fixed-size hardware chunks of L2/L2-TLB/LLC/BTB/branch-predictor
    capacity -- that persist a function's microarchitectural state across context switches and are tagged
    so other functions cannot see or evict them
  problem: Serverless functions are small (average 2.9MB LLC footprint vs 15MB available) but oversubscribed
    serverless hosts interleave many functions' executions on the same cores, so frequent context switches
    destroy microarchitectural state before it can be reused, causing up to 4x response-time degradation
    from 'cold' structures; server-class caches/TLBs/branch predictors are simply oversized for this workload
    mix.
  mechanism: MosaicCPU partitions oversized structures into fixed-size physical 'chunks' and assigns collections
    of chunks ('tiles') to individual functions, tagged so each function accesses only its own chunks;
    on a context switch, a preempted function's chunks are put into low-voltage mode instead of being
    evicted, retaining state; MosaicScheduler profiles functions online, models cache/TLB/BTB miss trends
    offline, and uses a random-forest classifier (92% accuracy) to predict per-function optimal tile sizes
    from only 8-10 invocations, then schedules functions preferentially onto cores that already hold their
    tile state.
  isolation_mechanism: Hardware tags on each chunk record which function owns it; a function can only
    access its own tagged chunks, and a coherence-protocol extension with FuncID tags supports the sharing
    needed for multi-threaded or concurrent invocations of the same function without leaking state to
    unrelated functions.
  multiplexing_mechanism: A per-core hardware States Table tracks which functions currently hold state
    in which structure (FuncID, allocated/required chunks, LRU bits); on a miss the LRU function's chunks
    are evicted and reassigned, and idle tiles drop into low-voltage mode rather than being powered normally,
    multiplexing both capacity and power across co-resident functions.
  state_mechanism: A function's microarchitectural state (cache lines, TLB entries, branch-predictor history)
    is retained in its dedicated, tagged chunks across preemptions instead of being flushed; the States
    Table is the on-chip record of where each function's state currently lives.
  overhead_bottleneck: Chunk write-back on eviction (500-600ns average, up to 1.5-2us worst case); voltage-rail
    switching adds a fixed 5-cycle latency per chunk on context switch.
  primary_tradeoff: Hardware-partitioning oversized structures into tagged, retainable per-function tiles
    gains large tail-latency and throughput improvements at oversubscription with only 1.06% core-storage
    overhead, but requires new tagged/partitionable cache-family hardware plus an online profiling and
    scheduling co-design to pick tile sizes correctly.
  quantitative_claims:
  - 'p99 tail latency: 74.6% reduction on average (64.8-79.9% range) vs an Intel-Sapphire-Rapids-class
    baseline (16 cores, 3.6GHz, 2MB L2, 1.875MB LLC slice)'
  - 'average latency: 59.6% reduction'
  - 'sustainable throughput: 225% improvement on average across functions'
  - 'power consumption: 22% average reduction (up to 46% for some functions); 80% improvement in energy-delay
    product'
  - 'datacenter scale (1000+ servers): 10-24% fewer servers needed than a Baseline+Manycore alternative'
  - 'storage overhead: 43.5KB per core (1.06% of core storage, 0.42% core area)'
  - 'profiling cost: 8-10 function invocations to set optimal tile sizes, 92% classifier accuracy'
  why_useful_for_learning: 'A CPU-side counterpart to GPU MIG/vGPU partitioning: shows how to give serverless
    multi-tenancy real hardware isolation and state retention in shared microarchitectural structures,
    directly the kind of accelerator/CPU partitioning-hardware result this batch specifically expected
    for 2024.'
  priority: P1
  related:
  - VIRT-MICRO24-07
  relations:
  - type: SAME_BRANCH
    target: VIRT-MICRO24-07
    basis: Both partition a normally-shared microarchitectural structure (L3 TLB for MIG GPU instances;
      L2/LLC/TLB/BTB for serverless functions) to give genuine per-tenant isolation/state retention within
      an existing multi-tenancy model.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: FULL
  evidence_kinds:
  - preprint
  - official-web
  confidence: HIGH
  notes: Read the author-hosted camera-ready PDF (jovans2.github.io).

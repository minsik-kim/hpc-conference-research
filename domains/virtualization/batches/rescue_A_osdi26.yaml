- id: VIRT-OSDI26-11
  title: "Rethinking Process Snapshots for Near-Warm Serverless Cold Starts"
  title_correction: null
  authors: [Ben Holmes, Baltasar Dinis, Lana Honcharuk, Adam Belay, Joshua Fried]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/holmes
  fullpaper_source: https://www.usenix.org/system/files/osdi26-holmes.pdf
  classification: SUPPORT
  classification_note: "Spice is a process-boundary (not VM-boundary) snapshot/restore mechanism for serverless cold starts. Per the brief's serverless rule, snapshot/restore mechanisms that make isolation cheap can be CORE or SUPPORT; because Spice operates below the VM/container boundary (a LibOS plus a new kernel VMA primitive) rather than virtualizing a machine resource, and is evaluated explicitly as an alternative to VM-boundary snapshot systems, it is classified SUPPORT: it explains the cost structure those CORE VM-snapshot systems pay, without itself being a virtualization abstraction."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T8]
  physical_resource: DRAM
  logical_abstraction: "A disk-resident process image (SHELF file) that the kernel can lazily and out-of-order splice into a fresh process's address space via a single spliceVMA mapping per region, so 'restore' means faulting pages in from arbitrary snapshot-file offsets rather than replaying syscalls or reconstructing many small VMAs."
  problem: "Serverless platforms cannot economically keep every function warm (81% of functions invoked at most once per minute, per cited Microsoft data), so cold starts from disk-resident images must be fast; existing options are process-boundary CRIU (thousands of syscalls to rebuild the address space, plus I/O-hungry tiny VMAs to preserve page ordering) or VM-boundary snapshot systems (REAP, FaaSnap) that capture 1.2-3.4x more state than needed and suffer a guest-scheduler 'deferred housekeeping storm' (22-79% of response time) when the guest's virtual clock jumps on resume."
  mechanism: "The SHELF (Snapshot Hybrid ELF) format stores working-set pages contiguously in access order plus a page-granular interval-tree index (pre-balanced B+ tree) mapping virtual addresses to snapshot-file offsets, decoupling on-disk layout from virtual-memory layout. The spliceVMA kernel primitive is a single VMA whose pages may come from the snapshot file, an underlying file-backed mapping, or be zero-filled, resolved per-page on fault via the (immutable) interval tree -- so a sparse, reordered snapshot presents to the kernel as a handful of contiguous VMAs instead of CRIU's thousands. An asynchronous prefetcher uses a recorded access trace to warm pages ahead of use, and shared file-backed pages (libc, interpreters) are served from the normal page cache rather than duplicated in the snapshot."
  isolation_mechanism: "N/A directly (a checkpoint/restore mechanism for one function instance, not a multi-tenant isolation boundary); the paper explicitly excludes container namespace/cgroup isolation setup from its measurements."
  multiplexing_mechanism: "N/A (single-process restore path), though 25-concurrent-restore scaling reaches 76% of ideal throughput, i.e. the mechanism scales to serve many tenants' cold starts from a shared disk-I/O and page-cache-sharing budget."
  state_mechanism: "Process/runtime state is serialized once into a SHELF file (working-set pages in access order + interval-tree index + serialized LibOS/OS metadata); restoration reconstructs metadata directly (0.9-7.5ms) and lazily faults in pages via spliceVMA, with prefetching overlapping most remaining I/O."
  overhead_bottleneck: "In prior systems, syscall-replay volume (CRIU) or guest-OS deferred housekeeping after a virtual-clock jump (VM-boundary systems) dominates restore latency; Spice's own remaining cost is storage-device read latency, mostly hidden by its asynchronous prefetcher."
  primary_tradeoff: "Process-boundary snapshotting with a kernel-level sparse-splice primitive -> gains 7.5x lower latency than CRIU and 9.5x lower than VM-boundary systems (REAP/FaaSnap), but costs an assumption of stable file-backed-mapping pathnames across restores and a LibOS (Junction) prototype rather than a full in-kernel Linux process-metadata restore path."
  quantitative_claims:
  - "end-to-end warm-invocation latency: 0.6-18ms (Spice) vs 3.6-1197ms (CRIU/REAP/FaaSnap), Python/Node.js/Java functions"
  - "average latency improvement: 7.5x vs CRIU, 9.5x vs VM-boundary systems (FaaSnap/REAP)"
  - "metadata restoration: 0.9-7.5ms (Spice) vs 2.6-749ms (CRIU), a 63-99% reduction"
  - "interval-tree lookup: ~284 cycles vs ~1110 cycles for Linux maple trees at 1000 intervals (cold cache)"
  - "prefetch throughput: 5.2M pages/sec (private), 0.6M pages/sec (shared)"
  - "concurrency: 76% of ideal throughput at 25 concurrent restores; hardware: Intel Xeon Gold 5420+, 28 cores, 128GB RAM, Crucial T705 NVMe (13.6GB/s sequential read)"
  why_useful_for_learning: "A precise account of exactly which costs are specific to the VM boundary (guest scheduler housekeeping after a clock jump, 1.2-3.4x excess captured state) versus the process boundary (syscall-replay volume) -- useful for calibrating whether a CORE VM/container-snapshot paper's overhead is fundamental or boundary-specific."
  priority: P2
  related: []
  relations:
  - {type: CONTRASTS_WITH, target: "REAP / FaaSnap (VM-boundary snapshot restore, cited baselines)", basis: "Spice is evaluated head-to-head against these VM-boundary snapshot systems and attributes part of their overhead specifically to guest-OS virtual-clock-jump housekeeping, a VM-virtualization-specific cost a process-boundary mechanism avoids."}
  - {type: ALTERNATIVE, target: "CRIU (process-boundary checkpoint/restore, cited baseline)", basis: "Both operate at the process boundary; Spice replaces CRIU's syscall-replay reconstruction with a single kernel-level sparse-mapping primitive."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: null

- id: VIRT-OSDI26-13
  title: "DVLA: Dynamic VM Lifetime Aware Scheduling for Drifting Lifetime Distributions and Long-Lived VM Placement Debt"
  title_correction: null
  authors: [Zhengtong Zhang, Zihan Xu, Zhidong Hu, Yanbo Shan, Fei Peng, Suhong Chen, Kaiyuan Shen, Xiangyun Kong, Handu Ding, Bing He, Binda Ma]
  venue: OSDI
  year: 2026
  publication_type: OPERATIONAL_REFERENCE
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/zhang-zhengtong
  fullpaper_source: https://www.usenix.org/system/files/osdi26-zhang-zhengtong.pdf
  classification: SUPPORT
  classification_note: "DVLA is a VM-placement/scheduling policy driven by predicted VM lifetime; it treats live migration purely as an already-available operational lever (a 'migration budget') and never touches virtualization mechanism itself, matching the brief's VMR2L-style precedent for VM placement/rescheduling work landing as SUPPORT."
  drop_reason: null
  taxonomy_primary: T9
  taxonomy_secondary: [T1, T4]
  physical_resource: CPU core
  logical_abstraction: "A VM-to-physical-machine placement policy that groups VMs by predicted lifetime class and scores candidate machines to avoid stranding long-lived, resource-dominant VMs on machines that will otherwise empty out."
  problem: "Static VM-lifetime-aware placement policies degrade as lifetime distributions drift over time and across clusters, and heterogeneous placement policies that scatter long-lived VMs across many machines for load-balancing accumulate 'placement debt': machines that can never fully empty because a few long-lived VMs remain, permanently reducing achievable packing density."
  mechanism: "A hierarchical prediction model gives a fast initial lifetime class at VM creation (static features) and a more accurate offline remaining-lifetime estimate later; Dynamic Affinity Grouping continuously re-derives lifetime-class thresholds via a warmup/stable/observation/cooldown state machine driven by a cosine-distance drift score; a Debt-Aware Placement Policy scores machines by a core-weighted-average lifetime index and applies an asymmetric penalty for placing long-lived VMs onto short-lived-leaning machines; an offline Placement Debt Rectification Engine identifies already-stranded long-lived VMs and migrates them (within production migration budgets) to consolidate them."
  isolation_mechanism: "N/A (a scheduling/placement policy); a VM Risk Aggregation Ratio side metric bounds how many customer VMs a single fault-isolation domain accumulates, as a monitored constraint rather than a new isolation mechanism."
  multiplexing_mechanism: "Physical machine core capacity is packed according to predicted VM lifetime class rather than only current resource demand, so machines are more likely to empty out together."
  state_mechanism: "VM state itself is unaffected; the paper treats live migration as an existing black-box operational primitive used by the rectification engine (averaging 810 VM migrations/day in production) rather than a mechanism it modifies."
  overhead_bottleneck: "Stranded machines -- 25.3% of non-empty machines hosting isolated long-lived VMs before DVLA, reduced to 21.3% after -- are the binding constraint on packing density, not scheduling compute cost (inference is cached at a 90% hit rate, 5ms p99 on miss)."
  primary_tradeoff: "Proactive debt-aware placement plus reactive offline rectification -> gains 0.6-2.0 percentage points of packing density (DVLA's realistic-prediction result already beats prior-state-of-the-art LAVA's oracle upper bound), at the cost of a 0.3pp increase in VM Risk Aggregation Ratio and a hard ceiling because ~40% of VMs are structurally non-migratable."
  quantitative_claims:
  - "packing density improvement: 1.5pp (DVLA, realistic predictions) vs 0.9pp (LAVA) vs 0.6pp (LA-Binary); DVLA's realistic result (1.5pp) exceeds LAVA's oracle upper bound (1.4pp)"
  - "long-lived-VM packing density (PDL): 0.9pp (DVLA) vs 0.4pp (LAVA) vs 0.1pp (LA-Binary)"
  - "production deployment (Alibaba Cloud, 7 months): 1.19pp average PDL gain; stranded machines reduced from 25.3% to 21.3%"
  - "evaluation scale: 23 production clusters, 200-2200 machines each, 12k-800k VM events per cluster, two months of trace data"
  - "robustness: even at 40% recall for long-lived-VM detection, DVLA still achieves 1.02pp PD improvement"
  - "PD-sensitivity improvement: 7.1pp (robustness to demand fluctuation)"
  why_useful_for_learning: "Illustrates, at production Alibaba-Cloud scale, why VM live migration is budgeted as a scarce operational resource ('migration budget', 'net-positive gain requirement') rather than used freely -- direct operational context for why CORE migration-cost papers like M3U (this pass) matter."
  priority: P2
  related: [VIRT-EUROSYS25-02]
  relations:
  - {type: SAME_BRANCH, target: VIRT-EUROSYS25-02, basis: "Both are VM placement/rescheduling papers that treat live migration as a budgeted operational primitive rather than a mechanism under study; VMR2L (EuroSys25) optimizes migration destination choice for CPU defragmentation, DVLA (OSDI26) optimizes initial+corrective placement by predicted VM lifetime -- complementary levers on the same VM-fleet-packing problem."}

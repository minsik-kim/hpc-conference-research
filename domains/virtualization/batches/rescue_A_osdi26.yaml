- id: VIRT-EUROSYS26-13
  title: "Not A DPU in Name Only! Unleashing RDMA-capable DPUs in Multi-Tenant Serverless Clouds with NADINO"
  title_correction: null
  authors: [Shixiong Qi, Songyu Zhang, K. K. Ramakrishnan, Diman Z. Tootaghaj, Hardik Soni, Puneet Sharma]
  venue: EuroSys
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3767295.3769386
  official_url: https://dl.acm.org/doi/10.1145/3767295.3769386
  fullpaper_source: https://shixiongqi.uky.edu/sites/default/files/2025-10/nadino-eurosys26.pdf
  classification: CORE
  classification_note: "NADINO's DPU Network Engine mediates and isolates access to a shared physical RDMA NIC among mutually-untrusting serverless tenants -- exactly the CORE T3 pattern (SmartNIC/DPU-mediated device virtualization), not merely a scheduler over or a consumer of existing RDMA."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T8, T9]
  physical_resource: NIC
  logical_abstraction: "A per-tenant virtual RDMA data plane: each serverless function gets isolated, zero-copy RDMA send/receive access mediated by an off-path DPU-resident network engine, without directly touching physical RDMA queue pairs itself."
  problem: "Serverless platforms cannot let untrusted tenant functions directly own RDMA queue pairs (no isolation); on-path DPU processing adds up to 1.54x data-movement overhead moving data between DPU and host; separate inter-/intra-node memory pools force copies while unified pools need expensive synchronization; and terminating external HTTP/TCP at every node while also speaking RDMA internally duplicates protocol processing (up to 11.4x degradation)."
  mechanism: "A DPU Network Engine (DNE) runs off-path on the DPU and operates RDMA queue pairs on behalf of tenant functions, enforcing per-tenant isolation so tenants never touch the NIC directly; cross-processor shared memory pools live on the host but are mapped into the DPU so the DNE only manages transfers while the RNIC performs the actual DMA; two-sided (send/receive) RDMA plus lock-free token-passing avoids the 'receiver-oblivious' problem of one-sided RDMA without distributed locks or duplicated pools; a DPDK/F-stack-based cluster ingress gateway terminates HTTP/TCP once at the cluster edge and converts to RDMA internally, eliminating redundant protocol processing inside the cluster."
  isolation_mechanism: "Physical separation of trust: tenant functions never hold RDMA queue pairs directly (only the DPU-resident, physically separate DNE does), plus per-tenant isolated memory pools via DPDK file-prefix mechanisms -- isolation enforced by hardware placement (DPU) rather than software checks alone."
  multiplexing_mechanism: "The DNE multiplexes one physical RDMA NIC's queue pairs and bandwidth across many tenant functions, with measured precise bandwidth division matching configured tenant weight ratios."
  state_mechanism: "N/A (a live data-plane mediation mechanism, not a migration/checkpoint mechanism); RDMA memory registrations and queue-pair state are held on the DPU/host and never exposed to guest/function code."
  overhead_bottleneck: "On-path DPU data movement (host<->DPU copy) is the single largest source of avoidable overhead the design removes (up to 1.54x), followed by duplicated ingress protocol processing (up to 11.4x) and one-sided-RDMA synchronization overhead."
  primary_tradeoff: "Off-path DPU-resident mediation of RDMA -> gains hardware-enforced multi-tenant isolation and 20.9x throughput / 21x latency improvement while freeing 7 host CPU cores (at a cost of only 2 DPU cores), but costs tight coupling to NVIDIA DOCA APIs (Comch/mmap) and fixed-size memory pools that limit dynamic buffer resizing."
  quantitative_claims:
  - "end-to-end (Online Boutique): 20.9x RPS improvement vs NightCore (single-node baseline); 2.1x-4.1x vs FUYAO-F (one-sided RDMA); 2.4x-4.1x vs SPRIGHT (shared-memory baseline); 21x latency reduction in optimal configuration"
  - "CPU savings: 7 host cores freed, consuming only 2 DPU cores"
  - "cross-processor shared memory vs on-path mode: 30% RPS improvement, 20%+ latency reduction"
  - "two-sided vs one-sided RDMA: 2.0x-2.8x latency reduction, 2.1x-2.7x throughput improvement"
  - "ingress optimization vs kernel TCP/IP stack: 11.4x RPS gain, 3.4x latency reduction"
  - "testbed: 4 nodes, dual 40-core Intel Xeon Gold 6148, 500GB RAM, 2 worker nodes with NVIDIA BlueField-2 DPUs, ConnectX-6 RNICs, 200Gbps switches"
  why_useful_for_learning: "A concrete, current (2026) example of I/O-device virtualization moving from hardware SR-IOV toward software-defined DPU-mediated isolation, extending the classic passthrough-vs-mediation trade-off (a small DPU-core tax for tenant isolation and host-CPU savings) into the RDMA/serverless setting."
  priority: P1
  related: []
  relations:
  - {type: CONTRASTS_WITH, target: "SPRIGHT / NightCore (intra-node shared-memory serverless data planes, cited baselines)", basis: "Both prior systems rely exclusively on intra-node shared memory and cannot extend across nodes; NADINO's DPU-mediated RDMA plane is evaluated as a distributed extension of the same zero-copy goal."}
  - {type: ALTERNATIVE, target: "FUYAO-F / RMMap (one-sided RDMA serverless data planes, cited baselines)", basis: "These use one-sided RDMA and incur synchronization/copy overhead from the 'receiver-oblivious' problem that NADINO avoids by choosing two-sided RDMA."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: "Full paper read from the author's institutional preprint (shixiongqi.uky.edu/sites/default/files/2025-10/nadino-eurosys26.pdf), also mirrored at github.com/ucr-serverless/NADINO; the ACM DL DOI page itself was not fetched (not needed given the preprint matches the official title/venue)."


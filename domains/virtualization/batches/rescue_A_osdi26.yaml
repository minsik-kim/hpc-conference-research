- id: VIRT-OSDI26-09
  title: "vBOIDs: Taming Chaos via Coarse-grained Scheduling Abstraction for Containers"
  title_correction: null
  authors: [Kaesi Manakkal, Nathan Daughety, Yu Sun, Marcus Pendleton, Hui Lu]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/manakkal
  fullpaper_source: https://www.usenix.org/system/files/osdi26-manakkal.pdf
  classification: CORE
  classification_note: "BOID is explicitly a container-level virtual-CPU-like abstraction (a scheduling unit on which 'at most one [thread] may execute on a physical core', bounding concurrency the way a hypervisor bounds a VM to its vCPU count), and the paper explicitly positions it as an alternative to full virtualization for getting vCPU-like scheduling stability -- a resource-virtualization abstraction, not merely a scheduler policy tweak. This is a borderline call against the brief's CPU-scheduling-is-usually-SUPPORT default; recorded as CORE because of the explicit vCPU-abstraction framing, but a reviewer could reasonably prefer SUPPORT."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T9, T1]
  physical_resource: CPU core
  logical_abstraction: "A BOID: a migratable, serially-executing scheduling unit that consolidates many of a container's kernel threads, giving the container a fixed number N of vCPU-like concurrency slots instead of exposing every individual thread to the Linux scheduler."
  problem: "High-density container deployments let the kernel scheduler make fine-grained per-thread placement/migration decisions across hundreds of threads, causing scheduling thrashing and unpredictable performance -- while cgroup CPU quotas bound time but not concurrent core occupancy (a container with a 2.0-CPU quota can legally burst across 100 cores for 20ms), and manual thread pinning fixes this but sacrifices flexibility."
  mechanism: "vBOIDs groups a container's threads into a small number of BOIDs (at most one thread per BOID may run on a core at a time). A two-level balancer runs inter-core BOID migration (treating BOIDs, not threads, as the atomic unit -- collapsing the search space from O(threads) to O(BOIDs), using cache-hotness checks and lock-free CAS on boid->new_cpu) and, when a BOID becomes an unmigratable 'elephant', delegates to intra-container task balancing that redistributes threads among that container's own BOIDs."
  isolation_mechanism: "Spatial concurrency bounding: a container with N BOIDs can never occupy more than N physical cores simultaneously, giving pinning-like isolation from co-located containers without the throttling bursts cgroup quotas allow."
  multiplexing_mechanism: "BOIDs (not raw threads) are the granularity at which the global CFS-style load balancer distributes container CPU demand across cores, cutting the balancer's per-decision search space and resulting migration rate."
  state_mechanism: "Scheduling state (BOID membership, current core assignment) lives in kernel scheduler structures (~2000 LoC added to fair.c/pelt.c/cgroup.c in Linux 6.15); no VM-level state migration is involved since threads stay in the same kernel."
  overhead_bottleneck: "Inter-core thread-migration churn from per-thread scheduling decisions (e.g. 315-731 migrations/sec/core in default unconstrained containers) is what vBOIDs removes, cutting it to 16-104/sec/core."
  primary_tradeoff: "Consolidating threads into vCPU-like BOIDs -> gains pinning-level cache locality and throughput (up to 3x) without pinning's manual, static configuration, but costs upfront BOID-count provisioning (like vCPU sizing) and reduced benefit for extremely short-lived, highly parallel bursts that cannot amortize placement/cache-warming."
  quantitative_claims:
  - "Hotel Reservation (DeathStarBench, 1k RPS): throughput up to 3x vs default containers; inter-core migrations 16.85/sec/core (vBOIDs) vs 315.47 (default) vs 117.13 (manually pinned)"
  - "Social Network (1k RPS): inter-core migrations 34.22/sec/core (vBOIDs) vs 233.44 (default) vs 243.14 (Firecracker default); throughput at SLO ~5k RPS (vBOIDs) vs ~2k (default) vs ~3k (Firecracker default)"
  - "Kubernetes Online Boutique: scheduler-visible units reduced 359 threads -> 31 BOIDs; p95 latency <500ms (vBOIDs, matching pinned) vs >4000ms (default containers)"
  - "hardware: two-socket Intel Xeon Gold 6430, 64 cores, 64GB DDR5, Ubuntu 22.04 / Linux 6.15.0"
  why_useful_for_learning: "A concrete case study in how far vCPU-like scheduling determinism for containers can go without a hypervisor (contrast directly with Firecracker microVMs in its own evaluation), clarifying what full virtualization's vCPU abstraction buys beyond scheduling stability alone (i.e. kernel isolation)."
  priority: P2
  related: []
  relations:
  - {type: TRADEOFF_PAIR, target: "Firecracker microVMs (cited baseline)", basis: "Paper's own evaluation shows vBOIDs matches or beats Firecracker's scheduling stability/throughput without hypervisor overhead, but explicitly trades away Firecracker's guest-kernel isolation."}
  existing_corpus_overlap: null

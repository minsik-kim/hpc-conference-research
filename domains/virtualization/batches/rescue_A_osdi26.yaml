- id: VIRT-OSDI26-01
  title: "JANUS: Cross-World, Cooperative Nested Virtualization for Secure Containers"
  title_correction: null
  authors: [Jiangshan Lai, Hang Huang, Quan Xu, Zhen Ren, Wenlong Hou, Wei Guo, Jia Rao, Hui Lu, Weidong Han, Jiesheng Wu, Jiang Liu, Naixuan Guan, Yibin Shen, Feng Yu, Xu Wang, Shiqiang Zhang, Zhiheng Tao, Yisheng Xie, Song Wu, Hai Jin]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/lai
  fullpaper_source: https://www.usenix.org/system/files/osdi26-lai.pdf
  classification: CORE
  classification_note: "JANUS's entire contribution is a nested-virtualization architecture (VMFUNC-based EPTP switching, shadow-root page tables, in-guest #VE handling) that splits CPU-event virtualization from memory virtualization across hypervisor levels; the virtualization mechanism is the object of study, not incidental."
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T5, T2]
  physical_resource: CPU core
  logical_abstraction: "A guest hypervisor (L1) that owns CPU-event world-switching for its L2 secure-container VM while ceding all GPA->HPA memory-translation authority to the host hypervisor (L0) -- cooperative rather than fully-nested virtualization."
  problem: "Secure containers (e.g. Kata Containers) create nested virtualization (L0 host KVM, L1 guest hypervisor, L2 container VM); existing designs entangle CPU and memory virtualization across all three levels, forcing frequent L2->L1->L0 cross-world synchronization and severe overhead for memory-access-heavy workloads."
  mechanism: "JANUS confines all L2 privileged-event handling to a lightweight in-L1 switcher using VMFUNC-based EPTP switching (trap-free), a shadow-root page-table mechanism letting L1 validate L2 page-table-root changes while allowing direct subordinate-table updates, and Intel #VE-based in-guest EPT-violation handling so L1 resolves most second-level faults with only one lightweight L0 hypercall (KVM_HC_JANUS_OPS)."
  isolation_mechanism: "Shadow PGD entries are the only path by which L2 can alter the page-table root the hardware MMU trusts, preventing a malicious L2 from corrupting the switcher; L0 remains the sole owner of physical-memory mapping validity."
  multiplexing_mechanism: "Nested EPT hierarchies (EPT0->1 for L1, EPT0->2 for L2) let L0 multiplex host physical memory across many L1/L2 pairs while L1 transparently multiplexes CPU-event handling for its own L2 without L0 involvement in the common case."
  state_mechanism: "World-switch state (registers, event vectors) lives entirely in the L1 switcher's per-CPU area; GPA->HPA mapping state lives in L0-owned EPT tables updated via hypercalls triggered by #VE."
  overhead_bottleneck: "Cross-world synchronization cost: legacy nested KVM needs a full L2->L0->L1->L0->L2 round trip per world switch (16,002 cycles measured) and re-walks EPT on every second-level fault (57,840 cycles), dominating memory-access-heavy container workloads."
  primary_tradeoff: "Separating CPU-event handling (kept in L1) from memory translation (kept in L0) -> gains near-PVM world-switch latency and near-native container overhead, but costs added shadow-root bookkeeping and reliance on hardware VMFUNC/#VE support."
  quantitative_claims:
  - "world-switch latency: 2,700 cycles (Kata-JANUS) vs 2,681 (Kata-PVM) vs 16,002 (Kata-KVM), 1M hypercalls, Intel Xeon Platinum 8475B, 192 vCPU/384GB host"
  - "mapping construction overhead: 26,960-28,100 cycles (JANUS) vs 19,266 (PVM) vs 57,840 (KVM)"
  - "multi-process apps (Ebizzy, UnixBench, Kbuild): Kata-JANUS 339.7% faster than Kata-PVM on average, 51.8% faster than Kata-KVM at 8 vCPUs"
  - "Redis throughput: Kata-JANUS 9.7% higher than Kata-PVM, 45.1% higher than Kata-KVM (2-12 clients)"
  - "dirty-page tracking (PML): Kata-KVM shows 175.5% average overhead vs untracked; Kata-JANUS near-identical to untracked (1-8GB memory)"
  - "production deployment (Alibaba Cloud Flink): PVM adds ~30% (C++)/~20% (Java) query-time overhead vs RunC; Kata-JANUS adds <5% overhead vs RunC"
  why_useful_for_learning: "Shows the concrete mechanics (VMFUNC EPTP switching, shadow page tables, #VE) of why nested virtualization for secure containers is expensive, and how splitting CPU vs memory virtualization responsibility across levels removes most cross-world exits."
  priority: P0
  related: [VIRT-EUROSYS26-03]
  relations:
  - {type: LAYER_ABOVE, target: VIRT-EUROSYS26-03, basis: "JANUS is a cooperative nested-virtualization architecture built on the same hardware-assisted nested-virtualization primitives (VMCS/VMCB handling, EPT) that NecoFuzz fuzzes for correctness."}
  - {type: ALTERNATIVE, target: "PVM (software-based nested virtualization, cited baseline)", basis: "JANUS is evaluated head-to-head against PVM and standard nested KVM as the two existing nested-virtualization approaches for Kata Containers."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Retrieved via WebSearch hit directly on usenix.org/conference/osdi26/presentation/lai and the official PDF osdi26-lai.pdf, resolving a prior agent's 'truncated technical-sessions page' access failure. No DOI is listed on the USENIX page (USENIX OSDI proceedings entries here carry ISBN 978-1-939133-55-7, pages 1015-1031, but not a per-paper DOI)."

- id: VIRT-OSDI26-02
  title: "M3U: Scalable Kernel Memory Management for Efficient Post-copy Live Migration of High-end Virtual Machines"
  title_correction: null
  authors: [Yizhe Xu, Yuan Tao, Zhibin Zhang, Kang Yan, Chao Zhang, Shuo Shi, Zongpu Zhang, Xu Huan, Yibin Shen, Xudong Zheng, Jiesheng Wu, Jian Li, Haibing Guan]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: "https://www.usenix.org/conference/osdi26/presentation/xu-yizhe (inferred: USENIX presentation-page slugs match PDF slugs for every other OSDI26 paper confirmed in this pass; not independently fetched)"
  fullpaper_source: https://www.usenix.org/system/files/osdi26-xu-yizhe.pdf
  classification: CORE
  classification_note: "M3U's contribution is a kernel-MMU scalability mechanism purpose-built for post-copy live migration of large VMs (dirty-page tracking, page-table consistency, IOPF handling) -- live migration mechanism itself is the object of study."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T2, T3]
  physical_resource: DRAM
  logical_abstraction: "A guest-transparent post-copy live-migration substrate for high-end (>=64 vCPU, >=256GB) VMs whose kernel-side MMU operations (dirty-page tracking, page-table updates, IOPF handling) scale via parallel worker threads instead of serializing under global locks."
  problem: "Post-copy live migration of high-end VMs is dominated by kernel MMU lock contention: dirty-page (un)map operations serialize on PMD/PUD locks (a 128GB working set triggers ~32M unmap ops), cross-table (HPT/EPT/IOPT) consistency locking limits paging efficiency to 9.2% of network bandwidth, and pass-through-device I/O page faults (IOPF) cost ~3x a vCPU page fault and stall I/O queues."
  mechanism: "M3U replaces HPT map/unmap with lightweight Present-bit permission flagging over statically-allocated physical memory partitioned into lock-free 1GB regions (parallel dirty-page registration); decouples page-data copying from page-table consistency maintenance via a separate Post-copy Virtual Address space and a single dedicated page-table-update thread serving 6-8 parallel push streams (decoupled userfault pipeline); and proactively pre-installs VirtIO virtqueue state before VM resumption to eliminate descriptor IOPFs (device-state pre-installation)."
  isolation_mechanism: "N/A (guest-transparent single-VM migration mechanism, not a multi-tenant isolation boundary)."
  multiplexing_mechanism: "Multiple concurrent data-push streams (6-8) share the 100Gbps post-copy network allocation while a single page-table-update thread serializes only HPT/EPT/IOPT metadata writes, avoiding per-stream lock contention."
  state_mechanism: "VM memory state moves via direct post-copy page pushing/demand paging over a DPU-backed 200Gbps link; device state (VirtIO virtqueues, <=671MB) is proactively transmitted (<=300ms at 100Gbps) before resume so guest I/O queues are already valid on the target."
  overhead_bottleneck: "Kernel-side lock contention in dirty-page tracking and cross-page-table consistency maintenance, not raw network bandwidth (baseline achieves only 9.2% of available bandwidth)."
  primary_tradeoff: "Parallelizing dirty-page registration and decoupling data-copy from page-table updates -> gains up to 89.6% shorter post-copy duration and 47.0% less downtime, but leaves a residual 1.5% of IOPFs that cannot be eliminated without violating guest transparency, and CPU-state migration overhead is unchanged (hardware-specific QEMU-KVM path)."
  quantitative_claims:
  - "downtime reduction: up to 47.0% vs community QEMU 8.2/Linux 4.19 baseline, 64 vCPU/256GB VM"
  - "post-copy completion time reduction: 85.8-89.6% vs baseline; 33.4-55.6% with a single stream"
  - "paging efficiency: 7.6-8.3x vs 4KB baseline with 6 streams; 2.6-3.6x higher than TDP MMU with 2MB pages"
  - "IOPF reduction: 98.5%, down to 0.2-3.8 IOPFs per migration vs hundreds in baseline"
  - "YCSB p99 latency: 1.8-4.9x lower than 2MB baseline, 8.3-14.5x lower than 4KB baseline"
  - "hardware: dual-socket Intel Xeon 8369B, 512GB DDR4, DPU card 200Gbps, 100Gbps vNIC passthrough; default VM 64 vCPU/256GB"
  why_useful_for_learning: "Concretely shows why post-copy live migration of large VMs is bottlenecked by kernel MMU lock scalability rather than network bandwidth, and how decoupling dirty-tracking, data-copy, and device-state transfer into independently parallel paths fixes it."
  priority: P1
  related: [VIRT-EUROSYS26-04]
  relations:
  - {type: SAME_BRANCH, target: VIRT-EUROSYS26-04, basis: "Both are 2026 live-migration papers; M3U addresses post-copy kernel-MMU scalability for large VMs, complementary to the EuroSys paper's cross-processor migration feasibility problem."}
  - {type: CONTRASTS_WITH, target: VIRT-SOSP25-01, basis: "M3U migrates a paravirtual (VirtIO) device's I/O-fault-visible state via proactive virtqueue pre-installation; Device-Assisted Live Migration of RDMA Devices solves the harder case of migrating truly opaque hardware device state for RDMA passthrough."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Author list and page numbers (osdi26-contents.pdf) confirmed the paper is real; full text read from usenix.org/system/files/osdi26-xu-yizhe.pdf (this exact URL returned the paper's content, confirming the slug). The presentation-page URL was not independently fetched (inferred from the confirmed slug pattern)."

- id: VIRT-OSDI26-03
  title: "Compaction-Free Memory Defragmentation for Virtualization via Infinite Guest Physical Address Space"
  title_correction: null
  authors: [Peixin Zeng, Hao Huang, Yanqi Pan, Wen Xia, Darong Yang, Jiahao Chen, Nan Zhang]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/zeng
  fullpaper_source: https://www.usenix.org/system/files/osdi26-zeng.pdf
  classification: CORE
  classification_note: "The paper's entire contribution is a guest-physical-address-space virtualization technique (decoupling GPA from HPA to make GPA space effectively infinite) that eliminates guest-visible memory compaction for hypervisor-managed VMs -- squarely T2 memory virtualization."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T1]
  physical_resource: DRAM
  logical_abstraction: "A guest physical address space treated as (nearly) infinite/sparse, so huge-page-friendly contiguity can always be manufactured by remapping GPA->HPA rather than by moving guest data (InfiniDefrag)."
  problem: "Guest OSes reuse host-side compaction techniques that assume a small, fixed GPA space, so recovering huge pages under fragmentation requires expensive page relocation (up to 51% throughput drop, 102% latency increase in YCSB-Redis under extreme fragmentation); unmovable/pinned pages further cap what compaction can recover."
  mechanism: "InfiniDefrag's Infinite Address Manager lets the guest trade fragmented base pages for freshly-mapped contiguous GPA blocks (via a VirtIO-communicated Memory Trade, a bitmap-based lock-free Fast Reclaim, and a memory-hotplug-based Guest Extender that pre-reserves 96GB at boot); the Host Memory Guard performs Self-Hosted Remap (direct page remapping bypassing the buddy allocator, ~1us vs ~270us for mremap) and Batch Unmapping for host huge pages; a Scalability Optimizer adds lock-free atomic bitmap updates and delayed TLB flushes for multi-thread/multi-VM scaling."
  isolation_mechanism: "The Host Memory Guard enforces each VM's memory quota during remap so one VM's GPA expansion cannot claim another VM's host memory."
  multiplexing_mechanism: "Host physical memory is multiplexed across VMs via per-VM GPA->HPA remapping rather than static allocation; a hybrid-paging mode keeps performance-critical expanded regions as host huge pages while cold fragments stay on host base pages."
  state_mechanism: "Fragmentation-tracking state (2-bit-per-page bitmap, ~1.6% memory overhead) lives in guest kernel memory; GPA->HPA remap state lives in host KVM/QEMU EPT structures updated via a Page Dispatcher."
  overhead_bottleneck: "Compaction bandwidth: Linux THP achieves only 0.91GB/s of contiguous-memory generation; InfiniDefrag's fast-reclaim+self-hosted-remap path reaches ~20GB/s (~19x)."
  primary_tradeoff: "Treating GPA as infinite -> eliminates guest-side compaction and reaches near-fragmentation-free throughput, but costs page-metadata memory that grows linearly with GPA size and a (currently unbounded, ~100+-year-horizon) risk of exhausting the 57-bit address space; host-side compaction is still needed for host huge pages under multi-VM contention."
  quantitative_claims:
  - "throughput vs Linux THP under extreme fragmentation: 21-105% improvement (YCSB-Redis 21%, Graph500 105%), dual-socket Intel Xeon Gold 6330, QEMU 8.2.94/Linux 6.10.0 KVM host, 16 vCPU/64GB Ubuntu 20.04 guest"
  - "defragmentation bandwidth: ~20GB/s (InfiniDefrag) vs 0.91GB/s (Linux THP compaction), ~19x"
  - "page-table-walk cycles: 30-50% reduction vs Linux THP and competitors"
  - "huge-page allocation coverage under extreme fragmentation: ~90-95% of ideal (InfiniDefrag) vs 0-40% (LLFREE/CBMM) vs 50-75% (Linux THP variants)"
  - "CPU overhead: 4.0-4.2 cores (InfiniDefrag) vs 4.4-4.8 (Linux THP) vs 4.6-4.9 (LLFREE)"
  - "baseline degradation without InfiniDefrag: up to 51% throughput drop / 102% latency rise, YCSB-Redis"
  why_useful_for_learning: "Makes explicit how the guest-physical/host-physical address indirection that virtualization already provides can be exploited to sidestep a hard OS problem (memory compaction) entirely, rather than optimizing the compaction algorithm itself."
  priority: P1
  related: [VIRT-SOSP25-02]
  relations:
  - {type: CONTRASTS_WITH, target: VIRT-SOSP25-02, basis: "Demeter (SOSP25-02) delegates tiered-memory hot/cold page management fully into the guest at 2MB granularity; InfiniDefrag instead keeps defragmentation host-transparent by exploiting an oversized GPA space, a different point on the guest/host memory-management delegation spectrum."}
  - {type: ALTERNATIVE, target: "vMitosis (NUMA-aware defragmentation, cited related work)", basis: "Paper positions vMitosis as orthogonal (page-table-locality-focused) and suggests its own memory-trade mechanism could itself be made NUMA-aware."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Retrieved via a direct WebSearch hit on usenix.org/conference/osdi26/presentation/zeng and the full PDF osdi26-zeng.pdf; internal system name is InfiniDefrag."

- id: VIRT-OSDI26-04
  title: "Inside Out: A Paradigm Shift In VM Introspection"
  title_correction: null
  authors: [Dufy Teguia, Louis Duval, Teo Pisenti, Kahina Lazri, Daniel Hagimont, Thomas Pasquier, Renaud Lachaize, Alain Tchana]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/teguia
  fullpaper_source: https://www.usenix.org/system/files/osdi26-teguia.pdf
  classification: CORE
  classification_note: "VM introspection is an explicit CORE keyword; GOODKIT's contribution is a new hypervisor-adjacent introspection architecture (colocated observer VMs joining the target's kernel locking protocol) rather than an application that merely consumes VMI."
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T7, T2]
  physical_resource: CPU core
  logical_abstraction: "An observer, itself a lightweight guest VM colocated with the target under the same VMM, granted native-speed read access to the target's live kernel memory/state through lock-aware coherence, without pausing the target or enlarging the hypervisor TCB (GOODKIT)."
  problem: "Existing live VM introspection (LibVMI-style) needs heavy target-VM pausing to get a consistent view, causing 5.15x-37.6x slowdowns and poor scalability with monitoring frequency; alternatives either embed observers in the hypervisor (larger TCB, no multi-observer isolation), run them in separate VMs needing hypervisor changes, or run in-guest (forfeiting isolation)."
  mechanism: "GOODKIT deploys observers as ordinary guest OSes under the same VMM instance as the target. A kernel module (GKMODULE) in each observer acquires the same lock (spinlock/RWlock/mutex, via MCS-queue impersonation of vCPU0/idle-thread context) that protects the target's kernel data structure before reading it, so concurrent target updates serialize naturally against observer reads instead of requiring a global pause. GKPROBE hooks VMM-side I/O/hypervisor events and streams them to observers via VirtIO virtqueues/hypercalls. Seven dedicated address-translation functions convert target-guest-virtual to observer-virtual addresses. A mutualizer observer centralizes and deduplicates redundant introspection work across multiple client observers."
  isolation_mechanism: "Each observer is a full guest VM under standard hypervisor accounting/isolation, so a compromised or crashing observer cannot directly corrupt the target or other observers, unlike hypervisor-embedded VMI which enlarges the TCB."
  multiplexing_mechanism: "Multiple observers can inspect the same target concurrently; a mutualizer observer performs shared introspection work once and redistributes results, reducing per-observer lock contention as observer count grows."
  state_mechanism: "No target state is copied wholesale; observers read live target memory in place (translated via 7 address-translation functions) while holding the same lock the target's own writers would hold, maintaining consistency without snapshotting."
  overhead_bottleneck: "Global VM-pause cost is the bottleneck in prior LibVMI-style systems; GOODKIT's own bottleneck is lock-acquisition/impersonation overhead per introspected event and boot-time cost scaling with colocated observer count (1.57x boot-time at 5 observers)."
  primary_tradeoff: "Fine-grained lock-aware synchronization instead of global pausing -> gains up to 110x lower introspection latency and 99% capture rate at high modification rates, but costs a lock-based consistency model with no current RCU support, and a faulty observer can disrupt the target if it crashes while impersonating a held lock."
  quantitative_claims:
  - "single-observer overhead: at most 1.06x slowdown on OpenSSL vs 5.15x-37.6x for LibVMI (Phoronix workloads)"
  - "introspection latency: up to 110x faster on microbenchmarks; 17x faster for lock acquisition vs pause/resume"
  - "capture rate: 99% at 500 modifications/sec vs LibVMI dropping to 0.16% above 200 modifications/sec"
  - "boot-time overhead: 1.08-1.11x with one observer, up to 1.57x with five observers"
  - "ransomware detector (DefPunk, trained on RanSAP): F1 = 0.76"
  - "hardware: 16-core Intel Xeon Silver 4215, 256GB RAM, Firecracker 1.5, Alpine Linux 5.10.198 guests, KVM/Ubuntu 20.04"
  why_useful_for_learning: "Reframes VM introspection from a hypervisor-privileged snooping problem into a guest-to-guest, lock-respecting concurrency problem -- the key conceptual move needed to make live (non-paused) VMI practical without hypervisor modification."
  priority: P1
  related: []
  relations:
  - {type: ALTERNATIVE, target: "LibVMI (pause-based VMI, cited baseline)", basis: "GOODKIT is evaluated head-to-head against LibVMI across rootkit/ransomware/liveness workloads as the dominant prior live-VMI approach."}
  - {type: CONTRASTS_WITH, target: "BlueGuard (SmartNIC-based VMI, cited related work)", basis: "Paper contrasts GOODKIT's hypervisor-colocated-VM approach against BlueGuard's specialized-SmartNIC-hardware approach to the same introspection problem."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Retrieved via a WebSearch hit on the UBC Security & Privacy Group publication page and the USENIX presentation page (usenix.org/conference/osdi26/presentation/teguia) plus the full PDF; internal system name is GOODKIT."

- id: VIRT-OSDI26-05
  title: "Blowfish: Elastic Virtual Machine Memory for Disaggregated Memory"
  title_correction: null
  authors: [Yulong Zhang, Yilong Luo, Diyu Zhou, Quan Chen, Quanxi Li, Mosong Zhou, Lei Zhu, Senbo Fu, Qian Peng, Huimin Cui, Xiaobing Feng, Tao Xie, Chenxi Wang]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/zhang-yulong
  fullpaper_source: https://www.usenix.org/system/files/osdi26-zhang-yulong.pdf
  classification: CORE
  classification_note: "Blowfish builds a guest-elastic VM-memory abstraction over an RDMA-disaggregated far-memory backend (EPT-only reclaim/restore, no GPT/IOPT changes) -- exactly the brief's condition for CORE disaggregated-memory work: a virtual resource abstraction over the pool, not just pooling."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T9]
  physical_resource: DRAM
  logical_abstraction: "Elastic VM memory: the guest keeps its full memory footprint logically, while cold/free pages are transparently backed by RDMA-attached far memory and reclaimed/restored at microsecond granularity without the guest or its passthrough devices ever seeing a page-table change."
  problem: "Cold-memory rebalancing under VM memory overcommitment breaks on Transparent Huge Pages: THP causes 'unfair hotness' (a 2MB page looks hot from one touched subpage) and 'hot bloat' (a few hot subpages block reclaiming an otherwise-cold huge page); prior systems also modify guest/IO page tables on every reclaim/restore, which is slow."
  mechanism: "A guest-level hotness tracker built on Linux MGLRU adds Fair MGLRU (incremental, not jump-to-youngest, promotion for huge pages) and a Subpage Tracker (periodic PMD->PTE splitting of candidate huge pages for 100ms to sample subpage access bits, then re-coalescing) to accurately classify cold huge pages despite THP; the host-side backend then reclaims purely by invalidating the EPT entry, transferring the page to RDMA far memory, and encoding the far-memory address in unused EPT bits -- restoring on fault with a single RDMA read and one EPT update, touching neither guest page tables nor I/O page tables."
  isolation_mechanism: "N/A directly (single-VM memory-elasticity mechanism); guest cooperation is validated against actual EPT mappings so a misbehaving/uncooperative guest falls back to host-driven swapping rather than corrupting state."
  multiplexing_mechanism: "Host physical memory freed from one VM's cold pages is returned to a shared pool and reused by co-located VMs (multi-VM rebalancing), regulated by a free-memory watermark and PSI-based pressure throttling."
  state_mechanism: "Reclaimed page content is transferred via RDMA to a remote memory server (Hermit-derived backend, <5us for a 4KB page over 100Gbps InfiniBand vs ~200MB/s disk); the far-memory address is stashed directly in unused EPT PTE bits so no separate metadata table or GPT/IOPT update is needed."
  overhead_bottleneck: "EPT management dominates per-page reclaim/restore latency (41-57% of the total), ahead of the RDMA data transfer itself."
  primary_tradeoff: "Decoupling guest-side hotness tracking from host-side data movement (vs Demeter's fully guest-delegated tiering) -> gains 53-60% lower per-operation latency and subpage-level precision, but costs a guest-cooperation assumption (with a correctness-preserving but slower uncooperative fallback) and empirically-tuned tracker parameters (100ms epoch, 32-page batch, 20% threshold)."
  quantitative_claims:
  - "reclaim/restore latency: 14.5us / 9.8us (Blowfish) vs 36us / 21us (HyperAlloc-4K-G), 53%/60% lower"
  - "reclamation ratio at <=5% slowdown: 1.6x-6.1x higher than HyperAlloc variants across Memcached/Cassandra/GAPBS/GraphChi/Liblinear/KMeans/602.gcc_s workloads"
  - "memory reclaimable at <5% degradation: 33-49% of application memory without THP, dropping to 16-25% with THP enabled"
  - "multi-VM rebalancing degradation: 1.06x-1.25x (Blowfish) vs substantially larger for baselines, six workload pairs"
  - "hardware: two servers, dual Intel Xeon Gold 6342, 256GB each, 100Gbps Mellanox ConnectX-5 InfiniBand"
  - "code: ~6000 LoC added to Linux 6.1 (host), ~1700 LoC to QEMU 8.2.1 (guest)"
  why_useful_for_learning: "Shows concretely how VM memory-overcommitment mechanisms (ballooning-style guest cooperation, EPT manipulation) extend onto RDMA-disaggregated far memory, and why THP forces a rethink of hotness tracking at subpage granularity."
  priority: P1
  related: [VIRT-SOSP25-02, VIRT-EUROSYS26-08]
  relations:
  - {type: CONTRASTS_WITH, target: VIRT-SOSP25-02, basis: "Demeter delegates the full tiering pipeline (including data migration) to the guest at 2MB granularity requiring GPT/IOPT updates; Blowfish keeps only hotness tracking in the guest and does all data movement/EPT-only reclamation on the host at subpage granularity."}
  - {type: SAME_BRANCH, target: VIRT-EUROSYS26-08, basis: "Both address memory tiering/partitioning for multi-tenant clouds; MTTM partitions fast-tier capacity across tenants while Blowfish reclaims/restores cold pages to a far-memory tier for a single VM -- complementary layers of the same CXL/RDMA-disaggregated-memory stack."}
  - {type: USES_MECHANISM_FROM, target: "Hermit (RDMA far-memory backend, cited)", basis: "Blowfish explicitly builds its RDMA data-transfer path on Hermit's paging backend, adding VM-specific EPT-only reclamation and guest hotness tracking on top."}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web, code]
  confidence: HIGH
  notes: "Presentation slug found via the paper's own GitHub repo (github.com/ICTPLSys/blowfish), whose description linked to usenix.org/conference/osdi26/presentation/zhang-yulong; full author/affiliation list confirmed from osdi26-contents.pdf."

- id: VIRT-OSDI26-07
  title: "μShell: A Microkernel-based FPGA Shell Architecture"
  title_correction: null

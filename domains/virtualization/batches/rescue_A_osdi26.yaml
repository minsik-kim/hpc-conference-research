- id: VIRT-OSDI26-08
  title: "Virtualizing eBPF with Late-Binding"
  title_correction: null
  authors: [Jing Zhang, Xiaguannan Song, Dong Du, Yubin Xia, Binyu Zang, Haibo Chen]
  venue: OSDI
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: UNKNOWN
  official_url: https://www.usenix.org/conference/osdi26/presentation/zhang-jing
  fullpaper_source: https://www.usenix.org/system/files/osdi26-zhang-jing.pdf
  classification: CORE
  classification_note: "vBPF creates eBPF namespaces -- a genuine multi-tenant virtualization boundary for a kernel-extension mechanism (late-bound program-to-hook attachment plus compiler-assisted per-tenant state isolation) -- analogous to the syscall-interposition isolation boundaries the brief marks CORE, not merely a scheduling or filtering policy over existing eBPF."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T9]
  physical_resource: CPU core
  logical_abstraction: "An eBPF namespace: a per-tenant virtualized view of a shared kernel hook (interrupt, syscall, XDP, struct_ops) with its own program set and privately-instantiated copies of any kernel global state the program touches, resolved to the physical hook only at run time (late binding)."
  problem: "eBPF's static-binding model rigidly couples logical eBPF programs to physical kernel hooks and assumes a single trust domain, so when multiple mutually-distrusting tenants attach programs to the same hook they get O(N) linear dispatch overhead, no state isolation for eBPF-touched kernel globals, and no clean way to attribute interrupt-driven events (e.g. XDP packets) to the tenant that owns them."
  mechanism: "The Sniffer attributes interrupt-driven events to tenants (recording resource-to-namespace mappings during process-context operations, then looking them up context-free during interrupts, via network/request/task sniffer variants). The Dispatcher replaces linear program traversal with O(1) hash-indexed per-namespace lookup plus a path-flattening compile-time optimization. A compiler-assisted state-isolation framework statically flags (default-deny) any eBPF helper touching global kernel state, then either instantiates it per-namespace (declarative API) or maintains copy-on-write per-tenant overlay patches applied atomically on namespace context switch (using BTF metadata). eBPF namespaces are first-class, hierarchical, and bound to Linux namespaces (clone/unshare/setns)."
  isolation_mechanism: "Per-namespace program dispatch (no cross-tenant program execution by construction) plus per-tenant state instances/overlays for any kernel global an eBPF program can mutate, enforced by a static default-deny analyzer at compile/verification time."
  multiplexing_mechanism: "Many tenants' eBPF programs share the same physical kernel hook; the Dispatcher's O(1) namespace-keyed lookup means adding tenants does not degrade any other tenant's dispatch latency (flat vs native eBPF's O(N) degradation)."
  state_mechanism: "Kernel-global state touched by eBPF helpers is represented either as per-namespace instances (declarative API) or as short-lived copy-on-write overlay patches captured/applied/restored around each namespace's execution window; overlays are reclaimed once the underlying kernel object (e.g. sk_buff) is freed."
  overhead_bottleneck: "Native eBPF's linear program-array traversal under multi-tenant contention (O(N) degradation with attached-program count) is the bottleneck vBPF removes; vBPF's own overhead is dominated by Sniffer resolution + namespace/program lookup (~2.1% of total execution time for a co-located tcx program)."
  primary_tradeoff: "Late-binding namespace dispatch and per-tenant state isolation -> gains O(1) cross-tenant dispatch (54x speedup over native eBPF at 160 attached programs) and eliminates cross-tenant interference (1.4x-3.9x lower same-hook latency), at a cost of 2.5-5.2% co-located overhead vs native eBPF and growing (but reclaimable) per-tenant state-overlay memory."
  quantitative_claims:
  - "co-located overhead vs native eBPF: 2.51-5.18% (lmbench syscall/select/fork/network), Intel Xeon Gold 6330, Linux 6.12"
  - "cross-tenant isolation gains vs native eBPF sharing one namespace: 1.4x-3.9x lower latency depending on operation"
  - "multi-program contention at 160 attached programs: vBPF cross-tenant O(1) throughput, 54x speedup vs native eBPF's O(N) degradation"
  - "PostgreSQL with background eBPF monitoring: 29% higher throughput, 23.6% lower latency vs native eBPF"
  - "Apache httpd with netobserv-ebpf-agent monitoring: up to 2.8x throughput speedup vs native eBPF"
  - "state-overlay optimization: 31.4x lower overhead vs a naive full-object-copy baseline"
  why_useful_for_learning: "A clean, non-CPU/non-memory example of the same virtualization pattern (multiplex one physical mechanism among mutually-distrusting tenants via a mediating namespace layer) applied to a kernel-extension technology rather than a machine resource."
  priority: P2
  related: []
  relations:
  - {type: CONTRASTS_WITH, target: "cgroup-eBPF / KrakenGuard (cited related work)", basis: "Paper's own comparison table shows cgroup-eBPF and KrakenGuard provide load-time admission control or partial isolation but neither combines enforced dispatch isolation with per-tenant state isolation the way vBPF does."}
  existing_corpus_overlap: null

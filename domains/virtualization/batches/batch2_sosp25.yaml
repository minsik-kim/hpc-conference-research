- id: VIRT-SOSP25-02
  title: "Demeter: A Scalable and Elastic Tiered Memory Solution for Virtualized Cloud via Guest Delegation"
  title_correction: null
  authors: [Junliang Hu, Zhisheng Hu, Chun-Feng Wu, Ming-Chang Yang]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764801
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://zenodo.org/records/16912877
  classification: CORE
  classification_note: "The system's subject is the guest/hypervisor division of labour for tiered VM memory: tiering decisions are delegated into the guest instead of being driven by the hypervisor, which is a memory-virtualization architecture question, not an application question."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T1, T9]
  physical_resource: DRAM
  logical_abstraction: "Guest-visible elastic tiered memory: the VM sees a memory pool whose fast/slow tier placement it manages itself under hypervisor-granted capacity."
  problem: "Hypervisor-driven tiered memory management for VMs cannot see guest access semantics and does not scale or adapt elastically across many co-located VMs."
  mechanism: "Demeter delegates hot/cold page classification and promotion/demotion to the guest kernel while the hypervisor retains capacity arbitration; the artifact ships patched Linux guest kernels plus a patched Cloud Hypervisor, and is compared against guest-side tiering baselines (TPP, Nomad, Memtis) and a hypervisor-side baseline (TPP-H) over DRAM + Intel Optane PMEM."
  isolation_mechanism: "Hypervisor retains tier capacity arbitration between VMs; per-VM tiering policy runs inside the guest so one guest's policy cannot drive another's placement (design inferred from the guest-delegation split; not verified against paper text)."
  multiplexing_mechanism: "Fast-tier (DRAM) capacity is divided among guests by the hypervisor, with each guest deciding which of its own pages occupy its share."
  state_mechanism: "Tiering/hotness state lives in the guest kernel rather than in hypervisor page-tracking structures; the hypervisor holds only capacity accounting."
  overhead_bottleneck: "Hypervisor-side hotness tracking of guest physical memory (the semantic gap and its scanning cost) is the cost Demeter removes."
  primary_tradeoff: "Delegating tiering to the guest -> gains guest-semantic accuracy and per-VM scalability but costs hypervisor authority over placement and requires a modified, cooperating guest."
  quantitative_claims: []
  why_useful_for_learning: "It is the cleanest 2025 statement of the classic memory-virtualization dilemma, where the hypervisor has authority but no semantics and the guest has semantics but no authority."
  priority: P1
  related: [VIRT-SOSP25-16, "HyperAlloc: Efficient VM Memory De/Inflation via Hypervisor-Shared Page-Frame Allocators", "virtio-mem: paravirtualized memory hot(un)plug"]
  relations:
    - {type: ALTERNATIVE, target: VIRT-SOSP25-16, basis: "Mage scales the host-side fault/eviction path for far memory; Demeter instead pushes the tiering decision into the guest -- two opposite answers to where memory-expansion policy belongs"}
    - {type: SAME_BRANCH, target: "HyperAlloc: Efficient VM Memory De/Inflation via Hypervisor-Shared Page-Frame Allocators", basis: "both are guest-hypervisor cooperative memory mechanisms in the ballooning/virtio-mem lineage"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [artifact, official-web]
  confidence: MEDIUM
  notes: "PARTIAL ACCESS FAILURE. Tried (1) ACM DL DOI page -> 403; (2) unpaywall.org/10.1145/3731569.3764801 -> 403; (3) author pages jlhu.io and jlhu.io/publications -> robots-disallowed / no PDF; (4) targeted preprint searches -> none. Evidence used is the authors' own Zenodo artifact record 16912877, which states Demeter is 'a tiered memory management solution designed for virtualized environments' via 'guest delegation', names the guest-delegated vs hypervisor-based (TPP-H) split, the DRAM+Optane PMEM setup and the TPP/Nomad/Memtis baselines. The artifact README also claims up to 2x over hypervisor-based and 28% over guest-based baselines; these are DELIBERATELY OMITTED from quantitative_claims because they were not read in the paper. Design/isolation fields marked as inferred."

- id: VIRT-SOSP25-03
  title: "Ghost in the Android Shell: Pragmatic Test-oracle Specification of a Production Hypervisor"
  title_correction: null
  authors: [Kayvan Memarian, Ben Simner, David Kaloper-Mersinjak, Thibaut Perami, Peter Sewell]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764817
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://www.cl.cam.ac.uk/~pes20/Stuff/exec-spec-paper.pdf
  classification: CORE
  classification_note: "The object of study is pKVM's memory-isolation invariant itself -- Arm stage-2 translation, page ownership and donation/sharing between host, hypervisor and guests -- so the contribution is a specification of hypervisor virtualization semantics."
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T1, T2]
  physical_resource: DRAM
  logical_abstraction: "An abstract 'ghost state' model of the hypervisor: finite partial maps from addresses to (physical address, permissions, attributes) plus per-page ownership and sharing annotations, standing in for concrete Arm page-table trees."
  problem: "pKVM enforces host/guest isolation in production Android but is too large and too concurrent for full formal verification, leaving its central memory-isolation invariant unchecked."
  mechanism: "The authors write executable functional-correctness specifications in plain C that mirror pKVM's own ownership structure, compute abstraction functions that walk the concrete stage-1/stage-2 page tables into ghost state at lock-acquire/release boundaries, and after each hypercall or fault handler compare the recorded post-state against a pure specification function applied to the pre-state; nondeterminism (ENOMEM, concurrently mutable host arguments) is handled by parameterising the spec on recorded return codes and READ_ONCE values."
  isolation_mechanism: "pKVM's own mechanism is Arm-A two-stage translation at EL2 with logical page ownership encoded in spare page-table-entry bits; the paper's contribution is a runtime oracle that checks that host, hypervisor and guest physical ranges stay disjoint except where explicitly shared."
  multiplexing_mechanism: "Host physical memory is partitioned among host, hypervisor and guests by ownership transfer (donation/sharing) rather than by time-slicing; vCPUs are loaded onto physical CPUs with ownership moving from a VM-global lock to thread-local state."
  state_mechanism: "Virtualization state lives in per-component stage-2 page tables plus ownership bits; the ghost state is a shadow copy in a separate physical memory region with its own allocator, recomputed at lock boundaries and discarded after each check."
  overhead_bottleneck: "Recomputing page-table abstractions at every lock boundary: 3.2x boot slowdown and 11.5x on the hand-written test suite, plus ~18 MB for the ghost page-table representations."
  primary_tradeoff: "Executable test-oracle specification -> gains developer-maintainable, concurrency-aware checking of a production hypervisor at ~1 person-year but costs soundness (testing, not proof) and 3-11x runtime overhead, so it cannot ship."
  quantitative_claims:
    - "bugs found: 5 critical bugs acknowledged by pKVM developers, 4 fixed (only 1 found by running the specification; 4 found while code-reading to write it)"
    - "specification size: ~2,600 lines for hypercall specs, ~1,300 for abstraction recording, ~4,500 for abstract datatypes, ~14,000 total C"
    - "runtime overhead: 3.2x for boot (1.49s -> 4.76s) and 11.5x for hand-written tests (1.07s -> 12.3s), on Intel Xeon Gold 6240 4 cores under QEMU"
    - "ghost state memory: ~18 MB, dominated by page-table representations"
    - "coverage: 100% line coverage of the __pkvm_host_share_hyp target excluding unreachable code; 92% (459/497) of specification function lines"
    - "effort: ~1 person-year total versus ~30 person-years of pKVM development"
    - "random testing rate: ~200,000 hypercalls/hour, runs up to 24 hours"
  why_useful_for_learning: "It is the best available description of what a production Arm hypervisor's isolation invariant actually is, stated precisely enough to check, including how ownership and locking interact."
  priority: P1
  related: [VIRT-SOSP25-04, VIRT-SOSP25-12, "Atmosphere: Practical Verified Kernels with Rust and Verus"]
  relations:
    - {type: ALTERNATIVE, target: VIRT-SOSP25-04, basis: "both establish confidence in a privileged isolation monitor, Miralis by exhaustive symbolic execution of a small TCB, pKVM by runtime test oracles over a large existing one"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-12, basis: "both verify that a production kernel's logical view of memory protection matches what the hardware actually enforces, here Arm stage-2 tables, there MPU/PMP registers"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: null

- id: VIRT-SOSP25-04
  title: The Design and Implementation of a Virtual Firmware Monitor
  title_correction: null
  authors: [Charly Castes, Francois Costa, Neelu S. Kalani, Timothy Roscoe, Nate Foster, Thomas Bourgeat, Edouard Bugnion]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764826
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://people.inf.ethz.ch/troscoe/pubs/caste_sosp_2025.pdf
  classification: CORE
  classification_note: "It applies textbook trap-and-emulate virtualization to a new privilege level -- RISC-V machine mode -- producing a virtual M-mode with virtual CSRs, virtual PMP entries, virtual interrupts and virtual MMIO devices for unmodified firmware."
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T1, T3]
  physical_resource: CPU core
  logical_abstraction: "A virtual machine mode (vM-mode): unmodified vendor firmware runs in user mode but sees a complete M-mode -- shadow CSRs, virtual PMP registers, virtual CLINT and virtual interrupts."
  problem: "TEE and confidential-VM security monitors sit at the same privilege level as tens-to-hundreds of thousands of lines of vendor firmware, so the whole firmware image is inside their TCB."
  mechanism: "Miralis, a 6.2k-line Rust virtual firmware monitor, deprivileges firmware into user mode and emulates 12 privileged instructions and 84 CSRs with shadow state that is never installed into physical registers while firmware runs; physical PMP entries are multiplexed so that virtual PMP rules are always installed at lower priority than the entries protecting Miralis, and unsafe MMIO regions are revoked by default via PMP; a fast-path offload subsystem implements common standard extensions (time reads, Sstc, IPIs, remote fences) directly in Miralis so firmware is bypassed for hot operations."
  isolation_mechanism: "RISC-V PMP, with Miralis's own protective entries at strictly higher priority than the firmware's virtual entries, plus trapping of all sensitive instructions; firmware DMA is blocked wholesale by denying access to MMIO regions controlling DMA-capable devices, because current platforms lack IOPMP."
  multiplexing_mechanism: "A single physical PMP register file is multiplexed between Miralis's own protection entries and the firmware's virtual PMP entries; there is one virtual guest (the firmware), so no inter-guest time-sharing."
  state_mechanism: "Virtual firmware state is shadow CSRs held in Miralis's memory; world switches install/restore CSRs, flush TLBs and reconfigure PMPs, costing ~7,000 cycles round trip."
  overhead_bottleneck: "World-switch frequency: without fast-path offloading, cost scales with trap rate, reaching 10.6% on IOzone and 2x latency on memcached at 388k traps/s."
  primary_tradeoff: "Virtualizing M-mode by trap-and-emulate -> gains firmware removal from the TCB with no firmware modification and no new hardware extension, but costs a per-trap emulation penalty that must be bought back by offloading standard operations into the monitor."
  quantitative_claims:
    - "code size: 6.2k lines of Rust total (2.1k instruction emulator, 1.1k hardware interface, 430 MMIO device emulation, 190 fast-path offloading)"
    - "verification: exhaustive symbolic execution with Kani against a Rust translation of the official RISC-V Sail model (6.9k lines), covering 43% of the codebase (2.7k lines); 21 bugs found during development"
    - "instruction emulation cost: ~483 cycles on StarFive VisionFive 2 (U74, 1.5 GHz), ~271 cycles on SiFive HiFive Premier P550 (1.8 GHz)"
    - "world switch: ~7,000 cycles round trip (~5 us)"
    - "application overhead with fast path: 0-1.2% on Redis, memcached, MySQL and GCC on Premier P550"
    - "overhead without fast-path offloading: 1.9% on CoreMark-Pro (11k traps/s), 10.6% on IOzone, 2x memcached latency (388k traps/s)"
    - "boot time: 48.0s with Miralis+offload vs 47.5s native vs 61.3s without offload"
    - "ported policies: Keystone enclave monitor at ~1% overhead (matching original); ACE confidential-VM monitor verified on QEMU"
    - "firmware virtualized unmodified: OpenSBI-based vendor firmware of 31.8k and 24.7k lines, RustSBI, Zephyr test suites, and closed-source Star64 firmware (164 kB binary)"
  why_useful_for_learning: "It is a modern, small, readable demonstration that Popek-Goldberg trap-and-emulate still works and still pays, applied at the one privilege level most people assume cannot be virtualized."
  priority: P0
  related: [VIRT-SOSP25-03, VIRT-SOSP25-12, "Keystone", "ACE confidential VM monitor", "Dorami"]
  relations:
    - {type: ALTERNATIVE, target: "Dorami", basis: "Dorami deprivileges firmware by binary scanning plus vendor firmware modification; Miralis achieves the same goal by classical virtualization with no firmware changes"}
    - {type: LAYER_BELOW, target: "ACE confidential VM monitor", basis: "Miralis hosts ACE as a policy module, so the confidential-VM monitor now sits above a virtualized M-mode and excludes firmware from its TCB"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-03, basis: "both are correctness arguments for privileged isolation monitors, one by symbolic execution against an ISA model, one by runtime test oracles"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "Threshold note: Arm EL3 is stated to be non-virtualizable in this style because cpsid does not trap, which is a useful negative result about Popek-Goldberg on real ISAs."

- id: VIRT-SOSP25-05
  title: "Oasis: Pooling PCIe Devices Over CXL to Boost Utilization"
  title_correction: null
  authors: [Yuhong Zhong, Daniel S. Berger, Pantea Zardoshti, Enrique Saurez, Jacob Nelson, Dan R. K. Ports, Antonis Psistakis, Joshua Fried, Asaf Cidon]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764812
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://www.yuhong-zhong.com/papers/Oasis_SOSP25.pdf
  classification: SUPPORT
  classification_note: "Applying the brief's disaggregation rule: Oasis multiplexes *physical* PCIe devices across hosts over a CXL memory fabric and explicitly frames itself as pooling rather than virtualization -- its allocator hands out physical devices and it builds no per-tenant virtual device with independent, migratable state."
  drop_reason: null
  taxonomy_primary: T3
  taxonomy_secondary: [T2, T9]
  physical_resource: PCIe/CXL fabric
  logical_abstraction: "A pod-wide logical PCIe device pool: a frontend driver on every host exposes a packet-I/O or block interface to local instances, backed by a physical device that may live on another host."
  problem: "PCIe devices are 20-40% of server capex and 13% of power at Azure yet are provisioned per host for peak demand, leaving them stranded and idle; PCIe switches cost ~$80,000 per rack and RDMA disaggregation does not fit all device classes."
  mechanism: "I/O buffers and signalling messages are placed in shared, non-cache-coherent CXL 2.0 memory; a frontend driver on each host forwards requests over a message channel to a backend driver on the host that owns the physical device, which drives it via native DPDK/SPDK queue pairs and never inspects the buffers; a logically centralised pod allocator whose state lives in CXL memory assigns instances to the least loaded device and can migrate them for load balance or failover."
  isolation_mechanism: "Software-enforced only: instances are confined to their allocated TX buffer region, RX packets are copied out of per-NIC shared buffers into instance-local memory so instances cannot inspect each other's traffic, and NIC flow tagging identifies destinations without CPU payload inspection; drivers and devices are assumed fully trusted and no IOMMU is used."
  multiplexing_mechanism: "One physical device is shared by instances on multiple hosts through per-instance buffer regions plus backend queue pairs, with the allocator placing instances greedily on the lowest-load device."
  state_mechanism: "Allocator state (instance-to-device mappings) and all I/O buffers live in shared CXL memory, which is what makes reassignment on failure possible without transferring in-device state; there is no device-state capture or migration."
  overhead_bottleneck: "Cross-host signalling over non-coherent CXL: a naive channel is far too slow, so the paper's message-channel design with epoch bits and targeted cache-line invalidation to enable prefetching is what brings it to 14 MOp/s at 0.6 us."
  primary_tradeoff: "Pooling physical devices over CXL -> gains roughly 2x device utilization and cheap failover without PCIe switches, but costs 4-7 us of added I/O latency, a dedicated busy-polling core per driver, a fully trusted driver/device TCB, and no tolerance of CXL link failure."
  quantitative_claims:
    - "latency overhead: 4-7 us at P50/P90/P99 across Python HTTP, Rust Rocket, nginx, Tomcat and memcached, versus a local-NIC Junction baseline"
    - "NIC utilization: aggregated P99.99 improves from 18% to 37% when two hosts multiplex one NIC, with ~1 us added latency for the second host"
    - "failover: 38 ms interruption for UDP, 133 ms for TCP including retransmission"
    - "message channel: 14 MOp/s at 0.6 us latency with the optimized non-coherent design"
    - "CXL bandwidth consumed: 0.2 GB/s idle from busy-polling, 13.5 GB/s at 4 MOp/s with 1500 B packets"
    - "motivation from Azure production: only 20% P99.99 NIC bandwidth utilization; 27% of NIC bandwidth and 33% of SSD capacity unallocated/stranded"
    - "testbed: two AMD EPYC hosts (9825 144-core, 9015 8-core), one 256 GB DDR5-4800 CXL 2.0 device with x8 lanes per host, 100 Gbit ConnectX-5 NICs"
  why_useful_for_learning: "It shows exactly where the boundary between device pooling and device virtualization lies, and what the split frontend/backend driver structure costs once the backend is on another machine instead of in the local hypervisor."
  priority: P1
  related: [VIRT-SOSP25-15, VIRT-SOSP25-16, VIRT-SOSP25-01]
  relations:
    - {type: CONTRASTS_WITH, target: VIRT-SOSP25-01, basis: "Oasis sidesteps device-state migration entirely by keeping all I/O state in shared CXL memory and reassigning physical devices, whereas device-assisted live migration attacks the in-device state problem directly"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-16, basis: "both build host-crossing resource expansion over a fabric, one for devices over CXL, one for memory over RDMA"}
    - {type: ALTERNATIVE, target: VIRT-SOSP25-15, basis: "both reclaim idle I/O-path capacity in hyperscale clouds, Oasis by pooling devices across hosts, Tai Chi by reclaiming idle SmartNIC cycles on one host"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "THRESHOLD CALL (CORE vs SUPPORT). Argument for CORE: the frontend driver hands instances a device-like interface backed by a remote physical device, which is structurally the virtio split-driver pattern. Argument for SUPPORT, which I took: the paper's own framing is pooling ('Oasis bridges containers or VMs with devices located at other hosts' as distinct from virtualization bridging VMs with local devices), the allocator assigns physical devices rather than instantiating virtual ones, there is no virtual device state, no IOMMU/SR-IOV, and no device-state migration. The brief's disaggregation rule -- CORE only when a virtual resource abstraction is built over the pool -- resolves it to SUPPORT."

- id: VIRT-SOSP25-06
  title: "PhoenixOS: Concurrent OS-level GPU Checkpoint and Restore with Validated Speculation"
  title_correction: null
  authors: [Xingda Wei, Zhuobin Huang, Tianle Sun, Yingyi Hao, Rong Chen, Mingcong Han, Jinyu Gu, Haibo Chen]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764813
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://arxiv.org/html/2405.12079v4
  classification: CORE
  classification_note: "It virtualizes GPU execution state at the CUDA driver-API boundary -- buffers, contexts, streams and queued kernels -- and reconstructs that state transparently on another context or another machine, which is checkpoint/restore of virtualized accelerator state rather than a scheduling policy."
  drop_reason: null
  taxonomy_primary: T4
  taxonomy_secondary: [T6, T8]
  physical_resource: GPU
  logical_abstraction: "A checkpointable, migratable GPU process: the application keeps using unmodified CUDA while the OS service owns a dataflow (kernel DAG) representation of its GPU state and a pool of pre-initialised execution contexts to restore into."
  problem: "GPUs bypass the OS and paging, so the dirty bits and copy-on-write that make CPU checkpoint/restore concurrent do not exist, forcing stop-the-world GPU C/R with hundreds of milliseconds of downtime."
  mechanism: "PhoenixOS interposes on CUDA driver APIs and maintains a runtime kernel DAG whose nodes are kernels and buffers and whose edges are read/write dependencies; buffer access sets are inferred from kernel launch arguments (treating 8-byte arguments as candidate device addresses filtered against allocated ranges) and this speculation is validated by offline PTX binary instrumentation used only during C/R; the DAG then supports software substitutes for the missing hardware features -- soft copy-on-write (copy a buffer before a kernel touches a buffer currently being checkpointed), a soft dirty bit, and soft on-demand restore that loads buffers in topological order so kernels start as soon as inputs arrive."
  isolation_mechanism: "N/A -- single-GPU, single-process scope; the paper explicitly does not address multi-process isolation or GPU multiplexing."
  multiplexing_mechanism: "N/A for tenants; an execution-context pool multiplexes pre-initialised CUDA contexts across successive restores to remove context-creation cost."
  state_mechanism: "Checkpoint images are held in host memory with background SSD flush; for live migration they are sent over RDMA peer-to-peer into the target GPU's memory, with a second stop phase retransmitting dirty buffers or, if the dirty set is too large, shipping the DAG and re-executing kernels instead."
  overhead_bottleneck: "GPU memory copy dominates both checkpoint and restore, and GPU context creation adds 50-83% of restore time -- the three costs the design attacks."
  primary_tradeoff: "Speculating on kernel buffer access from launch arguments and validating by instrumentation -> gains concurrent, transparent GPU C/R with ~1 ms stop time, but costs 2-21% instrumentation slowdown during C/R on opaque kernels, per-API manual rules, and a fallback path when speculation fails."
  quantitative_claims:
    - "stop time: ~1 ms versus 726 ms for a stop-the-world Singularity-style baseline (GPT-2)"
    - "checkpointing: 5.5-72.2% faster than the stop-the-world baseline; 12.4-62.3% faster than PyTorch framework-level checkpointing"
    - "live migration: 58.0-95.2% faster; Llama-2-13B downtime 7.9 s -> 0.4 s"
    - "restore / cold start: 3.2-19.5x faster than the OS-level baseline, 6.8-111.9x faster than framework-level, up to 82% reduction for serverless cold start"
    - "instrumentation overhead: 2-21% slowdown during C/R only, on the under-20% of kernels that are opaque; negligible during normal execution"
    - "image size with deduplication: 56-97% smaller for inference, e.g. Llama-2 inference 48.1 GB -> 970.7 MB"
    - "speculation accuracy: reported 100% on the evaluated training and inference applications, with no validation failures observed"
    - "API rules: up to 50 of 2,449 CUDA 12.3 APIs needed manual rules, ~2 human-days"
    - "testbed: two servers, 8x A100 80GB each, dual Xeon Gold 6348 (56 cores), 1 TB host memory, 200 Gbps InfiniBand"
  why_useful_for_learning: "It is the clearest worked example of what 'state' means for accelerator virtualization and why device-bypass architectures make migration and checkpointing hard."
  priority: P1
  related: [VIRT-SOSP25-01, VIRT-SOSP25-14, VIRT-SOSP25-07, "NVIDIA cuda-checkpoint"]
  relations:
    - {type: SAME_BRANCH, target: VIRT-SOSP25-01, basis: "both capture and move device state that the OS cannot see because the device bypasses it"}
    - {type: ALTERNATIVE, target: "NVIDIA cuda-checkpoint", basis: "the paper's Driver-C baseline is NVIDIA's closed-source driver-level checkpoint, against which PhoenixOS argues for an OS-level DAG abstraction"}
    - {type: USES_MECHANISM_FROM, target: VIRT-SOSP25-07, basis: "Aegaeon's fast model switching needs exactly the GPU state save/restore primitives PhoenixOS generalises; both treat KV cache / device buffers as the migratable unit"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH

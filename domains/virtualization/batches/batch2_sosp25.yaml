    - {type: ALTERNATIVE, target: VIRT-SOSP25-13, basis: "both attack FaaS start cost by avoiding multiple address spaces -- Dandelion by removing the guest OS, uFork by forking within one address space"}
    - {type: TRADEOFF_PAIR, target: "Firecracker", basis: "Firecracker keeps POSIX and pays snapshot restore cost; Dandelion drops POSIX and pays portability cost"}
    - {type: LAYER_BELOW, target: VIRT-SOSP25-09, basis: "Quilt optimises workflow packing above an unchanged isolation substrate; Dandelion replaces the substrate itself"}

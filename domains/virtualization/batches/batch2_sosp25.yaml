  fullpaper_source: https://ranjitjhala.github.io/static/sosp25-ticktock.pdf
  classification: SUPPORT
  classification_note: "It contains no virtualization -- the paper says Tock 'cannot rely on virtual memory and memory management units' -- but it verifies the exact hardware resource, RISC-V PMP and Arm MPU registers, that Miralis multiplexes to create virtual PMP entries, and it isolates the general failure mode where a kernel's logical view of protection diverges from what hardware enforces."
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: [T7]
  physical_resource: CPU core
  logical_abstraction: "A verified process memory region: each user process sees code, stack and heap it can reach and provably nothing of the kernel or of other processes, enforced by MPU/PMP rather than page tables."
  problem: "Tock ships in Google's Ti50 security chip, Microsoft Pluton and TPMs, but its MPU configuration logic was unverified, and a mismatch between the kernel's idea of a process's memory layout and the regions the MPU actually enforces silently breaks isolation."
  mechanism: "The authors split Tock's monolithic MPU interface into a RegionDescriptor trait abstracting hardware region properties and an MPU trait handling region creation/update, which decouples kernel requirements from hardware constraints; they then verify with Flux, an SMT-backed refinement-type checker for Rust, placing invariants on structures like AppBreaks to tie memory_start/app_break/kernel_break relationships to the bits actually written into Arm RBAR/RASR registers via associated refinements; interrupt and context-switch assembly is verified against FluxArm, a new executable formal semantics of ARMv7-M, because leaving the CPU privileged across a context switch would bypass the MPU entirely."
  isolation_mechanism: "Hardware MPU regions on Arm and PMP entries on RISC-V configured by a privileged Rust kernel; capsules (drivers) are isolated at the language level by forbidding unsafe Rust; the verification is what ties the two together."
  multiplexing_mechanism: "A small fixed number of hardware protection regions is multiplexed across processes by reprogramming them on context switch -- the paper's redesign returns the actual enforced layout rather than recomputing it, which is where the bugs were."
  state_mechanism: "Protection state lives entirely in MPU/PMP registers plus the kernel's AppBreaks bookkeeping; it is reprogrammed on every context switch and there is no migration or persistence."
  overhead_bottleneck: "Context switch dominates at ~32.7k cycles, which the redesign leaves essentially unchanged; verification time, not runtime, was the thing the granular abstraction fixed."
  primary_tradeoff: "Refinement types over a granular MPU abstraction -> gains machine-checked isolation plus faster grant/brk paths and a 9x drop in verification time, but costs 3,603 lines of annotation over 22,131 lines of source, 125 trusted functions, and a two-region cap imposed by Rust/Flux const-generic limits."
  quantitative_claims:
    - "bugs found: five previously unknown MPU configuration bugs and two interrupt-handling bugs that break isolation"
    - "context switch overhead: 0.3% (32,740 vs 32,640 cycles on Arm)"
    - "allocate_grant: 50% faster (641 vs 1290 cycles); brk syscall 21.7% faster"
    - "memory: 7,780 bytes allocated with 5.6% unused, versus Tock's 8,192 bytes with 3.1% unused"
    - "verification time: 36 s total for the granular design (mean 0.05 s per function) versus 5 min 19 s for the original monolithic design; interrupt verification 2 min 34 s; full kernel+interrupts ~3 min"
    - "trust surface: 125 trusted functions and 3,603 lines of Flux annotations for 22,131 lines of source; 14 trusted functions proved separately in Lean"
    - "differential testing: 21 Tock test applications run on both Tock and TickTock"
  why_useful_for_learning: "It shows what it takes to prove that a privileged kernel's memory-protection bookkeeping agrees with the hardware registers, which is the same obligation a hypervisor carries for its stage-2 tables and virtual PMPs."
  priority: P2
  related: [VIRT-SOSP25-04, VIRT-SOSP25-03, VIRT-SOSP25-11, VIRT-SOSP25-17]
  relations:
    - {type: SAME_BRANCH, target: VIRT-SOSP25-03, basis: "both check that a production isolation kernel's abstract view matches enforced hardware protection -- stage-2 page tables there, MPU/PMP registers here"}
    - {type: LAYER_BELOW, target: VIRT-SOSP25-04, basis: "Miralis virtualizes the very PMP registers whose correct configuration TickTock verifies, so TickTock's bug classes are the correctness burden Miralis inherits and must multiplex"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-17, basis: "same OS (Tock) and same isolation architecture, examined formally here and retrospectively there"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH

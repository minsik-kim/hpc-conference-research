- id: VIRT-SOSP25-08
  title: Unlocking True Elasticity for the Cloud-Native Era with Dandelion
  title_correction: null
  authors: [Tom Kuchler, Pinghe Li, Yazhuo Zhang, Lazar Cvetkovic, Boris Goranov, Tobias Stocker, Leon Thomm, Simone Kalbermatter, Tim Notter, Andrea Lattuada, Ana Klimovic]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764803
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://arxiv.org/html/2505.01603v2
  classification: CORE
  classification_note: "Its contribution is the isolation substrate itself: by restricting functions to pure compute it removes the guest OS from the sandbox and then implements four interchangeable isolation backends (CHERI, rWasm, process, guest-kernel-less KVM) with microsecond cold start."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T8, T1, T7]
  physical_resource: CPU core
  logical_abstraction: "A DAG of pure compute functions plus platform-provided communication functions; each compute function gets a bounded contiguous memory context and a file-like in-memory filesystem, with no POSIX, no syscalls and no network stack."
  problem: "Serverless platforms cannot be elastic because cold start costs tens of milliseconds -- at least 8 ms just to load a microVM snapshot and re-establish networking -- so providers keep ~16x more DRAM in idle warm sandboxes than in executing functions."
  mechanism: "Dandelion changes the programming model so that user code is pure, deterministic and syscall-free, which removes the guest OS, device emulation and network setup from the sandbox; a sandbox is then just a contiguous memory region into which an executable is loaded, so it can be created per request across four pluggable backends -- CHERI capability bounds inside one address space (~89 us), rWasm compiled to safe Rust (~241 us), ptrace-confined Linux processes (~486 us), and identity-mapped KVM VMs with no guest kernel (~889 us); a custom libc (hlibc) provides file-like I/O without syscalls, and a proportional-integral controller reassigns cores between run-to-completion compute engines and green-threaded communication engines based on queue growth."
  isolation_mechanism: "Backend-dependent: CHERI capability bounds, Rust-compiler-enforced memory safety for rWasm, ptrace syscall blocking for processes, or hardware virtualization for the guest-kernel-less KVM backend; in all cases the function has no access to host resources and its untrusted output is parsed by a ~100-line Rust parser, while platform-owned communication functions validate HTTP input."
  multiplexing_mechanism: "Cores are partitioned between compute engines (one task run to completion per core, no context switching) and communication engines (cooperative green threads), with the split adjusted at runtime by the controller."
  state_mechanism: "There is deliberately no state across invocations: data flows along DAG edges and contexts are freed once downstream functions have consumed outputs, which is precisely why no snapshot is needed."
  overhead_bottleneck: "In the baselines, guest-OS snapshot loading and network re-establishment (>8 ms); in Dandelion, data copying between contexts and the code-quality penalty of the safe backends."
  primary_tradeoff: "Dropping POSIX for pure functions -> gains microsecond cold start, ~1 MB per sandbox instead of ~30 MB, and stable rather than bimodal latency, but costs application portability (existing POSIX code must be refactored into a DAG) and rules out stateful workloads such as OLTP, gaming and training."
  quantitative_claims:
    - "cold start: 89 us (CHERI), 241 us (rWasm), 486 us (process), 889 us (KVM) versus ~120 ms for Firecracker snapshot restore"
    - "memory: 4% committed (109 MB average) versus 2619 MB for Knative autoscaling on an Azure Functions trace, a 96% reduction, with p99 latency 46% lower"
    - "throughput: 4800 RPS (KVM backend) on 128x128 matmul versus 3000 RPS Firecracker and 2600 RPS Wasmtime"
    - "image compression p99: 19.64 ms, 38.6% lower than Firecracker and 67.1% lower than Wasmtime; run-to-run variance 1.30% versus 389.6% (Firecracker) and 6.11% (Wasmtime)"
    - "query processing: 40% lower latency and 67% lower cost than AWS Athena on Star Schema Benchmark short queries"
    - "composition: at 16 chained phases, 4.6x faster than Firecracker cold start but 4 ms slower than Firecracker warm sandboxes"
    - "hardware: dual-socket Intel Xeon E5-2630v3 (16 cores, 256 GB) and an Arm Morello board (4 cores, 16 GB) for the CHERI backend"
  why_useful_for_learning: "It isolates the question 'what does the guest OS actually cost in a sandbox?' by building the same service on four different isolation mechanisms and measuring each."
  priority: P1
  related: [VIRT-SOSP25-11, VIRT-SOSP25-13, VIRT-SOSP25-09, VIRT-SOCC25-01, "Firecracker", "Hyperlight Wasm"]
  relations:

- id: VIRT-SOSP25-10
  title: "Coyote v2: Raising the Level of Abstraction for Data Center FPGAs"
  title_correction: null
  authors: [Benjamin Ramhorst, Dario Korolija, Maximilian Jakob Heer, Jonas Dann, Luhao Liu, Gustavo Alonso]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764845
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://arxiv.org/html/2504.21538v1
  classification: CORE
  classification_note: "The contribution is the FPGA virtualization layer itself: multiple isolated vFPGA regions each with its own hardware MMU/TLB over host DRAM and FPGA HBM, credit-based bandwidth partitioning between them, and dynamic partial reconfiguration of both services and applications."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T2, T3, T9]
  physical_resource: FPGA
  logical_abstraction: "A vFPGA: an isolated reconfigurable region with shared virtual memory across host DRAM and FPGA HBM, multithreaded stream interfaces (cThreads), interrupts, and an RDMA-capable network endpoint that speaks virtual addresses."
  problem: "About 75% of FPGA development effort goes into infrastructure rather than the application, and existing shells fix networking and memory management statically, offer no per-application multithreading, and lack generic interfaces and interrupts -- so FPGAs cannot be first-class datacenter citizens."
  mechanism: "Coyote v2 is a three-layer shell: a thin platform-specific static layer (PCIe XDMA, driver, ICAP reconfiguration controller), a dynamically reconfigurable *services* layer holding memory management and networking, and an application layer of multiple parallel vFPGAs; memory is virtualized by a hybrid MMU with on-chip SRAM TLBs and host-driver page-fault handling, supporting 4 KB to 1 GB pages and HBM striping across banks, and BALBOA provides a RoCE v2 100G RDMA stack that operates on virtual addresses; moving services out of the static layer is what lets them be reconfigured at runtime via ICAP at ~800 MB/s."
  isolation_mechanism: "A per-vFPGA hardware MMU gives each region its own address translation, and a per-vFPGA per-stream credit-based backpressure scheme stops one region from stalling others; each application also has its own host address space."
  multiplexing_mechanism: "Spatial partitioning of fabric into vFPGAs, plus 4 KB packetization and round-robin interleaving on bandwidth-constrained links (PCIe, network) for fair sharing, plus per-vFPGA multithreading where software cThreads map onto shared hardware pipeline stages distinguished by AXI TID."
  state_mechanism: "TLBs live in on-chip SRAM with page tables in the host kernel driver; per-vFPGA isolation metadata sits in hardware MMU and control registers; credit counters in hardware queues; control/status via AXI4-Lite mapped to user space; interrupts via MSI-X surfaced as Linux eventfd."
  overhead_bottleneck: "Routing congestion limits practical vFPGA count to about eight to ten, and MMU-mediated translation caps HBM bandwidth scaling so peak bandwidth requires bypassing the abstraction."
  primary_tradeoff: "Raising the FPGA abstraction with per-vFPGA virtual memory, reconfigurable services and multithreading -> gains 15-20% faster iteration, order-of-magnitude faster reconfiguration and GPU-like deployment ergonomics, but costs ~10% extra fabric resources, a congestion-bounded number of regions, and HBM throughput that tapers unless the MMU is bypassed."
  quantitative_claims:
    - "synthesis: application-only flow linking against a pre-routed shell is 15-20% faster in total time than the shell-only flow"
    - "reconfiguration: kernel-only 51-85 ms, total 536-929 ms including disk I/O, versus 55-71 s for full Vivado reprogramming"
    - "ICAP throughput: ~800 MB/s versus 19-145 MB/s for prior controllers"
    - "HBM: linear throughput scaling from 1 to 4 channels with minimal virtual-memory overhead, approaching 400+ GB/s at 8 channels"
    - "multi-tenant AES ECB: fair bandwidth distribution across vFPGAs with cumulative throughput flat at the ~12 GB/s PCIe limit (no arbiter overhead)"
    - "multithreading: AES CBC single thread saturates at ~280 MB/s and 32 KB; 8 threads scale near-linearly to ~2.1 GB/s (7x idle-time reduction)"
    - "HyperLogLog: throughput comparable to Coyote v1 at ~10% higher resource utilization; on-demand kernel reconfiguration 57 ms"
    - "hls4ml NN inference: order of magnitude faster than a PYNQ+Vitis baseline (acknowledged as not fully optimized), ~15% resource utilization, under 10 lines of Python to deploy"
    - "boards: AMD Alveo U55C, U250, U280, 250 MHz system clock, 450 MHz HBM"
  why_useful_for_learning: "It is the reference example of building a full OS-style virtualization stack -- address translation, isolation, fair bandwidth sharing, reconfiguration -- for a non-CPU, non-GPU accelerator."
  priority: P1
  related: [VIRT-SOSP25-14, VIRT-SOCC25-05, "AmorphOS", "OPTIMUS", "Coyote v1"]
  relations:
    - {type: EXTENSION, target: "Coyote v1", basis: "the paper states it extends v1 by moving services into the dynamic layer, adding multithreading, generic interfaces and interrupts"}
    - {type: ALTERNATIVE, target: "AmorphOS", basis: "compared directly: AmorphOS lacks networking, shared virtual memory and service reconfiguration"}
    - {type: ALTERNATIVE, target: "OPTIMUS", basis: "compared directly: OPTIMUS only spatially partitions static regions, without dynamic reconfiguration or multithreading"}
    - {type: SAME_BRANCH, target: VIRT-SOCC25-05, basis: "Funky orchestrates FPGA virtualization in a cloud-native control plane, one layer above the shell abstraction Coyote v2 provides"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-14, basis: "both spatially partition an accelerator with hardware-enforced per-partition isolation, on FPGA fabric and on GPU TPCs respectively"}
  existing_corpus_overlap: null

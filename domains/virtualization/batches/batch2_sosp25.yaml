- id: VIRT-SOSP25-13
  title: "μFork: Supporting POSIX fork Within a Single-Address-Space OS"
  title_correction: null
  authors: [John Alistair Kressel, Hugo Lefeuvre, Pierre Olivier]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764809
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://arxiv.org/html/2509.09439v2
  classification: CORE
  classification_note: "It builds a process abstraction (micro-processes) inside a unikernel's single address space, with CHERI capability bounds as the isolation boundary and a new copy-on-pointer-access mechanism -- a lightweight-isolation architecture contribution, not an application of one."
  drop_reason: null
  taxonomy_primary: T5
  taxonomy_secondary: [T2, T8]
  physical_resource: DRAM
  logical_abstraction: "A micro-process: a POSIX process (own PID, thread, contiguous memory region, duplicated file descriptors) that lives inside one shared address space, so unmodified applications get fork semantics without a second page table."
  problem: "Single-address-space OSes and unikernels are lightweight precisely because they avoid multiple address spaces, but that is exactly why they cannot support fork -- the child's memory must sit at a different location in the same address space, breaking every absolute pointer in the copy."
  mechanism: "Built on Unikraft, uFork reserves a contiguous virtual region for the child and initially maps it to the parent's physical pages; to fix absolute references it exploits CHERI's 128-bit tagged capabilities, scanning copied pages in 16-byte steps and relocating any word whose tag bit marks it a valid pointer; because a child merely *reading* a page containing a pointer would load a stale parent reference, plain copy-on-write is insufficient, so uFork adds copy-on-pointer-access (CoPA) using an extra page-table permission bit that faults on capability load; sealed capabilities give exception-less user/kernel domain switches so syscalls avoid trap overhead, and system permission bits plus copy-before-check buffer handling protect the kernel."
  isolation_mechanism: "CHERI capability bounds restrict each micro-process to its own contiguous region, monotonicity prevents privilege escalation, parent capabilities are proactively relocated during copy so they cannot leak into the child, and sealed capabilities plus system permission bits enforce the user/kernel boundary without separate page tables."
  multiplexing_mechanism: "One address space and one page-table hierarchy is shared by all micro-processes, which is what removes page-table switches from context switch and IPC; physical pages are shared until CoPA or a write forces a copy."
  state_mechanism: "Micro-process state (PID, thread, capability bounds, private static heap) lives in the shared address space; on fork, memory state moves by page sharing plus tag-directed pointer relocation rather than by snapshot."
  overhead_bottleneck: "Pointer relocation work during the copy, and virtual-address-space fragmentation from reserving large contiguous regions per micro-process."
  primary_tradeoff: "Forking within a single address space -> gains 3.7x faster fork, 0.13 MB per process and trap-less IPC, but costs dependence on CHERI hardware and a fault-on-capability-load feature, plus address-space fragmentation and build-time-fixed private heaps."
  quantitative_claims:
    - "fork latency: 54 us for a minimal process versus 197 us on CheriBSD (3.7x) and 10.7 ms on Nephele (VM-based SASOS fork via Xen, 198x)"
    - "per-process memory: 0.13 MB versus 0.29 MB (CheriBSD) and 1.6 MB (Nephele, 12.3x)"
    - "Redis: 260 us fork latency on a 100 MB database; snapshot save 109 ms versus 158 ms (1.4x faster)"
    - "CoPA benefit: fork of a 100 MB Redis DB drops from 23.2 ms and 144 MB (full synchronous copy) to 260 us and 6 MB"
    - "FaaS: 24% higher throughput than CheriBSD on a fork-bound MicroPython Zygote workload"
    - "Unixbench 1000 forks: 56 ms versus 198 ms (3.5x); pipe IPC 100k ops 245 ms versus 419 ms (43% faster)"
    - "nginx: 9% single-core throughput improvement with 3 workers"
    - "platform: Arm Morello board, 4 ARMv8.2-A cores at 2.5 GHz, 16 GB RAM"
  why_useful_for_learning: "It is the sharpest available demonstration of what the address space actually buys you, by removing it and then paying, piece by piece, for every POSIX property that depended on it."
  priority: P1
  related: [VIRT-SOSP25-08, VIRT-SOSP25-11, VIRT-SOCC25-02]
  relations:
    - {type: LAYER_BELOW, target: VIRT-SOSP25-11, basis: "uFork depends on CHERI capability tags and bounds, the mechanism CHERIoT RTOS characterises in detail"}
    - {type: ALTERNATIVE, target: VIRT-SOSP25-08, basis: "both cut FaaS start cost by refusing multiple address spaces, Dandelion by dropping the guest OS and uFork by retrofitting fork into a unikernel"}
    - {type: SAME_BRANCH, target: VIRT-SOCC25-02, basis: "both are unikernel memory-efficiency mechanisms -- uFork sharing pages across forked micro-processes, load-time deduplication sharing pages across unikernel instances"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [preprint, official-web]
  confidence: HIGH
  notes: "OMISSION from the seed list, found in the official SOSP 2025 accepted-papers list. Read the arXiv v2 manuscript."

- id: VIRT-SOSP25-14
  title: "LithOS: An Operating System for Efficient Machine Learning on GPUs"
  title_correction: null
  authors: [Patrick H. Coppock, Brian Zhang, Eliot H. Solomon, Vasileios Kypriotis, Leon Yang, Bikash Sharma, Dan Schatzberg, Todd C. Mowry, Dimitrios Skarlatos]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764818
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: http://www.cs.cmu.edu/~dskarlat/publications/lithos_sosp25.pdf
  classification: CORE
  classification_note: "This is the GPU partition mechanism itself, not a scheduler over existing partitions: it masks TPCs to create dynamic hardware-isolated spatial partitions, and it manufactures the preemption primitive the GPU lacks by rewriting queue metadata to atomize kernels."
  drop_reason: null
  taxonomy_primary: T6
  taxonomy_secondary: [T9, T5]
  physical_resource: GPU
  logical_abstraction: "A right-sized, quota-bounded slice of a GPU: each application gets a dynamically sized set of TPCs, with its kernels transparently split into schedulable atoms, without any change to framework, runtime or source."
  problem: "GPU datacenters run below 30% utilization for inference and ~40% for training while burning over 1000 W per device; temporal schemes run one job at a time, MIG and MPS partition too coarsely and cause head-of-line blocking, and most fine-grained schemes need framework modifications."
  mechanism: "LithOS interposes at the CUDA driver API as a drop-in library (LibLithOS) and schedules at TPC granularity, argued to be the finest level that stays portable; launch queues buffer work on the CPU so dispatch can be deferred, per-TPC timers plus an online latency predictor drive TPC stealing of idle capacity under another workload's quota; transparent preemption comes from a kernel atomizer that, with no access to source or PTX, wraps a kernel in a 'Prelude' that filters thread-block indices and injects it by modifying the Queue Metadata structure, so a kernel becomes independently schedulable atoms of 250-500 us; right-sizing fits l = m/t + b per kernel from two reference latencies to allocate the fewest TPCs meeting a latency slip target, and a DVFS controller derives a per-kernel-sequence frequency from aggregate sensitivity."
  isolation_mechanism: "Disjoint TPC sets give hardware compute isolation that MPS does not (competing kernels do not share compute units), each application keeps its own address space, stolen work runs at lower hardware stream priority with per-TPC timers guarding against priority inversion, and GPU errors are interposed so only the faulty process dies."
  multiplexing_mechanism: "Spatial via TPC masking under user-specified quotas (e.g. 75% high-priority / 25% best-effort), combined with temporal switching between atoms at microsecond granularity through deferred dispatch."
  state_mechanism: "Scheduler, atomizer, latency predictor, right-sizing model and DVFS controller all live in CPU user space; on the GPU side TPC masks and hardware stream priorities are carried in modified QMD structures, with launch queues and per-kernel atomization metadata cached across repeated launches."
  overhead_bottleneck: "Memory bandwidth contention, which TPC partitioning does not address and which still costs 4-13% under heavy contention; plus the ~50 ms DVFS transition latency that forces coarse frequency control."
  primary_tradeoff: "Transparent TPC-granularity spatial partitioning with atomized preemption -> gains 13x tail-latency reduction versus MPS at 100% SLO attainment plus 26% capacity and 26% energy savings, but costs reverse-engineered QMD dependence on each new GPU architecture, no memory bandwidth or I/O isolation, and loss of the application semantics a framework-integrated system could exploit."
  quantitative_claims:
    - "tail latency: 13x reduction versus MPS and 4x versus the best state of the art, with throughput improved 1.3x-1.35x"
    - "inference stacking (2 high-priority, 1 best-effort): 100% HP SLO attainment versus 45% for MPS and ~84% for TGS"
    - "hybrid inference+training: P99 latency 1.2x ideal versus 5.83x for MPS; 1.35x aggregate throughput versus TGS; 4.7x tail-latency reduction versus MPS"
    - "right-sizing: 26% mean capacity savings (up to 51%) at under 4% latency cost, with prediction R^2 of 0.92-0.99"
    - "power management: 26% mean energy savings (up to 46%) at 7% latency cost"
    - "overhead: 4% versus the native NVIDIA driver with no multitenancy; atomization under 1%"
    - "best-effort latency misprediction rate: 11-14%"
    - "testbed: one NVIDIA A100 SXM4 (108 SMs, 40 GB), 30 CPU cores, 216 GB host memory, CUDA 12.6, PyTorch 2.3, TensorRT 10.1, TensorRT-LLM 0.11.0; ResNet-50, RetinaNet, YOLOv4, Llama 3 8B, GPT-J 6B, BERT-Large inference under Poisson arrivals with training as best-effort"
  why_useful_for_learning: "It is the clearest statement of why GPUs are hard to virtualize -- no preemption, no dirty bits, coarse vendor partitions -- and of how much can be recovered purely in software above the driver API."
  priority: P1
  related: [VIRT-SOSP25-07, VIRT-SOSP25-10, VIRT-SOSP25-06, VIRT-SOCC25-06, VIRT-SOCC25-14, "MIG", "MPS", "REEF", "TGS", "Orion"]
  relations:
    - {type: CONTRASTS_WITH, target: VIRT-SOSP25-07, basis: "spatial hardware-isolated partitioning versus temporal token-granularity multiplexing as the two ways to raise GPU density"}
    - {type: ALTERNATIVE, target: "MIG", basis: "the paper positions TPC masking as finer and dynamic where MIG is GPC-granular and static"}
    - {type: ALTERNATIVE, target: "MPS", basis: "MPS shares compute units with weak isolation and no priority; LithOS gives disjoint TPCs and priorities"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-10, basis: "both spatially partition an accelerator's fabric with per-partition hardware isolation"}
  existing_corpus_overlap: ai_hpc_systems
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "OMISSION from the seed list, found in the official SOSP 2025 accepted-papers list. Arguably the single most important GPU-virtualization paper in this batch."

- id: VIRT-SOSP25-15
  title: "Tai Chi: A General High-Efficiency Scheduling Framework for SmartNICs in Hyperscale Clouds"
  title_correction: null
  authors: [Bang Di, Yun Xu, Kaijie Guo, Yibin Shen, Yu Li, Sanchuan Cheng, Hao Zheng, Fudong Qiu, "et al."]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764851
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://dibang2008.github.io/files/SOSP2025-0917.pdf
  classification: CORE
  classification_note: "Its named mechanism is 'hybrid virtualization': vCPUs are registered into the SmartNIC's native OS as if they were physical CPUs so that control-plane work becomes preemptible at microsecond granularity, and it is measured directly against type-1 and type-2 virtualization."
  drop_reason: null
  taxonomy_primary: T1
  taxonomy_secondary: [T3, T9]
  physical_resource: CPU core
  logical_abstraction: "A hybrid CPU pool inside one SmartNIC OS: physical CPUs run polling data-plane services while vCPUs, visible to the OS as ordinary CPUs bindable by standard affinity, host control-plane tasks in idle cycles."
  problem: "SmartNIC data-plane services (DPDK/SPDK for VM network and storage I/O) are provisioned for peak and idle 67.5% of cycles for 99% of runtime, yet naively co-scheduling control-plane work there breaks I/O SLOs because control-plane operations contain non-preemptible kernel routines up to 67 ms long."
  mechanism: "Instead of type-1 or type-2 virtualization with a separate guest OS, Tai Chi integrates vCPUs into the native SmartNIC OS so native IPC semantics survive and legacy control-plane code needs no modification; softirq-based context switching schedules vCPUs onto physical CPUs when the data plane is idle (detected by empty-polling counts), and the SmartNIC's programmable I/O accelerator runs a hardware workload probe that spots arriving I/O during a 3.2 us preprocessing window and forces a VM exit, hiding the 2 us scheduling latency; a unified IPI orchestrator routes inter-processor interrupts between vCPU and pCPU domains using V-state/P-state tracking, and a vCPU preempted while holding a lock is immediately rescheduled on an idle pCPU to avoid deadlock."
  isolation_mechanism: "Performance isolation rather than security isolation: vCPU contexts make long non-preemptible control-plane routines interruptible at microsecond granularity, and the hardware probe guarantees the data plane preempts control-plane work on I/O arrival."
  multiplexing_mechanism: "Control-plane vCPUs are time-multiplexed onto the idle cycles of data-plane physical CPUs, with a 50 us initial vCPU time slice; control-plane tasks also drive emulated NICs (eNICs) and virtual block devices in coordination with host QEMU."
  state_mechanism: "vCPU state lives in the SmartNIC OS as ordinary CPU state plus V-state/P-state tracking for interrupt routing; there is no migration of this state."
  overhead_bottleneck: "Cache and TLB pollution from interleaving control-plane vCPUs onto data-plane cores, which accounts for the residual 0.7% data-plane overhead."
  primary_tradeoff: "Hybrid rather than conventional virtualization -> gains 3.1x faster VM startup and 4x control-plane throughput at only 0.7% data-plane cost with zero legacy code changes, where type-1 costs 7% and type-2 costs 25.9% data-plane degradation, but costs heuristic empty-polling thresholds and an unaddressed cache/TLB isolation problem."
  quantitative_claims:
    - "control-plane performance: 4x faster task execution at 32 concurrent tasks"
    - "VM startup latency: 3.1x reduction at high instance density (4x baseline)"
    - "data-plane overhead: 0.7% average, 1.92% peak"
    - "virtualization comparison: type-1 incurs 7% data-plane degradation and type-2 (QEMU+KVM) 25.9%, versus Tai Chi's 0.7%"
    - "hardware probe: without it, maximum RTT overhead reaches 203%"
    - "motivating measurement: 67.5% idle data-plane CPU cycles during 99% of runtime; control-plane kernel routines up to 67 ms non-preemptible"
    - "setup: Alibaba Cloud production SmartNICs with 12 cores (8 data-plane, 4 control-plane baseline); netperf, fio, sockperf, MySQL, nginx; 300-500 heterogeneous control-plane tasks in C, Python, Java, Bash and Rust"
    - "deployment: over three years in production at a top-tier cloud provider with no user-reported I/O SLO violations"
  why_useful_for_learning: "It shows the DPU as a virtualization host in its own right, and quantifies why conventional guest-OS virtualization is unaffordable on the I/O datapath."
  priority: P1
  related: [VIRT-SOSP25-05, VIRT-SOCC25-19, "Triton: A Flexible Hardware Offloading Architecture for Accelerating Apsara vSwitch in Alibaba Cloud"]
  relations:
    - {type: ALTERNATIVE, target: VIRT-SOSP25-05, basis: "both recover wasted I/O capacity in hyperscale clouds, Tai Chi by reclaiming idle SmartNIC cycles on one host and Oasis by pooling devices across hosts"}
    - {type: SAME_BRANCH, target: "Triton: A Flexible Hardware Offloading Architecture for Accelerating Apsara vSwitch in Alibaba Cloud", basis: "same Alibaba SmartNIC/CIPU platform and the same offloaded virtual-switch datapath that Tai Chi's data-plane services implement"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]

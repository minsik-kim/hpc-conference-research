  state_mechanism: "Model weights are cached in host memory and staged into a self-managed VRAM buffer; KV cache is swapped in and out through slab-allocated unified blocks with CUDA events tracking transfer state, and a daemon thread drives move lists asynchronously."
  overhead_bottleneck: "Model-switch cost, which component reuse plus explicit memory management reduces by 97% (component reuse alone removes 80%)."

  fullpaper_source: https://tockos.org/assets/papers/2025-sosp-tock-decade.pdf
  classification: CONTEXT
  classification_note: "A ten-year retrospective on an isolation-focused embedded OS with no virtual resource abstraction anywhere; its value here is operational -- what MPU-plus-language isolation actually costs to sustain in shipped root-of-trust hardware."
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: [T5]
  physical_resource: CPU core
  logical_abstraction: "A hardware-isolated, preemptively scheduled process on a device with no MMU, plus compile-time-isolated kernel extensions (capsules) and per-process kernel allocations (grants)."
  problem: "Whether a research OS built on a new language and new hardware protection mechanisms can survive the transition to production security-critical deployment, and what that transition costs."
  mechanism: "Processes are hardware-isolated by MPU and run untrusted application code in an unprivileged domain; capsules are the kernel extension mechanism, implemented as Rust structs forbidden from using unsafe code so their isolation is enforced at compile time with essentially no runtime overhead; grants remove the global kernel heap entirely by placing all dynamic kernel allocations in the requesting process's own memory region, so no process can exhaust kernel resources."
  isolation_mechanism: "MPU-enforced process isolation combined with Rust type-system isolation for capsules, under a threat model of mutually distrustful applications whose data stays secret even from the kernel unless explicitly revealed, and which cannot deny each other service at runtime."
  multiplexing_mechanism: "Preemptive scheduling of processes onto a single core with MPU reprogramming; grants time-share kernel memory by charging allocations to processes."
  state_mechanism: "Static kernel allocations plus the kernel stack only; per-process dynamic state lives in the process's own grant region, so there is no shared kernel heap to migrate or exhaust."
  overhead_bottleneck: "Not a performance paper; the identified costs are engineering ones -- Rust's memory model being tied to threaded synchronous execution forced a major redesign for asynchronous drivers, and downstream forks (Ti50) diverged from mainline."
  primary_tradeoff: "Language-plus-MPU isolation with academic stewardship -> gains least privilege at virtually no CPU or state overhead and a decade of survival as both product and research platform, but costs poor reuse of existing driver and library code and an async programming model that fits root-of-trust state machines badly."
  quantitative_claims:
    - "deployment: root-of-trust hardware in datacenter servers and millions of laptops; described as deployed on tens of millions of computers"
    - "named deployments: Google OpenSK (FIDO second factor), Google Ti50 (Chromebook root of trust), Microsoft Pluton (datacenter server root of trust), Signpost (urban sensing)"
    - "unsafe-code trend: the number of unsafe blocks remained steady despite significant added features"
    - "governance: three-quarters of the current leadership team are academics"
  why_useful_for_learning: "It is the operational reality check on non-virtualization isolation: what a shipped, mutually-distrustful-tenant isolation kernel looks like after ten years, and which of its design bets paid."

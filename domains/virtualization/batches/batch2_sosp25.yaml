- id: VIRT-SOSP25-09
  title: "Quilt: Resource-aware Merging of Serverless Workflows"
  title_correction: null
  authors: [Yuxuan Zhang, Sebastian Angel]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764830
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://www.cis.upenn.edu/~sga001/papers/quilt-sosp25.pdf
  classification: CONTEXT
  classification_note: "Per the brief's serverless rule this is the consuming layer, not the mechanism: Quilt leaves container, runtime and kernel isolation untouched and only changes which functions are packed into one process, treating the platform as a black box."
  drop_reason: null
  taxonomy_primary: T8
  taxonomy_secondary: [T9, T5]
  physical_resource: CPU core
  logical_abstraction: "A merged serverless function: several workflow functions compiled into one binary that existing unmodified platforms deploy as a single function."
  problem: "Decomposing a workflow into per-function containers pays API-gateway indirection, new TCP/HTTP connections per call and chained cold starts, but merging everything into one function causes resource fragmentation and throttling."
  mechanism: "Quilt lifts functions to LLVM IR, renames conflicting symbols, replaces HTTP invocation calls with direct calls (using string-based shims across C, C++, Swift, Go and Rust because functions only ever exchange REST payloads), and debloats/dedups libraries; which functions to merge is chosen by constraint-aware clustering of the call graph -- ILP for graphs up to 20 vertices and a 'downstream impact' heuristic beyond that -- subject to per-container CPU and memory limits."
  isolation_mechanism: "Unchanged platform containers between tenants and workflows; within one tenant's workflow the merged functions share an address space, which the paper justifies by arguing the trust boundary is the workflow, not the function."
  multiplexing_mechanism: "None introduced; the underlying platform's autoscaling and load balancing continue to multiplex the merged functions."
  state_mechanism: "N/A -- no virtualization state; merge decisions are computed offline from distributed-tracing profiles and baked into the deployed binary."
  overhead_bottleneck: "Inter-function invocation overhead (gateway, connection setup, cold-start chains) for short functions; and, if merging ignores limits, resource fragmentation causing throttling or OOM at high load."
  primary_tradeoff: "Merging functions into one process -> gains large latency and throughput wins for millisecond-scale functions but costs per-function fault isolation (one crash kills the merged workflow), per-function billing clarity, and independent scaling."
  quantitative_claims:
    - "median workflow completion time improvement: 45.63%-70.95%"
    - "throughput: 2.05x-12.87x, e.g. compose-post 11.24x synchronous and 12.87x asynchronous"
    - "tail (99th percentile) latency improvement: 15.64%-85.47%"
    - "merged binary size: 3.4%-86.7% smaller than the sum of individual binaries"
    - "merge decision time: under 0.27 s median for graphs up to 200 nodes; compilation ~1-2 minutes as a one-time background step"
    - "setup: 6-machine cluster (3 workers with 128-core Xeons), Fission primary plus OpenWhisk and OpenFaaS, DeathStarBench social-network / hotel-reservation / movie-review workflows with 2-15 functions"
    - "benefit qualifier: concentrated on workflows whose functions run tens of milliseconds or less; multi-second functions see minimal improvement"
  why_useful_for_learning: "It makes the cost of fine-grained isolation boundaries legible -- the same decomposition that buys independent scaling is what the measured 2-12x throughput gap pays for."
  priority: P3
  related: [VIRT-SOSP25-08, VIRT-SOCC25-01, VIRT-SOCC25-09]

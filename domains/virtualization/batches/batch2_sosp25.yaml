- id: VIRT-SOSP25-11
  title: "CHERIoT RTOS: An OS for Fine-Grained Memory-Safe Compartments on Low-Cost Embedded Devices"
  title_correction: null
  authors: [Saar Amar, Tony Chen, David Chisnall, Nathaniel Wesley Filardo, Ben Laurie, Hugo Lefeuvre, Kunyan Liu, Simon W. Moore, Robert Norton-Wright, Margo Seltzer, Yucong Tao, Robert N. M. Watson, Hongyan Xia]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764844
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://api.repository.cam.ac.uk/server/api/core/bitstreams/db4a3848-5f29-4786-bc5e-668d27799f0e/content
  classification: SUPPORT
  classification_note: "No VM, hypervisor or virtual resource appears, but it is the definitive account of the capability-based compartment -- the third isolation mechanism alongside page tables and MPUs -- and it is the exact hardware substrate Dandelion's fastest sandbox and uFork's micro-processes are built on."
  drop_reason: null
  taxonomy_primary: T10
  taxonomy_secondary: [T5, T7]
  physical_resource: CPU core
  logical_abstraction: "A compartment: a statically defined unit of code plus data, reachable only through declared entry points, sharing one address space with all others but able to fault, recover and micro-reboot independently."
  problem: "Embedded devices omit memory protection to cut cost yet are now internet-connected; MPU/TrustZone give only coarse isolation (typically 8 regions), do not harden compartment interfaces, and do nothing about supply-chain attacks or temporal memory safety."
  mechanism: "Every pointer is a CHERI capability carrying cursor, bounds and permissions with an unforgeable tag bit, so spatial safety is checked in hardware on each access; CHERIoT adds permit-load-mutable and permit-load-global for deep immutability and deep no-capture, and sealed capabilities (sentries) to hand out callable functions without exposing their data; a ~355-instruction 'switcher' is the only code that can unseal the sealed capability naming a callee's export table, and on each cross-compartment call it pushes a trusted-stack frame, clears non-argument registers and truncates and zeroes the stack capability; temporal safety uses a load filter that clears the tag of any capability loaded from a revoked 8-byte heap granule plus a hardware revoker that sweeps memory invalidating capabilities to freed objects, with the allocator quarantining freed memory until a sweep completes."
  isolation_mechanism: "Hardware capability bounds and permissions, sealing, per-compartment import/export tables restricting which compartments and MMIO devices are reachable, and switcher-private trusted stacks."
  multiplexing_mechanism: "A single shared quota-controlled heap lets phases with different memory needs time-division-multiplex SRAM instead of each pre-allocating its peak; threads are preemptively scheduled onto the core by a scheduler compartment, with futex-based locks, message queues and blocking."
  state_mechanism: "Per-compartment import/export tables and per-thread trusted stacks live in switcher-only SRAM; revocation bits sit in a separate SRAM region, one set per 8-byte heap granule; allocator quotas and quarantine lists live inside the allocator compartment."
  overhead_bottleneck: "Cross-compartment call cost driven by register clearing and stack zeroing (209 cycles empty, up to 1284 worst case), and the hardware revoker, which becomes the allocator's bottleneck for large objects."
  primary_tradeoff: "Capability compartments instead of MMU/MPU domains -> gains unbounded fine-grained isolation with object-level sharing and fault-tolerant micro-reboots in tens of KB of SRAM, but costs ~4.5% more area than a 16-entry PMP, ~20.65% CoreMark slowdown, and non-deterministic allocation latency while revocation sweeps run."
  quantitative_claims:
    - "area: CHERIoT adds ~4.5% more area than a 16-entry PMP"
    - "CoreMark overhead: 20.65% versus non-CHERI RISC-V 32E (load filter ~8%, widened memory bus ~8%)"
    - "compartment call: 209 cycles empty, 452 cycles with a 256 B stack, 1284 cycles worst case with 1 KiB on both sides"
    - "interrupt latency: 1028 cycles (31 us at 33 MHz)"
    - "footprint: base system 25.9 KB code + 3.7 KB data (18.4 KB code once the loader is erased at boot); base+network stack 151.8 KB code + 20.4 KB data; 83 B per additional compartment"
    - "example IoT deployment: 13 compartments with MQTT/TLS in 243 KB total (182 KB code, 28 KB data, 33 KB heap)"
    - "allocator: ~5 MiB/s sustained for buffers over 1 KiB; revoker becomes the bottleneck above ~80 KiB allocations"
    - "API latencies: unseal 44.8 cycles, allocate sealed object 2432.2 cycles, ephemeral claim 182 cycles, heap claim+unclaim 3714 cycles, fault+unwind 109-413 cycles"
    - "platform: Arty A7-100T FPGA at 33 MHz with 256 KiB SRAM, compiled -Oz"
  why_useful_for_learning: "It gives concrete cycle and byte costs for a hardware isolation boundary that is neither a page table nor a VM, which is the reference point for judging what container and microVM boundaries cost."
  priority: P2
  related: [VIRT-SOSP25-08, VIRT-SOSP25-13, VIRT-SOSP25-12, VIRT-SOSP25-17]
  relations:
    - {type: LAYER_BELOW, target: VIRT-SOSP25-08, basis: "Dandelion's 89 us CHERI backend relies on exactly these capability bounds for sandbox isolation"}
    - {type: LAYER_BELOW, target: VIRT-SOSP25-13, basis: "uFork uses CHERI capability tags to relocate pointers and to isolate micro-processes within one address space"}
    - {type: ALTERNATIVE, target: VIRT-SOSP25-12, basis: "capability compartments versus MPU/PMP regions as the isolation mechanism for microcontroller-class devices; the paper argues MPUs' ~8 domains force over-privileging"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "THRESHOLD CALL (embedded isolation, in or out of scope), resolved to SUPPORT/T10: the paper never mentions VMs or hypervisors, so it is not CORE, but it is not DROP either because CHERI compartments are a load-bearing alternative isolation mechanism that two CORE papers in this same batch (Dandelion, uFork) build directly on. Read the Cambridge repository accepted version; ACM DL PDF was 403."


- id: VIRT-SOSP25-16
  title: "Scalable Far Memory: Balancing Faults and Evictions"
  title_correction: null
  authors: [Yueyang Pan, Yash Lala, Musa Unal, Yujie Ren, Seung-seob Lee, Abhishek Bhattacharjee, Anurag Khandelwal, Sanidhya Kashyap]
  venue: SOSP
  year: 2025
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1145/3731569.3764842
  official_url: https://sigops.org/s/conferences/sosp/2025/accepted.html
  fullpaper_source: https://rs3lab.github.io/assets/papers/2025/pan:mage.pdf
  classification: SUPPORT
  classification_note: "Under the brief's disaggregation rule this is SUPPORT, not CORE: Mage expands a machine's memory over RDMA but builds no virtual memory resource for a guest -- it re-engineers the host paging fault-in/eviction path -- and it is not pure page-table work either, since memory expansion over a fabric is the subject."
  drop_reason: null
  taxonomy_primary: T2
  taxonomy_secondary: [T9]
  physical_resource: DRAM
  logical_abstraction: "Transparently extended process memory: the application sees more memory than the machine has, with remote pages faulted in over RDMA and evicted asynchronously."
  problem: "Page-based far memory systems inherit virtual-memory machinery designed for millisecond disks and collapse at high thread counts on modern multi-core machines, because TLB coherence via cross-core interrupts, system-wide LRU lists and contended allocators all serialise."
  mechanism: "Three principles: always-asynchronous decoupling, which forbids synchronous eviction on the fault-in path and offloads all eviction to a small pool of at most four dedicated threads that keep a free-page supply; cross-batch pipelined execution, which uses per-CPU TLB and RDMA staging buffers to run other batches' pipeline stages during RDMA wait time, amortising TLB coherence cost; and scalability-prioritised coordination avoidance, which shards LRU lists and free-page caches per CPU and accepts less precise eviction for less contention. Two implementations: MageLnx (17k lines in Linux 4.15, bypassing the swap layer) and MageLib (4,234 lines on the OSv library OS with unified page tables and one-sided RDMA)."
  isolation_mechanism: "N/A -- single-application focus; dedicated evictor threads keep eviction work off application threads, and per-CPU sharding limits inter-thread interference, but there is no multi-tenant isolation or quota."
  multiplexing_mechanism: "Local DRAM is multiplexed across a process's pages by the sharded eviction policy; no multiplexing across tenants."
  state_mechanism: "Page state lives in per-CPU sharded LRU lists and free-page caches with VMA-level direct mapping replacing swap-entry allocation; remote pages live in a peer's DRAM reached by one-sided RDMA."
  overhead_bottleneck: "TLB coherence via cross-core interrupts plus contention on shared page-accounting structures, which is why throughput collapses with thread count in prior systems."
  primary_tradeoff: "Always-asynchronous, pipelined, coordination-avoiding paging -> gains up to 4.2x throughput and 94.5% tail-latency reduction at 48 threads, but costs global eviction accuracy (partitioned LRU), dedicated evictor cores, and a 200 Gbps-class network assumption."
  quantitative_claims:
    - "throughput: up to 4.2x over Hermit and 3.6-3.8x over DiLOS/Hermit; tail latency reduced by up to 94.5%"
    - "GapBS page rank at 10% offload, 48 threads: 15-19% throughput drop (4.2x better than Hermit); XSBench ~10% drop"
    - "sequential scan with prefetch: 6.4% throughput drop at 10% offload"
    - "memcached at 24 threads: p99 latency in the 160-220 us range; +0.64 M ops/s load capacity over Hermit at 50% offload"
    - "network utilization: MageLib reaches 181 Gbps (94% of RDMA bandwidth), 3.1-7.1x over DiLOS/Hermit; MageLnx reaches 139 Gbps, limited by Linux network stack contention"
    - "sequential read p99: 12 us for MageLib versus 82-255 us for baselines"
    - "virtualization caveat stated by the authors: MageLib and MageLnx run in KVM/QEMU VMs while Hermit runs bare metal, and MageLib shows an 8.6% regression versus Hermit at 100% local memory attributed to EPT translation and VM exits"
    - "hardware: dual-socket Intel Xeon Gold 6348 (56 cores), 512 GB DRAM per server, Mellanox BlueField-2 at 200 Gbps"
  why_useful_for_learning: "It gives the host-side counterpart to guest-delegated tiering: the same problem of where memory-expansion policy should live, answered by making the host path scale instead of handing policy to the guest."
  priority: P2
  related: [VIRT-SOSP25-02, VIRT-SOSP25-05, VIRT-SOCC25-20, "Hermit", "DiLOS"]
  relations:
    - {type: ALTERNATIVE, target: VIRT-SOSP25-02, basis: "opposite answers to where memory-expansion policy belongs -- Mage scales the host fault/eviction path, Demeter delegates the decision into the guest"}
    - {type: SAME_BRANCH, target: VIRT-SOSP25-05, basis: "both extend a host's resources across a fabric, memory over RDMA here and PCIe devices over CXL there"}
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: DESIGN_EVAL
  evidence_kinds: [paper, official-web]
  confidence: HIGH
  notes: "OMISSION from the seed list, found in the official SOSP 2025 accepted-papers list; flagged by the concept scan on disaggregation/far memory. Kept as SUPPORT rather than DROP because the brief's disaggregation rule assigns far memory to SUPPORT by default; a reader interested only in guest-visible memory virtualization can skip it."


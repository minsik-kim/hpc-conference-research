  mechanism: "Aegaeon auto-scales at token granularity: between individual decode steps it can offload the current model's KV cache, load the next model's weights and resume, so the number of concurrently *active* models can fall below the steady-state expectation that bounds request-level schemes; the switch is made cheap by initialising the inference engine and workers once per GPU and caching everything except weights and KV cache, a self-managed bump-allocated VRAM buffer that bypasses PyTorch GC with host-memory weight caching and optional prefetch on a separate CUDA stream, slab allocation for a unified KV cache across model shapes, and CUDA-event-based fine-grained KV transfer synchronisation; prefill and decode instances are disaggregated with grouped FCFS and weighted round-robin schedulers respectively."

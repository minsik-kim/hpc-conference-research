  primary_tradeoff: Extending the confidential-computing trust boundary from a single CPU/CVM to the full multi-GPU interconnect -> gains end-to-end confidentiality for distributed training, but costs substantial communication latency versus native (non-confidential) NVLink/PCIe, which SCALE's co-encryption design only partially recovers.

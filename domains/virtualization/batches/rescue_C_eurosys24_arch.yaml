- id: VIRT-HPCA26-05
  title: 'DSAssassin: Cross-VM Side-Channel Attacks by Exploiting Intel Data Streaming Accelerator'
  title_correction: null
  authors: [Benfeng Chen, Kun Li, Shuwen Deng, Dongsheng Wang, Yun Chen]
  venue: HPCA
  year: 2026
  publication_type: ARCHIVAL_MAIN_PAPER
  doi: 10.1109/HPCA68181.2026.11408519
  official_url: https://ieeexplore.ieee.org/document/11408519/
  fullpaper_source: UNKNOWN
  classification: CORE
  classification_note: The paper does not merely run an attack inside a VM - it reverse-engineers and breaks the isolation of Intel Scalable I/O Virtualization's shared work queue and Device TLB on a shared accelerator (Intel DSA), i.e. it breaks an accelerator's inter-VM isolation boundary, which per the brief's own attack-paper rule makes this a device-virtualization-isolation paper (T7/T3), not a generic CONTEXT attack paper.
  drop_reason: null
  taxonomy_primary: T7
  taxonomy_secondary: [T3]
  physical_resource: Intel DSA (on-SoC shared accelerator, virtualized via Intel VT-d Scalable IOV)
  logical_abstraction: Intel Scalable I/O Virtualization (SIOV) shared work queues (SWQ) and per-process Device TLB (DevTLB) entries that let multiple VMs/processes submit descriptors to one physical DSA engine as if each had a private queue.
  problem: Intel's Data Streaming Accelerator (DSA), shared across VMs/processes via Intel VT-d's Scalable I/O Virtualization to offload data-movement workloads from the CPU, was assumed to be protected against device-based cross-tenant threats because SIOV mediates device access, but its microarchitectural isolation had not been examined.
  mechanism: The authors reverse-engineer DSA's Device TLB (DevTLB) and find its entries are not isolated per process/VM, and analyze DSA's Shared Work Queue (SWQ) to uncover a timer-free side channel via Deferred Memory Write (DMWr) transaction ordering; they build two attack primitives - a DevTLB-based timing attack and an SWQ-based contention attack - that let one VM infer another VM's memory-access and I/O activity through the shared accelerator, bypassing SIOV's intended device-level isolation.
  isolation_mechanism: The finding IS a broken isolation boundary - DevTLB entries and SWQ contention state are shared across the VMs that Intel Scalable IOV is supposed to keep isolated from one another.
  multiplexing_mechanism: Intel Scalable IOV multiplexes one physical DSA engine's work queue and DevTLB across many VMs/processes via PASID-tagged shared submission, which is exactly the shared hardware state the attack exploits.
  state_mechanism: N/A (offensive security paper; no virtualization state migration is involved) - DevTLB and SWQ hardware state are themselves the side channel.
  overhead_bottleneck: N/A (the paper's "overhead" is the attack channel's own bandwidth/accuracy, not a defended system's performance cost).
  primary_tradeoff: Sharing one physical DSA engine across VMs via Scalable IOV for offload efficiency and density -> gains device-offload throughput, but costs a previously unrecognized cross-VM covert/side-channel surface (DevTLB + SWQ) that bypasses SIOV's intended isolation.
  quantitative_claims:
  - "cross-VM covert channel: 17.19 Kbps true capacity at 4.64% error rate, reported as 5x faster and 4x more accurate than the prior state-of-the-art covert channel"
  - "website fingerprinting attack: 85.7% classification accuracy across the top 100 websites"
  - "cross-VM keystroke inference: F1 = 92.0% (DevTLB-based attack) and F1 = 98.4% (SWQ-based attack)"
  why_useful_for_learning: A concrete, mechanism-level counterexample showing that a hardware I/O-virtualization scheme (Intel Scalable IOV) marketed as closing device-based cross-tenant threats can still leak through microarchitectural sharing (DevTLB, shared work queue) - the same class of isolation gap that S-NIC's hard partitioning is explicitly designed to prevent on a different shared accelerator.
  priority: P1
  related: [VIRT-EUROSYS24-04]
  relations:
  - type: CONTRASTS_WITH
    target: VIRT-EUROSYS24-04
    basis: DSAssassin demonstrates exactly the class of shared-accelerator cross-VM leakage (via an unisolated Device TLB and shared work queue) that S-NIC's hard TLB/cache/bus partitioning of NIC accelerators is built to prevent; read together they show the isolation-vs-sharing trade-off from the attack and defense sides respectively.
  existing_corpus_overlap: null
  previous_analysis_depth: null
  evidence_depth: ABSTRACT
  evidence_kinds: [official-web]
  confidence: HIGH
  notes: "Full text behind IEEE Xplore (document rendered empty content on fetch) and the authors' own THU HAS Lab page (metadata only, no hosted abstract). Full abstract obtained via Semantic Scholar's record for DOI 10.1109/HPCA68181.2026.11408519, whose document-number suffix matches IEEE Xplore doc/11408519 exactly and whose author list matches THU HAS Lab's own publication listing. The abstract itself is detailed enough (naming DevTLB, SWQ, DMWr, and the SIOV bypass explicitly) to support classification and mechanism fields with high confidence even though architecture diagrams and full evaluation methodology were not read."


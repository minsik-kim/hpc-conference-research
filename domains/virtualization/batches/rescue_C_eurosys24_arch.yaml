  logical_abstraction: A confidential distributed-training fabric in which each GPU's Trusted Execution Environment is chained to Confidential VMs and to other GPU TEEs so inter-GPU collective communication stays inside the confidential trust boundary end-to-end.
  problem: NVIDIA's Confidential Computing mode (Confidential VMs chained to GPU TEEs) protects distributed ML training from an untrusted cloud, but encrypting/authenticating traffic that crosses TEE boundaries - both CVM-to-GPU-TEE and GPU-TEE-to-GPU-TEE over NVLink - adds latency that is especially severe for collective-communication operations, hurting end-to-end training throughput.
  mechanism: SCALE introduces a co-encryption design that offloads and parallelizes encryption/authentication work onto otherwise-underutilized GPU compute, plus a communication algorithm tailored to the confidential setting, to reduce the encryption-induced latency tax that collective operations pay when crossing TEE security boundaries.
